%A3%E0%B8%B2%E0%B8%87%E0%B8%84%E0%B9%8C%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%AD%E0%B8%A3%E0%B8%B8%E0%B8%932.jpg/960px-%E0%B9%80%E0%B8%88%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B9%8C%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%B2%E0%B8%99%E0%B8%97%E0%B8%A3%E0%B8%87%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%87%E0%B8%84%E0%B9%8C%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%AD%E0%B8%A3%E0%B8%B8%E0%B8%932.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"วัดอรุณราชวราราม หรือเรียกสั้น ๆ ว่า วัดอรุณ หรือ วัดแจ้ง เป็นพุทธศาสนสถานในประเทศไทย มีสถานะเป็นพระอารามหลวงชั้นเอก ชนิดราชวรมหาวิหาร ตั้งอยู่ริมฝั่งแม่น้ำเจ้าพระยา เขตบางกอกใหญ่ กรุงเทพมหานคร มีประวัติยาวนานตั้งแต่สมัยกรุงศรีอยุธยา เดิมชื่อ วัดบางมะกอก ต่อมาในสมัยสมเด็จพระเจ้ากรุงธนบุรีแห่งกรุงธนบุรี ได้เปลี่ยนชื่อเป็นวัดแจ้ง เนื่องจากการยกทัพผ่านมาหน้าวัดในยามรุ่งอรุณ และเมื่อพระบาทสมเด็จพระพุทธเลิศหล้านภาลัยทรงบูรณปฏิสังขรณ์วัดใหม่ จึงทรงพระราชทานนามวัดว่า \"วัดอรุณราชวราราม\" เพื่อเป็นวัดประจำรัชกาลอีกด้วย","history":"วัดอรุณราชวรารามราชวรมหาวิหารมีชื่อเดิมว่า วัดบางมะกอก สร้างในสมัยกรุงศรีอยุธยาก่อนรัชกาลสมเด็จพระนารายณ์มหาราช ปรากฏหลักฐานในแผนที่ของชาวฝรั่งเศส มีพระอุโบสถ และพระวิหารของเก่าอยู่บริเวณหน้าพระปรางค์เป็นฝีมือช่างสมัยอยุธยา\nตามข้อสันนิษฐานของสมเด็จพระเจ้าบรมวงศ์เธอ กรมพระยาดำรงราชานุภาพเข้าใจว่าคงจะเรียกชื่อวัดคล้อยตามชื่อตำบลที่ตั้งตามคติการเรียกชื่อวัดไทยสมัยโบราณ ซึ่งแต่เดิมวัดอรุณตั้งอยู่ ณ ตำบลบางมะกอก ตั้งแต่สมัยอยุธยา ภายหลังเสียงหดลงคงเรียกสั้น ๆ ว่า วัดมะกอก และกลายเป็นวัดมะกอกนอกในเวลาต่อมาเพราะได้มีการสร้างวัดขึ้นอีกวัดหนึ่งในตำบลเดียวกันแต่อยู่ในคลองบางกอกใหญ่ ชาวบ้านเรียกวัดที่สร้างใหม่ว่า วัดมะกอกใน (วัดนวลนรดิศ) แล้วจึงเรียกวัดมะกอกซึ่งอยู่ปากคลองบางกอกใหญ่ว่า วัดมะกอกนอก\nสมเด็จพระเจ้าบรมวงศ์เธอ กรมพระยาดำรงราชานุภาพทรงเคยทูลสมเด็จพระเจ้าบรมวงศ์เธอ เจ้าฟ้ากรมพระยานริศรานุวัดติวงศ์เมื่อวันที่ 14 สิงหาคม พ.ศ. 2484 ไว้ว่า :–หม่อมฉันเคยเห็นแผนที่เมืองธนบุรีที่ฝรั่งเศสทำเมื่อรัชกาลสมเด็จพระนารายณ์ ฯ ในแผนที่นั้นมีแต่วัดเลียบกับวัดแจ้งแต่วัดโพธิ์หามีไม่ ตรงที่วัดพระเชตุพนนั้นยังเป็นชานป้อมใหญ่ซึ่งอยู่ราวโรงเรียนราชินี …","other":"Wat Arun"},"en":{"title":"Wat Arun","url":"https://en.wikipedia.org/wiki/Wat_Arun","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2a/%E0%B9%80%E0%B8%88%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B9%8C%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%B2%E0%B8%99%E0%B8%97%E0%B8%A3%E0%B8%87%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%87%E0%B8%84%E0%B9%8C%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%AD%E0%B8%A3%E0%B8%B8%E0%B8%932.jpg/960px-%E0%B9%80%E0%B8%88%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B9%8C%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%B2%E0%B8%99%E0%B8%97%E0%B8%A3%E0%B8%87%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%87%E0%B8%84%E0%B9%8C%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%AD%E0%B8%A3%E0%B8%B8%E0%B8%932.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Wat Arun Ratchawararam Ratchawaramahawihan (Thai: วัดอรุณราชวราราม ราชวรมหาวิหาร  ) or Wat Arun (Thai pronunciation: [wát ʔarun], \"Temple of Dawn\") is a Buddhist temple (wat) in the Bangkok Yai district of Bangkok, Thailand. It is situated in Thonburi on the west bank of the Chao Phraya River. The temple derives its name from the Hindu god Aruṇa, often personified as the rays of the rising sun.","history":"A Buddhist temple had existed at the site of Wat Arun since the time of the Ayutthaya Kingdom, prior to the reign of King Narai. It was then known as Wat Bang Makok which was later shortened to Wat Makok, after the village of Bang Makok in which it was built (makok is the Thai name for the Spondias pinnata plant). According to the historian Prince Damrong Rajanubhab, the temple was shown in French maps during the reign of Narai (1656–88), drawn by Claude de Forbin and de Lamare.\nThe temple was renamed Wat Chaeng by Taksin (1767–82) when he established his new capital of Thonburi near the temple, following the fall of Ayutthaya. It is believed that Taksin vowed to restore the temple after passing it at dawn. The temple enshrined the Emerald Buddha image before it was transferred to Wat Phra Kaew on the river\u0027s eastern bank in 1785. The temple was on the grounds of the royal palace during Taksin\u0027s reign, before his successor, Rama I (1782–1809), moved the palace to the other side of the river.  It was abandoned until the reign of Rama II (1809–24), who had the temple restored and had …","other":"วัดอรุณราชวรารามราชวรมหาวิหาร"}},{"th":{"title":"เกาะตาปู","url":"https://th.wikipedia.org/wiki/%E0%B9%80%E0%B8%81%E0%B8%B2%E0%B8%B0%E0%B8%95%E0%B8%B2%E0%B8%9B%E0%B8%B9","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/37/Isla_Tapu%2C_Phuket%2C_Tailandia%2C_2013-08-20%2C_DD_11.JPG/960px-Isla_Tapu%2C_Phuket%2C_Tailandia%2C_2013-08-20%2C_DD_11.JPG?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"เกาะตาปู หรือ เกาะตะปู เป็นเกาะโขดหินขนาดเล็ก ตั้งอยู่ทางด้านเหนือในเวิ้งอ่าวของเกาะเขาพิงกัน ทางทิศตะวันตกเฉียงใต้ของอุทยานแห่งชาติอ่าวพังงาในท้องที่ตำบลกะไหล อำเภอตะกั่วทุ่ง จังหวัดพังงา ห่างจากที่ทำการอุทยานฯ ไปตามลำคลองเกาะปันหยีเป็นระยะทางประมาณ 15 กิโลเมตร เกาะตาปูมีลักษณะเป็นเกาะเดี่ยว ส่วนบนโปนออกและคอดกิ่วลงที่บริเวณฐานเหมือนกับตาของปู (เกาะในลักษณะนี้มีศัพท์ทางธรณีวิทยาเรียกว่า เกาะหินโด่ง) การชมเกาะตาปูต้องชมในระยะไกลจากเรือ หรือจากสันดอนของเกาะเขาพิงกัน ไม่สามารถขึ้นไปบนเกาะได้","history":"เกาะตาปู หรือ เกาะตะปู เป็นเกาะโขดหินขนาดเล็ก ตั้งอยู่ทางด้านเหนือในเวิ้งอ่าวของเกาะเขาพิงกัน ทางทิศตะวันตกเฉียงใต้ของอุทยานแห่งชาติอ่าวพังงาในท้องที่ตำบลกะไหล อำเภอตะกั่วทุ่ง จังหวัดพังงา ห่างจากที่ทำการอุทยานฯ ไปตามลำคลองเกาะปันหยีเป็นระยะทางประมาณ 15 กิโลเมตร เกาะตาปูมีลักษณะเป็นเกาะเดี่ยว ส่วนบนโปนออกและคอดกิ่วลงที่บริเวณฐานเหมือนกับตาของปู (เกาะในลักษณะนี้มีศัพท์ทางธรณีวิทยาเรียกว่า เกาะหินโด่ง) การชมเกาะตาปูต้องชมในระยะไกลจากเรือ หรือจากสันดอนของเกาะเขาพิงกัน ไม่สามารถขึ้นไปบนเกาะได้","other":"Ko Ta Pu"},"en":{"title":"Khao Phing Kan","url":"https://en.wikipedia.org/wiki/Khao_Phing_Kan","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e3/Isla_Tapu%2C_Phuket%2C_Tailandia%2C_2013-08-20%2C_DD_36.JPG/960px-Isla_Tapu%2C_Phuket%2C_Tailandia%2C_2013-08-20%2C_DD_36.JPG?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Khao Phing Kan (Thai: เขาพิงกัน, pronounced [kʰǎw pʰīŋ kān]) or Ko Khao Phing Kan (เกาะเขาพิงกัน, [kɔ̀ʔ kʰǎw pʰīŋ kān]), commonly known in English as James Bond Island, is an island in Thailand, in Phang Nga Bay northeast of Phuket. About 40 metres (130 ft) from the shores of Khao Phing Kan lies a 20-metre (66 ft) tall islet called Ko Ta Pu (เกาะตาปู, [kɔ̀ʔ tāː pūː]) or Ko Tapu (เกาะตะปู, [kɔ̀ʔ tā.pūː]).\nThe islands are limestone karst towers and are a part of Ao Phang Nga National Park.","history":"Before 1974, the island, now known as Khao Phing Kan, was relatively undisturbed and predominantly inhabited by indigenous communities. Its international recognition escalated following its selection as a filming location for the 1974 James Bond film, The Man with the Golden Gun. The island served as the backdrop for the hideout of the film\u0027s antagonist, Francisco Scaramanga. After the film\u0027s release, Khao Phing Kan experienced a significant surge in tourism, transforming it into a renowned tourist destination.\nThe increased popularity of Khao Phing Kan, however, brought challenges, including a notable increase in litter and environmental impact. In response to these concerns, and to preserve the natural environment, the island was incorporated into the Ao Phang Nga Marine National Park, established in 1981. Since 1998, in an effort to protect the fragile limestone formations of the nearby islet Ko Ta Pu, regulations prohibit tourist boats from approaching too closely. This measure is intended to prevent erosion that could jeopardize the structural integrity of the limestone …","other":"เขาพิงกัน"}},{"th":{"title":"วัดมหาธาตุ (จังหวัดสุโขทัย)","url":"https://th.wikipedia.org/wiki/%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8_(%E0%B8%88%E0%B8%B1%E0%B8%87%E0%B8%AB%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%AA%E0%B8%B8%E0%B9%82%E0%B8%82%E0%B8%97%E0%B8%B1%E0%B8%A2)","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/Sukhotha%C3%AF-06.jpg/960px-Sukhotha%C3%AF-06.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"วัดมหาธาตุ เป็นโบราณสถานที่มีความสำคัญในฐานะวัดมหาธาตุ ซึ่งเป็นพระอารามหลวงในเขตพระราชวังราชธานีสุโขทัยในอดีต ปัจจุบันตั้งอยู่บริเวณศูนย์กลางอุทยานประวัติศาสตร์สุโขทัย ตำบลเมืองเก่า อำเภอเมืองสุโขทัย จังหวัดสุโขทัย\nวัดมหาธาตุเป็นวัดที่มีขนาดใหญ่ที่สุดในเมือง สร้างขึ้นในช่วงพุทธศตวรรษที่ 18 หรือสมัยสุโขทัยตอนต้น ในศิลาจารึกพ่อขุนรามคำแหง พุทธศักราช 1835 (หลักที่ 1 ด้านที่ 2 บรรทัดที่ 23–26) ได้ระบุถึงอารามดังกล่าวว่า \"กลางเมืองสุโขทัยนี้ มีพิหาร มีพระพุทธรูปอันราม\" ซึ่งหมายถึงวิหารหลวงทางด้านทิศตะวันออกของเจดีย์ประธานเคยเป็นที่ประดิษฐานพระพุทธรูปสำริดแบบสุโขทัย หน้าตักกว้าง 6.25 เมตร พระมหาธรรมราชาลิไทได้โปรดฯ ให้หล่อขึ้นและทำการฉลองเมื่อ พ.ศ. 1904 \nวัดมหาธาตุ ยังมีองค์ประกอบสำคัญคือเจดีย์มหาธาตุและเจดีย์บริวารทรงปรางค์จำนวน 8 องค์ซึ่งทำหน้าที่เป็นเจดีย์ประจำด้าน (ทิศ) ได้อิทธิพลจากศิลปะขอมและมีลวดลายปูนปั้นแบบอิทธิพลศิลปะลังกา ส่วนเจดีย์ประจำมุมทั้งสี่เป็นเจดีย์ทรงปราสาทห้ายอดได้อิทธิพลของศิลปะพุกาม-หริภุญไชย-ล้านนา ถือเป็นหนึ่งในตัวอย่างเจดีย์ทรงปราสาทแบบสุโขทัยแท้ที่หลงเหลือในสภาพสมบูรณ์ที่สุดแห่งหนึ่ง\nวัดมหาธาตุได้รับการประกาศขึ้นทำเบียนโบราณสถาน ในราชกิจจานุเบกษาเล่ม 52 ตอนที่ 75 วันที่ 8 มีนาคม พ.ศ.","history":"วัดมหาธาตุ เป็นโบราณสถานที่มีความสำคัญในฐานะวัดมหาธาตุ ซึ่งเป็นพระอารามหลวงในเขตพระราชวังราชธานีสุโขทัยในอดีต ปัจจุบันตั้งอยู่บริเวณศูนย์กลางอุทยานประวัติศาสตร์สุโขทัย ตำบลเมืองเก่า อำเภอเมืองสุโขทัย จังหวัดสุโขทัย\nวัดมหาธาตุเป็นวัดที่มีขนาดใหญ่ที่สุดในเมือง สร้างขึ้นในช่วงพุทธศตวรรษที่ 18 หรือสมัยสุโขทัยตอนต้น ในศิลาจารึกพ่อขุนรามคำแหง พุทธศักราช 1835 (หลักที่ 1 ด้านที่ 2 บรรทัดที่ 23–26) ได้ระบุถึงอารามดังกล่าวว่า \"กลางเมืองสุโขทัยนี้ มีพิหาร มีพระพุทธรูปอันราม\" ซึ่งหมายถึงวิหารหลวงทางด้านทิศตะวันออกของเจดีย์ประธานเคยเป็นที่ประดิษฐานพระพุทธรูปสำริดแบบสุโขทัย หน้าตักกว้าง 6.25 เมตร พระมหาธรรมราชาลิไทได้โปรดฯ ให้หล่อขึ้นและทำการฉลองเมื่อ พ.ศ. 1904 \nวัดมหาธาตุ ยังมีองค์ประกอบสำคัญคือเจดีย์มหาธาตุและเจดีย์บริวารทรงปรางค์จำนวน 8 องค์ซึ่งทำหน้าที่เป็นเจดีย์ประจำด้าน (ทิศ) ได้อิทธิพลจากศิลปะขอมและมีลวดลายปูนปั้นแบบอิทธิพลศิลปะลังกา ส่วนเจดีย์ประจำมุมทั้งสี่เป็นเจดีย์ทรงปราสาทห้ายอดได้อิทธิพลของศิลปะพุกาม-หริภุญไชย-ล้านนา ถือเป็นหนึ่งในตัวอย่างเจดีย์ทรงปราสาทแบบสุโขทัยแท้ที่หลงเหลือในสภาพสมบูรณ์ที่สุดแห่งหนึ่ง\nวัดมหาธาตุได้รับการประกาศขึ้นทำเบียนโบราณสถาน ในราชกิจจานุเบกษาเล่ม 52 ตอนที่ …","other":null},"en":{"title":"Sukhothai Historical Park","url":"https://en.wikipedia.org/wiki/Sukhothai_Historical_Park","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Wat_srichum_03.jpg/960px-Wat_srichum_03.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Sukhothai Historical Park (Thai: อุทยานประวัติศาสตร์สุโขทัย (Pronunciation)) covers the ruins of Sukhothai, literally \u0027dawn of happiness\u0027, capital of the Sukhothai Kingdom in the 13th and 14th centuries, in north central Thailand. It is near the city of Sukhothai Thani, capital of Sukhothai province.\nThe city\u0027s walls form a rectangle about 2 km (1.2 mi) east-west by 1.6 km (0.99 mi) north-south.","history":"The traditions that report the founding of the town disagree with one another, and none of them is contemporary. One chronicle tradition places it in 494 CE, followed by the twin city of Chaliang. The Legend of the Arhat gives 679 CE instead and names the founder as Indrajayadhirāja, from a city called Nakhon Luang, who was deposed in 687 by Balidhiraja, the elder son of Kalavarnadisharaja of Lavo. A local textual tradition then brings Sukhothai and Lavo under the authority of Padumasūriyavaṁśa, presented as the first Siamese sovereign, whose reign is conventionally dated to the second half of the 8th century.\nA comparable position has been reached from the Chinese records. The Cefu Yuangui and the Book of Tang have the territory of Qiān, centred at Si Thep, bordering to the north on Duō Mó Cháng, placed in the Yom and Nan basins. On that reading the Sukhothai–Chaliang region was subordinate to Si Thep between the 8th and 10th centuries.\nThe town is generally presumed to have been abandoned during the 9th and 10th centuries after an incursion attributed to the legendary Khom polity …","other":"อุทยานประวัติศาสตร์สุโขทัย"}},{"th":null,"en":{"title":"Songkhla","url":"https://en.wikipedia.org/wiki/Songkhla","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/City_of_Songkhla.jpg/960px-City_of_Songkhla.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Songkhla (Thai: สงขลา, pronounced [sǒŋ.kʰlǎː]), also known as Singgora or Singora (Pattani Malay: ซิงกอรอ, Singoro), is a city (thesaban nakhon) in Songkhla Province of southern Thailand, near the border with Malaysia. Songkhla lies 968 km (601 mi) south of Bangkok and as of 2020 had a population of 61,758.\nDespite being smaller than the neighboring city Hat Yai, Songkhla is the capital of Songkhla Province as well as the Mueang Songkhla District (Songkhla town district).","history":"The name Songkhla means \u0027the city of lions\u0027 (not to be confused with Singapura) and is the Thai variant of \"Singgora\" (Malay and Jawi: سيڠڬورا). This refers to a lion-shaped mountain near the city of Songkhla. Archaeological excavations on the isthmus between Lake Songkhla and the sea reveal that in the 10th through the 14th century, this was a major urbanized area, and a center of international maritime trade, in particular with Quanzhou in China. The long Sanskrit name of the state that existed there has been lost; its short Sanskrit name was Singhapura (\u0027Lion City\u0027) (not to be confused with Singapura), a city state. The short vernacular name was Satingpra, coming from the Mon-Khmer sting/steng/stang (meaning \u0027river\u0027) and the Sanskrit pura (\u0027cit ia/commons/thumb/5/56/Pha_taem_figures1.JPG/960px-Pha_taem_figures1.JPG?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Pha Taem National Park (Thai:อุทยานแห่งชาติผาแต้ม) is a national park on the Mekong River in Ubon Ratchathani Province, northeast Thailand. Phou Xieng Thong National Protected Area in Laos is on the opposite side of the river.\nIt is notable for its Dipterocarp forest cover and for extensive rock art on cliffs above the Mekong.","history":"In the past, only a few local peasants from the surrounding region dared to access the Pha Taem area. Because it is believed that Pha Taem is a prohibited location, and the mountain is protected by the holy. Pha Taem is renowned as the \"Mountain of Death\", and anybody who trespasses risks becoming ill or, worse, dying. The Pha Taem region has been widely publicized. Following that, professors and students from Silpakorn University Department of Archaeology researched and uncovered prehistoric ancient paintings 3,000-4,000 years old at Pha Taem, Ban Kum, Huai Phai sub-district, Khong Chiam district, Ubon Ratchathani province. In the original dialect, \"Taem\" refers to a drawing, painting, stamping, or any other action that uses color to create images, marks, or symbols. It is the site of prehistoric paintings dating from 3,000 to 4,000 years old, divided into four groups, the longest of which is 180 meters long and contains over 300 images. Furthermore, Pha Taem is surrounded by densely packed trees. As a consequence, they began to draft a memorandum from the department dated May 26, …","other":"อุทยานแห่งชาติผาแต้ม"}},{"th":{"title":"ปราสาทสัจธรรม","url":"https://th.wikipedia.org/wiki/%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%AA%E0%B8%B2%E0%B8%97%E0%B8%AA%E0%B8%B1%E0%B8%88%E0%B8%98%E0%B8%A3%E0%B8%A3%E0%B8%A1","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fb/Santuaryoftruth2.jpg/960px-Santuaryoftruth2.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ปราสาทสัจธรรม เป็นปราสาทที่ทำด้วยไม้ทั้งหลังที่มีขนาดใหญ่ที่สุดในประเทศไทย ตั้งอยู่ ณ บริเวณแหลมราชเวช ตำบลนาเกลือ อำเภอบางละมุง จังหวัดชลบุรี สร้างขึ้นโดยเล็ก วิริยะพันธุ์ นักธุรกิจผู้ชื่นชอบสถาปัตยกรรมไทยและศาสนาพุทธ เขายังเป็นเจ้าของพิพิธภัณฑ์ช้างเอราวัณและเมืองโบราณอีกด้วย ชาวบ้านเรียกชื่อปราสาทแห่งนี้โดยทั่วไปว่า \"วังโบราณ\" หรือ \"ปราสาทไม้\" ภายในปราสาทได้แฝงเนื้อหาทางปรัชญา และศิลปวัฒนธรรมอันเป็นมรดกของมนุษย์ สะท้อนให้เห็นถึงความสำคัญของศาสนาในฐานะเป็นเครื่องค้ำจุนโลก โดยเน้นหลักสำคัญคือ \"ก่อกำเนิดทั้ง 7 และคุณธรรมข้อประพฤติปฏิบัติทั้ง 4\"\nปราสาทสัจธรรมได้รับรางวัลประเภทรายการแหล่งท่องเที่ยวดีเด่น จากรางวัลอุตสาหกรรมท่องเที่ยวไทย ประจำปี พ.ศ.","history":"ปราสาทสัจธรรม เป็นปราสาทที่ทำด้วยไม้ทั้งหลังที่มีขนาดใหญ่ที่สุดในประเทศไทย ตั้งอยู่ ณ บริเวณแหลมราชเวช ตำบลนาเกลือ อำเภอบางละมุง จังหวัดชลบุรี สร้างขึ้นโดยเล็ก วิริยะพันธุ์ นักธุรกิจผู้ชื่นชอบสถาปัตยกรรมไทยและศาสนาพุทธ เขายังเป็นเจ้าของพิพิธภัณฑ์ช้างเอราวัณและเมืองโบราณอีกด้วย ชาวบ้านเรียกชื่อปราสาทแห่งนี้โดยทั่วไปว่า \"วังโบราณ\" หรือ \"ปราสาทไม้\" ภายในปราสาทได้แฝงเนื้อหาทางปรัชญา และศิลปวัฒนธรรมอันเป็นมรดกของมนุษย์ สะท้อนให้เห็นถึงความสำคัญของศาสนาในฐานะเป็นเครื่องค้ำจุนโลก โดยเน้นหลักสำคัญคือ \"ก่อกำเนิดทั้ง 7 และคุณธรรมข้อประพฤติปฏิบัติทั้ง 4\"\nปราสาทสัจธรรมได้รับรางวัลประเภทรายการแหล่งท่องเที่ยวดีเด่น จากรางวัลอุตสาหกรรมท่องเที่ยวไทย ประจำปี พ.ศ. 2551","other":"Sanctuary of Truth"},"en":{"title":"Sanctuary of Truth","url":"https://en.wikipedia.org/wiki/Sanctuary_of_Truth","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fb/Santuaryoftruth2.jpg/960px-Santuaryoftruth2.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Sanctuary of Truth (Thai: ปราสาทสัจธรรม) is an unfinished museum in Pattaya, Thailand designed by Thai businessman Lek Viriyaphan. The museum structure is a hybrid of a temple and a castle that is themed on the Ayutthaya Kingdom and Hindu and Buddhist beliefs. The building is notably constructed entirely out of wood, specifically Mai Deang, Mai Takien, Mai Panchaat, and Teak.","history":"The building has been under construction since 1981, and may not be finally completed until 2026 at the earliest. Though under construction, tourists are able to visit the sanctuary.","other":"ปราสาทสัจธรรม"}},{"th":{"title":"วัดภูมินทร์","url":"https://th.wikipedia.org/wiki/%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%A0%E0%B8%B9%E0%B8%A1%E0%B8%B4%E0%B8%99%E0%B8%97%E0%B8%A3%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/2013_Wat_Phumin_Nan.jpg/960px-2013_Wat_Phumin_Nan.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"วัดภูมินทร์ ตั้งอยู่ ณ ถนนผากอง บ้านภูมินทร์ ตำบลในเวียง อำเภอเมืองน่าน จังหวัดน่าน เป็นวัดราษฎร์ ฝ่ายมหานิกาย และเป็นสถานที่ท่องเที่ยวที่สำคัญและมีชื่อเสียงของจังหวัดน่าน ภาพของวัดเคยปรากฏบนธนบัตรไทย รุ่นที่ 2 ราคา 1 บาท","history":"ประวัติความเป็นมา \n วัดภูมินทร์ สร้างขึ้นเมื่อราวปี พ.ศ. 2139 โดย เจ้าเจตบุตรพรหมินทร์ เจ้าผู้ครองนครน่าน องค์ที่ 40 (พ.ศ. 2134 - พ.ศ. 2146) เดิมมีชื่อว่า “วัดพรหมมินทร์” ซึ่งเป็นพระนามของเจ้าเจตบุตรพรหมินทร์ ผู้สร้างวัด สันนิษฐานว่าในภายหลังได้เรียกชื่อกันเพี้ยนมาเป็นวัดภูมินทร์จนถึงปัจจุบัน วัดภูมินทร์ และได้รับการบูรณปฏิสังขรณ์ครั้งใหญ่ เมื่อปี พ.ศ. 2410 ในรัชสมัยเจ้าอนันตวรฤทธิเดช เจ้าผู้ครองนครน่าน องค์ที่ 62 และองค์ที่ 12 แห่งราชวงศ์ติ๋นมหาวงศ์ (พ.ศ. 2395 - พ.ศ. 2435) โดยใช้เวลาในการบูรณปฏิสังขรณ์ถึง 8 ปี (พ.ศ. 2410 - พ.ศ. 2418) ซึ่งสันนิษฐานว่าในการบูรณะครั้งนี้เจ้าอนันตวรฤทธิเดช ได้ทรงมีรับสั่งให้วาดภาพจิตรกรรมฝาผนัง (คำเมือง: ฮูบแต้ม) ภายในพระอุโบสถจตุรมุข ซึ่งรวมทั้งภาพที่มีชื่อเสียง เช่น ปู่ม่านย่าม่าน หรือ กระซิบรักบันลือโลก ของ หนานบัวผัน ซึ่งตรงกับปลายรัชสมัยพระบาทสมเด็จพระจอมเกล้าเจ้าอยู่หัว รัชกาลที่ 4 ถึงต้นรัชสมัยพระบาทสมเด็จพระจุลจอมเกล้าเจ้าอยู่หัว รัชกาลที่ 5 แห่งราชวงศ์จักรี","other":"Wat Phumin"},"en":{"title":"Wat Phumin","url":"https://en.wikipedia.org/wiki/Wat_Phumin","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/2013_Wat_Phumin_Nan.jpg/96       if (out.length > 1100) {
        const cut = out.slice(0, 1100);
        const end = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf(".\n"), cut.lastIndexOf(" "), cut.lastIndexOf("\n"));
        out = cut.slice(0, end > 600 ? end + 1 : 1100).trim() + " …";
      }
      return out;
    }).catch(() => { delete historyCache[k]; return ""; });
  }
  return historyCache[k];
}
function revealExtras(card, c) {
  const tools = document.createElement("div"); tools.className = "actions";
  const zoomBtn = document.createElement("button"); zoomBtn.type = "button"; zoomBtn.className = "btn alt"; zoomBtn.textContent = rt("zoomReal");
  zoomBtn.onclick = () => { setSatellite(true); satBtn.textContent = rt("mapView"); map.flyTo([c.lat, c.lon], 17); document.querySelector(".mapwrap").scrollIntoView({ behavior: "smooth", block: "center" }); };
  const satBtn = document.createElement("button"); satBtn.type = "button"; satBtn.className = "btn alt"; satBtn.textContent = satOn ? rt("mapView") : rt("sat");
  satBtn.onclick = () => { setSatellite(!satOn); satBtn.textContent = satOn ? rt("mapView") : rt("sat"); };
  tools.append(zoomBtn, satBtn);
  const box = document.createElement("figure"); box.className = "wiki";
  const loading = document.createElement("figcaption"); loading.textContent = rt("wikiLoading");
  box.append(loading);
  card.append(tools, box);
  const forLang = LANG;
  wikiFor(c).then(w => {
    if (!box.isConnected || forLang !== LANG) return;
    box.replaceChildren();
    if (!w) { box.remove(); return; }
    if (w.img) { const img = document.createElement("img"); img.src = w.img; img.alt = w.title; img.loading = "lazy"; box.append(img); }
    const cap = document.createElement("figcaption");
    const h = document.createElement("b"); h.textContent = (w.noTh && c.histTh) ? (c.th ? c.th.place : c.place) : w.title;
    const p = document.createElement("span"); p.textContent = w.text ? " " + w.text : "";
    cap.append(h, p);
    if (w.url && /^https:\/\/[a-z]+\.wikipedia\.org\//.test(w.url)) {
      const a = document.createElement("a"); a.href = w.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = " " + rt("wikiMore");
      cap.append(a);
    }
    box.append(cap);
    // Thai reader with no Thai article: use the case's own Thai history, else the English one with a note.
    const histP = (w.noTh && c.histTh) ? Promise.resolve(c.histTh)
      : (typeof w.history === "string" ? Promise.resolve(w.history) : wikiHistory(w.lang || "en", w.title));
    histP.then(hist => {
      if (!hist || !box.isConnected || forLang !== LANG) return;
      const sec = document.createElement("section"); sec.className = "history";
      const hh = document.createElement("h3"); hh.textContent = rt("history");
      sec.append(hh);
      if (w.noTh && !c.histTh) { const note = document.createElement("p"); note.className = "note"; note.textContent = rt("noThai"); sec.append(note); }
      hist.split("\n").forEach(line => { if (line.trim()) { const para = document.createElement("p"); para.textContent = line.trim(); sec.append(para); } });
      box.append(sec);
    });
  });
}

// ---------- personal stats & streak (from this device's saved daily results) ----------
const STATS_T = {
  th: { played: "เล่นแล้ว", solved: "ไขได้", streak: "ต่อเนื่อง", best: "สูงสุด", dist: "ไขได้ในกี่หมุด", days: n => `${n} วันติด`, title: "สถิติของคุณ" },
  en: { played: "Played", solved: "Solved", streak: "Streak", best: "Best", dist: "Pins to solve", days: n => `${n}-day streak`, title: "Your stats" }
};
const st = k => STATS_T[LANG][k];
function dailyResults() {
  // Only real daily games count; #N practice games are saved under future/past keys but never mark "counted".
  const prefix = LS().slice(0, -dateKey.length), out = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith(prefix)) continue;
      const day = k.slice(prefix.length);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) continue;
      const v = JSON.parse(localStorage.getItem(k) || "null");
      if (v && v.done && Array.isArray(v.g)) out[day] = v;
    }
  } catch (e) {}
  return out;
}
function computeStats() {
  const res = dailyResults(), todayIdx = Math.max(0, Math.floor((Date.now() + TZ - EPOCH) / DAY));
  const keyOf = i => new Date(EPOCH + i * DAY).toISOString().slice(0, 10);
  const days = Object.keys(res).filter(d => d <= keyOf(todayIdx)).sort();
  const solvedN = days.filter(d => res[d].solved).length;
  const dist = [0, 0, 0, 0, 0];
  days.forEach(d => { if (res[d].solved && res[d].g.length >= 1 && res[d].g.length <= 5) dist[res[d].g.length - 1]++; });
  // current streak: consecutive finished days ending today (or yesterday if today isn't finished yet)
  let i = res[keyOf(todayIdx)] ? todayIdx : todayIdx - 1, cur = 0;
  while (i >= 0 && res[keyOf(i)]) { cur++; i--; }
  let best = 0, run = 0, prev = null;
  days.forEach(d => { const idx = Math.round((Date.parse(d) - EPOCH) / DAY); run = (prev !== null && idx === prev + 1) ? run + 1 : 1; best = Math.max(best, run); prev = idx; });
  return { played: days.length, solvedPct: days.length ? Math.round(solvedN * 100 / days.length) : 0, streak: cur, best, dist };
}
function shareExtra() {
  if (PRACTICE !== null) return "";
  const s = computeStats();
  return s.streak >= 2 ? "\n🔥 " + st("days")(s.streak) : "";
}
function renderStats(card) {
  if (PRACTICE !== null) return;
  const s = computeStats();
  const box = document.createElement("section"); box.className = "stats";
  const h = document.createElement("div"); h.className = "eyebrow"; h.textContent = st("title");
  const row = document.createElement("div"); row.className = "stat-row";
  [[s.played, st("played")], [s.solvedPct + "%", st("solved")], [s.streak, st("streak")], [s.best, st("best")]].forEach(([v, l]) => {
    const c = document.createElement("div"); c.className = "stat";
    const b = document.createElement("b"); b.textContent = v;
    const sp = document.createElement("span"); sp.textContent = l;
    c.append(b, sp); row.append(c);
  });
  const dh = document.createElement("div"); dh.className = "eyebrow"; dh.textContent = st("dist");
  const dist = document.createElement("div"); dist.className = "dist";
  const max = Math.max(1, ...s.dist);
  s.dist.forEach((n, i) => {
    const line = document.createElement("div"); line.className = "dist-line";
    const lab = document.createElement("span"); lab.textContent = i + 1;
    const bar = document.createElement("i"); bar.style.width = Math.max(8, n / max * 100) + "%"; bar.textContent = n;
    if (state.solved && state.g.length === i + 1) bar.className = "now";
    line.append(lab, bar); dist.append(line);
  });
  box.append(h, row, dh, dist);
  card.append(box);
}

// ---------- in-view feedback after each pin, and jump to the answer when the game ends ----------
const UX_T = {
  th: { prompt: (i, n) => `หมุด ${i}/${n} · แตะแผนที่เพื่อปัก`, next: "แตะปักหมุดถัดไป" },
  en: { prompt: (i, n) => `Pin ${i}/${n} · tap the map`, next: "tap for the next pin" }
};
function showFeedback(ro) {
  ro.replaceChildren();
  const g = state.g[state.g.length - 1];
  if (!g) { ro.textContent = UX_T[LANG].prompt(1, MAX_GUESSES); return; }
  const d = guessKm(g), tr = tier(d);
  const label = typeof ROMAN !== "undefined" ? ROMAN[state.g.length - 1] : String(state.g.length);
  const chip = document.createElement("span"); chip.className = "fb t-" + tr;
  chip.textContent = `${label} · ${fmtKm(d)} ${t("km")}` + (tr === "hit" ? " ✓" : "");
  ro.append(chip, document.createTextNode(" " + UX_T[LANG].next));
}
function scrollToResult() {
  if (!matchMedia("(max-width: 899px)").matches) return;
  setTimeout(() => { const c = document.getElementById("resultCard"); if (c && !c.hidden) c.scrollIntoView({ behavior: "smooth", block: "start" }); }, 700);
}

// ---------- anonymous play data for testing (Google Sheet via Apps Script) ----------
const RESULTS_URL = "https://script.google.com/macros/s/AKfycbzzfkOnhgbwSgHddrvZ286gMrGv-RoBxYcIPE8hZWjf0y8s32OpezgJORBbGU01kKLHIQ/exec";
const EDITION = typeof ROMAN !== "undefined" ? "world" : "thai";
const PRIVACY_T = {
  th: "เกมเก็บผลการเล่นแบบไม่ระบุตัวตน (ข้อที่เล่น จำนวนหมุด ระยะ และเวลา) เพื่อนำไปปรับปรุงเกม",
  en: "The game records anonymous play results (riddle, pins, distance and time) to help improve it."
};
function playerId() {
  try {
    let id = localStorage.getItem("pikadlap:player");
    if (!id) { id = Math.random().toString(36).slice(2, 10); localStorage.setItem("pikadlap:player", id); }
    return id;
  } catch (e) { return "anon"; }
}
// the clock starts at the first tap on the map for today's riddle
map.on("click", () => { if (!state.done && !state.t0) { state.t0 = Date.now(); saveLocal(); } });
function sendResult() {
  if (PRACTICE !== null || !RESULTS_URL) return;
  const key = `pikadlap:sent:${EDITION}:${dateKey}`;
  try { if (localStorage.getItem(key)) return; localStorage.setItem(key, "1"); } catch (e) {}
  const body = {
    edition: EDITION, day: dateKey, file: dayIdx + 1, solved: !!state.solved, pins: state.g.length,
    bestKm: Math.round(bestKm(state) * 10) / 10,
    seconds: state.t0 ? Math.round((Date.now() - state.t0) / 1000) : "",
    device: /Line\//i.test(navigator.userAgent) ? "line" : (matchMedia("(max-width: 899px)").matches ? "mobile" : "desktop"),
    player: playerId(), lang: LANG
  };
  try { fetch(RESULTS_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).catch(() => {}); } catch (e) {}
}
// add the privacy line to the How-to-play list in whichever language is shown
const applyStaticBase = applyStatic;
applyStatic = function () {
  applyStaticBase();
  const li = document.createElement("li"); li.className = "privacy"; li.textContent = PRIVACY_T[LANG];
  document.getElementById("helpList").append(li);
};
// ---------- boot ----------
$("helpBtn").onclick = () => $("help").showModal();
applyStatic();
setupDay();
state = loadLocal() || state;
renderAll();
if (state.done) fitResult();
try { if (!state.g.length && !localStorage.getItem("pikadlap:seenHelp")) { localStorage.setItem("pikadlap:seenHelp", "1"); $("help").showModal(); } } catch (e) {}
