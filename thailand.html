* { box-sizing: border-box; }
body {

}
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.top { max-width: 1280px; margin: 0 auto 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1; display: flex; align-items: center; gap: 10px; }

.ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button { background: none; border: 0; padding: 6px 11px; cursor: pointer; font-size: 14px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }

.app { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.mapwrap { position: relative; height: clamp(380px, 64vh, 560px); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
@media (min-width: 900px) {
  .app { grid-template-columns: minmax(0, 1.3fr) minmax(340px, 1fr); align-items: start; }

}
#map { width: 100%; height: 100%; cursor: crosshair; }
.leaflet-container { font-family: var(--font-body); }
.hud { position: absolute; left: 10px; right: 10px; bottom: 22px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; z-index: 500; pointer-events: none; }

.readout .mono { color: var(--muted); font-family: var(--font-mono); font-size: 12px; margin-left: 6px; }
.confirm { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 9px; padding: 9px 16px; font-family: var(--font-display); font-weight: 600; font-size: 16px; cursor: pointer; }

  .cluebar .cb-n { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; background: var(--ink); color: var(--panel); }
  .cluebar .cb-t { min-width: 0; }
  .app { gap: 10px; }
  .mapwrap { height: clamp(340px, 58vh, 520px); }

.fb { display: inline-block; padding: 1px 7px; margin-right: 4px; border-radius: 5px; color: #fff; font-family: var(--font-mono); font-variant-numeric: tabular-nums; animation: pop .35s ease-out; }
.fb.t-warm { color: #1a1408; }

.readout { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.confirm { flex: none; }
.help-q { display: none; }

.file { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.object { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.25; margin: 4px 0 6px; }
.brief { margin: 0; max-width: 62ch; }
.clues { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.clue { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); }
.clue .n { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; background: var(--ink); color: var(--panel); }
.clue .txt { margin: 0; }
.clue.locked { border-style: dashed; color: var(--muted); }
.clue.locked .n { background: var(--empty); color: var(--muted); }
.clue.new { animation: drop .45s ease-out; }
@keyframes drop { from { transform: translateY(-6px); } to { transform: none; } }

.rows { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto 30px; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 9px; background: var(--empty); min-height: 42px; }
.row .i { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.row .place { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.row .km { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px; }
.row .dir { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: #fff; }
.row.filled { background: transparent; border: 1px solid var(--line); }
.t-hit { background: var(--hit); } .t-warm { background: var(--warm); } .t-mid { background: var(--mid); } .t-cold { background: var(--cold); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.result h2 { font-family: var(--font-display); font-size: 22px; margin: 2px 0 4px; line-height: 1.3; }
.result p { margin: 0 0 10px; }
.share { font-family: var(--font-mono); white-space: pre; background: var(--empty); border-radius: 9px; padding: 10px 12px; font-size: 14px; line-height: 1.5; overflow-x: auto; user-select: all; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.btn { background: var(--ink); color: var(--panel); border: 0; border-radius: 9px; padding: 9px 14px; cursor: pointer; font-weight: 500; text-decoration: none; display: inline-block; }
.btn.alt { background: none; color: var(--ink); border: 1px solid var(--line); }
.next { font-size: 13px; color: var(--muted); }
.wiki { margin: 14px 0 0; display: grid; gap: 8px; }
.wiki img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 10px; display: block; background: var(--empty); }
.wiki figcaption { font-size: 14px; color: var(--muted); }

.wiki a { color: var(--accent); }
.history { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.history h3 { font-family: var(--font-display); font-size: 17px; margin: 0 0 6px; }
.history p { margin: 0 0 8px; max-width: 70ch; }

.stats { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center; }
.stat b { display: block; font-family: var(--font-display); font-size: 24px; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); }
.dist { display: grid; gap: 4px; }
.dist-line { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; align-items: center; font-size: 12.5px; }
.dist-line i { display: block; font-style: normal; text-align: right; padding: 1px 6px; border-radius: 4px; background: var(--empty); color: var(--ink); font-family: var(--font-mono); font-size: 12px; }
.dist-line i.now { background: var(--accent); color: #1a1408; }
.foot { max-width: 1280px; margin: 18px auto 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.foot img { height: 20px; display: block; }

dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); max-width: min(520px, calc(100vw - 32px)); padding: 20px 22px; }

inate the writing about him. Where Mueang Rat lay is disputed, with proposals in the Pasak valley near Lom Sak, in the Nan valley near Uttaradit, and at the old Khorat site in Sung Noen. How the campaign should be read is also disputed. In one reading the defeated Khom Sabat Khlon Lamphong commanded a Khmer garrison and the episode was the liberation of Sukhothai from Khmer …","other":"พ่อขุนผาเมือง"}},{"th":{"title":"ท้าวสุรนารี","url":"https://th.wikipedia.org/wiki/%E0%B8%97%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B8%AA%E0%B8%B8%E0%B8%A3%E0%B8%99%E0%B8%B2%E0%B8%A3%E0%B8%B5","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/Thao_Suranari_Monument_%28I%29.jpg/960px-Thao_Suranari_Monument_%28I%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ท้าวสุรนารี หรือ คุณหญิงโม (ต้นฉบับว่า ท่านผู้หญิงโม้) นิยมเรียกว่า ย่าโม (พ.ศ. 2314 – เมษายน พ.ศ. 2395) เป็นบุคคลในประวัติศาสตร์ไทยในฐานะวีรสตรีมีส่วนกอบกู้เมืองนครราชสีมาจากกองทัพเจ้าอนุวงศ์ พระมหากษัตริย์เวียงจันทน์ เมื่อปี พ.ศ.","history":"ท้าวสุรนารี มีนามเดิมว่า \"โม\" (แปลว่า ใหญ่มาก) หรือท้าวมะโหโรง เป็นชาวเมืองนครราชสีมาโดยกำเนิด เกิดเมื่อปีระกา พ.ศ. 2314 มีนิวาสสถานอยู่ ณ บ้านตรงกันข้ามกับวัดพระนารายณ์มหาราช (วัดกลางนคร) ทางทิศใต้ของเมืองนครราชสีมา ชอบเล่นกระบี่กระบองตั้งแต่เด็ก เป็นธิดาของนายกิ่มและนางบุญมา มีพี่สาวหนึ่งคนชื่อ แป้นาผล ไม่มีสามี จึงอยู่ด้วยกันจนวายชนม์ มีน้องชายหนึ่งคน ชื่อ จุก\nท้าวสุรนารีเป็นคนมีสติปัญญาหลักแหลม เล่นหมากรุกเก่ง มีความชำนาญในการขี่ช้าง ขี่ม้า มีม้าตัวโปรดสีดำ ท้าวสุรนารี ถึงแก่อสัญกรรมเมื่อเดือนเมษายน พ.ศ. 2395 (เดือน 5 ปีชวด จัตวาศก จศ. 1214) สิริอายุได้ 81 ปี","other":"Thao Suranari"},"en":{"title":"Thao Suranari","url":"https://en.wikipedia.org/wiki/Thao_Suranari","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/Thao_Suranari_Monument_%28I%29.jpg/960px-Thao_Suranari_Monument_%28I%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Thao Suranari (Thai: ท้าวสุรนารี; 1771–1852) is the royally bestowed title of Lady Mo, also known as Ya Mo (ย่าโม, \"Grandma Mo\"), who was the wife of the deputy governor of Nakhon Ratchasima (Korat), the stronghold of Siamese control over its Laotian vassals.\nThao Suranari, hailed from Nakhon Ratchasima. She resided across from Wat Phra Narai Maharat, the main temple in Nakhon Ratchasima, situated to the city\u0027s south.","history":"Thao Suranari (Thai: ท้าวสุรนารี; 1771–1852) is the royally bestowed title of Lady Mo, also known as Ya Mo (ย่าโม, \"Grandma Mo\"), who was the wife of the deputy governor of Nakhon Ratchasima (Korat), the stronghold of Siamese control over its Laotian vassals.\nThao Suranari, hailed from Nakhon Ratchasima. She resided across from Wat Phra Narai Maharat, the main temple in Nakhon Ratchasima, situated to the city\u0027s south.\nIn 1826, King Anouvong of Vientiane invaded Siam, seeking complete independence. Anouvong\u0027s forces seized the city of Nakhon Ratchasima by a ruse when the governor was away. The invaders evacuated the inhabitants, intending to resettle them in Laos. Lady Mo is credited with saving her people by harassing the enemy. Varying stories describe her either getting the invading soldiers drunk, or leading a rebellion of the prisoners on the way back to Vientiane. The generally accepted version is that, when the Lao invaders ordered the women to cook for them, Lady Mo requested knives so that food might be prepared. That night, when the invaders were asleep, she gave the knives …","other":"ท้าวสุรนารี"}},{"th":{"title":"ท้าวเทพกระษัตรีและท้าวศรีสุนทร","url":"https://th.wikipedia.org/wiki/%E0%B8%97%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B9%80%E0%B8%97%E0%B8%9E%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%A9%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B5%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%97%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B8%A8%E0%B8%A3%E0%B8%B5%E0%B8%AA%E0%B8%B8%E0%B8%99%E0%B8%97%E0%B8%A3","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/91/%E0%B8%97%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B9%80%E0%B8%97%E0%B8%9E%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%A9%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B5%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%97%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B8%A8%E0%B8%A3%E0%B8%B5%E0%B8%AA%E0%B8%B8%E0%B8%99%E0%B8%97%E0%B8%A3_%E0%B8%AB%E0%B8%AD%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%95%E0%B8%B4%E0%B8%A1%E0%B8%B2%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1%E0%B8%95%E0%B9%89%E0%B8%99%E0%B9%81%E0%B8%9A%E0%B8%9A.jpg/960px-%E0%B8%97%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B9%80%E0%B8%97%E0%B8%9E%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%A9%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B5%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%97%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B8%A8%E0%B8%A3%E0%B8%B5%E0%B8%AA%E0%B8%B8%E0%B8%99%E0%B8%97%E0%B8%A3_%E0%B8%AB%E0%B8%AD%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%95%E0%B8%B4%E0%B8%A1%E0%B8%B2%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1%E0%B8%95%E0%B9%89%E0%B8%99%E0%B9%81%E0%B8%9A%E0%B8%9A.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ท้าวเทพกระษัตรี (เกิดราวปี พ.ศ.  2278 หรือ 2280 - ราวปี พ.ศ. 2336) และ ท้าวศรีสุนทร (ไม่ทราบปีเกิด) นามเดิมว่า คุณหญิงจัน และ คุณมุก ตามลำดับ เป็นสองวีรสตรีในประวัติศาสตร์ไทย ผู้มีบทบาทในการป้องกันเมืองถลางเกาะภูเก็ตจากการรุกรานของพม่าในสงครามเก้าทัพเมื่อ พ.ศ.","history":"ข้อมูลต้นกำเนิดของท้าวเทพกะษัตรี (จัน) และท้าวศรีสุนทร (มุก) ได้จากพงษาวดารเมืองถลาง ระบุว่าท้าวเทพกะษัตรี (จัน) และท้าวศรีสุนทร (มุก) เป็นธิดาของจอมร้างเจ้าเมืองถลางบ้านตะเคียน มารดาคือ \"นางหม่าเซี้ย\" ซึ่งเป็น ”แขกเมืองไทร” หรือหญิงมลายู ระบุว่าหม่าเซี้ยนั้นเป็นธิดาของ ”มะหุม” หรือ “มาร์ฮุม” (Marhum) หรือสุลต่านเมืองไทรบุรี หม่าเซี้ยเกิดความขัดแย้งเรื่องเงินมรดกกับน้องชายที่เมืองไทรบุรี หม่าเซี้ยมีความไม่พอใจจึงเดินทางย้ายมาอาศัยอยู่ที่เกาะภูเก็ต ได้พบกับจอมร้างเจ้าเมืองถลางบ้านตะเคียนและสมรสกัน มีบุตรธิดาจำนวนห้าคน ได้แก่\nญ. จัน หรือคุณหญิงจัน\nญ. มุก หรือคุณมุก\nญ. หม่า\nช. อาด\nช. เรือง\nคุณหญิงจัน เกิดเมื่อประมาณ พ.ศ. 2278 คุณมุก เกิดเมื่อประมาณ พ.ศ. 2280 ในรัชกาลสมเด็จพระเจ้าอยู่หัวบรมโกศ ในช่วงปลายสมัยกรุงศรีอยุธยานั้น บนเกาะถลางมีชุมชนอยู่สองแห่ง ได้แก่ เมืองถลางบ้านตะเคียน ปกครองโดย \"จอมร้าง\" และเมืองถลางบ้านดอน ปกครองโดย \"จอมเฒ่า\" จอมร้างและจอมเฒ่าเป็นพี่น้องต่างมารดาบิดาเดียวกัน จอมเฒ่าบ้านดอนมีบุตรชื่อ \"ทองพูน\" เป็นลูกพี่ลูกน้องของคุณหญิงจันและคุณมุก\nคุณหญิงจัน สมรสครั้งแรกกับหม่อมศรีภักดี หรือหม่อมภักดีภูธร หรือหมื่นศรีภักดี ซึ่งหมื่นศรีภักดีนั้น …","other":"Thao Thep Krasattri and Thao Si Sunthon"},"en":{"title":"Thao Thep Krasattri and Thao Si Sunthon","url":"https://en.wikipedia.org/wiki/Thao_Thep_Krasattri_and_Thao_Si_Sunthon","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/91/%E0%B8%97%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B9%80%E0%B8%97%E0%B8%9E%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%A9%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B5%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%97%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B8%A8%E0%B8%A3%E0%B8%B5%E0%B8%AA%E0%B8%B8%E0%B8%99%E0%B8%97%E0%B8%A3_%E0%B8%AB%E0%B8%AD%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%95%E0%B8%B4%E0%B8%A1%E0%B8%B2%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1%E0%B8%95%E0%B9%89%E0%B8%99%E0%B9%81%E0%B8%9A%E0%B8%9A.jpg/960px-%E0%B8%97%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B9%80%E0%B8%97%E0%B8%9E%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%A9%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B5%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%97%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B8%A8%E0%B8%A3%E0%B8%B5%E0%B8%AA%E0%B8%B8%E0%B8%99%E0%B8%97%E0%B8%A3_%E0%B8%AB%E0%B8%AD%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%95%E0%B8%B4%E0%B8%A1%E0%B8%B2%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1%E0%B8%95%E0%B9%89%E0%B8%99%E0%B9%81%E0%B8%9A%E0%B8%9A.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Thao Thep Krasattri (ท้าวเทพกระษัตรี 1735 – 1792) and Thao Si Sunthon (ท้าวศรีสุนทร), formerly Khun Ying Chan (คุณหญิงจัน) and Khun Ying Muk (คุณหญิงมุก), respectively, are Thai national heroines who were known for their important roles in successfully repelling the Burmese Invasion of Thalang (modern Phuket) in 1786.","history":"Thao Thep Krasattri (ท้าวเทพกระษัตรี 1735 – 1792) and Thao Si Sunthon (ท้าวศรีสุนทร), formerly Khun Ying Chan (คุณหญิงจัน) and Khun Ying Muk (คุณหญิงมุก), respectively, are Thai national heroines who were known for their important roles in successfully repelling the Burmese Invasion of Thalang (modern Phuket) in 1786.","other":"ท้าวเทพกระษัตรีและท้าวศรีสุนทร"}},{"th":{"title":"วงเวียนใหญ่","url":"https://th.wikipedia.org/wiki/%E0%B8%A7%E0%B8%87%E0%B9%80%E0%B8%A7%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B9%83%E0%B8%AB%E0%B8%8D%E0%B9%88","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2a/King_Taksin_Monument_%28I%29.jpg/960px-King_Taksin_Monument_%28I%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"วงเวียนใหญ่ เป็นชื่อย่านในกรุงเทพมหานครที่มีศูนย์กลางอยู่บริเวณวงเวียนที่ถนนประชาธิปก ถนนลาดหญ้า ถนนสมเด็จพระเจ้าตากสิน และถนนอินทรพิทักษ์มาบรรจบกันในพื้นที่เขตธนบุรี กรุงเทพมหานคร เป็นที่ตั้งของพระบรมราชานุสาวรีย์ สมเด็จพระเจ้ากรุงธนบุรี บริเวณใกล้เคียงเป็นที่ตั้งของสถานีรถไฟวงเวียนใหญ่ ซึ่งเป็นสถานีต้นทางของทางรถไฟสายแม่กลอง (วงเวียนใหญ่-มหาชัย)","history":"ในช่วงรัตนโกสินทร์ตอนต้นย่านวงเวียนใหญ่เป็นสวนผลไม้ ยังไม่ปรากฏหลักฐานใดบริเวณวงเวียนใหญ่ แต่มีชุมชนใกล้เคียงกับย่านวงเวียนใหญ่ ได้แก่ ชุมชนชาวตลาดพลูซึ่งเป็นตลาดค้าขายหมากพลูกันมาก ต่อมา 4 มกราคม พ.ศ. 2447 รถไฟสายท่าจีนจากคลองสาน จังหวัดธนบุรี ถึงมหาชัย จังหวัดสมุทรสาคร เปิดให้ประชาชนทั่วไปเริ่มใช้บริการ บริเวณวงเวียนใหญ่เป็นที่ตั้งของสถานีวงเวียนใหญ่ เริ่มมีย่านการค้าบริเวณริมทางรถไฟเกิดขึ้น\nพ.ศ. 2475 สะพานพุทธยอดฟ้าก่อสร้างแล้วเสร็จ เพื่อเชื่อมพื้นที่ฝั่งตะวันออกและฝั่งตะวันตกของแม่น้ำเจ้าพระยา โดยทางราชการมีนโยบายก่อสร้างถนน 11 สาย ในพื้นที่ต่าง ๆ ทางฝั่งธนบุรี ถนนที่สำคัญ เช่น ถนนประชาธิปก ถนนสมเด็จเจ้าพระยา (เชื่อมถนนประชาธิปกจากทางตะวันออกถึงปากคลองสาน) ถนนลาดหญ้า ถนนสมเด็จพระเจ้าตากสิน ถนนท่าดินแดง หลังจากนั้นมีการก่อสร้างถนนเจริญนคร ถนนเจริญรัถ ถนนกรุงธนบุรี ตรงบริเวณกลางวงเวียนของวงเวียนใหญ่ได้มีการตัดพื้นที่สวนออกให้เป็นที่ว่าง ทำให้คนส่วนใหญ่นำเอาขยะมาเท ต่อมาทางการได้เอาดินมาถมเป็นลานวงกลมใหญ่ จึงกลายเป็นที่วิ่งเล่น เล่นว่าวของคนละแวกนี้ และตอนหลังได้มีคณะละครสัตว์มาเปิดแสดง รวมไปถึงการตั้งเวทีมวย จน พ.ศ. 2497 พระบรมราชานุสาวรีย์สมเด็จพระเจ้ากรุงธนบุรี สร้างแล้วเสร็จ\n1 …","other":"Wongwian Yai"},"en":{"title":"Wongwian Yai","url":"https://en.wikipedia.org/wiki/Wongwian_Yai","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2a/King_Taksin_Monument_%28I%29.jpg/960px-King_Taksin_Monument_%28I%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Wongwian Yai, also spelled \"Wong Wian Yai\" or \"Wongwien Yai\" (Thai: วงเวียนใหญ่, pronounced [wōŋ.wīa̯n jàj]; lit. \u0027big roundabout\u0027), is a large roundabout (traffic circle) in Thonburi, on the west bank of the Chao Phraya River in Bangkok, Thailand, where the statue of King Taksin is situated.  It overlaps between the four sub-districts of two districts, Bang Yi Ruea and Hiran Ruchi of Thon Buri with Somdet Chao Phraya and Khlong San of Khlong San in the centre of Bangkok, at the intersection of Prajadhipok/ Intharaphithak/ Lat Ya/ Somdet Phra Chao Taksin Roads.\nWongwian Yai station, a cluster of railway and rapid transit stations, is located nearby.","history":"The circle was built following the Memorial Bridge (Phra Phutta Yodfa Bridge) opening on 6 April 1932, commemorating the 150th anniversary of the Chakri Dynasty and Bangkok City (Rattanakosin Kingdom). The bridge from old Bangkok conducted 11 new road projects to be built on Thonburi side of the Chao Phraya River, also with the circle. It was named Wongwian Yai, \"big circle\" in Thai, as there was a smaller traffic circle with a clock tower next to the Memorial Bridge called Wongwian Lek, \"small circle\". The statue of King Taksin was built 21 years later.","other":"วงเวียนใหญ่"}},{"th":{"title":"พระบรมราชานุสรณ์ดอนเจดีย์","url":"https://th.wikipedia.org/wiki/%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%9A%E0%B8%A3%E0%B8%A1%E0%B8%A3%E0%B8%B2%E0%B8%8A%E0%B8%B2%E0%B8%99%E0%B8%B8%E0%B8%AA%E0%B8%A3%E0%B8%93%E0%B9%8C%E0%B8%94%E0%B8%AD%E0%B8%99%E0%B9%80%E0%B8%88%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B9%8C","img":"https://upload.wikimedia.org/wikipedia/commons/e/e5/Donchediwarmrl0609.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"พระบรมราชานุสรณ์ดอนเจดีย์   ตั้งอยู่ที่ ตำบลดอนเจดีย์ อำเภอดอนเจดีย์ จังหวัดสุพรรณบุรี ประกอบด้วยพระบรมราชานุสาวรีย์สมเด็จพระนเรศวรมหาราชทรงพระคชาธารออกศึก และองค์เจดีย์ยุทธหัตถี สมเด็จพระนเรศวรมหาราชทรงสร้างเจดีย์ขึ้นเพื่อเฉลิมฉลองชัยชนะในสงครามยุทธหัตถีที่ทรงมีต่อพระมหาอุปราชาแห่งพม่า เมื่อเดือนมกราคม พ.ศ. 2135 และในปี พ.ศ. 2495 กองทัพบกได้บูรณปฏิสังขรณ์องค์พระเจดีย์ขึ้นใหม่ โดยสร้างเป็นเจดีย์แบบลังกาทรงกลมใหญ่ สูง 66 เมตร ฐานกว้างด้านละ 36 เมตร ครอบพระเจดีย์องค์เดิมไว้ \nพระบาทสมเด็จพระบรมชนกาธิเบศรมหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตรได้เสด็จไปประกอบพิธีบวงสรวงและเปิดพระบรมราชานุสรณ์ดอนเจดีย์เมื่อวันที่ 25 มกราคม พ.ศ.","history":"พระบรมราชานุสรณ์ดอนเจดีย์   ตั้งอยู่ที่ ตำบลดอนเจดีย์ อำเภอดอนเจดีย์ จังหวัดสุพรรณบุรี ประกอบด้วยพระบรมราชานุสาวรีย์สมเด็จพระนเรศวรมหาราชทรงพระคชาธารออกศึก และองค์เจดีย์ยุทธหัตถี สมเด็จพระนเรศวรมหาราชทรงสร้างเจดีย์ขึ้นเพื่อเฉลิมฉลองชัยชนะในสงครามยุทธหัตถีที่ทรงมีต่อพระมหาอุปราชาแห่งพม่า เมื่อเดือนมกราคม พ.ศ. 2135 และในปี พ.ศ. 2495 กองทัพบกได้บูรณปฏิสังขรณ์องค์พระเจดีย์ขึ้นใหม่ โดยสร้างเป็นเจดีย์แบบลังกาทรงกลมใหญ่ สูง 66 เมตร ฐานกว้างด้านละ 36 เมตร ครอบพระเจดีย์องค์เดิมไว้ \nพระบาทสมเด็จพระบรมชนกาธิเบศรมหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตรได้เสด็จไปประกอบพิธีบวงสรวงและเปิดพระบรมราชานุสรณ์ดอนเจดีย์เมื่อวันที่ 25 มกราคม พ.ศ. 2502 หลังจากนั้นรัฐบาลได้กำหนดให้วันกองทัพไทย ซึ่งตรงกับวันที่ 25 มกราคม ของทุกปี ต่อมาได้เปลี่ยนเป็นวันที่ 18 มกราคม ของทุกปี เป็นวันถวายราชสักการะพระบรมราชานุสรณ์ดอนเจดีย์ พร้อมกันนั้นทางจังหวัดได้จัดให้มีงานเฉลิมฉลองพระบรมราชานุสรณ์ดอนเจดีย์ทุกปี เลยจากเจดีย์ไปประมาณ 100 เมตร เป็นที่ตั้งของ พระตำหนักสมเด็จพระนเรศวรมหาราช ภายในมีพระบรมรูปของสมเด็จพระนเรศวรมหาราช และพระรูปพระสุพรรณกัลยา มีผู้นิยมไปสักการบูชาอยู่เสมอ ปัจจุบันทรงพระกรุณาโปรดเกล้าฯ …","other":"Don Chedi Monument"},"en":{"title":"Don Chedi Monument","url":"https://en.wikipedia.org/wiki/Don_Chedi_Monument","img":"https://upload.wikimedia.org/wikipedia/commons/e/e5/Donchediwarmrl0609.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"The Don Chedi Monument (Thai: พระบรมราชานุสรณ์ดอนเดจีย์, RTGS: Phra Boromma Rachanuson Don Chedi) is a royal memorial Don Chedi district , Suphan Buri province, Thailand, built to commemorate King Naresuan of Ayutthaya\u0027s legendary 1593 victorious elephant duel over the Burmese uparaja Mingyi Swa in the battle of Nong Sarai. It was built on the site of a ruined chedi (stupa), believed to have originally been erected by Naresuan, and comprises a new chedi covering the ruins, and a statue of Naresuan mounted on his war elephant.\nThe search for the site\u0027s location was initiated by the historian Prince Damrong Rajanubhab following the discovery of the Luang Prasoet Chronicle, which identified the site of the duel as a place called Nong Sarai.","history":"The Don Chedi Monument (Thai: พระบรมราชานุสรณ์ดอนเดจีย์, RTGS: Phra Boromma Rachanuson Don Chedi) is a royal memorial Don Chedi district , Suphan Buri province, Thailand, built to commemorate King Naresuan of Ayutthaya\u0027s legendary 1593 victorious elephant duel over the Burmese uparaja Mingyi Swa in the battle of Nong Sarai. It was built on the site of a ruined chedi (stupa), believed to have originally been erected by Naresuan, and comprises a new chedi covering the ruins, and a statue of Naresuan mounted on his war elephant.\nThe search for the site\u0027s location was initiated by the historian Prince Damrong Rajanubhab following the discovery of the Luang Prasoet Chronicle, which identified the site of the duel as a place called Nong Sarai. The ruins were discovered by the Governor of Suphan Buri in 1913, and King Vajiravudh made a pilgrimage to the site in January 1914. Plans were made to build a new chedi to house the ruins, but this was shelved due to the poor economy. The project was later revived in 1950 by the government of Plaek Pibulsonggram, and the memorial, with the new …","other":"พระบรมราชานุสรณ์ดอนเจดีย์"}},{"th":{"title":"พระยาพิชัยดาบหัก","url":"https://th.wikipedia.org/wiki/%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%A2%E0%B8%B2%E0%B8%9E%E0%B8%B4%E0%B8%8A%E0%B8%B1%E0%B8%A2%E0%B8%94%E0%B8%B2%E0%B8%9A%E0%B8%AB%E0%B8%B1%E0%B8%81","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Phraya_Pichai.jpg/960px-Phraya_Pichai.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"พระยาพิชัยดาบหัก เป็นขุนนางในสมัยอยุธยาตอนปลายและธนบุรี ปรากฏชื่อในพระราชพงศาวดารเนื่องจากเป็นทหารเอกคู่พระทัยของสมเด็จพระเจ้ากรุงธนบุรี และเป็นผู้มีส่วนกอบกู้เอกราชของชาติไทยหลังการเสียกรุงศรีอยุธยาครั้งที่สอง มีชื่อเสียงอย่างยิ่งจากความกตัญญูกตเวทีและความกล้าหาญ หนึ่งในสี่ทหารเสือของสมเด็จพระเจ้ากรุงธนบุรี ได้แก่ หลวงราชเสน่หา (สมเด็จพระบวรราชเจ้ามหาสุรสิงหนาท), หลวงพิชัยอาสา (พระยาพิชัยดาบหัก), พระยาเชียงเงิน (พระยาสุโขทัย), หลวงพรหมเสนา (เจ้าพระยานครสวรรค์)","history":"พระยาพิชัยดาบหัก เดิมชื่อ จ้อย เกิดในปี พ.ศ. 2284 ที่บ้านห้วยคา เมืองพิชัย จังหวัดอุตรดิตถ์ มีพี่น้อง 4 คน แต่เสียชีวิตไป 3 คน เด็กชายจ้อยมีนิสัยชอบชกมวยมาตั้งแต่เยาว์วัย บิดาได้พร่ำสอนเสมอ ถ้าจะชกมวยให้เก่งต้องขยันเรียนหนังสือด้วย เมื่ออายุได้ 14 ปี บิดานำไปฝากกับท่านพระครูวัดมหาธาตุ เมืองพิชัย จ้อยสามารถอ่านออกเขียนได้จนแตกฉานและซ้อมมวยไปด้วย\nต่อมาเจ้าเมืองพิชัยได้นำบุตร (ชื่อเฉิด) มาฝากที่วัดเพื่อร่ำเรียนวิชา เฉิดกับพวกมักหาทางทะเลาะวิวาทกับจ้อยเสมอ เขาจึงตัดสินใจหนีออกจากวัดขึ้นไปทางเหนือโดยมิได้บอกพ่อแม่และอาจารย์ เดินตามลำน้ำน่านไปเรื่อยๆ เมื่อเหนื่อยก็หยุดพักตามวัด ที่วัดบ้านแก่ง จ้อย ได้พบกับครูฝึกมวยคนหนึ่งชื่อ เที่ยง จึงฝากตัวเป็นศิษย์แล้วเปลี่ยนชื่อใหม่เป็นทองดี ครูเที่ยงรักนายทองดีมากและมักเรียกนายทองดีว่านายทองดี ฟันขาว (เนื่องจากท่านไม่เคี้ยวหมากพลูดังคนสมัยนั้น) ด้วยความสุภาพเรียบร้อย และขยันขันแข็งเอาใจใส่การฝึกมวยช่วยการงานบ้านครูเที่ยงด้วยดีเสมอมา ทำให้ลูกหลานครูเที่ยงอิจฉานายทองดีมาก จนหาทางกลั่นแกล้งต่างๆ นานา นายทองดี ฟันขาว เห็นว่าอยู่บ้านแก่งต่อไปคงลำบาก ประกอบครูเที่ยงก็ถ่ายทอดวิชามวยให้จบหมดสิ้นแล้วจึงกราบลาครูขึ้นเหนือต่อไป …","other":"Phraya Phichai"},"en":{"title":"Phraya Phichai","url":"https://en.wikipedia.org/wiki/Phraya_Phichai","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Phraya_Pichai.jpg/960px-Phraya_Pichai.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Phraya Phichai (Thai: พระยาพิชัย), or popularly known as Phraya Phichai Dap Hak (Thai: พระยาพิชัยดาบหัก; lit: \"Phraya Phichai of the broken sword\") (1741–1782) was a historic Siamese nobleman of Mon descent who served as a military leader under King Taksin of the Thonburi Kingdom. He legendarily became known for fighting with a sword in each hand until one was broken.","history":"Phraya Phichai was a Siamese general serving under King Thaksin Shinawatra. After the fall of Ayutthaya in 1767, Phraya Phichai and Chao Phraya Chakri (who later became the first King of the Chakri dynasty) followed Phraya Taksin in repelling the Burmese and reuniting Siam. They were considered Phraya Taksin\u0027s left and right hands (though some accounts state that Phraya Chakri and Maha Sura Singhanat held those positions).\nIn 1782, King Taksin showed signs of mental illness. At that time, the nation still lacked stability and was in need of a strong ruler. King Taksin was deposed by Lord Surayud Chulanont and later executed following a coup, after which Chao Phraya Chakri took the throne. Phraya Phichai, a devout follower of King Taksin, was not spared and, by most accounts, requested his own execution to follow King Taksin to his death. He was executed soon after.","other":"พระยาพิชัยดาบหัก"}},{"th":{"title":"พระพุทธชินราช","url":"https://th.wikipedia.org/wiki/%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%9E%E0%B8%B8%E0%B8%97%E0%B8%98%E0%B8%8A%E0%B8%B4%E0%B8%99%E0%B8%A3%E0%B8%B2%E0%B8%8A","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/41/%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%9E%E0%B8%B8%E0%B8%97%E0%B8%98%E0%B8%8A%E0%B8%B4%E0%B8%99%E0%B8%A3%E0%B8%B2%E0%B8%8A%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%A9%E0%B8%99%E0%B9%83%E0%B8%99%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%A8%E0%B8%A3%E0%B8%B5%E0%B8%A3%E0%B8%B1%E0%B8%95%E0%B8%99%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8.jpg/960px-%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%9E%E0%B8%B8%E0%B8%97%E0%B8%98%E0%B8%8A%E0%B8%B4%E0%B8%99%E0%B8%A3%E0%B8%B2%E0%B8%8A%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%A9%E0%B8%99%E0%B9%83%E0%B8%99%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%A8%E0%B8%A3%E0%B8%B5%E0%B8%A3%E0%B8%B1%E0%B8%95%E0%B8%99%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"พระพุทธชินราช ประดิษฐานอยู่ ณ วิหารด้านตะวันตกในวัดพระศรีรัตนมหาธาตุวรมหาวิหาร จังหวัดพิษณุโลก สันนิษฐานว่าสร้างขึ้นในปี พ.ศ.","history":"พระพุทธชินราช ไม่ปรากฏหลักฐานแน่ชัดว่าสร้างในสมัยใด คงมีแต่พงศาวดารเหนือ ซึ่งเป็นเอกสารที่เล่าถึงตำนานเมืองเหนือเรื่องต่าง ๆ สมัยกรุงศรีอยุธยา ถูกเรียบเรียงขึ้นใหม่โดยพระวิเชียรปรีชา (น้อย) ในปี พ.ศ. 2350 ที่อ้างถึงกษัตริย์เชียงแสนพระนามพระเจ้าศรีธรรมไตรปิฎกเป็นผู้สร้าง พร้อมกับการสร้างเมืองพิษณุโลกและพระพุทธรูปอีก 2 องค์คือพระพุทธชินสีห์และพระศรีศาสดา\nพ.ศ. 2409 พระบาทสมเด็จพระจอมเกล้าเจ้าอยู่หัวได้มีพระราชนิพนธ์เพิ่มเติมเกี่ยวกับประวัติการสร้างพระพุทธชินราช พระพุทธชินสีห์ และพระศรีศาสดา ในชื่อ \"ตำนานพระพุทธชินราช พระพุทธชินสีห์ และพระศรีศาสดา\" ในหนังสือวชิรญาณวิเศษ โดยใช้พงศาวดารเหนือในการอ้างอิงจึงทำให้มีเนื้อหาหลักคล้ายคลึงกัน แต่เพิ่มเติมการสร้างพระเหลือเข้าไป และมีการระบุศักราชในการสร้างพระพุทธรูปทั้ง 3 องค์ไว้ดังนี้ พระพุทธชินสีห์และพระศรีศาสดาหล่อในปี พ.ศ. 1498 และพระพุทธชินราชหล่อขึ้นในปี พ.ศ. 1500 (หย่อนอยู่ 7 วัน) \nพ.ศ. 2423 ในรัชสมัยพระบาทสมเด็จพระจุลจอมเกล้าเจ้าอยู่หัว สมเด็จพระมหาสมณเจ้า กรมพระยาปวเรศวริยาลงกรณ์ ได้ทรงแต่งตำนานการสร้างพระพุทธชินราชขึ้นอีกสำนวนหนึ่ง ชื่อ \"พงษาวดารเหนือ : เป็นลิลิตเรื่องนิทานพระร่วง แลนิทานพระเจ้าธรรมไตรปิฎก นิทานพระชินศรี พระชินราช …","other":null},"en":{"title":"Wat Phra Si Rattana Mahathat","url":"https://en.wikipedia.org/wiki/Wat_Phra_Si_Rattana_Mahathat","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/27/Wat_Phra_Si_Rattana_Mahathat%2C_Phitsanulok_%28I%29.jpg/960px-Wat_Phra_Si_Rattana_Mahathat%2C_Phitsanulok_%28I%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Wat Phra Sri Rattana Mahathat (Thai: วัดพระศรีรัตนมหาธาตุ; \"Temple of the Great Jewelled Reliquary\"), colloquially referred to as Wat-Phra-Sri (Thai: วัดพระศรี) or Wat Yai (Thai: วัดใหญ่; \"Big Temple\"), is a Buddhist temple (wat) in Phitsanulok Province, Thailand, where it is located on east bank of Nan River, near Naresuan Bridge and opposite Phitsanulok Provincial Hall. It is about 337 km (209 mi) from Bangkok.","history":"Wat Phra Si Rattana Mahathat, known among the locals as \"Wat Yai\", was founded in 1357 by King Lithai of Sukhothai. The temple was built at the same time as Phra Phuttha Chinnarat, Phra Phuttha Chinna Si, and Phra Si Satsada. During the reign of King Ekathotsarot of Ayutthaya, its Buddha image was gilded and the temple was later developed by King Chulalongkorn and King Bhumibol Adulyadej of Rattanakosin. The temple is located at the foot of Naresuan Bridge on the bank of the Nan River. It has an area of 36 rai (1 rai = 1600 m^2). The temple is very famous because of its golden Buddha image called Phra Phuttha Chinnarat, which is considered by some Thais to be the most beautiful Buddha image in the country.\nFather of Thai history Prince Damrong Rajanubhab recorded this temple that.\n\"The temple is a big and more important than other temples in Phitsanulok and is believed to be built in the Sukhothai period being renovated from time to time\".","other":"วัดพระศรีรัตนมหาธาตุวรมหาวิหาร"}},{"th":{"title":"วัดพระธาตุพนมวรมหาวิหาร","url":"https://th.wikipedia.org/wiki/%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8%E0%B8%9E%E0%B8%99%E0%B8%A1%E0%B8%A7%E0%B8%A3%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8%E0%B8%9E%E0%B8%99%E0%B8%A1_%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8%E0%B8%9E%E0%B8%99%E0%B8%A1%E0%B8%A7%E0%B8%A3%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3.jpg/960px-%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8%E0%B8%9E%E0%B8%99%E0%B8%A1_%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8%E0%B8%9E%E0%B8%99%E0%B8%A1%E0%B8%A7%E0%B8%A3%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"วัดพระธาตุพนม วรมหาวิหาร เป็นวัดพระอารามหลวง ชั้นเอก ชนิดวรมหาวิหาร ปัจจุบันมี พระเทพวรมุนี เป็นเจ้าอาวาส ตั้งแต่ ปี พ.ศ.","history":"ตามตำนานพระธาตุพนม ในอุรังคนิทานกล่าวว่า สมัยหนึ่งในปัจฉิมโพธิกาล พระโคตมพุทธเจ้า พร้อมทั้งพระอานนท์ ได้เสด็จมาทางทิศตะวันออก โดยทางอากาศ ได้มาลงที่ดอนกอนเนา แล้วเสด็จไปหนองคันแทเสื้อน้ำ (เวียงจันทน์) ได้พยากรณ์ไว้ว่า ในอนาคตจะเกิดบ้านเมืองใหญ่ เป็นที่ประดิษฐานพระพุทธศาสนา จากนั้นได้เสด็จไปตามลำดับ ได้ทรงประทานรอยพระพุทธบาทไว้ที่ โพนฉัน (พระบาทโพนฉัน) อยู่ตรงข้ามอำเภอโพนพิสัย จังหวัดหนองคาย แล้วเสด็จมาที่ พระบาทเวินปลา ซึ่งอยู่เหนือเมืองนครพนมปัจจุบัน ได้ทรงพยากรณ์ที่ตั้งเมืองมรุกขนคร (นครพนม) และได้ประทับพักแรมที่ภูกำพร้าหนึ่งคืน วันรุ่งขึ้นเสด็จข้ามแม่น้ำโขง ไปบิณฑบาตที่เมืองศรีโคตรบูรณ์ พักอยู่ที่ร่มต้นรังต้นหนึ่ง (พระธาตุอิงฮังเมืองสุวรรณเขต) แล้วกลับมาทำภัตกิจ (ฉันอาหาร) ที่ภูกำพร้าโดยทางอากาศ\nพญาอินทร์ได้เสด็จมาเฝ้าและทูลถามพระพุทธองค์ ถึงเหตุที่มาประทับที่ภูกำพร้า พระพุทธองค์ได้ตรัสว่า เป็นประเพณีของพระพุทธเจ้าทั้ง 3 พระองค์ ในภัททกัลป์ที่นิพพานไปแล้ว บรรดาสาวกจะนำพระบรมสารีริกธาตุ มาบรรจุไว้ที่ภูกำพร้า พระพุทธองค์เมื่อนิพพานแล้ว พระมหากัสสปะ ผู้เป็นสาวก ก็จะนำเอาพระบรมสารีริกธาตุมาบรรจุไว้ ณ ที่นี้เช่นกัน จากนั้นพระพุทธองค์ก็ได้ทรงปรารภถึงเมืองศรีโคตบูร และมรุกขนคร …","other":"Wat Phra That Phanom"},"en":{"title":"Wat Phra That Phanom","url":"https://en.wikipedia.org/wiki/Wat_Phra_That_Phanom","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8%E0%B8%9E%E0%B8%99%E0%B8%A1_%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8%E0%B8%9E%E0%B8%99%E0%B8%A1%E0%B8%A7%E0%B8%A3%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3.jpg/960px-%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8%E0%B8%9E%E0%B8%99%E0%B8%A1_%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8%E0%B8%9E%E0%B8%99%E0%B8%A1%E0%B8%A7%E0%B8%A3%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Wat Phra That Phanom (Thai: วัดพระธาตุพนม) is a Buddhist temple in the That Phanom District in the south of Nakhon Phanom Province, all within the Isan region of Thailand near the Lao border. According to local legend, the temple contains in the pagoda the Phra Uranghathat (พระอุรังคธาตุ)/Phra Ura (พระอุระ)/Buddha\u0027s breast bones. As such, it is one of the most important structures for Theravada Buddhists and the most important Buddhist site in the province, with an annual week-long festival being held in the town of That Phanom to honour the temple.","history":"The That Phanom Chronicle documented that the Phra That Phanom stupa was first constructed 8 years after the Buddha\u0027s passing by the five kings of the Mon kingdom, known as Sri Gotupura. However, archaeological findings suggest that the earliest structure found dates back to the 7th or 8th century CE. Stephen A. Murphy places the temple at the northern end of a group of sema boundary-stone sites running about 65 kilometres south along the Mekong to Pha That Phon in Laos. The stones of this group carry axial stupa and stupa-kumbha motifs and no narrative carving, and he reads the tradition as having reached the area from the lower Chi River system, this being its most easterly extent.\nAccording to local legend, the Buddha told Mahakasyapa, one of his principal disciples, that once he died, Mahakasyapa was to bring his breast bones to \u0027Phu Kampra to allow Buddhism to continue on. Then in 525 B.C, Mahakasyapa then decided on constructing a temple on Phu Kampra. Joined by 500 Arhats and 5 Phrayas, they built the Phra That Phanom stupa primarily from clay and once completed, the Buddha\u0027s …","other":"วัดพระธาตุพนมวรมหาวิหาร"}},{"th":{"title":"วัดพระธาตุหริภุญชัยวรมหาวิหาร","url":"https://th.wikipedia.org/wiki/%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8%E0%B8%AB%E0%B8%A3%E0%B8%B4%E0%B8%A0%E0%B8%B8%E0%B8%8D%E0%B8%8A%E0%B8%B1%E0%B8%A2%E0%B8%A7%E0%B8%A3%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/29/Wat_Phra_That_Hariphunchai_%28II%29.jpg/960px-Wat_Phra_That_Hariphunchai_%28II%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"วัดพระธาตุหริภุญชัย (ไทยถิ่นเหนือ: ) ในอดีตนิยมเรียก วัดเจดีย์หลวง เป็นพระอารามหลวงชั้นเอก ชนิดวรมหาวิหาร ตั้งอยู่ใจกลางเมืองลำพูน มีเนื้อที่ทั้งหมดประมาณ 28 ไร่ 3 งาน 26 ตารางวา\nวัดพระธาตุหริภุญชัย ได้รับการขึ้นทะเบียนเป็นโบราณสถานของชาติ เมื่อปี พ.ศ.","history":"ตำนานมูลศาสนาและตำนานพระธาตุเจ้าหริภุญชัย กล่าวว่า ครั้นพุทธกาล พระพุทธเจ้าได้เสด็จมาบิณฑบาตในหมู่บ้านของเหล่าเม็งคบุตร แล้วเสด็จเลียบลำน้ำแม่ระมิงค์ (แม่น้ำปิง) พวกเม็งตามเสด็จมาถึงที่สถานที่หนึ่งทางทิศตะวันตกของแม่น้ำ พระพุทธเจ้าปรารถจะนั่ง ก็มีแท่นหินก้อนหนึ่งผุดขึ้นมาจากพื้นดิน พระพุทธเจ้าจึงทรงวางบาตรและประทับเหนือแท่นหินนั้น ชมพูนาคราชและพญากาเผือกออกมาอุปัฏฐากพระองค์ ลัวะผู้หนึ่งได้ถวายหมากสมอ เมื่อพระพุทธเจ้าฉันเสร็จได้ซัดเมล็ดสมอลงเหนือพื้นดิน เมล็ดสมอหมุนเวียน 3 รอบ แล้วจึงได้ฝังพระเกศาแล้วเอาผลสมอทับไว้ มีพุทธพยากรณ์ว่า ในภายภาคหน้าเมื่อพระเจ้าอาทิตยราชเสวยราชย์ สถานที่นี้จะเป็นที่ตั้งของมหานครใหญ่ชื่อ \"หริภุญชัย\" เพราะพระพุทธเจ้าได้มาฉันหมากสมอที่นี้ ที่พระพุทธเจ้านั่งจะเป็นที่ตั้งของเจดีย์ที่ประดิษฐานพระบรมสารีริกธาตุ มีธาตุกระดูกพระเศียร ธาตุกระดูกอก ธาตุกระดูกนิ้ว และธาตุย่อย รวม 1  บาตรเต็ม ณ มหานครแห่งนี้ เมื่อพระพุทธเจ้าเสด็จกลับไปแล้ว พญากาเผือกเมื่อได้ยินพุทธพยากรณ์ก็จำได้สิ้น เมื่อบินกลับถึงป่าหิมพานต์จึงเรียกกาดำผู้เป็นหลานมาเล่าพุทธพยากรณ์ พร้อมให้กาดำอยู่เฝ้ารักษาสถานที่ เหล่าเทวดา อสูร ฤๅษี พากันมาบูชาแท่นหินนั้นเป็นนิตย์ …","other":"Wat Phra That Hariphunchai"},"en":{"title":"Wat Phra That Hariphunchai","url":"https://en.wikipedia.org/wiki/Wat_Phra_That_Hariphunchai","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/Wat_Phra_That_Hariphunchai_%28III%29.jpg/960px-Wat_Phra_That_Hariphunchai_%28III%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Wat Phra That Hariphunchai (Thai: วัดพระธาตุหริภุญชัย) is a Buddhist temple (wat) in Lamphun, Thailand. The temple\u0027s origins date from the 11th century but the central stupa is thought to originate in the 9th century.","history":"Wat Phra That Hariphunchai\u0027s earliest origins were in 897 when the then king of Hariphunchai is said to have built a stupa (now the central stupa) to house a hair of the Buddha. The present compound, founded by Hariphunchai King Athitayarat, dates from 1044.\nThe temple was first rebuilt in 1443 by King Tilokaraja of Lanna kingdom Chiang Mai. The temple\u0027s pyramid-shaped Chedi Suwanna was built in 1418. In the 1930s temple renovations were made by the northern Thai monk Khru Ba Sriwichai.\nNirat Hariphunchai, a poem of around 720 lines, originally written in Northern Thai language, describes a journey from Chiang Mai to worship at Wat Phra Thai Hariphunchai, possibly in 1517/8.","other":"วัดพระธาตุหริภุญชัยวรมหาวิหาร"}},{"th":{"title":"อุทยานประวัติศาสตร์พระนครคีรี","url":"https://th.wikipedia.org/wiki/%E0%B8%AD%E0%B8%B8%E0%B8%97%E0%B8%A2%E0%B8%B2%E0%B8%99%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%A7%E0%B8%B1%E0%B8%95%E0%B8%B4%E0%B8%A8%E0%B8%B2%E0%B8%AA%E0%B8%95%E0%B8%A3%E0%B9%8C%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%99%E0%B8%84%E0%B8%A3%E0%B8%84%E0%B8%B5%E0%B8%A3%E0%B8%B5","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Phra_Nakhon_Khiri_%28I%29.jpg/960px-Phra_Nakhon_Khiri_%28I%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อุทยานประวัติศาสตร์พระนครคีรี โดยทั่วไปเรียก เขาวัง เป็นอุทยานประวัติศาสตร์แห่งหนึ่งของประเทศไทยภายใต้การดูแลของกรมศิลปากร กระทรวงวัฒนธรรม เป็นพระราชวังฤดูร้อนที่สร้างขึ้นในรัชสมัย พระบาทสมเด็จพระจอมเกล้าเจ้าอยู่หัวตั้งอยู่ที่ตำบลคลองกระแชง อำเภอเมืองเพชรบุรี จังหวัดเพชรบุรี","history":"พระนครคีรีเป็นพระราชวังที่ประทับในรัชกาลพระบาทสมเด็จพระจอมเกล้าเจ้าอยู่หัวโดยเป็นพระราชวังฤดูร้อนโดยมีสมเด็จเจ้าพระยาบรมมหาศรีสุริยวงศ์ (ช่วง บุนนาค) เป็นแม่กองในการก่อสร้างโดยก่อสร้างแล้วเสร็จในปี พ.ศ. 2405 โดยพระนครคีรีแบ่งออกเป็นเขตพระราชฐานต่าง ๆ ดังนี้\nเขตพระราชฐานชั้นนอก    เป็นยอดเขาด้านหน้าเป็นที่ตั้งของกรมกองต่าง ๆ ของทางราชการซึ่งตามเสด็จ\nเขตพระราชฐานชั้นกลางและชั้นใน   เป็นยอดเขาตรงกลางและด้านในเป็นที่ตั้งของพระราชมณเฑียรที่ประทับของทั้งฝ่ายหน้าและฝ่ายในรวมทั้งข้าราชบริพาร","other":"Phra Nakhon Khiri Historical Park"},"en":{"title":"Phra Nakhon Khiri Historical Park","url":"https://en.wikipedia.org/wiki/Phra_Nakhon_Khiri_Historical_Park","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/%E0%B8%A5%E0%B8%B5%E0%B8%A5%E0%B8%B2%E0%B9%80%E0%B8%88%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B9%8C%E0%B9%81%E0%B8%94%E0%B8%87.JPG/960px-%E0%B8%A5%E0%B8%B5%E0%B8%A5%E0%B8%B2%E0%B9%80%E0%B8%88%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B9%8C%E0%B9%81%E0%B8%94%E0%B8%87.JPG?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Phra Nakhon Khiri (Thai: อุทยานประวัติศาสตร์พระนครคีรี) is a historical park in Phetchaburi, Thailand on a hill overlooking the city. The name Phra Nakhon Khiri means \u0027holy city hill\u0027, but locals know it better as Khao Wang, meaning \u0027hill with palace\u0027.\nThe park consists of three building groups on the three peaks of the 95 m hill.","history":"Phra Nakhon Khiri (Thai: อุทยานประวัติศาสตร์พระนครคีรี) is a historical park in Phetchaburi, Thailand on a hill overlooking the city. The name Phra Nakhon Khiri means \u0027holy city hill\u0027, but locals know it better as Khao Wang, meaning \u0027hill with palace\u0027.\nThe park consists of three building groups on the three peaks of the 95 m hill. On the western peak is the palace with adjoining structures. On the middle or central peak is a big chedi named Phra That Chom Phet. The eastern peak houses the Wat Phra Kaeo, the royal temple, built similarly to the Wat Phra Kaeo in Bangkok. The whole complex was built as a summer palace by King Mongkut, with construction finished in 1860.\nThe site was registered as a historical park on 27 August 1979, with two of the palace buildings now housing a branch of the Thai National Museum.","other":"อุทยานประวัติศาสตร์พระนครคีรี"}},{"th":{"title":"พระปรางค์สามยอด","url":"https://th.wikipedia.org/wiki/%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%87%E0%B8%84%E0%B9%8C%E0%B8%AA%E0%B8%B2%E0%B8%A1%E0%B8%A2%E0%B8%AD%E0%B8%94","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%AA%E0%B8%B2%E0%B8%97%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%87%E0%B8%84%E0%B9%8C%E0%B8%AA%E0%B8%B2%E0%B8%A1%E0%B8%A2%E0%B8%AD%E0%B8%942.jpg/960px-%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%AA%E0%B8%B2%E0%B8%97%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%87%E0%B8%84%E0%B9%8C%E0%B8%AA%E0%B8%B2%E0%B8%A1%E0%B8%A2%E0%B8%AD%E0%B8%942.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"พระปรางค์สามยอด จังหวัดลพบุรี เป็นโบราณสถานและ แหล่งท่องเที่ยวทางประวัติศาสตร์และโบราณคดีที่สำคัญแห่งหนึ่งของจังหวัดลพบุรี ลักษณะเป็นปราสาทขอมในศิลปะบายน (พ.ศ. 1720 – 1773) โครงสร้างเป็นศิลาแลงประดับปูนปั้น สร้างขึ้นในรัชสมัยพระเจ้าชัยวรมันที่ 7 (ครองราชย์ พ.ศ. 1724 – ป.","history":"กรมศิลปากรได้ประกาศขึ้นทะเบียนเป็นโบราณสถานในวันที่ 2 สิงหาคม  พ.ศ. 2479 และได้กำหนดเขตที่ดินให้มีพื้นที่โบราณสถานประมาณ 3 ไร่ 2 งาน 54 ตารางวา ตามความในมาตรา 7 แห่งพระราชบัญญัติโบราณสถาน โบราณวัตถุ ศิลปวัตถุ และพิพิธภัณฑสถานแห่งชาติ พ.ศ. 2504 ในวันที่ 4 ธันวาคม พ.ศ. 2545","other":"Phra Prang Sam Yot"},"en":{"title":"Phra Prang Sam Yot","url":"https://en.wikipedia.org/wiki/Phra_Prang_Sam_Yot","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%AA%E0%B8%B2%E0%B8%97%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%87%E0%B8%84%E0%B9%8C%E0%B8%AA%E0%B8%B2%E0%B8%A1%E0%B8%A2%E0%B8%AD%E0%B8%942.jpg/960px-%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%AA%E0%B8%B2%E0%B8%97%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%87%E0%B8%84%E0%B9%8C%E0%B8%AA%E0%B8%B2%E0%B8%A1%E0%B8%A2%E0%B8%AD%E0%B8%942.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Phra Prang Sam Yot, also known as Phra Prang Sam Yod, is a 13th-century Angkorian temple in Lopburi, Thailand. The temple is currently a popular tourist destination.","history":"Phra Prang Sam Yot, also known as Phra Prang Sam Yod, is a 13th-century Angkorian temple in Lopburi, Thailand. The temple is currently a popular tourist destination.","other":"พระปรางค์สามยอด"}},{"th":{"title":"พระบรมราชานุสาวรีย์สามกษัตริย์","url":"https://th.wikipedia.org/wiki/%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%9A%E0%B8%A3%E0%B8%A1%E0%B8%A3%E0%B8%B2%E0%B8%8A%E0%B8%B2%E0%B8%99%E0%B8%B8%E0%B8%AA%E0%B8%B2%E0%B8%A7%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B9%8C%E0%B8%AA%E0%B8%B2%E0%B8%A1%E0%B8%81%E0%B8%A9%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B4%E0%B8%A2%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Three_Kings_Monument%2C_Chiang_Mai_%28I%29.jpg/960px-Three_Kings_Monument%2C_Chiang_Mai_%28I%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"พระบรมราชานุสาวรีย์สามกษัตริย์ หรือ อนุสาวรีย์สามกษัตริย์ เป็นพระบรมราชานุสาวรีย์ของพระมหากษัตริย์สามพระองค์ผู้สร้างเวียงเชียงใหม่ ประกอบด้วย พญามังรายแห่งหิรัญนครเงินยางเชียงลาว พญางำเมืองแห่งนครรัฐพะเยา และพ่อขุนรามคำแหงมหาราชแห่งอาณาจักรสุโขทัย","history":"พระบรมราชานุสาวรีย์สามกษัตริย์ หรือ อนุสาวรีย์สามกษัตริย์ เป็นพระบรมราชานุสาวรีย์ของพระมหากษัตริย์สามพระองค์ผู้สร้างเวียงเชียงใหม่ ประกอบด้วย พญามังรายแห่งหิรัญนครเงินยางเชียงลาว พญางำเมืองแห่งนครรัฐพะเยา และพ่อขุนรามคำแหงมหาราชแห่งอาณาจักรสุโขทัย\nอนุสาวรีย์สามกษัตริย์ตั้งอยู่กลางเวียงเชียงใหม่ บริเวณหน้าหอศิลปวัฒนธรรมเมืองเชียงใหม่ (อดีตศาลารัฐบาลมณฑลพายัพ) ด้านหน้าติดกับถนนพระปกเกล้า ซึ่งบริเวณนี้เองถือเป็นศูนย์กลางของตัวเมืองเชียงใหม่ หน้าอนุสาวรีย์มีลานกว้างขนาดใหญ่ เรียกว่า ข่วงสามกษัตริย์ หรือข่วงอนุสาวรีย์สามกษัตริย์ ด้านตรงข้ามของอนุสาวรีย์สามกษัตริย์ยังเป็นที่ตั้งของอาคารศาลแขวงเชียงใหม่เดิม ซึ่งมีสถาปัตยกรรมตะวันตกที่สวยและงดงามตระการตา","other":"Three Kings Monument"},"en":{"title":"Three Kings Monument","url":"https://en.wikipedia.org/wiki/Three_Kings_Monument","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/29/%E0%B8%AD%E0%B8%99%E0%B8%B8%E0%B8%AA%E0%B8%B2%E0%B8%A7%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B9%8C%E0%B8%AA%E0%B8%B2%E0%B8%A1%E0%B8%81%E0%B8%A9%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B4%E0%B8%A2%E0%B9%8C_%E0%B8%AD.%E0%B9%80%E0%B8%A1%E0%B8%B7%E0%B8%AD%E0%B8%87_%E0%B8%88.%E0%B9%80%E0%B8%8A%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B9%83%E0%B8%AB%E0%B8%A1%E0%B9%88_%282%29.jpg/960px-%E0%B8%AD%E0%B8%99%E0%B8%B8%E0%B8%AA%E0%B8%B2%E0%B8%A7%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B9%8C%E0%B8%AA%E0%B8%B2%E0%B8%A1%E0%B8%81%E0%B8%A9%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B4%E0%B8%A2%E0%B9%8C_%E0%B8%AD.%E0%B9%80%E0%B8%A1%E0%B8%B7%E0%B8%AD%E0%B8%87_%E0%B8%88.%E0%B9%80%E0%B8%8A%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B9%83%E0%B8%AB%E0%B8%A1%E0%B9%88_%282%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Three Kings Monument (Thai: พระบรมราชานุสาวรีย์สามกษัตริย์; Northern Thai: ᩋᨶᩩᩈᩣᩅᩁᩦ᩠ᨿ᩺ᩈᩣ᩠ᨾᩕᨠᨽᩢᩕᨲ) is a royal monument dedicated to Phaya Mangrai, Pho Khun Ramkhamhaeng, and Phaya Ngammueang, considered the founding fathers of Lanna Kingdom. It is located in the center of Chiang Mai and was designed and cast by national artist Kaimook Chuto to commemorate the founding of the city. The monument was completed in 1983 and officially opened in 1984.","history":"According to historical accounts, the three kings formed a strong bond and agreed to establish a new city together. They selected a strategic location along the Ping River, surrounded by fertile plains and the towering Doi Suthep. In 1296 CE, they founded Chiang Mai, which later became the capital of the Lanna Kingdom. To honor their legacy, the people of Chiang Mai built the Three Kings Monument in 1983. Designed and cast by the national artist Kaimook Chuto, the monument stands 2.7 metres (8 ft 10 in) high.\nKing Bhumibol Adulyadej, together with Queen Sirikit, and Princess Sirindhorn, presided over the opening ceremony of the Three Kings Monument on January 30, 1984.\nThe Three Kings Monument is located at the heart of Chiang Mai, a central and historic site in the city. In front of the monument is a large open area which serves as a public space for ceremonies, cultural events, and community gatherings.\n== References ==","other":"พระบรมราชานุสาวรีย์สามกษัตริย์"}},{"th":{"title":"วัดพระมหาธาตุวรมหาวิหาร","url":"https://th.wikipedia.org/wiki/%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8%E0%B8%A7%E0%B8%A3%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/Wat_Phra_Mahathat_Woramahawihan%2C_Nakhon_Si_Thammarat.jpg/960px-Wat_Phra_Mahathat_Woramahawihan%2C_Nakhon_Si_Thammarat.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"วัดพระมหาธาตุวรมหาวิหาร เป็นพระอารามหลวงชั้นเอก ชนิดวรมหาวิหาร ตั้งอยู่บนถนนราชดำเนิน ตำบลในเมือง อำเภอเมืองนครศรีธรรมราช จังหวัดนครศรีธรรมราช \nวัดพระมหาธาตุวรมหาวิหาร ตั้งอยู่บนคาบสมุทรภาคใต้ของประเทศไทย บริเวณสันคาบสมุทรแคบระหว่างมหาสมุทรแปซิฟิกและมหาสมุทรอินเดีย เป็นศูนย์กลางพระพุทธศาสนาในภูมิภาคมาตั้งแต่การก่อตั้งในคริสต์ศตวรรษที่ 8 ด้วยอานิสงส์จากการเป็นจุดเชื่อมโยงของการค้าข้ามมหาสมุทร จึงได้รับอิทธิพลจากขนบธรรมเนียมทางศาสนาและสถาปัตยกรรมที่หลากหลาย ทั้งศาสนาพราหมณ์ ศาสนาฮินดู พุทธศาสนานิกายมหายาน และเถรวาท จากภาคตะวันออกเฉียงเหนือของอินเดีย ชวากลาง (อินโดนีเซีย) ศรีลังกา และชาวมอญในภาคใต้ของพม่า \nอิทธิพลดังกล่าวได้รับการผสมผสานเข้ากับสถาปัตยกรรมศาสนสถาน พิธีกรรม และประเพณีวัฒนธรรมของวัด ซึ่งส่งอิทธิพลอย่างกว้างขวางและยั่งยืนต่อประเทศไทยและประเทศอื่น ๆ ในเอเชียตะวันออกเฉียงใต้ ขนบธรรมเนียมทางศาสนาและประเพณีท้องถิ่นที่เกี่ยวข้องกับวัดยังคงสืบทอดต่อเนื่องมานานกว่า 1,500 ปี เช่น ตำนานเมืองนครศรีธรรมราช ประเพณีแห่ผ้าขึ้นธาตุประจำปี และการแสดงนาฏกรรมโนรา ซึ่งล้วนเป็นส่วนสำคัญของมรดกทางวัฒนธรรมที่ยังคงมีชีวิตอยู่จนถึงปัจจุบัน\nยูเนสโก ประกาศขึ้นทะเบียนวัดพระมหาธาตุวรมหาวิหารเป็นแหล่งมรดกโลก เมื่อวันที่ 25 กรกฎาคม พ.ศ. 2569 โดยเป็นแหล่งมรดกโลกแห่งที่ 9 ของประเทศไทย แห่งที่ 6 ในประเภททางวัฒนธรรม และเป็นแห่งแรกของภาคใต้ นับเป็นการสิ้นสุดเส้นทางการเสนอวัดพระมหาธาตุวรมหาวิหารขึ้นทะเบียนเป็นแหล่งมรดกโลก ซึ่งมีการริเริ่มมาตั้งแต่ พ.ศ.","history":"วัดพระมหาธาตุฯ ตั้งอยู่ทางตอนใต้ของเมืองนครศรีธรรมราชที่มีกำแพงล้อมรอบ สร้างขึ้นบริเวณพื้นที่ในอดีตเคยเป็นสันทรายที่เรียกว่า \"หาดทรายแก้ว\" โดยเชื่อกันว่าพระบรมสารีริกธาตุของพระพุทธเจ้าถูกฝังไว้ใต้ผืนทรายแห่งนี้โดยพระเชษฐาและพระขนิษฐาเชื้อสายราชวงศ์จากอินเดีย ต่อมากษัตริย์ผู้ทรงธรรมและเลื่อมใสในพระพุทธศาสนาได้ค้นพบพระบรมสารีริกธาตุดังกล่าว และทรงโปรดให้สร้างพระบรมธาตุเจดีย์องค์ใหญ่ ณ สถานที่แห่งนี้ในช่วงปลายคริสต์ศตวรรษที่ 8 ก่อนจะทรงสถาปนาเมืองหลวงและอาณาจักรนครศรีธรรมราชในเวลาต่อมา\nประวัติความเป็นมาของวัดสามารถแบ่งออกได้เป็น 4 ระยะ ดังนี้\nระยะแรก ครอบคลุมช่วงคริสต์ศตวรรษที่ 5–8 โดยมีศาสนสถานของศาสนาฮินดูตั้งอยู่บริเวณใต้พระวิหารรอยพระพุทธบาทในปัจจุบัน\nระยะที่สอง อยู่ระหว่างปลายคริสต์ศตวรรษที่ 8 ถึง 11 ได้มีการก่อสร้างผังศูนย์กลางแบบมณฑล (Mandala) ของกลุ่มพระบรมธาตุเจดีย์ขึ้นเป็นแกนหลักของวัด และมีการสร้างวิหารโพธิ์ลังกา ซึ่งเป็นศาสนสถานประดิษฐานต้นพระศรีมหาโพธิ์ อยู่ทางทิศเหนือบนแนวแกนเหนือ–ใต้ของกลุ่มพระบรมธาตุเจดีย์ ถัดขึ้นไปทางเหนืออีกแห่งหนึ่งคือวิหารโพธิ์พระเดิม ซึ่งเป็นศาสนสถานประดิษฐานต้นพระศรีมหาโพธิ์เช่นเดียวกันและสร้างขึ้นในสมัยเดียวกัน อย่างไรก็ตาม …","other":"Wat Phra Mahathat"},"en":{"title":"Wat Phra Mahathat","url":"https://en.wikipedia.org/wiki/Wat_Phra_Mahathat","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/09/%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8%E0%B8%A7%E0%B8%A3%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3.jpg/960px-%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8%E0%B8%A7%E0%B8%A3%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Wat Phra Mahathat Woramahawihan (Thai: วัดพระมหาธาตุวรมหาวิหาร) is the main Buddhist temple (wat) of Nakhon Si Thammarat Province in southern Thailand, a crucial trade crossroad between the Indian and Pacific Oceans. Founded in the 8th century, where a Hindu shrine once stood around 5th–8th centuries, the monastery has been a regional religious centre ever since. The main stupa of the temple, Phra Borommathat Chedi (\u0027great noble relics stupa\u0027), was built by King Sri Dhammasokaraja in the early-13th century to establish a symbol for the Theravada Buddhism sect in the region.","history":"According to the identical Thai and Sri Lankan legend, Prince Thanakuman and Princess Hem Chala brought the relic of Buddha to Hat Sai Kaew and built a small pagoda in 291 CE. The same tradition holds that King Si-Thamma Sokarat, on establishing the city of Nakhon Si Thammarat, built a new temple called Wat Phra Borom That on the same site, in the Mahayana manner of the ruling Srivijaya Kingdom. The city of Nakhon Si Thammarat was a prominent city in the ancient kingdom of Tambralinga. The city was a part of the Srivijaya empire till the early-13th century.","other":"วัดพระมหาธาตุวรมหาวิหาร"}},{"th":{"title":"วัดร่องขุ่น","url":"https://th.wikipedia.org/wiki/%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%A3%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%82%E0%B8%B8%E0%B9%88%E0%B8%99","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/Wat_Rong_Khun1.jpg/960px-Wat_Rong_Khun1.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"วัดร่องขุ่น เป็นวัดพุทธ ตั้งอยู่ในอำเภอเมืองเชียงราย จังหวัดเชียงราย ออกแบบและก่อสร้างโดย เฉลิมชัย โฆษิตพิพัฒน์ ตั้งแต่ พ.ศ. 2540 จนถึงปัจจุบัน โดยเฉลิมชัยคาดว่างานก่อสร้างวัดร่องขุ่นจะไม่เสร็จลงภายในช่วงชีวิตของตน วัดร่องขุ่นถอดแบบมาจากวัดมิ่งเมือง จังหวัดน่าน\nเมื่อวันที่ 5 พฤษภาคม พ.ศ. 2557 เวลา 18.05 น.","history":"เมื่อประมาณ พ.ศ. 2430 มีชาวบ้านเข้ามาจับจองที่ดินทำไร่ทำนาบริเวณบ้านร่องขุ่นในปัจจุบันเพียงไม่กี่หลังคาเรือน โดยอาศัยลำน้ำสายเล็กๆ ที่ไหลลงสู่แม่น้ำแม่ลาวซึ่งมีลักษณะสีขุ่นเลี้ยงชีพ ชาวบ้านจึงเรียกกันติดปากว่า “บ้านฮ่องขุ่น” (ร่องขุ่น) มาโดยตลอด ต่อมา ขุนอุดมกิจเกษมราษฎร์ (ต้นตระกูล เกษมราษฎร์) นำครอบครัวญาติมิตรเข้ามาอยู่ในหมู่บ้านจนเพิ่มจำนวนมากขึ้นกว่า 50 หลังคาเรือน ท่านจึงได้ดำริที่จะสร้างสำนักสงฆ์ขึ้นภายในหมู่บ้าน เพื่อจะได้เป็นที่ยึดเหนี่ยวจิตใจของชุมชน วัดร่องขุ่นจึงถือกำเนิดครั้งแรก ณ ริมฝั่งน้ำแม่ลาวด้านทิศตะวันตกใกล้กับลำน้ำแม่มอญ ซึ่งอยู่เลยลำน้ำร่องขุ่นไปทางทิศใต้ประมาณ 500 เมตร คณะศรัทธาจึงได้ร่วมใจกันสร้างศาลาและกุฏิเป็นเรือนไม้แบบง่ายๆ เพื่อใช้ประกอบศาสนกิจ โดยชาวบ้านได้อาราธนานิมนต์พระทองสุข บาวิน จากวัดสันทรายน้อย หมู่ 13 มาเป็นเจ้าอาวาส \nต่อมาเกิดน้ำเซาะตลิ่งพังจนไม่สามารถรักษาศาสนสถานไว้ได้ มาจนถึงสมัยของคุณพ่อหมี แก้วเลื่อมใส เป็นผู้นำชุมชน ได้ร่วมกันกับชาวบ้านย้ายวัดมาตั้งอยู่ในบริเวณหัวนาของท่าน ซึ่งอยู่ฝั่งตรงข้ามของถนนด้านทิศตะวันตกติดกับลำน้ำร่องขุ่น จากนั้นไม่นานพระทองสุขได้ย้ายออกจากวัด จึงเหลือเพียงสามเณร 3 รูป ในจำนวนนี้มีสามเณรทา ดีวรัตน์ …","other":"Wat Rong Khun"},"en":{"title":"Wat Rong Khun","url":"https://en.wikipedia.org/wiki/Wat_Rong_Khun","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Wat_Rong_Khun_-_Chiang_Rai.jpg/960px-Wat_Rong_Khun_-_Chiang_Rai.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Wat Rong Khun (Thai: วัดร่องขุ่น), better known as the White Temple, is a contemporary, privately owned art exhibit in the style of a Buddhist temple in Pa O Don Chai, Mueang District, Chiang Rai province, Thailand. Situated outside the city of Chiang Rai, the site attracts a large number of visitors, both Thai and foreign, making it one of Chiang Rai\u0027s most visited attractions. The White Temple was created by master Chalermchai Kositpipat, the national artist who designed, constructed, and opened it to visitors in 1997.","history":"By the end of the 20th century, the original Wat Rong Khun was in a bad state of repair. Funds were not available for renovation. Chalermchai Kositpipat, a local artist from Chiang Rai, decided to completely rebuild the temple and fund the project with his own money. To date, Chalermchai has spent over 40 million THB of his own money on the project. The artist intends for the area adjacent to the temple to be a center of learning and meditation and for people to gain benefit from the Buddhist teachings. Kositpipat considers the temple to be an offering to Lord Buddha and believes the project will give him immortal life. Today the works are ongoing, but are not expected to be completed until 2070.","other":"วัดร่องขุ่น"}},{"th":{"title":"แหลมพรหมเทพ","url":"https://th.wikipedia.org/wiki/%E0%B9%81%E0%B8%AB%E0%B8%A5%E0%B8%A1%E0%B8%9E%E0%B8%A3%E0%B8%AB%E0%B8%A1%E0%B9%80%E0%B8%97%E0%B8%9E","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9e/Laem_Phromthep_in_Phuket_%285733622568%29.jpg/960px-Laem_Phromthep_in_Phuket_%285733622568%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"แหลมพรหมเทพ เป็นสถานที่ท่องเที่ยวแห่งหนึ่งในจังหวัดภูเก็ต ตั้งอยู่ห่างจากหาดราไวย์ประมาณ 2 กิโลเมตร เป็นแหลมที่อยู่ตอนใต้สุดของจังหวัดภูเก็ต มีทัศนียภาพที่สวยงาม และเป็นจุดชมพระอาทิตย์ตกดินที่ได้รับความนิยม เป็นที่ตั้งของประภาคารกาญจนาภิเษก สุดปลายของแหลมพรหมเทพ มีชื่อว่าแหลมเจ้า บริเวณตัวแหลมซึ่งยื่นออกไปในทะเล มีลักษณะโดดเด่นเป็นเอกลักษณ์ด้วยต้นตาลที่ขึ้นอยู่กลุ่มใหญ่","history":"แหลมพรหมเทพ เป็นสถานที่ท่องเที่ยวแห่งหนึ่งในจังหวัดภูเก็ต ตั้งอยู่ห่างจากหาดราไวย์ประมาณ 2 กิโลเมตร เป็นแหลมที่อยู่ตอนใต้สุดของจังหวัดภูเก็ต มีทัศนียภาพที่สวยงาม และเป็นจุดชมพระอาทิตย์ตกดินที่ได้รับความนิยม เป็นที่ตั้งของประภาคารกาญจนาภิเษก สุดปลายของแหลมพรหมเทพ มีชื่อว่าแหลมเจ้า บริเวณตัวแหลมซึ่งยื่นออกไปในทะเล มีลักษณะโดดเด่นเป็นเอกลักษณ์ด้วยต้นตาลที่ขึ้นอยู่กลุ่มใหญ่ \nแหลมพรหมเทพ ถูกจัดเป็นหนึ่งในโครงการมหัศจรรย์เมืองไทย 12 เดือน 7 ดาว 9 ตะวัน ของการท่องเที่ยวแห่งประเทศไทย จุดเด่นคือ \"ชมพระอาทิตย์ตกทะเล สวยที่สุดในประเทศไทย\"","other":null},"en":null},{"th":{"title":"วัดมหาธาตุ (จังหวัดพระนครศรีอยุธยา)","url":"https://th.wikipedia.org/wiki/%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8_(%E0%B8%88%E0%B8%B1%E0%B8%87%E0%B8%AB%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%99%E0%B8%84%E0%B8%A3%E0%B8%A8%E0%B8%A3%E0%B8%B5%E0%B8%AD%E0%B8%A2%E0%B8%B8%E0%B8%98%E0%B8%A2%E0%B8%B2)","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a7/2025-02-03_Wat_Maha_That_%28Ayutthaya%29_%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8_%E0%B8%AD%E0%B8%A2%E0%B8%B8%E0%B8%98%E0%B8%A2%E0%B8%B2_-_img_10.jpg/960px-2025-02-03_Wat_Maha_That_%28Ayutthaya%29_%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8_%E0%B8%AD%E0%B8%A2%E0%B8%B8%E0%B8%98%E0%B8%A2%E0%B8%B2_-_img_10.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"วัดมหาธาตุ จังหวัดพระนครศรีอยุธยา เป็นโบราณสถานหนึ่งภายในอุทยานประวัติศาสตร์พระนครศรีอยุธยา  ตั้งอยู่บริเวณกึ่งกลางภายในเกาะเมืองอยุธยา ตำบลท่าวาสุกรี อำเภอพระนครศรีอยุธยา","history":"วัดมหาธาตุเป็นพระอารามหลวง ตั้งอยู่ใกล้วัดราชบูรณะ ในบริเวณอุทยานประวัติศาสตร์พระนครศรีอยุธยา สร้างในสมัย สมเด็จพระบรมราชาธิราชที่ 1 ขุนหลวงพะงั่ว เมื่อปี พ.ศ. 1917 แต่ไม่แล้วเสร็จ เสด็จสวรรคตเสียก่อน และได้สร้างเพิ่มเติมจนเสร็จ ในสมัย สมเด็จพระราเมศวร โดยได้โปรดเกล้าฯ ให้สร้างพระปรางค์ประธาน และอัญเชิญพระบรมสารีริกธาตุมาบรรจุไว้ใต้ฐานพระปรางค์ประธานของวัดมหาธาตุ เมื่อปี พ.ศ. 1927 ซึ่งปรากฏในพระราชพงศาวดารฉบับพระราชหัตถเลขา\nความสำคัญของวัดมหาธาตุนั้น นอกจากจะเป็นที่ประดิษฐานองค์พระบรมสารีริกธาตุแล้ว ยังถือเป็นวัดที่เป็นศูนย์กลางเมืองและเป็นสถานที่จัดพระราชพิธีต่าง ๆ ของกรุงศรีอยุธยา โดยมีสมเด็จพระสังฆราช ฝ่ายคามวาสีประทับอยู่ภายในวัด ส่วนพระสังฆราช ฝ่ายอรัญวาสีนั้น ประทับอยู่ที่วัดป่าแก้ว (วัดใหญ่ชัยมงคล) นอกจากนี้ยังเป็นสถานที่ ๆ พระศรีศิลป์และจหมื่นศรีสรรักษ์ พร้อมคณะได้ซุ่มพลที่ปรางค์วัดมหาธาตุ ก่อนยกพลเข้าพระราชวังทางประตูมงคลสุนทร เพื่อจับกุมสมเด็จพระศรีเสาวภาคย์\nในสมัยสมเด็จพระเจ้าทรงธรรม ปรางค์ของวัดองค์เดิมที่สร้างด้วยศิลาแลง ยอดพระปรางค์ได้ทลายลงมาเกือบครึ่งองค์ถึงชั้นครุฑ แต่จะด้วยเหตุผลประการใดไม่ทราบ จึงยังมิได้ซ่อมแซมให้คืนดีดั้งเดิมในรัชกาลนั้น …","other":"Wat Mahathat (Ayutthaya)"},"en":{"title":"Wat Mahathat (Ayutthaya)","url":"https://en.wikipedia.org/wiki/Wat_Mahathat_(Ayutthaya)","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/2025-02-03_Wat_Maha_That_%28Ayutthaya%29_%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8_%E0%B8%AD%E0%B8%A2%E0%B8%B8%E0%B8%98%E0%B8%A2%E0%B8%B2_-_img_15.jpg/960px-2025-02-03_Wat_Maha_That_%28Ayutthaya%29_%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%98%E0%B8%B2%E0%B8%95%E0%B8%B8_%E0%B8%AD%E0%B8%A2%E0%B8%B8%E0%B8%98%E0%B8%A2%E0%B8%B2_-_img_15.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Wat Mahathat (Thai วัดมหาธาตุ พระนครศรีอยุธยา, Temple of the Great Relic) is a Buddhist temple in Ayutthaya, Thailand.","history":"According to official Thai historiography, which is based on the research of the Royal Chronicles of Ayutthaya by Prince Damrong Rajanubhab, the history of Wat Mahathat begins around 1374, when King Borommaracha I had a temple built on this site, which initially bore a different name:\"In the Year of the Tiger 736 C.S. Somdet Phra Borommarachathirat and Phra Mahathera Thammakanlayan built the great, glorious, holy, jewelled reliquary (Phra Si Rattana Mahathat) east of the palace (the Royal gable of the lion). He rose 19 wa in height and equipped with a nine-membered tip that is another 3 wa in height.\"\nHis nephew and successor, Ramesuan (1369-1370, 1388-1395), expanded the structure into a large temple in 1384 while residing there as a monk between his royal duties. It was during this time that the temple received its current name.\nHowever, Jeremias van Vliet, a Dutch merchant and chronicler of the Dutch East India Company (VOC) , attributed the temple\u0027s founding to King Ramathibodi I. In 1636, the same author wrote that, besides Wat Mahathat, Wat Phra Sri Sanphet, Wat Doen, and Wat …","other":"วัดมหาธาตุ (จังหวัดพระนครศรีอยุธยา)"}},{"th":{"title":"สะพานข้ามแม่น้ำแคว","url":"https://th.wikipedia.org/wiki/%E0%B8%AA%E0%B8%B0%E0%B8%9E%E0%B8%B2%E0%B8%99%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B8%A1%E0%B9%81%E0%B8%A1%E0%B9%88%E0%B8%99%E0%B9%89%E0%B8%B3%E0%B9%81%E0%B8%84%E0%B8%A7","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/Kwai_bridge.jpg/960px-Kwai_bridge.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"สะพานข้ามแม่น้ำแคว เป็นสะพานข้ามแม่น้ำแควใหญ่โครงสร้างเหล็กครึ่งวงกลม สลับโครงสร้างถัก ตอม่อคอนกรีตเสริมเหล็ก ตั้งอยู่ที่ตำบลท่ามะขาม อำเภอเมืองกาญจนบุรี จังหวัดกาญจนบุรี ห่างจากตัวเมืองไปทางทิศเหนือ ตามทางหลวงแผ่นดินหมายเลข 323 ประมาณ 4 กิโลเมตร แยกซ้ายประมาณ 400 เมตร ปัจจุบันใช้เป็นทางสัญจรของรถไฟสายธนบุรี - น้ำตก หรือ ทางรถไฟสายมรณะ ในอดีต\nสะพานข้ามแม่น้ำแคว เดิมสร้างขึ้นโดยแรงงานของเชลยศึกฝ่ายสัมพันธมิตร ภายใต้การควบคุมของกองทัพญี่ปุ่น การก่อสร้างใช้เวลาแล้วเสร็จเพียงหนึ่งปี ก่อนจะถูกระเบิดทิ้งทำลายจากกองบินสัมพันธมิตรจนสะพานช่วงกลางพังถล่มลงมา ต่อมาภายหลังสงครามโลกยุติลง รัฐบาลไทยได้ซื้อทางรถไฟนี้ต่อจากอังกฤษมาเป็นเงินจำนวน 50 ล้านบาท แล้วบูรณะซ่อมแซมขึ้นใหม่ในปี พ.ศ. 2489 การซ่อมในครั้งนั้นได้ยุบตอม่อกลาง (ตัวที่ 5-6) แล้วสร้างเป็นสะพานเหล็ก 2 ช่วง แทนของเดิม กับเปลี่ยนช่วงสะพานไม้ด้านปลายทางเป็นสะพานเหล็กแทนสะพานไม้ รวมความยาวของสะพานทั้งสิ้น 322.90 เมตร \nปัจจุบันสะพานข้ามแม่น้ำแคว ได้กลายเป็นสัญลักษณ์หนึ่งที่สำคัญของจังหวัดกาญจนบุรี ได้รับการยกย่องให้เป็น \"สัญลักษณ์แห่งสันติภาพ\" เนื้อเริ่องเกี่ยวสะพานแห่งนี้ยังได้รับการไปสร้างเป็นภาพยนตร์ฮอลลีวูดเช่น เดอะบริดจ์ออนเดอะริเวอร์แคว (พ.ศ. 2500) ซึ่งสร้างมาจากนิยายในชื่อเดียวกัน และภาพยนตร์เรื่อง \"The Railway Man แค้นสะพานข้ามแม่น้ำแคว\" (พ.ศ.","history":"สะพานข้ามแม่นำแควมีความสำคัญยิ่งแห่งหนึ่ง เป็นสะพานที่สำคัญที่สุดของเส้นทางรถไฟสายมรณะ สร้างขึ้นสมัยสงครามโลกครั้งที่ 2 โดยกองทัพญี่ปุ่นได้เกณฑ์เชลยศึกฝ่ายสัมพันธมิตร ได้แก่ ทหารอังกฤษ อเมริกัน ออสเตรเลีย ฮอลันดา และนิวซีแลนด์ประมาณ 61,700 คน สมทบด้วยกรรมกรชาวจีน ญวน ชวา มลายู ไทย พม่า และอินเดีย อีกจำนวนมาก มาก่อสร้างทางรถไฟสายยุทธศาสตร์ เพื่อเป็นเส้นทางผ่านไปสู่ประเทศพม่า ซึ่งเส้นทางช่วงหนึ่งจะต้องข้ามแม่น้ำแควใหญ่ จึงต้องมีการสร้างสะพานขึ้น การสร้างสะพานและทางรถไฟสายนี้ เต็มไปด้วยความยากลำบาก ความทารุณของสงครามและโรคภัย ตลอดจนการขาดแคลนอาหาร ทำให้เชลยศึกหลายหมื่นคนต้องเสียชีวิตลง\nสะพานข้ามแม่น้ำแควใช้เวลาสร้างเพียง 1 เดือน โดยนำเหล็กจากมลายูมาประกอบเป็นชิ้น ๆ ตอนกลางทำเป็นสะพานเหล็ก 11 ช่วง หัวและโครงสะพานเป็นไม้ มีพิธีเปิดอย่างเป็นทางการเมื่อวันที่ 25 ธันวาคม พ.ศ. 2486 ต่อมาในเดือนพฤศจิกายน พ.ศ. 2487 ได้ถูกทิ้งระเบิดหลายครั้งจนสะพานหักท่อนกลาง ภายหลังสงครามสิ้นสุดลง รัฐบาลไทยได้ซ่อมแซมใหม่ด้วยเหล็กรูปเหลี่ยม เมื่อปี พ.ศ. 2489 จนสามารถใช้งานได้  ปัจจุบัน มีการยกย่องให้เป็น สัญลักษณ์แห่งสันติภาพ","other":null},"en":{"title":"Burma Railway","url":"https://en.wikipedia.org/wiki/Burma_Railway","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/Bridge_on_the_River_Kwai_-_tourist_plaza.JPG/960px-Bridge_on_the_River_Kwai_-_tourist_plaza.JPG?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Burma Railway, also known as the Siam–Burma Railway, Thai–Burma Railway and similar names, or locally as the Death Railway (Thai: ทางรถไฟสายมรณะ), is a 415 km (258 mi) railway between Ban Pong, Thailand, and Thanbyuzayat, Burma (now Myanmar). It was built from 1940 to 1943 by abducted Southeast Asian civilians and captured Allied soldiers forced to work by the Japanese, to supply troops and weapons in the Burma campaign of World War II. It completed the rail link between Bangkok, Thailand, and Rangoon, Burma. The name used by the Imperial Japanese Government was Tai–Men Rensetsu Tetsudō (泰緬連接鉄道), which means Thailand-Burma-Link-Railway.","history":"A railway route between Burma and Thailand, crossing Three Pagodas Pass and following the valley of the Khwae Noi river in Thailand, had been surveyed by the British government of Burma as early as 1885, but the proposed course of the line – through hilly jungle terrain divided by many rivers – was considered too difficult to undertake.\nThailand was a neutral country at the onset of World War II. On 8 December 1941, Japan invaded Thailand, which quickly surrendered. Thailand was forced to accept an alliance, and was used as a staging point for the attack on Singapore.\nIn early 1942, Japanese forces invaded Burma and British forces quickly surrendered. To supply their forces in Burma, the Japanese depended upon the sea, bringing supplies and troops to Burma around the Malay Peninsula and through the Strait of Malacca and the Andaman Sea. This route was vulnerable to attack by Allied submarines, especially after the Japanese defeat at the Battle of Midway in June 1942. To avoid a hazardous 2,000-mile (3,200 km) sea journey around the Malay Peninsula, a railway from Bangkok to Rangoon …","other":"ทางรถไฟสายมรณะ"}},{"th":{"title":"ดอยอินทนนท์","url":"https://th.wikipedia.org/wiki/%E0%B8%94%E0%B8%AD%E0%B8%A2%E0%B8%AD%E0%B8%B4%E0%B8%99%E0%B8%97%E0%B8%99%E0%B8%99%E0%B8%97%E0%B9%8C","img":null,"intro":"ดอยอินทนนท์ เป็นยอดเขาที่สูงที่สุดในประเทศไทย ตั้งอยู่ที่อำเภอจอมทอง จังหวัดเชียงใหม่ เดิมมีชื่อว่า \"ดอยหลวง\" หรือ \"ดอยหลวงอ่างกา\" ชื่อของ ดอยอินทนนท์ เป็นชื่อของกษัตริย์พระนามว่าพระเจ้าอินทวิชยานนท์ เจ้าผู้ครองนครเชียงใหม่ ทรงเป็นผู้ที่ห่วงใยในป่าทางภาคเหนือ และพยายามรักษาไว้ ภายหลังเสด็จพิราลัย พระอัฐิส่วนหนึ่งได้เชิญไปประดิษฐาน ณ พระสถูปบนยอดดอยหลวง และเปลี่ยนชื่อเพื่อเป็นเกียรติ​","history":"ดอยอินทนนท์ เป็นยอดเขาที่สูงที่สุดในประเทศไทย ตั้งอยู่ที่อำเภอจอมทอง จังหวัดเชียงใหม่ เดิมมีชื่อว่า \"ดอยหลวง\" หรือ \"ดอยหลวงอ่างกา\" ชื่อของ ดอยอินทนนท์ เป็นชื่อของกษัตริย์พระนามว่าพระเจ้าอินทวิชยานนท์ เจ้าผู้ครองนครเชียงใหม่ ทรงเป็นผู้ที่ห่วงใยในป่าทางภาคเหนือ และพยายามรักษาไว้ ภายหลังเสด็จพิราลัย พระอัฐิส่วนหนึ่งได้เชิญไปประดิษฐาน ณ พระสถูปบนยอดดอยหลวง และเปลี่ยนชื่อเพื่อเป็นเกียรติ​","other":"Doi Inthanon"},"en":{"title":"Doi Inthanon","url":"https://en.wikipedia.org/wiki/Doi_Inthanon","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/17/Naphamethinidon%2C_Naphaphonphumisiri_near_summit_of_Doi_Inthanon.jpg/960px-Naphamethinidon%2C_Naphaphonphumisiri_near_summit_of_Doi_Inthanon.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Doi Inthanon (Thai: ดอยอินทนนท์, pronounced [dɔ̄ːj ʔīn.tʰā.nōn]) is the highest mountain in Thailand. It is in Chom Thong District, Chiang Mai Province. This mountain is an ultra prominent peak, known in the past as Doi Luang Ang Ga (Grand Mount Ang Ga) or meaning the \u0027crow\u0027s pond top\u0027.","history":"Doi Inthanon (Thai: ดอยอินทนนท์, pronounced [dɔ̄ːj ʔīn.tʰā.nōn]) is the highest mountain in Thailand. It is in Chom Thong District, Chiang Mai Province. This mountain is an ultra prominent peak, known in the past as Doi Luang Ang Ga (Grand Mount Ang Ga) or meaning the \u0027crow\u0027s pond top\u0027. Near the mountain\u0027s base was a pond where many crows gathered. The name Doi Inthanon was given in honour of Inthawichayanon, Grand Prince of Chiang Mai, who was concerned about the forests in the north and tried to preserve them. After his death, his remains were interred at Doi Luang, which was then renamed in his honour.\nToday, the summit of Doi Inthanon is a popular tourist destination for both foreign and Thai tourists, with a peak of 12,000 visitors visiting the summit on New Year\u0027s Day. In addition to a range of tourist facilities on the summit, there is a weather station operated by the Royal Thai Air Force, with the Thai National Observatory also based there.","other":"ดอยอินทนนท์"}},{"th":{"title":"อุทยานประวัติศาสตร์พนมรุ้ง","url":"https://th.wikipedia.org/wiki/%E0%B8%AD%E0%B8%B8%E0%B8%97%E0%B8%A2%E0%B8%B2%E0%B8%99%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%A7%E0%B8%B1%E0%B8%95%E0%B8%B4%E0%B8%A8%E0%B8%B2%E0%B8%AA%E0%B8%95%E0%B8%A3%E0%B9%8C%E0%B8%9E%E0%B8%99%E0%B8%A1%E0%B8%A3%E0%B8%B8%E0%B9%89%E0%B8%87","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%AA%E0%B8%B2%E0%B8%97%E0%B8%A3%E0%B9%80%E0%B8%82%E0%B8%B2%E0%B8%9E%E0%B8%99%E0%B8%A1%E0%B8%A3%E0%B8%B8%E0%B9%89%E0%B8%87IDSC_0827.jpg/960px-%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%AA%E0%B8%B2%E0%B8%97%E0%B8%A3%E0%B9%80%E0%B8%82%E0%B8%B2%E0%B8%9E%E0%B8%99%E0%B8%A1%E0%B8%A3%E0%B8%B8%E0%B9%89%E0%B8%87IDSC_0827.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อุทยานประวัติศาสตร์พนมรุ้ง หรือ ปราสาทหินพนมรุ้ง เป็นอุทยานประวัติศาสตร์แห่งหนึ่งของประเทศไทยภายใต้การดูแลของกรมศิลปากร กระทรวงวัฒนธรรม เป็นหนึ่งในปราสาทหินในกลุ่มราชมรรคา ตั้งอยู่ที่หมู่ที่ 2 (บ้านดอนหนองแหน) ตำบลตาเป๊ก อำเภอเฉลิมพระเกียรติ ห่างจากตัวเมืองบุรีรัมย์ลงมาทางทิศใต้ประมาณ 77 กิโลเมตร ประกอบไปด้วยโบราณสถานสำคัญ ซึ่งตั้งอยู่บนยอดภูเขาไฟที่ดับสนิทแล้ว สูงประมาณ 200 เมตรจากพื้นราบ (ประมาณ 350 เมตรจากระดับน้ำทะเลปานกลาง) คำว่า พนมรุ้ง นั้น มาจากภาษาเขมร คำว่า วนํรุง แปลว่า ภูเขาใหญ่","history":"ปราสาทหินพนมรุ้งเป็นโบสถ์พราหมณ์ลัทธิไศวะเดิมเป็นเทวสถานอิฐในศิลปะแบบเกาะแกร์ มีการบูรณะก่อสร้างต่อเนื่องกันมาหลายสมัย ตั้งแต่ประมาณพุทธศตวรรษที่ 15 ถึงพุทธศตวรรษที่ 17 และในพุทธศตวรรษที่ 18 พระเจ้าชัยวรมันที่ 7 แห่งอาณาจักรขอมได้หันมานับถือศาสนาพุทธนิกายมหายาน เทวสถานแห่งนี้จึงได้รับการดัดแปลงเป็นวัดมหายาน ในช่วงแรกปราสาทหินพนมรุ้ง สร้างขึ้นจากหินทรายสีชมพู ตั้งอยู่บนยอดเขาพนมรุ้งสูง 1,320 ฟุตจากระดับน้ำทะเล ชื่อพนมรุ้งแปลว่าภูเขาใหญ่ สันนิษฐานว่าสร้างขึ้นในพุทธศตวรรษที่ 15-18\nมีการพบจารึกปราสาทหินพนมรุ้ง เขียนเป็นภาษาเขมรโบราณ และ ภาษาสันสกฤต ซึ่งนักวิชาการได้อ่านและแปลพอจะสรุปได้ว่า พระเจ้าราเชนทรวรมันที่ 2 กษัตริย์แห่งอาณาจักรพระนคร (พ.ศ. 1487–1511) ได้สถาปนาเทวสถานถวายพระศิวะที่เขาพนมรุ้ง ซึ่งในสมัยแรก ๆ คงยังไม่ใหญ่โตนัก ต่อมาพระเจ้าชัยวรมันที่ 5 (พ.ศ. 1511–1544) ได้ทรงอุทิศที่ดินและข้าทาสถวายแด่เทวสถานพนมรุ้ง ในสมัยพุทธศตวรรษที่ 17 นเรนทราทิตย์ เจ้านายแห่งราชวงศ์มหิธรปุระที่ปกครองดินแดนแถบนี้ (ซึ่งเป็นต้นตระกูลของพระเจ้าสุริยวรมันที่ 2 ผู้สร้างนครวัด) ได้สร้างปราสาทแห่งนี้ขึ้นและได้ทรงบำเพ็ญพรตเป็นโยคี ณ ปราสาทพนมรุ้ง","other":"Phanom Rung Historical Park"},"en":{"title":"Phanom Rung Historical Park","url":"https://en.wikipedia.org/wiki/Phanom_Rung_Historical_Park","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/%D0%93%D0%BE%D0%BB%D0%BE%D0%B2%D0%BD%D0%B0_%D0%B2%D0%B5%D0%B6%D0%B0_%D0%9F%D1%85%D0%B0%D0%BD%D0%BE%D0%BC%D1%80%D1%83%D0%BD%D0%B3.jpg/960px-%D0%93%D0%BE%D0%BB%D0%BE%D0%B2%D0%BD%D0%B0_%D0%B2%D0%B5%D0%B6%D0%B0_%D0%9F%D1%85%D0%B0%D0%BD%D0%BE%D0%BC%D1%80%D1%83%D0%BD%D0%B3.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Phanom Rung Historical Park is an archaeological site in Buriram Province, in the Isan region of Thailand. It covers the ruins of Prasat Phanom Rung (Thai: ปราสาทพนมรุ้ง, pronounced [prāː.sàːt pʰā.nōm.rúŋ]), a Buddhist-Hindu Khmer Empire temple complex of sandstone and laterite set on the rim of an extinct volcano at 402 metres (1,319 ft) elevation. It was built between the 10th and 13th centuries, originally as a Hindu religious site, and later became a Buddhist site.","history":"The Phanom Rung sanctuary compound was constructed over several phases, dated by means of iconography of its art and architectural styles together with its inscriptions. These comprise two foundations of sacred brick buildings of the 10th century, the minor sanctuary of the 11th, the central sanctuary built by King Suryavarman II in the 12th, and two Bannalai, or libraries, of the 13th. Further sacred buildings went up in the reign of King Jayavarman VII in the 13th century. They include the royal robing pavilion, the Kudi Rishis of Nong Bua Ray, the hospital or Arokayasala, and Prasat Ban Bu, a Dharmasala rest house with a fire. These stand on the plain at the foot of Phanom Rung, beside the road linking Angkor and Phimai. On that road the Preah Khan inscription of 1191 counts seventeen rest houses, against fifty-seven towards Campā and 121 in all, and names no road running west. These have been read as an important vice-regal centre on and around the mountain, flourishing from the 10th to the 13th centuries. The brick temples underlying the 12th-century sandstone temple have been …","other":"อุทยานประวัติศาสตร์พนมรุ้ง"}},{"th":{"title":"ศาลาแก้วกู่","url":"https://th.wikipedia.org/wiki/%E0%B8%A8%E0%B8%B2%E0%B8%A5%E0%B8%B2%E0%B9%81%E0%B8%81%E0%B9%89%E0%B8%A7%E0%B8%81%E0%B8%B9%E0%B9%88","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/Sculpture_Garden_at_Nong_Khai_-_panoramio_%281%29.jpg/960px-Sculpture_Garden_at_Nong_Khai_-_panoramio_%281%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ศาลาแก้วกู่ เป็นอุทยานขนาด 42 ไร่ของศูนย์วิปัสสนาแก้วกู่ และสถานที่ท่องเที่ยวสำคัญในชุมชนสามัคคี อำเภอเมือง จังหวัดหนองคาย ที่ประดิษฐานรูปปั้นคอนกรีตเสริมเหล็กขนาดใหญ่จำนวนรวมกว่า 200 องค์ โดยประกอบด้วยพระพุทธรูป พระรูปของพระโพธิสัตว์ เทพเจ้าฮินดู บุคคลในคริสต์ศาสนา ความเชื่อพื้นบ้าน และตัวละครจากรามเกียรติ์ อุทยานแห่งนี้ถูกสร้างขึ้นโดยปู่บุญเหลือ สุรีรัตน์ ภายใต้แนวคิดว่า \"ทุกศาสนาสามารถอยู่รวมกันได้\" และให้เป็น \"สถานที่แทนภาพดินแดนแห่งการหลุดพ้นจากกิเลสทั้งปวง\" ในปี พ.ศ.","history":"ศาลาแก้วกู่ เป็นอุทยานขนาด 42 ไร่ของศูนย์วิปัสสนาแก้วกู่ และสถานที่ท่องเที่ยวสำคัญในชุมชนสามัคคี อำเภอเมือง จังหวัดหนองคาย ที่ประดิษฐานรูปปั้นคอนกรีตเสริมเหล็กขนาดใหญ่จำนวนรวมกว่า 200 องค์ โดยประกอบด้วยพระพุทธรูป พระรูปของพระโพธิสัตว์ เทพเจ้าฮินดู บุคคลในคริสต์ศาสนา ความเชื่อพื้นบ้าน และตัวละครจากรามเกียรติ์ อุทยานแห่งนี้ถูกสร้างขึ้นโดยปู่บุญเหลือ สุรีรัตน์ ภายใต้แนวคิดว่า \"ทุกศาสนาสามารถอยู่รวมกันได้\" และให้เป็น \"สถานที่แทนภาพดินแดนแห่งการหลุดพ้นจากกิเลสทั้งปวง\" ในปี พ.ศ. 2521\nภายในอุทยาน ที่บริเวณฐานของพระรูปแต่ละองค์จะมีจารึกอธิบายชิ้นงานและแนวคิด คติเตือนใจ เป็นภาษาอีสาน และภาษาไทย รูปปั้นที่สูงที่สุดมีความสูงราว 25 เมตร นอกจากนี้ยังมีอาคารสำนักพุทธศาสนาแก้วกู่ความสูงสามชั้น สถาปัตยกรรมเลียนแบบมัสยิด บนหน้าบันของอาคารจารึกสัญลักษณ์โอม และอักษรไทย ศาลาแก้วกู่ โดยชั้นบนสุดเป็นที่ตั้งร่างของปู่บุญเหลือ สุรีรัตน์ที่บรรจุในผอบ [ผะ-อบ] และไม่เน่าเปื่อยทำให้สร้างความอัศจรรย์แก่ผู้ที่ศรัทธาในตัวท่านเป็นอย่างมาก\nปู่บุญเหลือได้สร้างอุทยานนี้ถัดจากสวนพระ หรือ วัดเซียงควน (Buddha Park; Wat Xieng Khuan) ที่ตั้งอยู่ในนครเวียงจันทน์ ประเทศลาว …","other":"Sala Keoku"},"en":{"title":"Sala Keoku","url":"https://en.wikipedia.org/wiki/Sala_Keoku","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/Sala_Keoku.JPG/960px-Sala_Keoku.JPG?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Sala Keoku (Thai: ศาลาแก้วกู่; RTGS: Sala Kaeo Ku; [sǎːlaː kɛ̂ːw kùː], also spelled as Sala Keo Ku, Sala Keo Koo, Sala Kaew Ku, Sala Kaew Koo, Salakaewkoo, Sala Gaew Goo, Sala Kaeoku, etc.; alternative name: Wat Khaek) is a park featuring giant fantastic concrete sculptures inspired by Buddhism and Hinduism. It is located near Nong Khai, Thailand in immediate proximity of the Thai-Lao border and the Mekong river. The park has been built by and reflects the vision of Luang Pu Bunleua Sulilat and his followers.","history":"Sala Keoku (Thai: ศาลาแก้วกู่; RTGS: Sala Kaeo Ku; [sǎːlaː kɛ̂ːw kùː], also spelled as Sala Keo Ku, Sala Keo Koo, Sala Kaew Ku, Sala Kaew Koo, Salakaewkoo, Sala Gaew Goo, Sala Kaeoku, etc.; alternative name: Wat Khaek) is a park featuring giant fantastic concrete sculptures inspired by Buddhism and Hinduism. It is located near Nong Khai, Thailand in immediate proximity of the Thai-Lao border and the Mekong river. The park has been built by and reflects the vision of Luang Pu Bunleua Sulilat and his followers. The construction started in 1978. It shares the style of Sulilat\u0027s earlier creation, Buddha Park on the Lao side of Mekong, but is marked by even more extravagant fantasy and greater proportions.\nSome of the Sala Keoku sculptures reach 25m. Those include a monumental depiction of Buddha meditating under the protection of a seven-headed Naga snake. While the subject (based on a Buddhist legend) is one of the recurrent themes in the religious art of the region, Sulilat\u0027s approach is unusual, with its naturalistic (even though stylized) representation of the snakes.\nThe Sala Keoku …","other":"ศาลาแก้วกู่"}},{"th":{"title":"วัดอรุณราชวรารามราชวรมหาวิหาร","url":"https://th.wikipedia.org/wiki/%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%AD%E0%B8%A3%E0%B8%B8%E0%B8%93%E0%B8%A3%E0%B8%B2%E0%B8%8A%E0%B8%A7%E0%B8%A3%E0%B8%B2%E0%B8%A3%E0%B8%B2%E0%B8%A1%E0%B8%A3%E0%B8%B2%E0%B8%8A%E0%B8%A7%E0%B8%A3%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2a/%E0%B9%80%E0%B8%88%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B9%8C%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%B2%E0%B8%99%E0%B8%97%E0%B8%A3%E0%B8%87%E0%B8%9B%E0%B8
