ติญี่ปุ่น\nประวัติความเป็นมาของศาลเจ้าย้อนหลังไปได้ตั้งแต่ศตวรรษที่ 6 การก่อสร้างสำเร็จจนมีลักษณะอย่างในปัจจุบันตั้งแต่ พ.ศ. 1711 โดยได้รับการสนับสนุนเงินทุนจากแม่ทัพคิโยโมริ ศาลเจ้าแห่งนี้เคยเป็นสัญลักษณ์แห่งความศักดิ์สิทธิ์ของเกาะ ในอดีตชาวบ้านสามัญชนจะถูกห้ามไม่ให้ย่างเท้าขึ้นบนเกาะ และต้องเดินทางโดยเรือผ่านเสาประตูที่ลอยอยู่กลางทะเล\nเสาโทริอิของศาลเจ้าอิตสึกูชิมะเป็นจุดท่องเที่ยวที่เป็นที่นิยมมากที่สุดแห่งหนึ่งในญี่ปุ่น และทิวทัศน์ของเสาประตูที่อยู่หน้าภูเขามิเซ็งบนเกาะ ยังได้รับการจัดให้เป็นหนึ่งในสามทิวทัศน์ที่งดงามที่สุดในญี่ปุ่น (Three Views of Japan) เสาโทริอิถูกสร้างขึ้นในบริเวณนี้ตั้งแต่ พ.ศ. 1711 แต่เสาที่เห็นในปัจจุบันถูกสร้างขึ้นใหม่เมื่อ พ.ศ.","history":"ศาลเจ้าอิตสึกูชิมะ (ญี่ปุ่น: 厳島神社; เฮปเบิร์น: Itsukushima-jinja) เป็นศาลเจ้าลัทธิชินโตบนเกาะอิตสึกูชิมะ เมืองฮัตสึกาอิจิ จังหวัดฮิโรชิมะ ประเทศญี่ปุ่น ได้รับการขึ้นทะเบียนจากองค์การยูเนสโกให้เป็นมรดกโลก และรัฐบาลญี่ปุ่นได้ยกฐานะอาคารต่าง ๆ ในศาลเจ้าให้เป็นสมบัติประจำชาติญี่ปุ่น\nประวัติความเป็นมาของศาลเจ้าย้อนหลังไปได้ตั้งแต่ศตวรรษที่ 6 การก่อสร้างสำเร็จจนมีลักษณะอย่างในปัจจุบันตั้งแต่ พ.ศ. 1711 โดยได้รับการสนับสนุนเงินทุนจากแม่ทัพคิโยโมริ ศาลเจ้าแห่งนี้เคยเป็นสัญลักษณ์แห่งความศักดิ์สิทธิ์ของเกาะ ในอดีตชาวบ้านสามัญชนจะถูกห้ามไม่ให้ย่างเท้าขึ้นบนเกาะ และต้องเดินทางโดยเรือผ่านเสาประตูที่ลอยอยู่กลางทะเล\nเสาโทริอิของศาลเจ้าอิตสึกูชิมะเป็นจุดท่องเที่ยวที่เป็นที่นิยมมากที่สุดแห่งหนึ่งในญี่ปุ่น และทิวทัศน์ของเสาประตูที่อยู่หน้าภูเขามิเซ็งบนเกาะ ยังได้รับการจัดให้เป็นหนึ่งในสามทิวทัศน์ที่งดงามที่สุดในญี่ปุ่น (Three Views of Japan) เสาโทริอิถูกสร้างขึ้นในบริเวณนี้ตั้งแต่ พ.ศ. 1711 แต่เสาที่เห็นในปัจจุบันถูกสร้างขึ้นใหม่เมื่อ พ.ศ. 2418 ตัวเสาทำจากไม้การบูร มีความสูงประมาณ 16 เมตร มีเสาเล็ก ๆ เป็นฐานรองอีก 4 เสา\nในเวลาที่น้ำขึ้น เสาโทริอิจะดูเหมือนลอยอยู่กลางทะเล เมื่อน้ำลง …","other":"Itsukushima Shrine"},"en":{"title":"Itsukushima Shrine","url":"https://en.wikipedia.org/wiki/Itsukushima_Shrine","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/Itsukushima_Shrine_Torii_Gate_%2813890465459%29.jpg/960px-Itsukushima_Shrine_Torii_Gate_%2813890465459%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Itsukushima Shrine (厳島神社, Itsukushima-jinja) is a Shinto shrine on the island of Itsukushima (popularly known as Miyajima), best known for its \"floating\" torii.  It is in the city of Hatsukaichi, in Hiroshima Prefecture in Japan, accessible from the mainland by ferry at Miyajimaguchi Station. The shrine complex is listed as a UNESCO World Heritage Site, and the Japanese government has designated several buildings and possessions as National Treasures.","history":"Itsukushima jinja was the chief Shinto shrine (ichinomiya) of Aki Province.\nThis shrine is one of the \"Three Great Shrines of Aki Province\", along with Take Shrine and Hayatani Shrine.\nThe first torii on the site is said to have been erected in 569, supposedly by Saeki Kuramoto during the reign of Empress Suiko (592–628 CE). Although a torii has been in place at the site since 1168, the current structure dates to 1875. The present shrine has been popularly attributed to Taira no Kiyomori, a prominent noble of the Imperial Court and later Chancellor (Daijō-daijin), who contributed heavily to the construction of the shrine during his time as governor of Aki Province in 1168. Another renowned patron of the shrine was Mōri Motonari, lord of Chōshū Domain, who was responsible for rebuilding the honden in 1571. As a result of waging war against Sue Takafusa there in 1555, Motonari is said to have tainted the island\u0027s grounds by battling on the island. Spilling blood violated the strict taboos meant to preserve the sacred purity associated with Shinto shrines. The only surviving structure …","other":"ศาลเจ้าอิตสึกูชิมะ"}},{"th":{"title":"ชิเชนอิตซา","url":"https://th.wikipedia.org/wiki/%E0%B8%8A%E0%B8%B4%E0%B9%80%E0%B8%8A%E0%B8%99%E0%B8%AD%E0%B8%B4%E0%B8%95%E0%B8%8B%E0%B8%B2","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Chichen_Itza_3.jpg/960px-Chichen_Itza_3.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ชิเชนอิตซา (สเปน: Chichén Itzá) เป็นแหล่งโบราณคดีขนาดใหญ่ที่สร้างขึ้นโดยชาวมายาในเขตวัฒนธรรมมีโซอเมริกา ตั้งอยู่ในคาบสมุทรยูกาตัน รัฐยูกาตัน ทางภาคตะวันออกเฉียงใต้ของประเทศเม็กซิโก ชิเชนอิตซาเป็นส่วนหนึ่งของเมืองจำนวนมากมายซึ่งพวกมายาได้สร้างขึ้นเพื่อเป็นอนุสรณ์ของเทพเจ้าผู้ทรงกระหายพระโลหิต \nลักษณะโดยทั่วไปของชิเชนอิตซา ทำเป็นรูปเหลี่ยมลดขั้นเป็นชั้น ๆ บนเนื้อที่ราว 6.4 ตารางกิโลเมตร มีบันไดกลาง วิหารที่ใหญ่สุดมีชื่อว่า วิหารแห่งนักรบ สร้างขึ้นในคริสต์ศตวรรษที่ 12 หลังจากสร้างวิหารเก่าแห่งชักโมล ตรงกลางสร้างเป็นปราสาทเหลี่ยมทึบสูงขึ้นไป ใช้เป็นที่ทำพิธีสังเวยเทพเจ้าโดยใช้เด็กสาวโยนลงไปถวายเทพเจ้า ณ ที่นั้น รอบ ๆ ห่างออกมาทำเป็นบริเวณตลาดทำนองเดียวกับสถานสถิตยุติธรรมของพวกโรมัน ซึ่งอยู่กลางเมืองที่สาธารณะและเป็นที่รวมของฝูงชน\nชนเผ่ามายาแห่งเม็กซิโกสืบสายมาจากคนพวกแรกที่เดินทางจากทวีปเอเชียเข้ามายังทวีปอเมริกาทางช่องแคบเบริง ได้มีการพัฒนาทางวัฒนธรรมทั้งในด้านเหี้ยมโหดอันป่าเถื่อนและความมีสติปัญญาอันสูงส่งในขณะเดียวกัน\nพวกมายาฝึกความเสียสละด้านมนุษยชาติ ควักหัวใจผู้ที่รับการบูชาออกสังเวยพระเจ้า ขณะเดียวกันก็มีการพัฒนาความรู้ด้านดาราศาสตร์ ศิลปะของสถาปัตยกรรม ทางอักษรศาสตร์ ด้านการเขียนบันทึกด้วยตัวอักษรพิเศษ และการค้นพบค่าของเลข 0 ทางคณิตศาสตร์ แต่ก็น่าแปลกที่พวกเขามิได้ค้นพบประโยชน์อันเกิดจากล้อเลื่อน\nศูนย์กลางของอารยธรรมของคนพวกนี้อยู่ที่ชิเชนอิตซา ในคาบสมุทรยูกาตัน ผู้ค้นพบ ขุมอารยธรรมเหล่านี้แล้วนำออกมาเผยแพร่ให้ชาวโลกได้ทราบคือ นายทอมป์สัน ชาวอเมริกัน ผู้ใช้ชีวิตซอกซอนท่องเที่ยวไปในหมู่พวกมายาด้วยความสนใจจะศึกษาสิ่งลึกลับต่าง ๆ\nบางทีอาจกล่าวได้ว่าพวกมายาจะเป็นต้นตำรับของพวกบูชาความสงบที่ต้องการศาสนารุนแรง นองเลือด หลังจากที่เคยพ่ายแพ้พวกชนเผ่าตอลเต็ก ซึ่งอยู่ตอนกลางของเม็กซิโก ในท้ายที่สุด พวกมายาก็ตกอยู่ใต้อำนาจของผู้ที่นิยมความรุนแรงที่เหนือกว่า ในเมื่อผู้ชนะที่กระหายเลือด โลภที่จะได้ทองและทรัพย์สมบัติของพวกมายาอย่างเต็มที่\n7 กรกฎาคม พ.ศ.","history":"ชิเชนอิตซา (สเปน: Chichén Itzá) เป็นแหล่งโบราณคดีขนาดใหญ่ที่สร้างขึ้นโดยชาวมายาในเขตวัฒนธรรมมีโซอเมริกา ตั้งอยู่ในคาบสมุทรยูกาตัน รัฐยูกาตัน ทางภาคตะวันออกเฉียงใต้ของประเทศเม็กซิโก ชิเชนอิตซาเป็นส่วนหนึ่งของเมืองจำนวนมากมายซึ่งพวกมายาได้สร้างขึ้นเพื่อเป็นอนุสรณ์ของเทพเจ้าผู้ทรงกระหายพระโลหิต \nลักษณะโดยทั่วไปของชิเชนอิตซา ทำเป็นรูปเหลี่ยมลดขั้นเป็นชั้น ๆ บนเนื้อที่ราว 6.4 ตารางกิโลเมตร มีบันไดกลาง วิหารที่ใหญ่สุดมีชื่อว่า วิหารแห่งนักรบ สร้างขึ้นในคริสต์ศตวรรษที่ 12 หลังจากสร้างวิหารเก่าแห่งชักโมล ตรงกลางสร้างเป็นปราสาทเหลี่ยมทึบสูงขึ้นไป ใช้เป็นที่ทำพิธีสังเวยเทพเจ้าโดยใช้เด็กสาวโยนลงไปถวายเทพเจ้า ณ ที่นั้น รอบ ๆ ห่างออกมาทำเป็นบริเวณตลาดทำนองเดียวกับสถานสถิตยุติธรรมของพวกโรมัน ซึ่งอยู่กลางเมืองที่สาธารณะและเป็นที่รวมของฝูงชน\nชนเผ่ามายาแห่งเม็กซิโกสืบสายมาจากคนพวกแรกที่เดินทางจากทวีปเอเชียเข้ามายังทวีปอเมริกาทางช่องแคบเบริง ได้มีการพัฒนาทางวัฒนธรรมทั้งในด้านเหี้ยมโหดอันป่าเถื่อนและความมีสติปัญญาอันสูงส่งในขณะเดียวกัน\nพวกมายาฝึกความเสียสละด้านมนุษยชาติ ควักหัวใจผู้ที่รับการบูชาออกสังเวยพระเจ้า ขณะเดียวกันก็มีการพัฒนาความรู้ด้านดาราศาสตร์ ศิลปะของสถาปัตยกรรม ทางอักษรศาสตร์ …","other":"Chichen Itza"},"en":{"title":"Chichen Itza","url":"https://en.wikipedia.org/wiki/Chichen_Itza","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Chichen_Itza_3.jpg/960px-Chichen_Itza_3.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Chichen Itza was a large pre-Columbian city built by the Maya people of the Terminal Classic period. The archeological site is located in Tinúm Municipality, Yucatán, Mexico, between the cities of Valladolid and Mérida.\nChichen Itza was a major focal point in the Northern Maya Lowlands from the Late Classic (c.","history":"The layout of Chichen Itza\u0027s core developed during its earlier phase of occupation, between 750 and 900 AD. Its final layout was developed after 900 AD, and the 10th century saw the rise of the city as a regional capital controlling the area from central Yucatán to the north coast, with its power extending down the east and west coasts of the peninsula. The earliest hieroglyphic date discovered at Chichen Itza is equivalent to 832 AD, while the last known date was recorded in the Osario temple in 998.\nThe Late Classic city was centered upon the area to the southwest of the Xtoloc cenote, with the main architecture represented by the substructures now underlying the Las Monjas and Observatorio and the basal platform upon which they were built. While the city was founded by the local Mayans of Northern Yucatan, another group of Mayan people of debated origins, the Itza, started arriving around 800 AD and gradually established themselves in the region. The name Itza was given by the local people, meaning \"those who speak our language brokenly\", and is considered to be part of the …","other":"ชิเชนอิตซา"}},{"th":null,"en":{"title":"Pyramid of the Sun","url":"https://en.wikipedia.org/wiki/Pyramid_of_the_Sun","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3b/2020-02-11_Teotihuacan_la_Avenida_de_los_Muertos_y_la_Pir%C3%A1mide_del_Sol.jpg/960px-2020-02-11_Teotihuacan_la_Avenida_de_los_Muertos_y_la_Pir%C3%A1mide_del_Sol.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Pyramid of the Sun is the largest building in Teotihuacan, and one of the largest in Mesoamerica. It is believed to have been constructed about 200 AD. Found along the Avenue of the Dead, in between the Pyramid of the Moon and the Ciudadela, and in the shadow of the mountain Cerro Gordo, the pyramid is part of a large complex in the heart of the city.","history":"The name Pyramid of the Sun comes from the Aztecs, who visited the city of Teotihuacan centuries after it was abandoned; the name given to the pyramid by the Teotihuacanos is unknown. It was constructed in two phases. The first construction stage, around 200 AD, brought the pyramid to nearly the size it is today. The second round of construction resulted in its completed size of 225 meters (738 feet) across and 75 meters (246 feet) high, making it one of the largest pyramids in the world, though still just over half the height of the Great Pyramid of Giza (146 metres). The second phase also saw the construction of an altar atop of the pyramid which has not survived into modern times.\nOver the structure, the ancient Teotihuacanos finished their pyramid with lime plaster imported from surrounding areas, on which they painted brilliantly colored murals. While the pyramid has endured for centuries, the paint and plaster have not and are no longer visible. Jaguar heads and paws, stars, and snake rattles are among the few images associated with the pyramids.\nIt is thought that the pyramid …","other":null}},{"th":null,"en":{"title":"Ahu Tongariki","url":"https://en.wikipedia.org/wiki/Ahu_Tongariki","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/41/Ahu-Tongariki-from-south-west-2013.jpg/960px-Ahu-Tongariki-from-south-west-2013.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Ahu Tongariki (Spanish pronunciation: [ˈa.u (ˈaxu) toŋɡaˈɾiki]) is the largest ahu on Easter Island (Rapa Nui). Its moais were toppled during the island\u0027s civil wars, and in the twentieth century the ahu was swept inland by a tsunami. It has since been restored and has fifteen moai, including one that weighs eighty-six tonnes, the heaviest ever erected on the island.","history":"Ahu Tongariki was the main centre and capital of the Hotu-iti clan, the eastern confederation of the Rapa Nui people. Its moai were toppled during the island\u0027s civil wars. In 1960, a tsunami caused by an earthquake off the coast of Chile swept the ahu inland.\nAhu Tongariki was substantially restored in the 1990s through the efforts of a multidisciplinary team headed by archaeologists Claudio Cristino and Patricia Vargas Casanova. The five-year project was carried out under an official agreement among the Chilean government, the University of Chile, and Japan-based crane manufacturer Tadano.","other":null}},{"th":{"title":"เส้นนัซกา","url":"https://th.wikipedia.org/wiki/%E0%B9%80%E0%B8%AA%E0%B9%89%E0%B8%99%E0%B8%99%E0%B8%B1%E0%B8%8B%E0%B8%81%E0%B8%B2","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/L%C3%ADneas_de_Nazca%2C_Nazca%2C_Per%C3%BA%2C_2015-07-29%2C_DD_49.JPG/960px-L%C3%ADneas_de_Nazca%2C_Nazca%2C_Per%C3%BA%2C_2015-07-29%2C_DD_49.JPG?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"เส้นนัซกา (สเปน: líneas de Nazca) เป็นกลุ่มภาพลายเส้นที่ทะเลทรายนัซกาทางตอนใต้ของประเทศเปรู สร้างขึ้นในช่วง 500 ปีก่อนคริสต์ศักราช ถึง ค.ศ. 500 โดยผู้คนที่ทำรอยบากหรือรอยบากตื้น ๆ บนพื้นทะเลทราย เอาก้อนกรวดออก และปล่อยดินสีต่าง ๆ ออกมา มีการวาดเส้นนัซกาถึงสองระยะหลัก คือ ระยะปารากัซใน 400 ถึง 200 ปีก่อนคริสต์ศักราช และระยะนัซกาใน 200 ปีก่อนคริสต์ศักราช ถึง ค.ศ. 500 จนกระทั่ง ค.ศ.","history":"เส้นนัซกา (สเปน: líneas de Nazca) เป็นกลุ่มภาพลายเส้นที่ทะเลทรายนัซกาทางตอนใต้ของประเทศเปรู สร้างขึ้นในช่วง 500 ปีก่อนคริสต์ศักราช ถึง ค.ศ. 500 โดยผู้คนที่ทำรอยบากหรือรอยบากตื้น ๆ บนพื้นทะเลทราย เอาก้อนกรวดออก และปล่อยดินสีต่าง ๆ ออกมา มีการวาดเส้นนัซกาถึงสองระยะหลัก คือ ระยะปารากัซใน 400 ถึง 200 ปีก่อนคริสต์ศักราช และระยะนัซกาใน 200 ปีก่อนคริสต์ศักราช ถึง ค.ศ. 500 จนกระทั่ง ค.ศ. 2020 มีการค้นพบภาพลายเส้นใหม่ระหว่าง 80 ถึง 100 รูปด้วยการใช้โดรน และนักโบราณคดีเชื่อว่าอาจพบได้มากกว่านี้\nเส้นส่วนใหญ่มักเป็นเส้นตรงผ่านภูมิประเทศ แต่ก็มีการออกแบบเป็นรูปสัตว์และพืชด้วย เส้นนัซกาบางส่วนสามารถมองเห็นรูปร่างได้ดีจากข้างบน (ที่ประมาณ 500 เมตร [1,600 ฟุต]) แม้ว่จะมองเห็นได้จากเชิงเขาโดยรอบและบริเวณที่สูงอื่น ๆ ก็ตาม รูปร่างเหล่านี้มักสร้างจากเส้นที่ยาวต่อเนื่อง โดยรูปที่ใหญ่ที่สุดมีเส้นที่ยาวประมาณ 370 เมตร (400 หลา) เนื่องจากที่ตั้งที่โดดเดี่ยวและสภาพภูมิอากาศบนที่ราบสูงที่แห้งแล้ง ไร้ลม และคงที่ ทำให้เส้นส่วนใหญ่ได้รับการรักษาตามธรรมชาติ การเปลี่ยนแปลงสภาพอากาศที่พบได้ยากมากอาจเปลี่ยนแปลงรูปร่างทั่วไปชั่วคราว ณ ค.ศ. 2012 กล่าวกันว่าเส้นต่าง ๆ …","other":"Nazca lines"},"en":{"title":"Nazca lines","url":"https://en.wikipedia.org/wiki/Nazca_lines","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/L%C3%ADneas_de_Nazca%2C_Nazca%2C_Per%C3%BA%2C_2015-07-29%2C_DD_49.JPG/960px-L%C3%ADneas_de_Nazca%2C_Nazca%2C_Per%C3%BA%2C_2015-07-29%2C_DD_49.JPG?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Nazca lines (, ) are a group of geoglyphs made in the soil of the Nazca Desert in southern Peru. They were created between 500 BC and 500 AD by people making depressions or shallow incisions in the desert floor, removing pebbles and leaving different-colored dirt exposed.  There are two major phases of the Nazca lines, Paracas phase, from 400 to 200 BC, and Nazca phase, from 200 BC to 500 AD. In the 21st century, several hundred new figures have been found with the use of drones, and archaeologists believe that there are more to be found.","history":"The Nazca lines (, ) are a group of geoglyphs made in the soil of the Nazca Desert in southern Peru. They were created between 500 BC and 500 AD by people making depressions or shallow incisions in the desert floor, removing pebbles and leaving different-colored dirt exposed.  There are two major phases of the Nazca lines, Paracas phase, from 400 to 200 BC, and Nazca phase, from 200 BC to 500 AD. In the 21st century, several hundred new figures have been found with the use of drones, and archaeologists believe that there are more to be found.\nMost lines run straight across the landscape, but there are also figurative designs of animals and plants. The combined length of all the lines is more than 1,300 km (800 mi), and the group covers an area of about 50 km2 (19 sq mi). The lines are typically 10 to 15 cm (4–6 in) deep. They were made by removing the top layer of reddish-brown ferric oxide–coated pebbles to reveal a yellow-grey subsoil. The width of the lines varies considerably, but more than half are slightly more than 33 cm (13 in) wide.  In some places they may be only 30 cm …","other":"เส้นนัซกา"}},{"th":{"title":"อนุสาวรีย์เทพีเสรีภาพ","url":"https://th.wikipedia.org/wiki/%E0%B8%AD%E0%B8%99%E0%B8%B8%E0%B8%AA%E0%B8%B2%E0%B8%A7%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B9%8C%E0%B9%80%E0%B8%97%E0%B8%9E%E0%B8%B5%E0%B9%80%E0%B8%AA%E0%B8%A3%E0%B8%B5%E0%B8%A0%E0%B8%B2%E0%B8%9E","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/Front_view_of_Statue_of_Liberty_%28cropped%29.jpg/960px-Front_view_of_Statue_of_Liberty_%28cropped%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"เทพีเสรีภาพ (Liberty Enlightening the World; ฝรั่งเศส: La Liberté éclairant le monde) เป็นประติมากรรมนีโอคลาสสิก ขนาดมหึมาบนเกาะลิเบอร์ตีในท่าเรือนิวยอร์ก ภายในนครนิวยอร์ก รูปปั้นที่หุ้มด้วยทองแดงนี้เป็นของขวัญจากประชาชนชาวฝรั่งเศสที่มอบให้แก่สหรัฐอเมริกา ออกแบบโดยประติมากรชาวฝรั่งเศส เฟรเดริก โอกุสต์ บาร์โตลดี และมีโครงสร้างโลหะที่สร้างโดย กุสตาฟ ไอเฟล รูปปั้นนี้ได้รับการอุทิศเมื่อวันที่ 28 ตุลาคม 1886\nรูปปั้นนี้เป็นสตรีที่สวมชุดคลุมแบบคลาสสิก ซึ่งเชื่อกันว่าได้รับแรงบันดาลใจจากลิเบอร์ตัส เทพธิดาแห่งเสรีภาพของโรมัน เธอยืนในท่าคอนทราพอสโต โดยใช้มือขวาชูคบเพลิงไว้เหนือศีรษะ ส่วนมือซ้ายถือแผ่นจารึก JULY IV MDCCLXXVI (4 กรกฎาคม 1776 เป็นตัวเลขโรมัน) ซึ่งเป็นวันที่มีประกาศอิสรภาพของสหรัฐอเมริกา เธอเหยียบโซ่และตรวนที่ขาดด้วยเท้าซ้าย เพื่อรำลึกถึงการเลิกทาสในระดับชาติ หลังสงครามกลางเมืองอเมริกา หลังจากมีการอุทิศ รูปปั้นนี้ได้กลายเป็นสัญลักษณ์แห่งเสรีภาพของสหรัฐอเมริกา และต่อมาก็เป็นที่จดจำในฐานะสัญลักษณ์แห่งการต้อนรับผู้อพยพที่เดินทางมาทางทะเล\nแนวคิดในการสร้างรูปปั้นนี้เริ่มขึ้นในปี 1865 เมื่อเอดูอาร์ เรอเน เดอ ลาบูเลย์ นักประวัติศาสตร์และนักเคลื่อนไหวต่อต้านการค้าทาสชาวฝรั่งเศสเสนอแนวคิดในการสร้างอนุสาวรีย์เพื่อเฉลิมฉลองครบรอบ 100 ปีการประกาศอิสรภาพของสหรัฐฯ (ในปี 1876) เพื่อยกย่องความมั่นคงของระบอบประชาธิปไตยของอเมริกา และการปลดปล่อยทาสในประเทศ อย่างไรก็ตาม สงครามฝรั่งเศส-ปรัสเซียทำให้โครงการนี้ล่าช้าไปจนถึงปี 1875 เมื่อลาบูเลย์เสนอให้ประชาชนชาวฝรั่งเศสร่วมกันระดมทุนสร้างรูปปั้น ส่วนทางด้านสหรัฐอเมริกาให้รับผิดชอบด้านสถานที่ตั้งและการก่อสร้างฐานรูปปั้น บาร์โตลดีได้สร้างส่วนหัวและแขนที่ถือคบเพลิงเสร็จเรียบร้อยก่อนที่แบบของรูปปั้นจะแล้วเสร็จ โดยชิ้นส่วนเหล่านี้ถูกนำไปจัดแสดงในงานแสดงสินค้าระดับนานาชาติเพื่อประชาสัมพันธ์โครงการนี้\nแขนที่ถือคบเพลิงได้รับการจัดแสดงที่ งาน Centennial Exposition ในเมืองฟิลาเดลเฟีย ในปี พ.ศ.","history":"เทพีเสรีภาพ (Liberty Enlightening the World; ฝรั่งเศส: La Liberté éclairant le monde) เป็นประติมากรรมนีโอคลาสสิก ขนาดมหึมาบนเกาะลิเบอร์ตีในท่าเรือนิวยอร์ก ภายในนครนิวยอร์ก รูปปั้นที่หุ้มด้วยทองแดงนี้เป็นของขวัญจากประชาชนชาวฝรั่งเศสที่มอบให้แก่สหรัฐอเมริกา ออกแบบโดยประติมากรชาวฝรั่งเศส เฟรเดริก โอกุสต์ บาร์โตลดี และมีโครงสร้างโลหะที่สร้างโดย กุสตาฟ ไอเฟล รูปปั้นนี้ได้รับการอุทิศเมื่อวันที่ 28 ตุลาคม 1886\nรูปปั้นนี้เป็นสตรีที่สวมชุดคลุมแบบคลาสสิก ซึ่งเชื่อกันว่าได้รับแรงบันดาลใจจากลิเบอร์ตัส เทพธิดาแห่งเสรีภาพของโรมัน เธอยืนในท่าคอนทราพอสโต โดยใช้มือขวาชูคบเพลิงไว้เหนือศีรษะ ส่วนมือซ้ายถือแผ่นจารึก JULY IV MDCCLXXVI (4 กรกฎาคม 1776 เป็นตัวเลขโรมัน) ซึ่งเป็นวันที่มีประกาศอิสรภาพของสหรัฐอเมริกา เธอเหยียบโซ่และตรวนที่ขาดด้วยเท้าซ้าย เพื่อรำลึกถึงการเลิกทาสในระดับชาติ หลังสงครามกลางเมืองอเมริกา หลังจากมีการอุทิศ รูปปั้นนี้ได้กลายเป็นสัญลักษณ์แห่งเสรีภาพของสหรัฐอเมริกา และต่อมาก็เป็นที่จดจำในฐานะสัญลักษณ์แห่งการต้อนรับผู้อพยพที่เดินทางมาทางทะเล\nแนวคิดในการสร้างรูปปั้นนี้เริ่มขึ้นในปี 1865 เมื่อเอดูอาร์ เรอเน เดอ ลาบูเลย์ …","other":"Statue of Liberty"},"en":{"title":"Statue of Liberty","url":"https://en.wikipedia.org/wiki/Statue_of_Liberty","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/Front_view_of_Statue_of_Liberty_%28cropped%29.jpg/960px-Front_view_of_Statue_of_Liberty_%28cropped%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Statue of Liberty (Liberty Enlightening the World, French: La Liberté éclairant le monde; colloquially known as Lady Liberty) is a colossal neoclassical sculpture of a robed and crowned woman on Liberty Island, part of New York City, in New York Harbor. The copper-clad statue, a gift to the United States from the people of France, was designed by French sculptor Frédéric Auguste Bartholdi, and its metal framework built by Gustave Eiffel. The statue was dedicated on October 28, 1886.","history":"The Statue of Liberty (Liberty Enlightening the World, French: La Liberté éclairant le monde; colloquially known as Lady Liberty) is a colossal neoclassical sculpture of a robed and crowned woman on Liberty Island, part of New York City, in New York Harbor. The copper-clad statue, a gift to the United States from the people of France, was designed by French sculptor Frédéric Auguste Bartholdi, and its metal framework built by Gustave Eiffel. The statue was dedicated on October 28, 1886.\nThe statue is a figure of a classically draped woman, inspired by the Roman goddess of liberty, Libertas. She holds a torch above her head with her right hand, and in her left hand carries a tabula ansata inscribed JULY IV MDCCLXXVI (July 4, 1776, in Roman numerals), the date of the U.S. Declaration of Independence. With her left foot she steps on a broken chain and shackle, commemorating the national abolition of slavery following the American Civil War.\nIn 1865, the French historian and abolitionist Édouard de Laboulaye proposed a monument to commemorate the upcoming centennial of U.S. independence …","other":"อนุสาวรีย์เทพีเสรีภาพ"}},{"th":{"title":"ภูเขารัชมอร์","url":"https://th.wikipedia.org/wiki/%E0%B8%A0%E0%B8%B9%E0%B9%80%E0%B8%82%E0%B8%B2%E0%B8%A3%E0%B8%B1%E0%B8%8A%E0%B8%A1%E0%B8%AD%E0%B8%A3%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Mount_Rushmore_detail_view_%28100MP%29.jpg/960px-Mount_Rushmore_detail_view_%28100MP%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อนุสรณ์สถานแห่งชาติเขารัชมอร์ (อังกฤษ: The Mount Rushmore National Memorial) เป็นประติมากรรมแกะสลักบนหน้าผาของภูเขาหินแกรนิต ชื่อเขารัชมอร์ (ชื่อในภาษาลาโกตาซู แปลว่า : ปู่หกคน) ใกล้เมื่องคีย์สโตน รัฐเซาท์ดาโคตา สหรัฐอเมริกา แกะสลักโดยชาวเดนมาร์ก-อเมริกันชื่อ Gutzon Borglum และลูกชายของเขาชื่อ ลิงคอล์น Borglum ประติมากรรมเป็นใบหน้าของอดีตประธานาธิบดีสหรัฐ สูง 60 ฟุต (18 เมตร) 4 ท่าน ได้แก่ จอร์จ วอชิงตัน (1732-1799), ทอมัส เจฟเฟอร์สัน (1743-1826) ทีโอดอร์ โรเซอเวลต์ (1858-1919) และเอบราแฮม ลิงคอล์น (1809-1865) อนุสรณ์สถานทั้งหมดครอบคลุมพื้นที่ 1,278.45 เอเคอร์ (5.17 ตารางกิโลเมตร) และอยู่เหนือระดับน้ำทะเล 5,725 ฟุต (1,745 เมตร)","history":"อนุสรณ์สถานแห่งชาติเขารัชมอร์ (อังกฤษ: The Mount Rushmore National Memorial) เป็นประติมากรรมแกะสลักบนหน้าผาของภูเขาหินแกรนิต ชื่อเขารัชมอร์ (ชื่อในภาษาลาโกตาซู แปลว่า : ปู่หกคน) ใกล้เมื่องคีย์สโตน รัฐเซาท์ดาโคตา สหรัฐอเมริกา แกะสลักโดยชาวเดนมาร์ก-อเมริกันชื่อ Gutzon Borglum และลูกชายของเขาชื่อ ลิงคอล์น Borglum ประติมากรรมเป็นใบหน้าของอดีตประธานาธิบดีสหรัฐ สูง 60 ฟุต (18 เมตร) 4 ท่าน ได้แก่ จอร์จ วอชิงตัน (1732-1799), ทอมัส เจฟเฟอร์สัน (1743-1826) ทีโอดอร์ โรเซอเวลต์ (1858-1919) และเอบราแฮม ลิงคอล์น (1809-1865) อนุสรณ์สถานทั้งหมดครอบคลุมพื้นที่ 1,278.45 เอเคอร์ (5.17 ตารางกิโลเมตร) และอยู่เหนือระดับน้ำทะเล 5,725 ฟุต (1,745 เมตร)","other":"Mount Rushmore"},"en":{"title":"Mount Rushmore","url":"https://en.wikipedia.org/wiki/Mount_Rushmore","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Mount_Rushmore_detail_view_%28100MP%29.jpg/960px-Mount_Rushmore_detail_view_%28100MP%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Mount Rushmore National Memorial is a national memorial  featuring a colossal sculpture carved into the granite face of Mount Rushmore (Lakota: Tȟuŋkášila Šákpe Pahá, or Six Grandfathers Mountain) in the Black Hills, about 2 mi (3 km) southwest of Keystone, South Dakota, United States. The sculptor, Gutzon Borglum, named it the Shrine of Democracy, and oversaw the execution from 1927 to 1941 with the help of his son, Lincoln Borglum. The sculpture features 60-foot-tall (18 m) depictions of the heads of four United States presidents: George Washington, Thomas Jefferson, Theodore Roosevelt, and Abraham Lincoln, respectively chosen to represent the nation\u0027s foundation, expansion, development, and preservation.","history":"The peak that would later be known as Mount Rushmore is situated in the Black Hills, which has been inhabited by numerous indigenous groups over the centuries. The Ponca, Arikara, and Mandan were among the earliest recorded inhabitants, and were later displaced by the Kiowa, Plains Apache, and Shoshone. By 1800 those groups were supplanted by the Cheyenne, Arapaho, and Lakota Sioux, with the Lakota becoming the majority in the area by 1850. The Lakota call the Black Hills Pahá Sápa and consider the entire region to be sacred ground, referring to the hills as wamakaognaka e\u0027cante, \"the heart of everything that is\". The Cheyenne, Arapaho, and other Native groups of the Northern Plains also recognize particular sites within the Black Hills as having sacred significance.\nMount Rushmore was originally known to the Lakota as Igmu Tanka Pahá (Cougar Mountain) due to the many cougars living in the area. After the 1870s, it came to be known as Tȟuŋkášila Šákpe Pahá (Six Grandfathers Mountain). The name referred to the six head-like knobs along the summit ridge, which came to be associated …","other":"ภูเขารัชมอร์"}},{"th":{"title":"เกาะอัลคาทราซ","url":"https://th.wikipedia.org/wiki/%E0%B9%80%E0%B8%81%E0%B8%B2%E0%B8%B0%E0%B8%AD%E0%B8%B1%E0%B8%A5%E0%B8%84%E0%B8%B2%E0%B8%97%E0%B8%A3%E0%B8%B2%E0%B8%8B","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f3/Alcatraz_Island_photo_Don_Ramey_Logan.jpg/960px-Alcatraz_Island_photo_Don_Ramey_Logan.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"เกาะอัลคาทราซ (บางครั้งเรียกว่า อัลคาทราซ หรือ เดอะร็อค) เป็นเกาะเล็ก ๆ ที่ตั้งอยู่กลางอ่าวซานฟรานซิสโก ในแคลิฟอร์เนีย ประเทศสหรัฐอเมริกา เกาะนี้เคยเป็นสถานที่ตั้งประภาคาร ป้อมปราการของกองทัพ และยังเป็นคุกทหารจนถึงปี 1963 หลังจากนั้น เกาะอัลคาทราซก็กลายเป็นสถานที่ท่องเที่ยว","history":"เกาะอัลคาทราซ (บางครั้งเรียกว่า อัลคาทราซ หรือ เดอะร็อค) เป็นเกาะเล็ก ๆ ที่ตั้งอยู่กลางอ่าวซานฟรานซิสโก ในแคลิฟอร์เนีย ประเทศสหรัฐอเมริกา เกาะนี้เคยเป็นสถานที่ตั้งประภาคาร ป้อมปราการของกองทัพ และยังเป็นคุกทหารจนถึงปี 1963 หลังจากนั้น เกาะอัลคาทราซก็กลายเป็นสถานที่ท่องเที่ยว\nปัจจุบันนี้ เกาะอัลคาทราซเป็นสถานที่ทางประวัติศาสตร์จากการอนุมัติโดยหน่วยงานอุทยาน แห่งชาติ ที่เป็นส่วนหนึ่งของ \"Golden Gate National Recreation Area\" และเปิดเป็นสถานที่ท่องเที่ยว นักท่องเที่ยวสามารถไปเยี่ยมชมโดยเรือเฟอร์รี่จากท่าเรือ 33 ใกล้กับ ฟิชเชอร์แมนวาร์ฟ (Fisherman\u0027s Wharf) ในซานฟรานซิสโก นอกจากนี้เกาะแห่งนี้ยังได้รับการขึ้นทะเบียนเป็นโบราณสถานของชาติในปี 1986\nชื่อของเกาะได้รับการตั้งขึ้นเมื่อปี 1775 เมื่อนักสำรวจชาวสเปน ฮวน มานูเอล เดอ อยาลา ทำการสำรวจอ่าวซานฟานซิสโก และตั้งชื่อตามขนาดของเกาะว่า ลา อิสลา เดอ ลอส อัลคาทราซ ซึ่งแปลว่า \"เกาะแห่งนกกระทุง\" เกาะแห่งนี้ไม่เหมาะที่จะอยู่อาศัย เนื่องจากกระแสน้ำทะเล พืชผักที่มีปริมาณน้อยมาก และพื้นดินที่แห้งแล้ง\nเนื่องจากเกาะแห่งนี้ตั้งอยู่โดดเดี่ยวกลางอ่าวตามธรรมชาติ ล้อมรอบด้วยน้ำที่มีอุณหภูมิเยือกแข็งและคลื่นลมแรง เกาะอัลคาทราซ …","other":"Alcatraz Island"},"en":{"title":"Alcatraz Island","url":"https://en.wikipedia.org/wiki/Alcatraz_Island","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/17/Alcatraz_2021.jpg/960px-Alcatraz_2021.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Alcatraz Island () is a small island about 1.25 miles offshore from San Francisco in San Francisco Bay, California, near the Golden Gate strait. The island was developed in the mid-19th century with facilities for a lighthouse, a military fortification, and a military prison. In 1934, the island was converted into a federal prison, Alcatraz Federal Penitentiary.","history":"The first European to document the islands of San Francisco Bay was Spanish naval officer and explorer Juan Manuel de Ayala during the Spanish rule of California; he charted San Francisco Bay in 1775. He named today\u0027s Yerba Buena Island as \"La Isla de los Alcatraces\", which translates as \"The Island of the Gannets\", but is commonly believed to translate as \"The Island of the Pelicans\" (the modern Spanish word for pelican is pelícano), from the archaic Spanish alcatraz (\"pelican\"). No gannets are native to the Pacific Coast, making the older Spanish usage more likely.\nYerba Buena Island was labeled on Ayala\u0027s 1775 chart of San Francisco Bay as \"Isla de Alcatraces\". The name was later applied to the rock now known as Alcatraz Island by Captain Frederick W. Beechey, an English naval officer and explorer.\nOver time, the Spanish version \"Alcatraz\" became popular and is now widely used. In August 1827, for instance, French Captain Auguste Bernard Duhaut-Cilly wrote \"... running past Alcatraze\u0027s (Pelicans) Island ... covered with a countless number of these birds. A gun fired over the …","other":"เกาะอัลคาทราซ"}},{"th":{"title":"กริชตูเรเดงโตร์","url":"https://th.wikipedia.org/wiki/%E0%B8%81%E0%B8%A3%E0%B8%B4%E0%B8%8A%E0%B8%95%E0%B8%B9%E0%B9%80%E0%B8%A3%E0%B9%80%E0%B8%94%E0%B8%87%E0%B9%82%E0%B8%95%E0%B8%A3%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Cristo_Redentor_-_Rio_de_Janeiro%2C_Brasil.jpg/960px-Cristo_Redentor_-_Rio_de_Janeiro%2C_Brasil.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"กริชตูเรเดงโตร์ (โปรตุเกส: Cristo Redentor; อังกฤษ: Christ the Redeemer พระคริสต์ผู้ไถ่) เป็นอลังการประติมากรรมพระเยซูในรีโอเดจาเนโร ประเทศบราซิล ออกแบบโดยปอล ลันดอฟสกี ประติมากรชาวฝรั่งเศสเชื้อสายโปแลนด์ และเอโตร์ ดา ซิลวา กอชตา (Heitor da Silva Costa) วิศวกรชาวบราซิลดำเนินการสร้างร่วมกับ Albert Caquot วิศวกรชาวฝรั่งเศส Gheorghe Leonida ประติมากรชาวโรมาเนีย เป็นผู้ก่อใบหน้า ประติมากรรมนี้สร้างขึ้นในช่วง ค.ศ.","history":"ตอนแรก Pedro Maria Boss บักบวชคณะวินเซนต์ เสนอแนะให้ตั้งอนุสรณ์ศาสนาคริสต์บนเขากอร์โกวาดูในช่วงกลางคริสต์ทศวรรษ 1850 เพื่ออุทิศแด่เจ้าหญิงอิซาเบล ผู้สำเร็จราชการแทนพระองค์ของบราซิล และพระราชธิดาในจักรพรรดิเปดรูที่ 2 แห่งบราซิล แต่โครงการไม่ได้รับการรับรอง ใน ค.ศ. 1889 เมื่อประเทศนี้กลายเป็นสาธารณรัฐ และถือแนวคิดการแยกศาสนจักรกับอาณาจักร รูปปั้นที่เสนอนี้จึงถูกยกเลิก","other":"Christ the Redeemer (statue)"},"en":{"title":"Christ the Redeemer (statue)","url":"https://en.wikipedia.org/wiki/Christ_the_Redeemer_(statue)","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Christ_the_Redeemer_-_Cristo_Redentor.jpg/960px-Christ_the_Redeemer_-_Cristo_Redentor.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Christ the Redeemer (Portuguese: Cristo Redentor, standard Brazilian Portuguese: [ˈkɾistu ʁedẽˈtoʁ]) is an Art Deco statue of Jesus in Rio de Janeiro, Brazil, created by French-Polish sculptor Paul Landowski and built by Brazilian engineer Heitor da Silva Costa, in collaboration with French engineer Albert Caquot and Romanian sculptor Gheorghe Leonida who sculpted the face. Constructed between 1922 and 1931, the statue is 30 metres (98 ft) high, excluding its 8-metre (26 ft) pedestal, and faces east. The arms stretch 28 metres (92 ft) wide.","history":"Vincentian priest Pedro Maria Boss first suggested placing a Christian monument on Mount Corcovado in the mid-1850s to honor Princess Isabel, regent of Brazil and the daughter of Emperor Pedro II, but the project was not approved. In 1889, the country became a republic, and owing to the separation of church and state, the proposed statue was dismissed.\nThe Catholic Circle of Rio made a second proposal for a landmark statue on the mountain in 1920. The group organized an event called Semana do Monumento (\"Monument Week\") to attract donations and collect signatures to support the building of the statue. The organization was motivated by what they perceived as \"Godlessness\" in the society. The donations came mostly from Brazilian Catholics. The designs considered for the \"Statue of the Christ\" included a representation of the Christian cross, a statue of Jesus with a globe in his hands, and a pedestal symbolizing the world. Eventually, the statue of Christ the Redeemer with open arms, a symbol of peace, was chosen.\nLocal engineer Heitor da Silva Costa and artist Carlos Oswald designed …","other":"กริชตูเรเดงโตร์"}},{"th":{"title":"โขดหินอุลูรู","url":"https://th.wikipedia.org/wiki/%E0%B9%82%E0%B8%82%E0%B8%94%E0%B8%AB%E0%B8%B4%E0%B8%99%E0%B8%AD%E0%B8%B8%E0%B8%A5%E0%B8%B9%E0%B8%A3%E0%B8%B9","img":null,"intro":"โขดหินอุลูรู (อังกฤษ: Uluru, ; Pitjantjatjara: Uluṟu [ˈʊlʊɻʊ]) หรือเรียกอีกอย่างได้ว่า หินแอร์ซ (Ayers Rock, ) และระบุอย่างเป็นทางการเป็น อุลูรู  /  หินแอร์ซ เป็นหินทรายขนาดใหญ่","history":"โขดหินอุลูรู (อังกฤษ: Uluru, ; Pitjantjatjara: Uluṟu [ˈʊlʊɻʊ]) หรือเรียกอีกอย่างได้ว่า หินแอร์ซ (Ayers Rock, ) และระบุอย่างเป็นทางการเป็น อุลูรู  /  หินแอร์ซ เป็นหินทรายขนาดใหญ่\nโขดหินอุลูรู ตั้งอยู่ในตอนกลางของประเทศออสเตรเลีย เป็นโขดหินขนาดใหญ่ที่โผล่จากพื้นดินโดดๆซึ่งสามารถมองเห็นได้ไกลกว่า 100 กิโลเมตร มีขนาดความสูง 348 เมตร เส้นรอบวงที่ฐานวัดได้ 9 กิโลเมตร จัดได้ว่าเป็นโขดหินที่ใหญ่ทีสุดในโลก ลักษณะเป็นหินทรายสีแดงเป็นหินอาร์โคส มีปริมาณแร่ฟันม้าหรือแร่เฟลด์สปาร์อยู่มาก มีสภาพการกัดเซาะของฝนและลมตามธรรมชาติ มีถ้ำและแอ่งน้ำ บริเวณผิวนอกของหินโดนความร้อนจากแสงอาทิตย์ ทำให้เกินผิวนอกแตกหลุดออกเป็นสะเก็ดและร่วมลงมาที่พื้นทับถมกันเป็นกำแพงภูเขาขนาดใหญ่ สีสันของหินเปลี่ยนแปลงตามเวลาซึ่งในแต่ละช่วงมีสีแตกต่างกัน ในตอนกลางวันแสงอาทิตย์เจิดจ้าทำให้มีแดง แต่พอตกเย็นสีสันจะเปลี่ยนเป็นสีม่วง","other":"Uluru"},"en":{"title":"Uluru","url":"https://en.wikipedia.org/wiki/Uluru","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/ULURU.jpg/960px-ULURU.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Uluru (; Pitjantjatjara: Uluṟu [ˈʊlʊɻʊ]), also known as Ayers Rock ( AIRS) and officially gazetted as Uluru / Ayers Rock, is a large sandstone monolith. It crops out near the centre of Australia in the southern part of the Northern Territory, 335 km (208 mi) south-west of Alice Springs.\nUluru is sacred to the Pitjantjatjara, the Aboriginal people of the area, one of the groups collectively known as the Aṉangu.","history":"Archaeological findings to the east and west indicate that humans settled in the area more than 10,000 years ago.\nEuropeans arrived in the Australian Western Desert in the 1870s. Uluru and Kata Tjuta were first mapped by Europeans in 1872 during the expeditionary period, which was made possible by the construction of the Australian Overland Telegraph Line. In separate expeditions, Ernest Giles and William Gosse were the first European explorers to this area. While exploring the area in 1872, Giles sighted Kata Tjuta from a location near Kings Canyon and called it Mount Olga, while the following year Gosse observed Uluru and named it Ayers\u0027 Rock, in honour of the Chief Secretary of South Australia, Sir Henry Ayers.\nFurther explorations followed with the aim of establishing the possibilities of the area for pastoralism. In the late 19th century, pastoralists attempted to establish themselves in areas adjoining the Southwestern/Petermann Reserve and interaction between Aṉangu and white people became more frequent and more violent. Due to the effects of grazing and drought, bush food …","other":"โขดหินอุลูรู"}},{"th":{"title":"มหาวิหารนักบุญเบซิล","url":"https://th.wikipedia.org/wiki/%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3%E0%B8%99%E0%B8%B1%E0%B8%81%E0%B8%9A%E0%B8%B8%E0%B8%8D%E0%B9%80%E0%B8%9A%E0%B8%8B%E0%B8%B4%E0%B8%A5","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Saint_Basil%27s_Cathedral%2C_Red_Square%2C_Moscow%2C_Russia.jpg/960px-Saint_Basil%27s_Cathedral%2C_Red_Square%2C_Moscow%2C_Russia.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"มหาวิหารนักบุญเบซิล (รัสเซีย: Собор Василия Блаженного) เป็นอาสนวิหารของศาสนจักรออร์โธดอกซ์รัสเซีย ตั้งอยู่ที่จัตุรัสแดง กรุงมอสโก ประเทศรัสเซีย สร้างโดยซาร์อีวานที่ 4 แห่งรัสเซีย หรือซาร์อีวานจอมโหด เพื่อฉลองชัยชนะเหนือพวกมองโกลที่กรีธาทัพมาเมืองคาซัน เมื่อปี ค.ศ. 1552 ผลจากชัยชนะครั้งนี้ทำให้รัสเซียสามารถรวมชาติได้เป็นปึกแผ่น จึงสร้างมหาวิหารแห่งนี้ขึ้นเมื่อปี ค.ศ.","history":"มหาวิหารนักบุญเบซิล (รัสเซีย: Собор Василия Блаженного) เป็นอาสนวิหารของศาสนจักรออร์โธดอกซ์รัสเซีย ตั้งอยู่ที่จัตุรัสแดง กรุงมอสโก ประเทศรัสเซีย สร้างโดยซาร์อีวานที่ 4 แห่งรัสเซีย หรือซาร์อีวานจอมโหด เพื่อฉลองชัยชนะเหนือพวกมองโกลที่กรีธาทัพมาเมืองคาซัน เมื่อปี ค.ศ. 1552 ผลจากชัยชนะครั้งนี้ทำให้รัสเซียสามารถรวมชาติได้เป็นปึกแผ่น จึงสร้างมหาวิหารแห่งนี้ขึ้นเมื่อปี ค.ศ. 1555 เดิมทีมหาวิหารเซนต์บาซิล เป็นเพียงโบสถ์ขนาดเล็กที่บรรจุศพของนักบุญวาซิลีหรือนักบุญบาซิล\nมหาวิหารเซนต์บาซิลมีรูปทรงที่ไม่เหมือนโบสถ์อื่น คือมีโดม 8 โดมล้อมรอบโดมที่ 9 ที่อยู่ตรงกลาง ทำให้อาคารมีรูปทรงแปดเหลี่ยม ด้วยสถาปัตยกรรมที่ผสมผสานระหว่างสถาปัตยกรรมแบบรัสเซียโบราณอันได้รับอิทธิพลมาจากไบแซนไทน์ที่เป็นโดมทรงหัวหอมกับสถาปัตยกรรมที่เรียกกันว่ารัสเซียนกอธิก หอคอยสูงรูปกระโจมเป็นอิทธิพลจากยุโรปตะวันตก ผลลัพธ์ที่ออกมาจึงกลายเป็นหอคอยสูงรูปแท่งเทียนกำลังลุกไหม้บนปลายลำเทียน ส่งความโชติช่วงชัชวาลย์เป็นเครื่องบูชาเทพเจ้าบนสวรรค์  \nมหาวิหารนี้ได้รับการออกแบบโดยสถาปนิกชื่อปอสต์นิก ยากอฟเลฟ (Postnik Yakovlev) และด้วยความงดงามของสถาปัตยกรรมจึงทำให้มีเรื่องเล่าสืบต่อกันว่า ซาร์อีวานที่ 4 …","other":"Saint Basil\u0027s Cathedral"},"en":{"title":"Saint Basil\u0027s Cathedral","url":"https://en.wikipedia.org/wiki/Saint_Basil%27s_Cathedral","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Saint_Basil%27s_Cathedral_in_Moscow.jpg/960px-Saint_Basil%27s_Cathedral_in_Moscow.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Cathedral of Vasily the Blessed (Russian: Собор Василия Блаженного, romanized: Sobor Vasiliya Blazhennogo), commonly known as Saint Basil\u0027s Cathedral, is a Russian Orthodox church on Red Square in the historic centre of Moscow. It is one of the most popular cultural symbols of Russia. The building, now a museum, is officially known as the Cathedral of the Intercession of the Most Holy Theotokos on the Moat, or Pokrovsky Cathedral.","history":"The site of the church had historically been a busy marketplace between the St. Frol\u0027s (later Saviour\u0027s) Gate of the Moscow Kremlin and the outlying posad. The centre of the marketplace was marked by the Trinity Church, built of the same white stone as the Kremlin of Dmitry Donskoy (1366–68) and its cathedrals. Tsar Ivan IV marked every victory of the Russo-Kazan War by erecting a wooden memorial church next to the walls of Trinity Church; by the end of his Astrakhan campaign, it was shrouded within a cluster of seven wooden churches. According to the report in Nikon\u0027s Chronicle, in the autumn of 1554 Ivan ordered the construction of the wooden Church of Intercession on the same site, \"on the moat\". One year later, Ivan ordered the construction of a new stone cathedral on the site of Trinity Church to commemorate his campaigns. Dedication of a church to a military victory was \"a major innovation\" for Muscovy. The placement of the church outside the Kremlin walls was a political statement in favour of posad commoners and against hereditary boyars.\nContemporary commentators clearly …","other":"มหาวิหารนักบุญเบซิล"}},{"th":{"title":"ชเต็ฟฟันส์โดม","url":"https://th.wikipedia.org/wiki/%E0%B8%8A%E0%B9%80%E0%B8%95%E0%B9%87%E0%B8%9F%E0%B8%9F%E0%B8%B1%E0%B8%99%E0%B8%AA%E0%B9%8C%E0%B9%82%E0%B8%94%E0%B8%A1","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Wien_-_Stephansdom_%281%29.JPG/960px-Wien_-_Stephansdom_%281%29.JPG?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อาสนวิหารนักบุญสเทเฟน หรือ  ชเต็ฟฟันส์โดม (เยอรมัน: Stephansdom, อังกฤษ: St. Stephen\u0027s Cathedral) เป็นอาสนวิหารโรมันคาทอลิกในอัครมุขมณฑลเวียนนา และเป็นที่ตั้งอาสนะของอาร์ชบิชอปแห่งเวียนนา ตัวอาสนวิหารตั้งอยู่ใจกลางกรุงเวียนนา ประเทศออสเตรีย สถาปัตยกรรมที่เห็นอยู่ในปัจจุบันเป็นแบบโรมานเนสก์ และ กอทิก ริเริ่มโดยรูดอล์ฟที่ 4 ดยุกแห่งออสเตรีย โบสถ์ปัจจุบันตั้งอยู่บนซากโบสถ์เดิมที่สร้างก่อนหน้านั้นสองโบสถ์ โบสถ์แรกเป็นโบสถ์ประจำเขตแพริชที่ได้รับการเสกในปี ค.ศ.","history":"เมื่อมาถึงกลางคริสต์ศตวรรษที่ 12 เวียนนาก็กลายเป็นศูนย์กลางสำคัญของวัฒนธรรมเยอรมันของยุโรปตะวันออก และสี่โบสถ์ที่มีอยู่ก็ไม่เพียงพอที่จะตอบรับความต้องการทางศาสนาของประชาชนในเมือง ในปี ค.ศ. 1137 เรจินมาร์บิชอปแห่งพัสเซา และ เลโอโพลด์ที่ 4 ดยุกแห่งบาวาเรียลงนามในสนธิสัญญามอเทิร์นที่กล่าวถึงเวียนนาว่าเป็น “Civitas” เป็นครั้งแรก และย้ายโบสถ์นักบุญเปโตร เวียนนาไปขึ้นกับมุขมณฑลพัสเซา ในข้อตกลงของสนธิสัญญาเลโอโพลด์ได้รับดินแดนเลยออกไปจากตัวกำแพงเมืองด้วยยกเว้นดินแดนที่ระบุว่าเป็นของโบสถ์ประจำเขตแพริชที่ต่อมาคือที่ดินที่ตั้งอาสนวิหารนักบุญสเทเฟน แม้ว่าเดิมจะเชื่อกันว่าเป็นโบสถ์ที่สร้างในทุ่งนอกกำแพงเมือง แต่โบสถ์ใหม่ความจริงแล้วน่าจะสร้างบนสุสานโบราณที่มีมาตั้งแต่สมัยโรมันโบราณ การขุดหาระบบทำความร้อนในปี ค.ศ. 2000 พบว่ามีหลุมศพลึกลงไปจากพื้นผิวปัจจุบัน 2.5 เมตรที่เมื่อทำการหาอายุจากคาร์บอนกัมมันตรังสี (Radiocarbon dating) แล้วก็พบว่ามีอายุจากคริสต์ศตวรรษที่ 4 การพบครั้งนี้ทำให้ทราบว่าแม้ตัววัดเดิมก็ยังสร้างก่อนโบสถ์รูเพรชท์ (Ruprechtskirche) ที่กล่าวกันว่าเป็นโบสถ์ที่เก่าที่สุดในเวียนนา\nก่อตั้งขึ้นในปี ค.ศ. 1137 หลังจากการตกลงในสนธิสัญญามอเทิร์น …","other":"St. Stephen\u0027s Cathedral, Vienna"},"en":{"title":"St. Stephen\u0027s Cathedral, Vienna","url":"https://en.wikipedia.org/wiki/St._Stephen%27s_Cathedral,_Vienna","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Wien_-_Stephansdom_%281%29.JPG/960px-Wien_-_Stephansdom_%281%29.JPG?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"St. Stephen\u0027s Cathedral (German: Domkirche St. Stephan [ˈdɔmˌkɪʁçə ˈzaŋkt ˈʃ͡tɛfan] also known as Stephansdom German pronunciation: [ˈʃ͡tɛfansˌdoːm]) is a Roman Catholic church in Vienna, Austria, and the mother church of the Archdiocese of Vienna.","history":"By the middle of the 12th century, Vienna had become an important municipal centre, and the four existing churches, including only one parish church, no longer met the town\u0027s religious needs. In 1137, Bishop of Passau Reginmar and Margrave Leopold IV signed the Treaty of Mautern, which referred to Vienna as a civitas for the first time and transferred St. Peter\u0027s Church to the Diocese of Passau. Under the treaty, Margrave Leopold IV also received from the bishop extended stretches of land beyond the city walls, with the notable exception of the territory allocated for the new parish church, which would eventually become St. Stephen\u0027s Cathedral. Although previously believed built in an open field outside the city walls, the new parish church was in actuality likely built on an ancient cemetery dating to Ancient Roman times; excavations for a heating system in 2000 revealed graves 2.5 metres (8.2 ft) below the surface, which were carbon-dated to the 4th century. This discovery suggests that an even older religious building on this site predated the St. Rupert\u0027s Church, which is …","other":"ชเต็ฟฟันส์โดม"}},{"th":null,"en":{"title":"Basilica of the Holy Blood","url":"https://en.wikipedia.org/wiki/Basilica_of_the_Holy_Blood","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Basilica_of_the_Holy_Blood_-_Saint-Baselius_Chapel%2C_Bruges%2C_Belgium..jpg/960px-Basilica_of_the_Holy_Blood_-_Saint-Baselius_Chapel%2C_Bruges%2C_Belgium..jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Basilica of the Holy Blood (Dutch: Heilig-Bloedbasiliek) is a Roman Catholic basilica in Bruges, Belgium. The church houses a relic of the Holy Blood that was, according to tradition, collected by Joseph of Arimathea and brought from the Holy Land by Thierry of Alsace, Count of Flanders. Built between 1134 and 1157 as the chapel of the Count of Flanders, it was promoted to a minor basilica in 1923.","history":"In 1134, Thierry of Alsace decided to build a private double chapel next to the Oud Steen, the first residence of the Counts of Flanders, transformed today into the town hall of Bruges. Thierry went on crusade a second time in 1147 during the Second Crusade. According to the tradition, Thierry of Alsace returned to his capital Bruges on April 7, 1150, with the relic of the Precious Blood. During the first half of the 13th century, the name of the upper chapel was changed to the Chapel of the Holy Blood.","other":null}},{"th":null,"en":{"title":"Meteora","url":"https://en.wikipedia.org/wiki/Meteora","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/Meteora%27s_monastery_2.jpg/960px-Meteora%27s_monastery_2.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Meteora (; Greek: Μετέωρα, pronounced [meˈteora]) is a rock formation in the regional unit of Trikala, in Thessaly, in northwestern Greece, hosting one of the most prominent complexes of Eastern Orthodox monasteries, viewed locally as second in importance only to Mount Athos. Their height is more than 20 metres (66 ft).\nTwenty-four monasteries were established atop the giant natural pillars and hill-like rounded boulders that dominate the local area, mainly from the second half of the 14th century under the local rule of self-proclaimed Emperor of Serbs, Greeks and Albanians, Simeon Uroš.","history":"Theopetra Cave is located 4 kilometres (2.5 mi) from Kalambaka. Its uniqueness from an archeological perspective is that a single site contains records of two greatly significant cultural transitions: the replacement of Neanderthals by modern humans and later, the transition from hunting-gathering to farming after the end of the last Ice Age. The cave consists of an immense 500 square metres (5,400 sq ft) rectangular chamber at the foot of a limestone hill, which rises to the northeast above the village of Theopetra, with an entrance 17 metres (56 ft) wide by 3 metres (9.8 ft) high. It lies at the foot of the Chasia mountain range, which forms the natural boundary between Thessaly and Macedonia regions, while the Lithaios River, a tributary of the Pineios River, flows in front of the cave. The small Lithaios River flowing literally on the doorsteps of the cave meant that cave dwellers always had easy access to fresh, clean water without the need to cover daily long distances to find it.\nCaves in the vicinity of Meteora were inhabited continuously between 50,000 and 5,000 years ago. …","other":null}},{"th":{"title":"เกอเรแม","url":"https://th.wikipedia.org/wiki/%E0%B9%80%E0%B8%81%E0%B8%AD%E0%B9%80%E0%B8%A3%E0%B9%81%E0%B8%A1","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Autumn_in_G%C3%B6reme_Valley.jpg/960px-Autumn_in_G%C3%B6reme_Valley.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"เกอเรแม (ตุรกี: Göreme, ออกเสียง: [ɟœˈɾeme]; กรีกโบราณ: Κόραμα, อักษรโรมัน: Kòrama) เป็นเมืองที่ตั้งอยู่ในบริเวณแคปพาโดเชียในตอนกลางของอานาโตเลียในประเทศตุรกี โดยมีประชากรประมาณ 2,000 คน\nเกอเรแมเดิมชื่อ Korama, Matiana, Maccan หรือ Machan และ Avcilar เมื่อหุบเขาเกอเรแมที่ตั้งอยู่ไม่ไกลนักได้รับการขึ้นทะเบียนเป็นแหล่งมรดกโลก ชื่อเมืองก็ถูกเปลี่ยนมาเป็น \"เกอเรแม\" เพื่อความสะดวก\nอุทยานแห่งชาติเกอเรแม (ตุรกี: Göreme Milli Parklar) ไดัรับขึ้นทะเบียนเป็นแหล่งมรดกโลกโดยยูเนสโกใน พ.ศ.","history":"เกอเรแม (ตุรกี: Göreme, ออกเสียง: [ɟœˈɾeme]; กรีกโบราณ: Κόραμα, อักษรโรมัน: Kòrama) เป็นเมืองที่ตั้งอยู่ในบริเวณแคปพาโดเชียในตอนกลางของอานาโตเลียในประเทศตุรกี โดยมีประชากรประมาณ 2,000 คน\nเกอเรแมเดิมชื่อ Korama, Matiana, Maccan หรือ Machan และ Avcilar เมื่อหุบเขาเกอเรแมที่ตั้งอยู่ไม่ไกลนักได้รับการขึ้นทะเบียนเป็นแหล่งมรดกโลก ชื่อเมืองก็ถูกเปลี่ยนมาเป็น \"เกอเรแม\" เพื่อความสะดวก\nอุทยานแห่งชาติเกอเรแม (ตุรกี: Göreme Milli Parklar) ไดัรับขึ้นทะเบียนเป็นแหล่งมรดกโลกโดยยูเนสโกใน พ.ศ. 2528 \nเกอเรแมตั้งอยู่ในบริเวณที่เป็นที่ตั้งถิ่นฐานของผู้คนมาตั้งแต่สมัยโรมัน และเป็นที่ที่ชาวคริสเตียนยุคแรกใช้ในการเป็นที่หลบหนีภัยจากการไล่ทำร้ายและสังหารก่อนที่คริสต์ศาสนาจะเป็นศาสนาที่ได้รับการประกาศว่าเป็นศาสนาของจักรวรรดิ ที่จะเห็นได้จากคริสต์ศาสนสถานจำนวนมากมายที่ตั้งอยู่ในบริเวณนี้","other":"Göreme"},"en":{"title":"Göreme","url":"https://en.wikipedia.org/wiki/G%C3%B6reme","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/G%C3%B6reme_town_and_valley_2015.JPG/960px-G%C3%B6reme_town_and_valley_2015.JPG?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Göreme (Turkish: [ɟœˈɾeme]; Ancient Greek: Κόραμα, romanized: Kòrama) is a town (belde) in the Nevşehir District, Nevşehir Province in Central Anatolia, Turkey. Its population is 2,034 (2022). It is well known for its fairy chimneys (Turkish: peribacalar), eroded rock formations, many of which were hollowed out in the Middle Ages to create Christian churches, houses and underground cities.","history":"Göreme was an important centre of early Christianity. Very little is known about Göreme\u0027s history until modern times in part because it was a small settlement away from the more travelled main roads linking Kayseri to Konya and the Mediterranean coast to Aksaray. The village contains several pillared tombs believed to date back to Roman times. In Byzantine times what is now Göreme was actually two separate but adjacent villages: Korama (Greek: Κόραμα) where the modern Open Air Museum can be found, and Matiana/Macan (Μάτιανα) where the modern village is. The first written record of Matiana and Korama appears in the proceedings of the Council of Chalcedon in 451 which was attended by representatives of both the settlements. A Life of St Hieron, the patron saint of Göreme, written in the sixth century nevertheless refers to events in the third century and offers the first mention of villagers living in cave houses. Some of the simpler cave churches around the village date from the sixth and seventh centuries, others from the tenth and eleventh centuries which is also when many of the …","other":"เกอเรแม"}},{"th":null,"en":{"title":"Library of Celsus","url":"https://en.wikipedia.org/wiki/Library_of_Celsus","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/84/Ephesus_Celsus_Library_Fa%C3%A7ade.jpg/960px-Ephesus_Celsus_Library_Fa%C3%A7ade.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Library of Celsus (Greek: Βιβλιοθήκη του Κέλσου) is an ancient Roman building in Ephesus, Anatolia, located near the modern town of Selçuk, in the İzmir Province of western Turkey. The building was commissioned in the years 110s CE by a consul of the Roman Empire, Tiberius Julius Aquila Polemaeanus, as a funerary monument for his father Tiberius Julius Celsus Polemaeanus, former proconsul of Asia, and completed during the reign of the Roman Emperor Hadrian, sometime after Aquila\u0027s death.\nThe Library of Celsus is considered an architectural marvel, and is one of the few remaining examples of great libraries of the ancient world located in the Roman Empire.","history":"Celsus enjoyed a successful military and political career, having served as a commander in the Roman army before being elected to serve as a consul for the Roman Empire in 92 CE. Celsus, a Romanized Greek native of Sardis or Ephesus who belonged to a family of priests of Rome, was one of the first men from the Greek-speaking eastern provinces of the Roman Republic to serve as a consul, the highest elected office in Imperial Rome. He may have been the first Greek to become a Roman senator, however there is scholarly debate that this may or may not be true. He was later appointed as proconsul, or governor, of Asia, the Roman province that covered roughly the same area as modern-day Turkey. Celsus served as a Roman senator, consul, and praetor, rising through the ranks very quickly. He then retired and returned to Ephesus, his home.\nAfter Celsus\u0027 death, his son Tiberius Julius Aquila Polemaeanus commissioned the library in his father\u0027s honor, using Greek and Roman techniques. However, it was not completed until after Aquila\u0027s death. An inscription records that Celsus left a large …","other":null}},{"th":{"title":"เปร์เซโปลิส","url":"https://th.wikipedia.org/wiki/%E0%B9%80%E0%B8%9B%E0%B8%A3%E0%B9%8C%E0%B9%80%E0%B8%8B%E0%B9%82%E0%B8%9B%E0%B8%A5%E0%B8%B4%E0%B8%AA","img":"https://upload.wikimedia.org/wikipedia/commons/3/39/Gate_of_All_Nations%2C_Persepolis.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"เปร์เซโปลิส (กรีกโบราณ: Περσέπολις; เปอร์เซียเก่า: 𐎱𐎠𐎼𐎿; เปอร์เซียใหม่: تخت جمشید) เป็นเมืองหลวงในนามของจักรวรรดิอะคีเมนิด (ประมาณ 550–330 ปีก่อนคริสต์ศักราช) ตั้งอยู่ในที่ราบของเมืองแมร์ฟแดชต์ ซากปรักหักพังที่เก่าแก่ที่สุดที่มีการค้นพบมีอายุย้อนกลับไปถึง 515 ปีก่อนคริสต์ศักราช หมู่โบราณสถานแห่งเปร์เซโปลิสเป็นหลักฐานชิ้นสำคัญของสถาปัตยกรรมอะคีเมนิด ยูเนสโกประกาศให้ซากปรักหักพังแห่งเปร์เซโปลิสเป็นแหล่งมรดกโลกในปี 1979","history":"เปร์เซโปลิส (กรีกโบราณ: Περσέπολις; เปอร์เซียเก่า: 𐎱𐎠𐎼𐎿; เปอร์เซียใหม่: تخت جمشید) เป็นเมืองหลวงในนามของจักรวรรดิอะคีเมนิด (ประมาณ 550–330 ปีก่อนคริสต์ศักราช) ตั้งอยู่ในที่ราบของเมืองแมร์ฟแดชต์ ซากปรักหักพังที่เก่าแก่ที่สุดที่มีการค้นพบมีอายุย้อนกลับไปถึง 515 ปีก่อนคริสต์ศักราช หมู่โบราณสถานแห่งเปร์เซโปลิสเป็นหลักฐานชิ้นสำคัญของสถาปัตยกรรมอะคีเมนิด ยูเนสโกประกาศให้ซากปรักหักพังแห่งเปร์เซโปลิสเป็นแหล่งมรดกโลกในปี 1979\n== อ้างอิง ==","other":"Persepolis"},"en":{"title":"Persepolis","url":"https://en.wikipedia.org/wiki/Persepolis","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/2018-09-21_Iran%2C_Persepolis%2C_Tachara_%28from_the_southeast%29.jpg/960px-2018-09-21_Iran%2C_Persepolis%2C_Tachara_%28from_the_southeast%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Persepolis or Parseh (Persian: پارسه, romanized: Pārseh; Old Persian: 𐎱𐎠𐎼𐎿, romanized: Pārsa), also known in modern Persian as Takht-e Jamshid (تخت جمشید, \"Throne of Jamshid\"), was the ceremonial capital of the Achaemenid Empire (c. 550–330 BC). It is situated in the plains of Marvdasht, encircled by the southern Zagros Mountains, in Fars province of Iran. It is one of the key Iranian cultural heritage sites and has been a UNESCO World Heritage Site since 1979.","history":"There are some indications that the site of Persepolis was already a government centre under Cyrus the Great and his son Cambyses II, but no archaeological traces of this older phase have been found. It was Darius I who created Persepolis as the splendid seat of the government of the Achaemenid Empire and as its centre for receptions and festivals. The earliest remains date back to 515 BC, and inscriptions on the buildings support the view that the terrace and the first palaces were built by Darius. Under his successors Xerxes I and Artaxerxes I the complex was extended in several building phases, and further buildings were added in the 4th century BC.\nWith Darius I, the sceptre passed to a new branch of the royal house. The administrative capitals of the empire were Susa, Babylon and Ecbatana. This may be why the Greeks were not acquainted with the city until Alexander the Great took and plundered it.\nDarius I\u0027s construction of Persepolis was carried out parallel to that of the Palace of Susa. According to Gene R. Garthwaite, the Susa Palace served as Darius\u0027 model for Persepolis. …","other":"เปร์เซโปลิส"}},{"th":{"title":"มู่เถียนยฺหวี","url":"https://th.wikipedia.org/wiki/%E0%B8%A1%E0%B8%B9%E0%B9%88%E0%B9%80%E0%B8%96%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B8%A2%E0%B8%BA%E0%B8%AB%E0%B8%A7%E0%B8%B5","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Great_Wall_of_China_July_2006.JPG/960px-Great_Wall_of_China_July_2006.JPG?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"มู่เถียนยฺหวี เป็นส่วนหนึ่งของกำแพงเมืองจีน ตั้งอยู่ในเขตหวยโหรว ภายในอาณาเขตของกรุงปักกิ่ง ห่างจากใจกลางเมืองไปทางตะวันออกเฉียงเหนือประมาณ 70 กิโลเมตร กำแพงเมืองจีนส่วนมู่เถียนยฺหวีเชื่อมต่อกับส่วนเจี้ยนโข่วทางทิศตะวันตกและเหลียนฮวาฉือทางทิศตะวันออก มู่เถียนยฺหวีเป็นหนึ่งในส่วนของกำแพงเมืองจีนที่ได้รับการอนุรักษ์ไว้ดีที่สุด ในอดีตเคยทำหน้าที่เป็นปราการด่านเหนือเพื่อปกป้องเมืองหลวงและสุสานหลวง","history":"กำแพงส่วนมู่เถียนยฺหวีสร้างขึ้นครั้งแรกในช่วงกลางคริสต์ศตวรรษที่ 6 ในสมัยราชวงศ์ฉีเหนือ ซึ่งมีอายุเก่าแก่กว่าส่วนปาต๋าหลิ่งที่เป็นที่รู้จักมากกว่า ในสมัยราชวงศ์หมิงภายใต้การควบคุมของแม่ทัพสวีต๋า ได้มีการเริ่มก่อสร้างกำแพงปัจจุบันทับบนแนวเนื่องกำแพงเดิม และในปี ค.ศ. 1404 ได้มีการสร้างด่านผ่านทางขึ้นบนกำแพง ต่อมาในปี ค.ศ. 1569 กำแพงเมืองจีนส่วนมู่เถียนยฺหวีได้รับการสร้างขึ้นใหม่ ซึ่งส่วนใหญ่ยังคงได้รับการอนุรักษ์ไว้อย่างดีจนถึงปัจจุบัน มู่เถียนยฺหวีถือเป็นส่วนที่มีขนาดโครงสร้างการก่อสร้างใหญ่ที่สุดและมีคุณภาพดีที่สุดในบรรดากำแพงเมืองจีนทุกส่วน\nในปี ค.ศ. 1568 จักรพรรดิหลงชิ่งทรงแต่งตั้งให้ชี จี้กวง เป็นผู้ว่าราชการและผู้บริหารฝ่ายทหารประจำภูมิภาคจี้โจว ฉางผิง และเป่าติ่ง เพื่อช่วยฝึกฝนทหารยามในพื้นที่ ชี จี้กวง ได้มีส่วนช่วยในการบำรุงรักษากำแพงเมืองจีนส่วนนี้เป็นระยะทางกว่า 2,000 ลี้ ซึ่งเสร็จสิ้นในปี ค.ศ. 1572 หลังจากที่ชี จี้กวง สังเกตเห็นว่ากำแพงไม่มีเชิงเทินหนุน เขาจึงเสนอให้มีการติดตั้งเชิงเทินหนุนแก่ข้าราชการและได้รับการอนุมัติ\nในปี ค.ศ. 1983 คณะรัฐมนตรีสาธารณรัฐประชาชนจีนได้อนุมัติการบูรณะกำแพงเมืองจีนส่วนมู่เถียนยฺหวี และในปี ค.ศ. 1985 …","other":"Mutianyu"},"en":{"title":"Mutianyu","url":"https://en.wikipedia.org/wiki/Mutianyu","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Great_Wall_of_China_July_2006.JPG/960px-Great_Wall_of_China_July_2006.JPG?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Mutianyu is a section of the Great Wall of China located in Huairou District within the city limits of Beijing 70 kilometers (43 mi) northeast of the center of the city. The Mutianyu section of the Great Wall is connected with Jiankou in the west and Lianhuachi in the east. As one of the best-preserved parts of the Great Wall, the Mutianyu section of the Great Wall used to serve as the northern barrier defending the capital and the imperial tombs.","history":"First built in the mid-6th century during the Northern Qi, the Mutianyu section is older than the better known Badaling section of the Great Wall. During the Ming dynasty, under the supervision of general Xu Da, construction of the present wall began, building over the previous wall. In 1404, a pass was built in the wall. In 1569, the Mutianyu Great Wall was rebuilt and still today most parts of it are well preserved. The Mutianyu Great Wall has the largest construction scale and best quality among all sections of Great Wall.\nIn 1568, the Longqing Emperor appointed Qi Jiguang as governor and military administrator of Jizhou, Changping and Baoding to help train the guards in the area. Qi Jiguang helped to maintain the 2000-li section of the Great Wall, which was finished in 1572. Qi Jiguang, upon noticing that the wall had no abutments, suggested the installation of abutments to officials. His suggestion was approved.\nIn 1983, the State Council of the People\u0027s Republic of China approved the restoration of the Mutianyu Great Wall. In 1985, the Huairou District local government …","other":"มู่เถียนยฺหวี"}},{"th":{"title":"พระราชวังโปตาลา","url":"https://th.wikipedia.org/wiki/%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%A3%E0%B8%B2%E0%B8%8A%E0%B8%A7%E0%B8%B1%E0%B8%87%E0%B9%82%E0%B8%9B%E0%B8%95%E0%B8%B2%E0%B8%A5%E0%B8%B2","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/49/Potala_-_panoramio_-_Matthew_Summerton_cropped.jpg/960px-Potala_-_panoramio_-_Matthew_Summerton_cropped.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"พระราชวังโปตาลา (ทิเบต: པོ་ཏ་ལ།, ไวลี: Po ta la, พินอินทิเบต: bodala) เป็นป้อมปราการแบบ ซง ในลาซ่า เขตปกครองตนเองทิเบต ประเทศจีน พระราชวังโปตาลาใช้งานเป็นที่ประทับฤดูหนาวของทะไลลามะมาตั้งแต่ปี 1649 ถึง 1959 หลังจากนั้นได้ถูกแปรสภาพมาเป็นพิพิธภัณฑ์ พระราชวังโปตาลาได้รับสถานะแหล่งมรดกโลกในปี 1994","history":"พระราชวังโปตาลา (ทิเบต: པོ་ཏ་ལ།, ไวลี: Po ta la, พินอินทิเบต: bodala) เป็นป้อมปราการแบบ ซง ในลาซ่า เขตปกครองตนเองทิเบต ประเทศจีน พระราชวังโปตาลาใช้งานเป็นที่ประทับฤดูหนาวของทะไลลามะมาตั้งแต่ปี 1649 ถึง 1959 หลังจากนั้นได้ถูกแปรสภาพมาเป็นพิพิธภัณฑ์ พระราชวังโปตาลาได้รับสถานะแหล่งมรดกโลกในปี 1994\nชื่อโปตาลานั้นตั้งตามเขาโปตาละกะ วิมานของพระโพธิสัตว์พระโพธิสัตว์อวโลกิเตศวรตามตำนาน การก่อสร้างเริ่มต้นขึ้นโดยทาไลลามะที่ห้า ในปี 1645 หลังที่ปรึกษาทางจิตวิญญาณส่วนพระองค์คนหนึ่ง Konchog Chophel (?-1646) ชี้ให้เห็นว่าพื้นที่ตรงนี้เหมาะสมแก่การเป็นที่ทำการรัฐ และตั้งอยู่ระหว่างอารามเทรปุง กับอารามเซรา และ เมืองเก่าลาซ่า เป็นไปได้ว่าวังนี้สร้างขึ้นบนซากของป้อมปราการเก่าที่มีชื่อว่าวังขาว หรือวังแดง ซึ่งสร้างขึ้นโดยพระเจ้าซงแจ็นกัมโป ในปี 637\nอาคารมีขนาด 400 เมตร (1,300 ฟุต) ตามแนวตะวันออก-ตะวันตก และ 350 เมตร (1,150 ฟุต) ตามแนวเหนือ-ใต้, ผนังหินขนาดหนาราว 3 เมตร (9.8 ฟุต) และที่ฐานหนาถึง 5 เมตร (16 ฟุต) ในส่วนฐานของวังยังมีการเททองแดงผสมลงไปเพื่อช่วยป้องกันอาคารจากแผ่นดินไหว อาคารมีความสูง 13 ชั้น ประกอบด้วยห้องหับกว่า 1,000 ห้อง, ศาลเจ้าต่าง ๆ 10,000 ศาล และรูปปั้นรวมกว่า 200,000 รูป …","other":"Potala Palace"},"en":{"title":"Potala Palace","url":"https://en.wikipedia.org/wiki/Potala_Palace","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/Potala_Palace_HQ.jpg/960px-Potala_Palace_HQ.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Potala Palace (Tibetan: ཕོ་བྲང་པོ་ཏ་ལ་, Wylie: pho brang po ta la; simplified Chinese: 布达拉宫; traditional Chinese: 布達拉宮; pinyin: Bùdálā Gōng) is a museum complex in Lhasa, the capital of the Tibet Autonomous Region of China. It was formerly the winter palace of the Dalai Lamas, and from 1649 until 1959 served as the Dalai Lamas\u0027 residence. The palace complex became a museum following the annexation of Tibet by the People\u0027s Republic of China.","history":"The Dalai Lama inhabited an estate at Drepung Monastery known as Ganden Podrang. During 1621 Lhasa was made the jurisdiction of Ganden Podrang by Tsang. During the third month of 1642 Gushri Khan Dhamma King, Holder of the Faith, had taken from the  Sde-srid Tsang-pa regime of the Garma Gagyu Sect   (Tsang) by military forces the places in Tibet, which was the Land of Wooden Doors, held by that governship; and then offered the thirteen parts of Tibet, which is the whole, to the Dalai Lama.  On the fifth day of the fourth month of the Water-Horse year in the 11th cycle the Dalai Lama was made sovereign of Tibet on the golden fearless snow lion throne. Sometime during or soon after 1644, the Dalai Lama, the then regent of Ganden Podrang,  and Gushri Khan all decided to build a palace.\nThe Potala is built on the site of palace Songtsen Gampo on the Red Hill. The Potala contains two chapels on its northwest corner that conserve parts of the earlier palace. One is the Phakpa Lhakhang, the other the Chogyel Drupuk, a recessed cavern identified as Songtsen Gampo\u0027s meditation cave. Ngawang …","other":"พระราชวังโปตาลา"}},{"th":{"title":"อานานดาพะย่า","url":"https://th.wikipedia.org/wiki/%E0%B8%AD%E0%B8%B2%E0%B8%99%E0%B8%B2%E0%B8%99%E0%B8%94%E0%B8%B2%E0%B8%9E%E0%B8%B0%E0%B8%A2%E0%B9%88%E0%B8%B2","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b5/Ananda_Temple_2.jpg/960px-Ananda_Temple_2.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อานานดาพะย่า, วัดอนันดา หรือ วัดอานนท์ (พม่า: အာနန္ဒာဘုရား, ออกเสียง: [ànàɰ̃dà pʰəjá]) คือมหาวิหารขนาดใหญ่ที่ตั้งอยู่ในเมืองพุกาม ประเทศพม่า เริ่มสร้างขึ้นใน พ.ศ. 1633 แล้วเสร็จในปีต่อมา ในรัชกาลพระเจ้าจานซิต้า มีความสำคัญในฐานะได้รับการยกย่องว่าเป็น \"เพชรน้ำเอกของพุทธศิลป์สกุลช่างพุกาม\" เมื่อก่อนยอดพระเจดีย์ยังเป็นสีขาวเหมือนกับพระเจดีย์องค์อื่น ๆ ของพุกาม แต่รัฐบาลพม่าได้มาทาสีทองทับเมื่อ พ.ศ.","history":"อานานดาพะย่า, วัดอนันดา หรือ วัดอานนท์ (พม่า: အာနန္ဒာဘုရား, ออกเสียง: [ànàɰ̃dà pʰəjá]) คือมหาวิหารขนาดใหญ่ที่ตั้งอยู่ในเมืองพุกาม ประเทศพม่า เริ่มสร้างขึ้นใน พ.ศ. 1633 แล้วเสร็จในปีต่อมา ในรัชกาลพระเจ้าจานซิต้า มีความสำคัญในฐานะได้รับการยกย่องว่าเป็น \"เพชรน้ำเอกของพุทธศิลป์สกุลช่างพุกาม\" เมื่อก่อนยอดพระเจดีย์ยังเป็นสีขาวเหมือนกับพระเจดีย์องค์อื่น ๆ ของพุกาม แต่รัฐบาลพม่าได้มาทาสีทองทับเมื่อ พ.ศ. 2533 เพื่อสมโภชการสร้างอานานดาพะย่าครบรอบ 900 ปี\nอานานดาพะย่าเป็นพระเจดีย์ที่สามารถเดินเข้าไปข้างในได้ แผนผังเป็นรูปสี่เหลี่ยมจตุรัสมีมุขยื่น 4 ทิศ ประตูทางเข้าเป็นประตูโค้ง (arch) ที่มักพบเห็นในสถาปัตยกรรมตะวันตกมากกว่าตะวันออก ภายในประดิษฐานพระพุทธรูปประทับยืนไม้ปิดทอง สี่ทิศ สี่องค์ สูง 9.5 เมตร ประกอบด้วย \nพระกกุสันธพุทธเจ้า ประจำทิศเหนือ (องค์เดิม แท้จริงแล้วประจำทิศตะวันออก)\nพระโกนาคมนพุทธเจ้า ประจำทิศตะวันออก (สร้างใหม่)\nพระกัสสปพุทธเจ้า ประจำทิศใต้ (องค์เดิม)\nพระโคตมพุทธเจ้า ประจำทิศตะวันตก (สร้างใหม่)\nพุทธศิลป์แบบนี้ยังสมารถพบเห็นได้ตามวัดสถาปัตยกรรมล้านนา เช่น วัดภูมินทร์ จังหวัดน่าน เป็นต้น","other":"Ananda Temple"},"en":{"title":"Ananda Temple","url":"https://en.wikipedia.org/wiki/Ananda_Temple","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fd/Bagan%2C_Myanmar%2C_Ananda_Temple.jpg/960px-Bagan%2C_Myanmar%2C_Ananda_Temple.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Ananda Temple (Burmese: အာနန္ဒာ ဘုရား, pronounced [ànàɰ̃dà pʰəjá]), located in Bagan, Myanmar is a Buddhist temple built in 1105 AD during the reign (1084–1112/13) of King Kyansittha (Hti-Hlaing Min) of the Pagan Dynasty. The temple layout is  cruciform with several terraces leading to a small pagoda at the top covered by an umbrella known as hti, which is the name of the umbrella or top ornament found in almost all pagodas in Myanmar. The Buddhist temple houses four standing Buddha statues, each one facing the cardinal direction of East, North, West and South.","history":"History of this perfectly dimensioned temple structure built in 1105 is credited to King Kyansittha. It denotes \"the stylistic end of the Early Bagan period and the beginning of the Middle period\". The timing of building this temple is considered as a culmination of religious education that began during the Pahothanya temple building activity in 1080 AD. The Theravada Buddhism adopted by the King motivated him to present the teachings of Buddha to his people in an accurate and a genuine way through the medium of this temple, to unite Burma under one flag and thus \"creating mass religious enthusiasm\". It has been inferred that the King, as the upholder of the Law wanted to convey his firm belief in the Buddhist doctrine according to his interpretation:\n(He) shall purify (and) make straight, write down (and) establish all the holy scriptures. (He) shall proclaim (and) voice the Law, which is even as a resounding drum. (He) shall arouse all the people that are slumbering carelessly. (He) shall stand steadfast in the observance of the commandments at all times.\nThrough the iconographic …","other":"อานานดาพะย่า"}},{"th":{"title":"เจดีย์ชเวดากอง","url":"https://th.wikipedia.org/wiki/%E0%B9%80%E0%B8%88%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B9%8C%E0%B8%8A%E0%B9%80%E0%B8%A7%E0%B8%94%E0%B8%B2%E0%B8%81%E0%B8%AD%E0%B8%87","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c4/Shwedagon_Pagoda_2017.jpg/960px-Shwedagon_Pagoda_2017.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"เจดีย์ชเวดากอง (พม่า: ရွှေတိဂုံစေတီတော်, ออกเสียง: [ʃwèdəɡòʊ̯ɰ̃ zèdìdɔ̀] ชเวดะโกนเซดีดอ; มอญ: ကျာ်ဒဂုၚ်) ตั้งอยู่บนเนินเขาสิงคุตตระ นครย่างกุ้ง ประเทศพม่า โดยคำว่า ชเว (ရွှေ) หมายถึง ทอง, ดะโกน (ဒဂုံ แผลงเป็น တိဂုံ, ภาษามอญเรียกชื่อว่า ตะเกิง) คือชื่อดั้งเดิมของนครย่างกุ้ง เชื่อกันว่าเป็นมหาเจดีย์ที่บรรจุพระเกศาธาตุ 8 เส้นของพระพุทธเจ้า ยอดสุดขององค์เจดีย์บริเวณลูกแก้วหรือหยาดน้ำค้างประดับด้วยเครื่องประดับต่าง ๆ และเพชร 5,448 เม็ด ชั้นบนสุดมีทับทิม 2,317 เม็ดและเพชรเม็ดใหญ่ 76 กะรัต เพื่อรับลำแสงแรกและลำแสงสุดท้ายของดวงอาทิตย์ ผู้ที่เข้ามานมัสการหรือเยี่ยมชมจะต้องถอดรองเท้าทุกครั้ง","history":"ตามตำนาน เจดีย์ชเวดากองนั้นสร้างเมื่อ 2,500 ปีที่แล้ว แต่นักประวัติศาสตร์และนักโบราณคดีเชื่อกันว่าชาวมอญสร้างขึ้นระหว่างคริสต์ศตวรรษที่ 6–10 โดย ตามตำนานนั้นกล่าวว่ามีพี่น้องพ่อค้า 2 คนคือ ตปุสสะและภัลลิกะ จากตอนเหนือของเนินเขาสิงคุตตระ ได้ไปเข้าเฝ้าพระโคตมพุทธเจ้าพระองค์จึงประทานพระเกศาให้พ่อค้าทั้งสองมา 8 เส้น พ่อค้าทั้งสองกลับมายังพม่าและได้ความช่วยเหลือจากผู้ปกครองท้องถิ่น พระราชาโอะกะลาปะ ในการประดิษฐานพระเกศาธาตุบริเวณเนินเขาสิงคุตตระ\nองค์เจดีย์ได้ถูกทิ้งร้างทรุดโทรมจนมาถึงคริสต์ศตวรรษที่ 14 พระยาอู่ (ค.ศ. 1323–1384) ได้ทรงบูรณะเจดีย์ให้มีความสูง 18 เมตร (59 ฟุต) ศตวรรษต่อมาพระนางเชงสอบู (ค.ศ. 1453–1472) ได้ทรงบูรณะเจดีย์ให้มีความสูงถึง 40 เมตร (131 ฟุต) ได้ทำการปรับเปลี่ยนเนินซึ่งเป็นที่ตั้งขององค์เจดีย์ให้เป็นฐานเจดีย์ลาดเป็นชั้น ๆ แบบขั้นบันได และปูพื้นด้านบนของฐานด้วยแผ่นหิน พระนางรับสั่งให้มีการบำรุงรักษาองค์เจดีย์ต่อไปแก่พระเจ้าธรรมเจดีย์ ซึ่งครองราชสมบัติต่อหลังพระนางสละราชสมบัติ ในช่วงบั้นปลายพระชนม์ชีพพระนางประชวรและมีพระบัญชาให้วางแท่นบรรทมในจุดที่พระองค์สามารถมองเห็นเจดีย์ได้ทุกเวลา มีการจารึกภาษามอญบันทึกการบูรณะปฏิสังขรณ์องค์เจดีย์ที่เริ่มต้นในปี ค.ศ. 1436 …","other":"Shwedagon Pagoda"},"en":{"title":"Shwedagon Pagoda","url":"https://en.wikipedia.org/wiki/Shwedagon_Pagoda","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c4/Shwedagon_Pagoda_2017.jpg/960px-Shwedagon_Pagoda_2017.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Shwedagon Pagoda (Burmese: ရွှေတိဂုံဘုရား, MLCTS: shwe ti. gon bhu. ra:, IPA: [ʃwèdəɡòʊɰ̃ pʰəjá]; Mon: ကျာ်ဒဂုၚ်), officially named Shwedagon Zedi Daw (Burmese: ရွှေတိဂုံစေတီတော်, [ʃwèdəɡòʊɰ̃ zèdìdɔ̀], lit. \u0027Golden Dagon Pagoda,\u0027), and also known as the Great Dagon Pagoda and the Golden Pagoda, Kyaik Dagon  is a gilded stupa located in Yangon, Myanmar.","history":"Legend holds that the Shwedagon Pagoda was constructed more than 2,500 years ago — while the Buddha was still alive — which would make it the oldest Buddhist stupa in the world. According to the Buddhavaṃsa, two merchants from Ukkalājanapada named Tapussa and Bhallika were passing through Bodh Gaya when they encountered the Buddha. The Buddha, who was at that time enjoying the bliss of his newly attained Buddhahood as he sat under a rājāyatana tree, accepted their offering of rice cake and honey and taught them some of the dharma in return. In so doing, they became the first lay disciples to take refuge in the teachings of the Buddha. The Buddha also gave eight strands of his hair to the merchants and gave them instructions on how to construct a stupa in which to enshrine these hair relics. The merchants presented the eight strands of hair to King Okkalapa of Dagon, who enshrined the strands along with some relics of the three preceding Buddhas (Kakusandha, Koṇāgamana, and Kassapa) in a stupa on the Singuttara Hill in present-day Myanmar.\nThe first mention of the pagoda in the royal …","other":"เจดีย์ชเวดากอง"}},{"th":{"title":"หริมันทิรสาหิบ","url":"https://th.wikipedia.org/wiki/%E0%B8%AB%E0%B8%A3%E0%B8%B4%E0%B8%A1%E0%B8%B1%E0%B8%99%E0%B8%97%E0%B8%B4%E0%B8%A3%E0%B8%AA%E0%B8%B2%E0%B8%AB%E0%B8%B4%E0%B8%9A","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Hamandir_Sahib_%28Golden_Temple%29.jpg/960px-Hamandir_Sahib_%28Golden_Temple%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"หริมันทิรสาหิบ, ฮรมันดิรซาฮิบ หรือ หริมนเทียรสาหิบ (คุรมุขี: ਹਰਿਮੰਦਰ ਸਾਹਿਬ; เทวนาครี: हरिमन्दिर साहिब; อักษรโรมัน: Harmandir Sahib) หรือ วิหารทอง (Golden Temple) เป็นคุรุทวาราที่สำคัญที่สุดในศาสนาซิกข์ ตั้งอยู่ที่เมืองอมฤตสระ รัฐปัญจาบ ทางภาคเหนือของประเทศอินเดีย ชื่อของวิหารนั้นแปลว่า ที่สถิตของพระผู้เป็นเจ้า สถานที่อันเป็นที่ยกย่องว่าศักดิ์สิทธิ์สูงสุด (abode of God, exalted holy court) ในภาษาไทยได้มีผู้เรียกวิหารนี้อีกหลายชื่อ เช่น วิหารทองคำ, สุวรรณวิหาร เป็นต้น\nวิหารนั้นสร้างขึ้นท่ามกลางสระน้ำอมฤตซึ่งสร้างโดยคุรุรามทาสในปี ค.ศ. 1577 ต่อมา คุรุอรชุน คุรุศาสดาองค์ที่ 5 ตามความเชื่อของซิกข์ได้ทรงรับสั่งให้ซาอี มีอัน มีร์ (Sai Mian Mir) ผู้เป็นปีร์ (pir) ชาวมุสลิมแห่ง ละฮอร์ วางศิลาฤกษ์ในปี ค.ศ. 1589 ต่อมาในปี ค.ศ.","history":"หริมันทิรสาหิบ, ฮรมันดิรซาฮิบ หรือ หริมนเทียรสาหิบ (คุรมุขี: ਹਰਿਮੰਦਰ ਸਾਹਿਬ; เทวนาครี: हरिमन्दिर साहिब; อักษรโรมัน: Harmandir Sahib) หรือ วิหารทอง (Golden Temple) เป็นคุรุทวาราที่สำคัญที่สุดในศาสนาซิกข์ ตั้งอยู่ที่เมืองอมฤตสระ รัฐปัญจาบ ทางภาคเหนือของประเทศอินเดีย ชื่อของวิหารนั้นแปลว่า ที่สถิตของพระผู้เป็นเจ้า สถานที่อันเป็นที่ยกย่องว่าศักดิ์สิทธิ์สูงสุด (abode of God, exalted holy court) ในภาษาไทยได้มีผู้เรียกวิหารนี้อีกหลายชื่อ เช่น วิหารทองคำ, สุวรรณวิหาร เป็นต้น\nวิหารนั้นสร้างขึ้นท่ามกลางสระน้ำอมฤตซึ่งสร้างโดยคุรุรามทาสในปี ค.ศ. 1577 ต่อมา คุรุอรชุน คุรุศาสดาองค์ที่ 5 ตามความเชื่อของซิกข์ได้ทรงรับสั่งให้ซาอี มีอัน มีร์ (Sai Mian Mir) ผู้เป็นปีร์ (pir) ชาวมุสลิมแห่ง ละฮอร์ วางศิลาฤกษ์ในปี ค.ศ. 1589 ต่อมาในปี ค.ศ. 1604 คุรุอรชุนได้ประดิษฐานพระมหาคัมภีร์ อาทิครันถ์ (ซึ่งต่อมาเรียกว่า พระมหาคัมถีร์คุรุครันถสาหิพ) และประทานชื่อให้กับวิหารนี้ว่า อัถ สัถ ติรัถ (Ath Sath Tirath) ซึ่งแปลโดยตรงว่าสถานที่แห่ง 68 การแสงบุญอันศักดิ์สิทธิ์ (\"shrine of 68 pilgrimages\") วิหารนั้นได้รับการสร้างใหม่อย่างต่อเนื่อง เนื่องด้วยความศักดิ์สิทธิ์และความเป็นศูนย์รวมจิตใจของชาวซิกข์ …","other":"Golden Temple"},"en":{"title":"Golden Temple","url":"https://en.wikipedia.org/wiki/Golden_Temple","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/94/The_Golden_Temple_of_Amrithsar_7.jpg/960px-The_Golden_Temple_of_Amrithsar_7.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Golden Temple is a gurdwara located in Amritsar, Punjab, India. It is the pre-eminent spiritual site of Sikhism and its holiest site. The gurdwara complex is a collection of buildings around the sanctum sanctorum and the sarovar (holy pool), known as the Amrit Sarovar.","history":"It is difficult to reconstruct the history of the complex due to a lack of records. The few Persian sources which exist tend to be biased, thus most of the early history of the site is reconstructed from what is found in hagiographical Sikh literature, especially the sakhi, mahima, gurbilas, and panth prakash genres. However, historical Sikh sources are semi-historical and generally reverential toward the site, being written by poets rather than historians, focusing more on theological aspects rather than objective history. \nSikh sources claim that the site was chosen as it had long been a site associated with religion but fell into obscurity before being rediscovered by the Sikh gurus. There are myths regarding the antecedents of the site, with a Puranic-style one declaring the site as an amrit kund (\"reservoir of nectar\"). Another claim linked to the Ramayana asserts that the site was named Iksvakusar, named after the figure Iksvaku who supposedly performed yajnas at it. Furthermore, there is a legend that Rama was injured by his sons Lava and Kush at the spot that the Dukh …","other":"หริมันทิรสาหิบ"}},{"th":null,"en":{"title":"Château de Montségur","url":"https://en.wikipedia.org/wiki/Ch%C3%A2teau_de_Monts%C3%A9gur","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Ch%C3%A2teau_de_Monts%C3%A9gur_-_vue_a%C3%A9rienne.jpg/960px-Ch%C3%A2teau_de_Monts%C3%A9gur_-_vue_a%C3%A9rienne.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Château de Montségur (English: Castle of Montsegur; Languedocien: Castèl de Montsegur) is a former fortress near Montségur, a commune in the Ariège department in southern France. Its ruins are the site of a razed stronghold of the Cathars. The present fortress on the site, though described as one of the \"Cathar castles,\" is actually of a later period.","history":"The earliest signs of human settlement in the area date back to the Stone Age. Evidence of Roman occupation such as Roman currency and tools have also been found in and around the site. The name comes from Latin mons securus, which evolved into mont ségur in Occitan, which means \"safe hill\". In the Middle Ages the Montsegur region was ruled by the Counts of Toulouse, the Viscounts of Carcassonne and finally the Counts of Foix. Little is known about the fortification until the time of the Albigensian Crusade.\nIn about 1204, Raymond de Péreille, one of the two lords of Montségur, the other being his cousin Pierre-Roger de Mirepoix, decided to rebuild the castle that had been in ruins for 40 years or more. Refortified, the castle became a center of Cathar activities, and home to Guilhabert de Castres, a Cathar theologian and bishop. In 1233 the site became \"the seat and head\" (domicilium et caput) of the Cathar church. It has been estimated that the fortified site housed about 500 people when in 1241, Raymond VII besieged Montsegur without success. The murder of representatives of the …","other":null}},{"th":null,"en":{"title":"Lindisfarne","url":"https://en.wikipedia.org/wiki/Lindisfarne","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8d/Holy_Island_Sunrise_%28again%29_%2815064111624%29.jpg/960px-Holy_Island_Sunrise_%28again%29_%2815064111624%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Lindisfarne, also known as Holy Island, is a tidal island off the northeast coast of England, which constitutes the civil parish of Holy Island in Northumberland. Holy Island has a recorded history from the 6th century AD; it was an important centre of Celtic Christianity under Saints Aidan, Cuthbert, Eadfrith, and Eadberht of Lindisfarne. The island was originally home to a monastery, which was destroyed during the Viking invasions but re-established as a priory following the Norman Conquest of England.","history":"The north-east of England was largely not settled by Roman civilians apart from the Tyne valley and Hadrian\u0027s Wall. The area had been little affected during the centuries of nominal Roman occupation. The countryside had been subject to raids from both Scots and Picts and was \"not one to attract early Germanic settlement\". The Anglian King Ida (reigned from 547) started the sea-borne settlement of the coast, establishing an urbis regia (meaning \"royal settlement\") at Bamburgh across the bay from Lindisfarne. The conquest was not straightforward, however. The Historia Brittonum recounts how, in the 6th century, Urien, prince of Rheged, with a coalition of North Brittonic kingdoms, besieged Angles led by Theodric of Bernicia on the island for three days and nights, until internal power struggles led to the Britons\u0027 defeat.\nLindisfarne Priory was first established in 634 AD by Irish monks. The island served as the site of a monastery for roughly 900 years. The site, most of which has fallen into a state of ruin, has since become a popular tourist destination and focus of pilgrimage …","other":null}},{"th":{"title":"เกาะสเกลลิกไมเคิล","url":"https://th.wikipedia.org/wiki/%E0%B9%80%E0%B8%81%E0%B8%B2%E0%B8%B0%E0%B8%AA%E0%B9%80%E0%B8%81%E0%B8%A5%E0%B8%A5%E0%B8%B4%E0%B8%81%E0%B9%84%E0%B8%A1%E0%B9%80%E0%B8%84%E0%B8%B4%E0%B8%A5","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Skellig_Michael_by_Maureen_%281%29.jpg/960px-Skellig_Michael_by_Maureen_%281%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"เกาะสเกลลิกไมเคิล (ไอริช: Sceilg Mhichíl; อังกฤษ: Skellig Michael) หรือ เกาะเกรตสเกลลิก (อังกฤษ: Great Skellig) เป็นเกาะหินสูงชันนอกชายฝั่งตะวันตกเฉียงใต้ของประเทศไอร์แลนด์ อยู่ในหมู่เกาะสเกลลิกร่วมกับเกาะลิตเทิลสเกลลิก นอกคาบสมุทรไอเวอราคในเทศมณฑลเคร์รี จังหวัดมันสเตอร์ เกาะตั้งตระหง่านกลางมหาสมุทรแอตแลนติก สูงถึง 218 เมตรเหนือระดับน้ำทะเล และเคยเป็นที่ตั้งของชุมชนสงฆ์คริสต์ศาสนายุคกลาง ก่อนจะได้รับการขึ้นทะเบียนเป็นแหล่งมรดกโลกใน ค.ศ. 1996 เกาะนี้อยู่ภายใต้อุทยานแห่งชาติทะเลเคร์รี\nเกาะนี้เป็นที่รู้จักในตำนานและเอกสารเก่าตั้งแต่ยุคก่อนคริสต์ศาสนา คาดว่ากลุ่มนักบวชน่าจะเริ่มเข้ามาตั้งถิ่นฐานบนเกาะราวคริสต์ศตวรรษที่ 6 ชุมชนนักบวชดำรงอยู่ต่อมาหลายศตวรรษ ก่อนค่อย ๆ ย้ายไปยังแผ่นดินใหญ่ที่บัลลินสเกลลิกส์ในช่วงคริสต์ศตวรรษที่ 13-14 หลังจากนั้นเกาะถูกทิ้งร้างเป็นเวลานาน จนมีการสร้างประภาคารสเกลลิกไมเคิลในคริสต์ศตวรรษที่ 19 ซึ่งทำให้ซากโบราณสถานบางส่วนเสียหาย ต่อมาประเทศไอร์แลนด์เริ่มดำเนินงานอนุรักษ์และบูรณะอย่างเป็นระบบ จนนำไปสู่การขึ้นทะเบียนเป็นมรดกโลกเมื่อปี ค.ศ.","history":"การศึกษาประวัติศาสตร์ของสเกลลิกไมเคิลอาศัยหลักฐานโบราณคดีและการวิเคราะห์กลุ่มสถาปัตยกรรมอารามเ
