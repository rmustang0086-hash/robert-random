uina language is most likely to have been the language …","other":"ตีวานากู"}},{"th":{"title":"โอลิมเปีย (ประเทศกรีซ)","url":"https://th.wikipedia.org/wiki/%E0%B9%82%E0%B8%AD%E0%B8%A5%E0%B8%B4%E0%B8%A1%E0%B9%80%E0%B8%9B%E0%B8%B5%E0%B8%A2_(%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B9%80%E0%B8%97%E0%B8%A8%E0%B8%81%E0%B8%A3%E0%B8%B5%E0%B8%8B)","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cf/Ancient_Olympia%2C_Greece2.jpg/960px-Ancient_Olympia%2C_Greece2.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"โอลิมเปีย (กรีก: Ὀλυμπία; เสียงอ่านภาษากรีก: [olympía]; เสียงอ่านภาษากรีก: [oli(m)ˈbia] Olymbía) เป็นเมืองโบราณบนคาบสมุทรเพโลพอนนีส และแหล่งกำเนิดของกีฬาโอลิมปิกโบราณ ซึ่งเคยจัดขึ้นทุก ๆ 4 ปี ตั้งแต่ 800 ปีก่อนคริสตกาล จนถึงคริสต์ศตวรรษที่ 4 ณ สนามกีฬากรีฑาโอลิมเปีย","history":"โอลิมเปีย (กรีก: Ὀλυμπία; เสียงอ่านภาษากรีก: [olympía]; เสียงอ่านภาษากรีก: [oli(m)ˈbia] Olymbía) เป็นเมืองโบราณบนคาบสมุทรเพโลพอนนีส และแหล่งกำเนิดของกีฬาโอลิมปิกโบราณ ซึ่งเคยจัดขึ้นทุก ๆ 4 ปี ตั้งแต่ 800 ปีก่อนคริสตกาล จนถึงคริสต์ศตวรรษที่ 4 ณ สนามกีฬากรีฑาโอลิมเปีย","other":"Olympia, Greece"},"en":{"title":"Olympia, Greece","url":"https://en.wikipedia.org/wiki/Olympia,_Greece","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cf/Ancient_Olympia%2C_Greece2.jpg/960px-Ancient_Olympia%2C_Greece2.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Olympia (Modern Greek: Ολυμπία [oli(m)ˈbi.a]; Ancient Greek: Ὀλυμπία [olympí.aː]), officially Archaia Olympia (Greek: Αρχαία Ολυμπία lit. \u0027Ancient Olympia\u0027), is a small town in Elis on the Peloponnese peninsula in Greece, famous for the nearby archaeological site of the same name. The site was a major Panhellenic religious sanctuary of ancient Greece, where the ancient Olympic Games were held every four years throughout classical antiquity, from the 8th century BC to the 4th century AD. They were restored on a global basis in 1894 in honor of the ideal of peaceful international contention for excellence.\nThe sacred precinct, named the Altis, was primarily dedicated to Zeus, although other gods were worshipped there.","history":"It used to be thought that the site had been occupied since about 1500 BC, with a religious cult of Zeus developing around 1000 BC. It may be that instead there was only a sanctuary from the 9th or 8th centuries, though the question remains in debate. Others believe that remains of food and burnt offerings dating back to the 10th century BC give evidence of a long history of religious activity at the site. No buildings have survived from this earliest period of use.\nThe first Olympic festival was organized on the site by the authorities of Elis in the 8th century BC – with tradition dating the first games at 776 BC. Major changes were made to the site around 700 BC, including levelling land and digging new wells. Elis\u0027 power diminished and the sanctuary fell into the hands of the Pisatans in 676 BC. The Pisatans organized the games until the late 7th century BC.\nThe earliest evidence of building activity on the site dates from around 600 BC. At this time, the Skiloudians, allies of the Pisatans, built the Temple of Hera. The Treasuries and the Pelopion were built during the course …","other":"โอลิมเปีย (ประเทศกรีซ)"}},{"th":{"title":"อารามนักบุญแคเธอริน","url":"https://th.wikipedia.org/wiki/%E0%B8%AD%E0%B8%B2%E0%B8%A3%E0%B8%B2%E0%B8%A1%E0%B8%99%E0%B8%B1%E0%B8%81%E0%B8%9A%E0%B8%B8%E0%B8%8D%E0%B9%81%E0%B8%84%E0%B9%80%E0%B8%98%E0%B8%AD%E0%B8%A3%E0%B8%B4%E0%B8%99","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6b/Katharinenkloster_Sinai_BW_2.jpg/960px-Katharinenkloster_Sinai_BW_2.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อารามนักบุญแคเธอริน (อาหรับ: دير القدّيسة كاترين Dayr al-Qiddīsa Katrīn; กรีก: Μονὴ τῆς Ἁγίας Αἰκατερίνης, Saint Catherine\u0027s Monastery) หรือชื่อทางการ อารามหลวงอิสระนักบุญแคเธอรินอันเป็นที่สักการะแห่งเขาซีนายอันศักดิ์สิทธิ์ที่ซึ่งพระเป็นเจ้าเคยเสด็จผ่าน (อังกฤษ: Sacred Autonomous Royal Monastery of Saint Catherine of the Holy and God-Trodden Mount Sinai) เป็นอารามในศาสนาคริสต์ ที่ตั้งอยู่บนคาบสมุทรซีนาย ประเทศอียิปต์ โดยตั้งอยู่ที่เชิงเขาซีนาย และสร้างขึ้นระหว่างปี ค.ศ.","history":"บันทึกเก่าแก่ที่สุดเกี่ยวกับชีวิตอารามวาสีในเขาซีนายมาจากบันทึกการเดินทางภาษาละตินของสตรีผู้แสวงบุญ นามว่าเอเกริยา (หรือ เอเธริยา, Etheria; นักบุญซิลเวียแห่งอะกีเตน) ราวปี 381/2–386\nอารามสร้างขึ้นโดยดำริของจักรพรรดิยุสตีเนียนที่หนึ่ง (ครองราชย์ 527–565) โดยสร้างขึ้นล้อมรอบโบสถ์น้อยแห่งพุ่มไม้ที่ลุกเป็นไฟ (Chapel of the Burning Bush) (หรือ โบสถ์น้อยนักบุญเฮเลน \"Saint Helen\u0027s Chapel\") ซึ่งสร้างตามดำริของจักรพรรดินีเฮเลนา พระวรชายา ผู้เป็นมารดาของจักรพรรดิคอนซตันตินมหาราช ตรงจุดที่เชื่อว่าโมเสสพบพุ่มไม้ลุกเป็นไฟตามพระคัมภีร์ โครงสร้างเสาค้ำหลังคา (truss) แบบคิงโปสต์ของอารามถือเป็นเสาค้ำหลังคาที่เก่าแก่ที่สุดในโลกที่ยังคงหลงเหลือถึงปัจจุบัน\n== อ้างอิง ==","other":"Saint Catherine\u0027s Monastery"},"en":{"title":"Saint Catherine\u0027s Monastery","url":"https://en.wikipedia.org/wiki/Saint_Catherine%27s_Monastery","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6b/Katharinenkloster_Sinai_BW_2.jpg/960px-Katharinenkloster_Sinai_BW_2.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Saint Catherine\u0027s Monastery (Arabic: دير القدّيسة كاترين Dayr al-Qiddīsa Katrīn, Greek: Ιερά Μονή Αγίας Αικατερίνης Όρους Σινά, romanized: Iërá Moní Ayías Ekaterínis Órus Siná), officially the Sacred Autonomous Royal Monastery of Saint Catherine of the Holy and God-Trodden Mount Sinai, is a Christian monastery located in the Sinai Peninsula of Egypt. Located at the foot of Mount Sinai, it was built between 548 and 565, and is the world\u0027s oldest continuously inhabited Christian monastery.\nThe monastery was built by order of the Byzantine emperor Justinian I, enclosing what is claimed to be the burning bush seen by Moses.","history":"The oldest record of monastic life at Mount Sinai comes from the Itinerarium Egeriae, a travel journal written in Latin by a female Christian pilgrim from the Atlantic coast of Galicia or Roman Gaul named Egeria about 381/2–386.\nThe monastery was built by order of the Byzantine emperor Justinian I (reigned 527–565), enclosing the Chapel of the Burning Bush (also known as \"Saint Helen\u0027s Chapel\") ordered to be built by Empress Consort Helena, mother of Constantine I, at the site where Moses is supposed to have seen the burning bush. The bush on the grounds is said to be the one seen by Moses. Structurally, the monastery\u0027s king post truss is the oldest known surviving roof truss in the world.\nFrom the time of the First Crusade, the presence of Crusaders in the Sinai until 1270 spurred the interest of European Christians. It increased the number of intrepid pilgrims who visited the monastery. Its dependencies in Egypt, Palestine, Syria, Crete, Cyprus and Constantinople supported the monastery. Throughout the Middle Ages, the monastery had a multiethnic profile, with monks of Arab, …","other":"อารามนักบุญแคเธอริน"}},{"th":null,"en":{"title":"Serpent Mound","url":"https://en.wikipedia.org/wiki/Serpent_Mound","img":"https://upload.wikimedia.org/wikipedia/commons/3/31/Serpent_Mound%2C_Peebles%2C_Ohio_04.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"The Great Serpent Mound is a 1,348-feet-long (411m), four-feet-high precontact effigy mound located in Peebles, Ohio, United States. It was built on what is known as the Serpent Mound crater plateau, running along the Ohio Brush Creek in Adams County, Ohio. The mound is the largest serpent effigy known in the world.","history":"The Great Serpent Mound is a 1,348-feet-long (411m), four-feet-high precontact effigy mound located in Peebles, Ohio, United States. It was built on what is known as the Serpent Mound crater plateau, running along the Ohio Brush Creek in Adams County, Ohio. The mound is the largest serpent effigy known in the world. \nThe first published surveys of the mound, by E. G. Squier and Edwin Hamilton Davis, were featured in their 1848 study Ancient Monuments of the Mississippi Valley, commissioned by the Smithsonian Institution.\nThe United States Department of the Interior designated the mound as a National Historic Landmark in 1966. It is maintained by the Ohio History Connection, a nonprofit organization dedicated to preserving historical sites in Ohio.","other":null}},{"th":{"title":"ทุ่งไหหิน","url":"https://th.wikipedia.org/wiki/%E0%B8%97%E0%B8%B8%E0%B9%88%E0%B8%87%E0%B9%84%E0%B8%AB%E0%B8%AB%E0%B8%B4%E0%B8%99","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3d/Poj_site3.jpg/960px-Poj_site3.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ทุ่งไหหิน (ลาว: ທົ່ງໄຫຫີນ) คือ ภูมิประเทศทางโบราณคดี ซึ่งเป็นที่ตั้งของหินใหญ่ (megalith) ที่กระจัดกระจายไปทั่วที่ราบสูงเชียงขวาง แขวงเชียงขวาง ทางเหนือของประเทศลาว ประกอบด้วยหินใหญ่รูปทรงไหนับพัน ปรากฏเป็นกลุ่ม ๆ ตลอดแนวเขาและอยู่ล้อมรอบหุบเขาสูง \nที่ราบสูงเชียงขวาง ตั้งอยู่บริเวณเหนือสุดของเทือกเขาอันนัมอันเป็นเทือกเขาหลักในอินโดจีน โดยมีการค้นพบทุ่งไหหินเบื้องต้นในช่วง ค.ศ.","history":"ทุ่งไหหิน (ลาว: ທົ່ງໄຫຫີນ) คือ ภูมิประเทศทางโบราณคดี ซึ่งเป็นที่ตั้งของหินใหญ่ (megalith) ที่กระจัดกระจายไปทั่วที่ราบสูงเชียงขวาง แขวงเชียงขวาง ทางเหนือของประเทศลาว ประกอบด้วยหินใหญ่รูปทรงไหนับพัน ปรากฏเป็นกลุ่ม ๆ ตลอดแนวเขาและอยู่ล้อมรอบหุบเขาสูง \nที่ราบสูงเชียงขวาง ตั้งอยู่บริเวณเหนือสุดของเทือกเขาอันนัมอันเป็นเทือกเขาหลักในอินโดจีน โดยมีการค้นพบทุ่งไหหินเบื้องต้นในช่วง ค.ศ. 1930 ซึ่งกล่าวถึงไหหินที่สัมพันธ์กับพิธีกรรมเกี่ยวกับงานศพในยุคก่อนประวัติศาสตร์ จากนั้นได้มีการขุดค้นโดยนักโบราณคดีชาวลาวและชาวญี่ปุ่น และมีการค้นพบวัตถุเกี่ยวกับงานศพและเครื่องเคลือบรอบ ๆ ไหหิน วัตถุเหล่านั้นถูกกำหนดให้อยู่ในยุคเหล็ก และกลายเป็นหนึ่งในแหล่งโบราณคดีทางประวัติศาสตร์ที่น่าสนใจและสำคัญที่สุดแห่งหนึ่งในการศึกษายุคสมัยก่อนประวัติศาสตร์ในเอเชียตะวันออกเฉียงใต้ แหล่งโบราณคดีทุ่งไหหินบ่งบอกถึงความสัมพันธ์ระหว่างสังคมที่ซับซ้อนมากขึ้นและโครงสร้างหินใหญ่ ที่อยู่ในชุมชนยุคเหล็กในเอเชียตะวันออกเฉียงใต้\nรัฐบาลลาวได้ผลักดันให้ยูเนสโกขึ้นทะเบียนทุ่งไหหินในแขวงเชียงขวางเป็นแหล่งมรดกโลกแห่งหนึ่งเคียงคู่กับเมืองหลวงพระบาง แขวงเชียงขวางเป็นพื้นที่ทางโบราณคดีสำคัญของลาว …","other":"Plain of Jars"},"en":{"title":"Plain of Jars","url":"https://en.wikipedia.org/wiki/Plain_of_Jars","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/Plainofjars_2.jpg/960px-Plainofjars_2.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Plain of Jars (Lao: ທົ່ງໄຫຫີນ Thong Hai Hin, [tʰōŋ hǎj hǐn]) is a megalithic archaeological landscape in Laos. It consists of thousands of stone jars scattered around the upland valleys and the lower foothills of the central plain of the Xiangkhoang Plateau. The jars are arranged in clusters ranging in number from one to several hundred.","history":"The Plain of Jars (Lao: ທົ່ງໄຫຫີນ Thong Hai Hin, [tʰōŋ hǎj hǐn]) is a megalithic archaeological landscape in Laos. It consists of thousands of stone jars scattered around the upland valleys and the lower foothills of the central plain of the Xiangkhoang Plateau. The jars are arranged in clusters ranging in number from one to several hundred.\nThe Xiangkhoang Plateau is at the northern end of the Annamese Cordillera, the principal mountain range of Indochina. French researcher Madeleine Colani concluded in 1930 that the jars were associated with burial practices. Excavation by Lao and Japanese archaeologists in the intervening years has supported this interpretation with the discovery of human remains, burial goods and ceramics around the jars. Researchers (using optically stimulated luminescence) determined that the jars were put in place as early as 1240 to 660 BC. The jars at Site 1 (using detrital zircon geochronology) were determined to have been transported to their current location from a presumed quarry eight kilometers away. The Plain of Jars is one of the most important …","other":"ทุ่งไหหิน"}},{"th":null,"en":{"title":"Roman Baths (Bath)","url":"https://en.wikipedia.org/wiki/Roman_Baths_(Bath)","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Roman_Baths_in_Bath_Spa%2C_England_-_July_2006.jpg/960px-Roman_Baths_in_Bath_Spa%2C_England_-_July_2006.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Roman Baths are well-preserved thermae in the city of Bath, Somerset, England. A temple was constructed on the site between 60 and 70 AD in the first few decades of Roman Britain. Its presence led to the development of the small Roman urban settlement known as Aquae Sulis around the site.","history":"Archaeological evidence indicates that the site of the baths may have been a centre of worship used by Celts; the springs were dedicated to the goddess Sulis, who was locally identified with Minerva. Geoffrey of Monmouth in his largely fictional Historia Regum Britanniae describes how the spring was discovered by the pre-Roman British king Bladud, who built the baths there. Early in the 18th century Geoffrey\u0027s obscure legend was given great prominence as a royal endorsement of the waters\u0027 qualities, with the embellishment that the spring had cured Bladud and his herd of pigs of leprosy through wallowing in the warm mud.\nThe name Sulis continued to be used after the Roman invasion, leading to the town\u0027s Roman name of Aquae Sulis (\"the waters of Sulis\"). The temple was constructed in 60–70 AD and the bathing complex was gradually built up over the next 300 years. During the Roman occupation of Britain, and possibly on the instructions of Emperor Claudius, engineers drove oak piles into the mud to provide a stable foundation and surrounded the spring with an irregular stone chamber …","other":null}},{"th":null,"en":{"title":"Aït Benhaddou","url":"https://en.wikipedia.org/wiki/A%C3%AFt_Benhaddou","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d5/Ksar_A%C3%AFt_Benhaddou%2C_Marocco_%28%D8%A3%D9%8A%D8%AA_%D8%A8%D9%86_%D8%AD%D8%AF%D9%88%D8%8C_%D8%A7%D9%84%D9%85%D8%BA%D8%B1%D8%A8%2C_%E2%B4%B0%E2%B5%A2%E2%B5%9C_%E2%B5%83%E2%B4%B0%E2%B4%B7%E2%B4%B7%E2%B5%93%29.jpg/960px-Ksar_A%C3%AFt_Benhaddou%2C_Marocco_%28%D8%A3%D9%8A%D8%AA_%D8%A8%D9%86_%D8%AD%D8%AF%D9%88%D8%8C_%D8%A7%D9%84%D9%85%D8%BA%D8%B1%D8%A8%2C_%E2%B4%B0%E2%B5%A2%E2%B5%9C_%E2%B5%83%E2%B4%B0%E2%B4%B7%E2%B4%B7%E2%B5%93%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Aït Benhaddou (Berber languages: ⵉⵖⵔⵎ ⵏ ⴰⵢⵜ ⴱⵏ ⵃⴷⴷⵓ, Arabic: آيت بن حدّو) is a historic ighrem or ksar (fortified village) along the former caravan route between the Sahara and Marrakesh in Morocco. It is considered a great example of Moroccan earthen clay architecture and has been a UNESCO World Heritage Site since 1987.","history":"The site of the ksar has been fortified since the 11th century during the Almoravid period. None of the current buildings are believed to date from before the 17th century, but they were likely built with the same construction methods and designs as had been used for centuries before. The site\u0027s strategic importance was due to its location in the Ounila Valley along one of the main trans-Saharan trade routes. The Tizi n\u0027Tichka pass, which was reached via this route, was one of the few routes across the Atlas Mountains, crossing between Marrakech and the Dra\u0027a Valley on the edge of the Sahara. Other kasbahs and ksour were located all along this route, such as the nearby Tamdaght to the north.\nToday, the ksar itself is only sparsely inhabited by several families. The depopulation over time is a result of the valley\u0027s loss of strategic importance in the 20th century. Most local inhabitants now live in modern dwellings in the village on the other side of the river, and make a living off agriculture and especially off the tourist trade. In 2011 a new pedestrian bridge was completed …","other":null}},{"th":{"title":"ชันตรมันตระ (ชัยปุระ)","url":"https://th.wikipedia.org/wiki/%E0%B8%8A%E0%B8%B1%E0%B8%99%E0%B8%95%E0%B8%A3%E0%B8%A1%E0%B8%B1%E0%B8%99%E0%B8%95%E0%B8%A3%E0%B8%B0_(%E0%B8%8A%E0%B8%B1%E0%B8%A2%E0%B8%9B%E0%B8%B8%E0%B8%A3%E0%B8%B0)","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/Jantar_Mantar_at_Jaipur.jpg/960px-Jantar_Mantar_at_Jaipur.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ชันตรมันตระ (ฮินดี: जन्तर मन्तर; Jantar Mantar) เป็นหมู่สิ่งก่อสร้างเพื่อประโยชน์ทางดาราศาสตร์ 19 ชิ้น ในเมืองชัยปุระ รัฐราชสถาน ประเทศอินเดีย ที่สร้างขึ้นโดยราชาราชปุต สไว ชัย สิงห์ ที่สอง ผู้ก่อตั้งนครชัยปุระ สร้างแล้วเสร็จในปี 1734 ในบรรดาสิ่งก่อสร้างนี้มีนาฬิกาแดดหินที่ใหญ่ที่สุดในโลก และหมู่โบราณสถานนี้ได้รับสถานะมรดกโลกโดยยูเนสโก ชันตรมันตระตั้งอยู่ไม่ไกลจากซิตีพาเลส และ หวมหัล","history":"ชันตรมันตระ (ฮินดี: जन्तर मन्तर; Jantar Mantar) เป็นหมู่สิ่งก่อสร้างเพื่อประโยชน์ทางดาราศาสตร์ 19 ชิ้น ในเมืองชัยปุระ รัฐราชสถาน ประเทศอินเดีย ที่สร้างขึ้นโดยราชาราชปุต สไว ชัย สิงห์ ที่สอง ผู้ก่อตั้งนครชัยปุระ สร้างแล้วเสร็จในปี 1734 ในบรรดาสิ่งก่อสร้างนี้มีนาฬิกาแดดหินที่ใหญ่ที่สุดในโลก และหมู่โบราณสถานนี้ได้รับสถานะมรดกโลกโดยยูเนสโก ชันตรมันตระตั้งอยู่ไม่ไกลจากซิตีพาเลส และ หวมหัล","other":"Jantar Mantar, Jaipur"},"en":{"title":"Jantar Mantar, Jaipur","url":"https://en.wikipedia.org/wiki/Jantar_Mantar,_Jaipur","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/Jantar_Mantar_at_Jaipur.jpg/960px-Jantar_Mantar_at_Jaipur.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Jantar Mantar is a collection of 19 astronomical instruments built by the Rajput king Sawai Jai Singh, the founder of Jaipur, Rajasthan, India. The monument was completed in 1734. It features the world\u0027s largest stone sundial, and is a UNESCO World Heritage Site.","history":"Exactly when Sawai Jai Singh began construction in Jaipur is unknown, but several instruments had been built by 1728, and the construction of the instruments in Jaipur continued until 1738. During 1735, when construction was at its peak, at least 23 astronomers were employed in Jaipur, and due to the changing political climate, Jaipur replaced Delhi as Raja Jai Singh\u0027s main observatory and remained Jai Singh\u0027s central observatory until his death in 1743. The observatory lost support under Ishwari Singh (r.1743-1750) because of a succession war between him and his brother. However, Madho Singh I (r. 1750–1768), Ishwari Singh\u0027s successor, supported the observatory, although it did not see the same level of activity as under Jai Singh. Although some restorations were made to the Jantar Mantar under Pratap Singh (r.1778-1803), activity at the observatory died down again. During this time, a temple was constructed and Pratap Singh turned the site of the observatory into a gun factory.\nRam Singh (r. 1835–1880) completed restoring the Jantar Mantar in 1876, and even made some of the …","other":"ชันตรมันตระ (ชัยปุระ)"}},{"th":{"title":"แลนโซเมโดส์","url":"https://th.wikipedia.org/wiki/%E0%B9%81%E0%B8%A5%E0%B8%99%E0%B9%82%E0%B8%8B%E0%B9%80%E0%B8%A1%E0%B9%82%E0%B8%94%E0%B8%AA%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c4/Anse_aux_Meadows%2C_Newfoundland._%2839555380500%29.jpg/960px-Anse_aux_Meadows%2C_Newfoundland._%2839555380500%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"แลนโซเมโดส์ (อังกฤษ: L\u0027Anse aux Meadows, ออกเสียง: /ˌlænsoʊˈmɛdoʊz/ เพี้ยนมาจาก ฝรั่งเศส: L\u0027Anse-aux-Méduses แปลว่า \"หุบผาแมงกะพรุน\") เป็นแหล่งโบราณคดีที่ปลายสุดด้านทิศเหนือของเกาะนิวฟันด์แลนด์ ในรัฐนิวฟันด์แลนด์และลาบราดอร์ ประเทศแคนาดา ค้นพบเมื่อ ค.ศ. 1960 เป็นหมู่บ้านของชาวนอร์สที่เป็นที่รู้จักเพียงแห่งเดียวในอเมริกาเหนือนอกจากที่กรีนแลนด์ ถือว่าเป็นตัวอย่างของการติดต่อข้ามมหาสมุทรก่อนสมัยโคลัมบัสที่เป็นที่ยอมรับอย่างกว้างของเพียงแห่งเดียว และมีชื่อเสียงเนื่องจากเป็นไปได้ว่าจะเกี่ยวข้องกับอาณานิคม Vindland ที่ก่อตั้งโดยเลฟ เอริกสันเมื่อประมาณ ค.ศ.","history":"แลนโซเมโดส์ (อังกฤษ: L\u0027Anse aux Meadows, ออกเสียง: /ˌlænsoʊˈmɛdoʊz/ เพี้ยนมาจาก ฝรั่งเศส: L\u0027Anse-aux-Méduses แปลว่า \"หุบผาแมงกะพรุน\") เป็นแหล่งโบราณคดีที่ปลายสุดด้านทิศเหนือของเกาะนิวฟันด์แลนด์ ในรัฐนิวฟันด์แลนด์และลาบราดอร์ ประเทศแคนาดา ค้นพบเมื่อ ค.ศ. 1960 เป็นหมู่บ้านของชาวนอร์สที่เป็นที่รู้จักเพียงแห่งเดียวในอเมริกาเหนือนอกจากที่กรีนแลนด์ ถือว่าเป็นตัวอย่างของการติดต่อข้ามมหาสมุทรก่อนสมัยโคลัมบัสที่เป็นที่ยอมรับอย่างกว้างของเพียงแห่งเดียว และมีชื่อเสียงเนื่องจากเป็นไปได้ว่าจะเกี่ยวข้องกับอาณานิคม Vindland ที่ก่อตั้งโดยเลฟ เอริกสันเมื่อประมาณ ค.ศ. 1003 หรืออาจเกี่ยวข้องกับการสำรวจทวีปอเมริกาของชาวนอร์สด้วย","other":"L\u0027Anse aux Meadows"},"en":{"title":"L\u0027Anse aux Meadows","url":"https://en.wikipedia.org/wiki/L%27Anse_aux_Meadows","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/Authentic_Viking_recreation.jpg/960px-Authentic_Viking_recreation.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"L\u0027Anse aux Meadows is an archaeological site, first excavated in the 1960s, of a Norse settlement dating to approximately 1,000 years ago. The site is located near St. Anthony on the northernmost tip of the island of Newfoundland in the Canadian province of Newfoundland and Labrador.","history":"Before the Norse arrived in Newfoundland, there is evidence of occupations by five Indigenous groups at the site of L\u0027Anse aux Meadows, the oldest dated to roughly 6,000 years ago. None were contemporaneous with the Norse occupation. The most prominent earlier occupation was by the Dorset people, who occupied the site about 300 years before the Norse. Radiocarbon date ranges for these groups are c. 4000 – c. 1000 BCE for the Maritime Archaic tradition, c. 1000 – c. 500 BCE for the Groswater tradition, c. 400 – c. 750 for the Middle Dorset, c. 800 – c. 850 for the Cow Head Group and Beaches traditions, and c. 1200 – c. 1500 CE (after the Norse) for the Little Passage tradition.\nThe Norse settlement at L\u0027Anse aux Meadows has been dated to approximately 1000 CE (carbon dating estimates 990–1050, with a mean carbon date of 1014), an assessment that tallies with the relative dating of artifact and structure types. A 2021 Nature study, using radiocarbon analysis of three separate tree ring samples and evidence from the anomaly in atmospheric 14C concentrations in the year 993, pinpointed …","other":"แลนโซเมโดส์"}},{"th":{"title":"เนินเขากางเขน","url":"https://th.wikipedia.org/wiki/%E0%B9%80%E0%B8%99%E0%B8%B4%E0%B8%99%E0%B9%80%E0%B8%82%E0%B8%B2%E0%B8%81%E0%B8%B2%E0%B8%87%E0%B9%80%E0%B8%82%E0%B8%99","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/Colina_de_las_Cruces%2C_Lituania%2C_2012-08-09%2C_DD_12.JPG/960px-Colina_de_las_Cruces%2C_Lituania%2C_2012-08-09%2C_DD_12.JPG?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"เนินเขากางเขน (ลิทัวเนีย: ) เป็นแหล่งจาริกแสวงบุญ ตั้งอยู่ห่างจากเมืองเช็วเลย์ไปทางเหนือ 12 กิโลเมตร ในภาคเหนือของประเทศลิทัวเนีย ต้นกำเนิดแท้จริงของการปักกางเขนไว้บนเขานี้ไม่ปรากฏแน่ชัด แต่เชื่อกันทั่วไปว่ามีการปักกางเขนชุดแรกบนอดีตป้อมเนิน Jurgaičiai หรือ Domantai หลังจากการก่อการกำเริบปี 1831 ตลอดระยะเวลานับจากนั้น ไม่เพียงแต่ไม้กางเขนและรูปพระเยซูตรึงกางเขนที่ถูกนำมาไว้ที่นี่เท่านั้น แต่ยังมีรูปแม่พระมารี, ประคำ และหุ่นพยนต์กับงานแกะสลักภาพวีรชนของลิทัวเนียอีกด้วย มีการประมาณจำนวนกางเขนทั้งหมดว่าอยู่ที่ประมาณ 55,000 ชิ้นในปี 1990 และประมาณ 100,000 ชิ้นในปี 2006","history":"เนินเขากางเขน (ลิทัวเนีย: ) เป็นแหล่งจาริกแสวงบุญ ตั้งอยู่ห่างจากเมืองเช็วเลย์ไปทางเหนือ 12 กิโลเมตร ในภาคเหนือของประเทศลิทัวเนีย ต้นกำเนิดแท้จริงของการปักกางเขนไว้บนเขานี้ไม่ปรากฏแน่ชัด แต่เชื่อกันทั่วไปว่ามีการปักกางเขนชุดแรกบนอดีตป้อมเนิน Jurgaičiai หรือ Domantai หลังจากการก่อการกำเริบปี 1831 ตลอดระยะเวลานับจากนั้น ไม่เพียงแต่ไม้กางเขนและรูปพระเยซูตรึงกางเขนที่ถูกนำมาไว้ที่นี่เท่านั้น แต่ยังมีรูปแม่พระมารี, ประคำ และหุ่นพยนต์กับงานแกะสลักภาพวีรชนของลิทัวเนียอีกด้วย มีการประมาณจำนวนกางเขนทั้งหมดว่าอยู่ที่ประมาณ 55,000 ชิ้นในปี 1990 และประมาณ 100,000 ชิ้นในปี 2006\nในัวนที่ 7 กันยายน 1993 สมเด็จพระสันตะปาปายอห์น ปอลที่ 2 เสด็จเยือนเนินเขากางเขนและประกาศให้ที่นี่เป็นสถานที่แห่งความหวัง สันติภาพ ความรัก และการเสียสละ ในปี 2013 เทศบาลเขตเช็วเลย์ประกาศใช้กฎเกี่ยวกับการปักกางเขนที่เนินเขากางเขน โดยอนุญาตให้สามารถติดตั้งกางเขนไม้ขนาดสูงสุด 3 เมตรเท่านั้น หากมีความสูงมากกว่านั้นจะต้องทำเรื่องของใบอนุญาตจากเทศบาลก่อน ในเดือนธันวาคม 2019 มีรายงานว่านักท่องเที่ยวชาวจีนรายหนึ่งดึงและโยนกางเขนที่เข้าใจว่าผู้เรียกร้องประชาธิปไตยชาวฮ่องกงมาปักไว้ทิ้ง ซึ่งต่อมาถูกวิพากษ์วิจารณ์อย่างหนัก Linas …","other":"Hill of Crosses"},"en":{"title":"Hill of Crosses","url":"https://en.wikipedia.org/wiki/Hill_of_Crosses","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/Kry%C5%BEi%C5%B3_kalnas_%28G%C3%B3ra_Krzy%C5%BCy%29.JPG/960px-Kry%C5%BEi%C5%B3_kalnas_%28G%C3%B3ra_Krzy%C5%BCy%29.JPG?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Hill of Crosses (Lithuanian: ) is a site of pilgrimage about 12 km (7.5 mi) north of the city of Šiauliai, in northern Lithuania. The precise origin of the practice of leaving crosses on the hill is uncertain, but it is believed that the first crosses were placed on the former Jurgaičiai or Domantai hill fort after the 1831 Uprising. Over the generations, not only crosses and crucifixes, but statues of the Virgin Mary, carvings of Lithuanian patriots and thousands of tiny effigies and rosaries have been brought here by Catholic pilgrims.","history":"Over the generations, the place has come to signify the peaceful endurance of Lithuanian people despite the threats they faced throughout history. After the 3rd partition of the Polish–Lithuanian Commonwealth in 1795, Lithuania became part of the Russian Empire. Poles and Lithuanians unsuccessfully rebelled against Russian authorities in 1831 and 1863. These two uprisings are connected with the beginnings of the hill: as families could not locate bodies of perished rebels, they started putting up symbolic crosses at the site of a former hill fort.\nWhen the old political structure of Eastern Europe fell apart in 1918, Lithuania once again declared its independence. Throughout this time, the Hill of Crosses was used as a place for Lithuanians to pray for peace, for their country, and for the loved ones they had lost during the Wars of Independence.\nThe Lithuanian public was subject to religious persecution during the Soviet occupation from 1944 to 1990. Many of these endeavors included the persecution of clergy members, anti-religious propaganda, and the prohibition of religious …","other":"เนินเขากางเขน"}},{"th":{"title":"ซิกกุรัตแห่งอูร์","url":"https://th.wikipedia.org/wiki/%E0%B8%8B%E0%B8%B4%E0%B8%81%E0%B8%81%E0%B8%B8%E0%B8%A3%E0%B8%B1%E0%B8%95%E0%B9%81%E0%B8%AB%E0%B9%88%E0%B8%87%E0%B8%AD%E0%B8%B9%E0%B8%A3%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6b/Ziggarat_of_Ur_001.jpg/960px-Ziggarat_of_Ur_001.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ซิกกุรัตแห่งอูร์ (ซูเมอร์: 𒂍𒋼𒅎𒅍 é-temen-ní-gùru \"Etemenniguru\"; แปลตรงตัว \u0027วิหารที่ซึ่งฐานเปล่งรังสี\u0027) เป็นซิกกุรัตสมัยซูเมอร์ใหม่ ตั้งอยู่ในอดีตนครโบราณอูร์ ใกล้กับอันนาศิรียะฮ์ซึ่งในปัจจุบันอยู่ในเขตผู้ว่าการษีกอร ประเทศอิรัก สิ่งปลูกสร้างนี้สร้างขึ้นในยุคสัมฤทธิ์ตอนต้น (2,100 ปีก่อนคริสต์ศักราช) แต่ได้พังทลายลงมาเหลือแต่ซากเมื่อถึง 600 ปีก่อนคริสต์ศักราชในสมัยบาบิโลนใหม่ เมื่อกษัตริย์นาโบนีดุสมีรับสั่งให้บูรณะวิหารขึ้นใหม่","history":"ซิกกุรัตแห่งอูร์ (ซูเมอร์: 𒂍𒋼𒅎𒅍 é-temen-ní-gùru \"Etemenniguru\"; แปลตรงตัว \u0027วิหารที่ซึ่งฐานเปล่งรังสี\u0027) เป็นซิกกุรัตสมัยซูเมอร์ใหม่ ตั้งอยู่ในอดีตนครโบราณอูร์ ใกล้กับอันนาศิรียะฮ์ซึ่งในปัจจุบันอยู่ในเขตผู้ว่าการษีกอร ประเทศอิรัก สิ่งปลูกสร้างนี้สร้างขึ้นในยุคสัมฤทธิ์ตอนต้น (2,100 ปีก่อนคริสต์ศักราช) แต่ได้พังทลายลงมาเหลือแต่ซากเมื่อถึง 600 ปีก่อนคริสต์ศักราชในสมัยบาบิโลนใหม่ เมื่อกษัตริย์นาโบนีดุสมีรับสั่งให้บูรณะวิหารขึ้นใหม่\nซากของซิกกุรัตได้รับการขุดค้นในคริสต์ทศวรรษ 1920 และ 1930 โดยเซอร์เลเนิร์ด วุลลีย์ ต่อมาในคริสต์ทศวรรษ 1980 สมัยประธานาธิบดีซัดดัม ฮุสเซน มีการก่อผนังล้อมซิกกุรัตขึ้นบางส่วนและมีการสร้างบันไดขนาดมหึมาขึ้นประกอบ ซิกกุรัตแห่งอูร์ถือเป็นซิกกุรัตที่ได้รับการรักษาไว้ดีที่สุดของเมโสโปเตเมีย นอกเหนือจากซิกกุรัตโชฆอแซมบีล และเป็นหนึ่งในสามสิ่งปลูกสร้างจากนครอูร์ของซูเมอร์ใหม่ อีกสองแห่งคืออนุสรณ์ศพหลวงแห่งอูร์ และอูร์นัมมู\n== อ้างอิง ==","other":"Ziggurat of Ur"},"en":{"title":"Ziggurat of Ur","url":"https://en.wikipedia.org/wiki/Ziggurat_of_Ur","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6b/Ziggarat_of_Ur_001.jpg/960px-Ziggarat_of_Ur_001.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Ziggurat (or Great Ziggurat) of Ur (Sumerian: 𒂍𒋼𒅎𒅍 é-temen-ní-gùru \"Etemenniguru\", meaning \"house whose foundation creates terror\") is a Neo-Sumerian ziggurat in what was the city of Ur near Nasiriyah, in present-day Dhi Qar Province, Iraq. The structure was built during the Early Bronze Age (21st century BC) by King Ur-Nammu of the Third Dynasty of Ur. It had crumbled to ruins by the 6th century BC of the Neo-Babylonian period, when it was restored by King Nabonidus.","history":"The Ziggurat (or Great Ziggurat) of Ur (Sumerian: 𒂍𒋼𒅎𒅍 é-temen-ní-gùru \"Etemenniguru\", meaning \"house whose foundation creates terror\") is a Neo-Sumerian ziggurat in what was the city of Ur near Nasiriyah, in present-day Dhi Qar Province, Iraq. The structure was built during the Early Bronze Age (21st century BC) by King Ur-Nammu of the Third Dynasty of Ur. It had crumbled to ruins by the 6th century BC of the Neo-Babylonian period, when it was restored by King Nabonidus.\nIts remains were excavated in the 1920s and 1930s by international teams led by Sir Leonard Woolley. Under Saddam Hussein in the 1980s, they were encased by a partial reconstruction of the façade and the monumental staircase. Today, Ur Tourist City is being developed adjacent to the site to serve Christian pilgrims and tourists, based on later religious traditions that identify a nearby complex as the home of the patriarch Abraham. The Ziggurat of Ur is the best-preserved of those known from Mesopotamia, besides the ziggurat of Dur Untash (Chogha Zanbil). It is one of three well-preserved structures of the …","other":"ซิกกุรัตแห่งอูร์"}},{"th":{"title":"หอคอยบือไล","url":"https://th.wikipedia.org/wiki/%E0%B8%AB%E0%B8%AD%E0%B8%84%E0%B8%AD%E0%B8%A2%E0%B8%9A%E0%B8%B7%E0%B8%AD%E0%B9%84%E0%B8%A5","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/65/Torre_Bel%C3%A9m_April_2009-4a.jpg/960px-Torre_Bel%C3%A9m_April_2009-4a.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"หอคอยบือไล (โปรตุเกส: Torre de Belém) ตั้งอยู่ที่กรุงลิสบอน เมืองหลวงของประเทศโปรตุเกส หอคอยบือไลแห่งนี้ได้รับการขึ้นทะเบียนเป็นแหล่งมรดกโลกโดยยูเนสโกใน พ.ศ.","history":"หอคอยบือไล (โปรตุเกส: Torre de Belém) ตั้งอยู่ที่กรุงลิสบอน เมืองหลวงของประเทศโปรตุเกส หอคอยบือไลแห่งนี้ได้รับการขึ้นทะเบียนเป็นแหล่งมรดกโลกโดยยูเนสโกใน พ.ศ. 2526\nหอคอยแห่งสร้างขึ้นโดยพระเจ้าฌูเวาที่ 2 ในคริสต์ศตวรรษที่ 16 โดยใช้สถาปัตยกรรมแบบโปรตุเกส ซึ่งเป็นส่วนหนึ่งของระบบป้องกันเมืองริมฝั่งแม่น้ำเทกัส ตัวหอคอยบือไลประกอบไปด้วยหินอ่อนและตัวป้อมปราการมีความสูงกว่า 30 เมตร\n== อ้างอิง ==","other":"Belém Tower"},"en":{"title":"Belém Tower","url":"https://en.wikipedia.org/wiki/Bel%C3%A9m_Tower","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/65/Torre_Bel%C3%A9m_April_2009-4a.jpg/960px-Torre_Bel%C3%A9m_April_2009-4a.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Belém Tower (Portuguese: Torre de Belém, pronounced [ˈtoʁɨ ðɨ βɨˈlɐ̃j]; literally: Bethlehem Tower), officially the Tower of Saint Vincent (Portuguese: Torre de São Vicente), is a 16th-century fortification located in Lisbon, Portugal, which served as a point of embarkation and disembarkation for Portuguese explorers and as a ceremonial gateway to Lisbon. The tower symbolizes Portugal\u0027s maritime and colonial power in early modern Europe. It was built during the height of the Portuguese Renaissance and is a prominent example of the Portuguese Manueline style, but it also incorporates other architectural styles, such as the minarets, which are inspired by Moorish architecture.","history":"In the late 15th century, King John II had designed a defence system for the mouth of the Tagus that depended on the fortresses of Cascais and São Sebastião (or Torre Velha) in Caparica on the south side of the river. These fortresses did not completely protect the river\u0027s mouth, and further protection was required. In his \"Chronicle of John II\" (Chronica de D. Joao II), which appeared in 1545, the author Garcia de Resende affirmed the king\u0027s opinion that the defences of Lisbon were inadequate, and that he had insisted on building fortifications along the entrance to the River Tagus to supplement the existing defences. To this end, he ordered the \"making of a strong fort\", but died before any plans were drawn. King Manuel I of Portugal revisited the proposal twenty years later and ordered the construction of a military fortification on the northern margin of the Tagus at Belém. In 1513, Lourenço Fernandes wrote a letter to his friends referring to the king\u0027s intention of constructing a tower near Restelo Velho, having determined it to be essential.\nThe presence of this military …","other":"หอคอยบือไล"}},{"th":{"title":"ปาโชตักชัง","url":"https://th.wikipedia.org/wiki/%E0%B8%9B%E0%B8%B2%E0%B9%82%E0%B8%8A%E0%B8%95%E0%B8%B1%E0%B8%81%E0%B8%8A%E0%B8%B1%E0%B8%87","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/Bhutan-Paro-136-Taktshang-Tigernest-gje.jpg/960px-Bhutan-Paro-136-Taktshang-Tigernest-gje.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ปาโชตักชัง (ซองคา: སྤ་གྲོ་སྟག་ཚང་; Paro Taktsang) หรือเรียกโดยสั้นว่า ตักชัง หรือที่รู้จักในชื่อแปลว่า ถ้ำเสือ (อังกฤษ: Tiger\u0027s Nest) เป็นพุทธศาสนสถานพุทธแบบหิมาลัยวัชรยาน ตั้งอยู่บนหน้าผาในหุบเขาปาโร ประเทศภูฏาน ถือเป็นหนึ่งในสิบสามถ้ำเสือ (Tiger\u0027s Nest caves) ในทิเบตโบราณที่ซึ่งคุรุปัทมสัมภวะเคยเดินทางมาปฏิบัติธรรมและเผยแผ่พุทธศาสนาแบบวัชรยาน","history":"ปาโชตักชัง (ซองคา: སྤ་གྲོ་སྟག་ཚང་; Paro Taktsang) หรือเรียกโดยสั้นว่า ตักชัง หรือที่รู้จักในชื่อแปลว่า ถ้ำเสือ (อังกฤษ: Tiger\u0027s Nest) เป็นพุทธศาสนสถานพุทธแบบหิมาลัยวัชรยาน ตั้งอยู่บนหน้าผาในหุบเขาปาโร ประเทศภูฏาน ถือเป็นหนึ่งในสิบสามถ้ำเสือ (Tiger\u0027s Nest caves) ในทิเบตโบราณที่ซึ่งคุรุปัทมสัมภวะเคยเดินทางมาปฏิบัติธรรมและเผยแผ่พุทธศาสนาแบบวัชรยาน\nอาคารสิ่งปลูกสร้างของอารามเริ่มสร้างในปี 1692 โดยจุกที่สี่ กยัลเซ เต็นซิน รับกา รอบถ้ำที่คุรุปัทมสัมภวะเคยมาบำเพ็ญเพียรและได้สอนศิษย์ เช่น เยเช ซกยัล ก่อนจะเดินทางออกจากอาณาจักรทิเบตในศตวรรษที่ 9 คุรุปัทมสัมภวะถือเป็นผู้นำศาสนาพุทธนิกายวัชรยานมายังภูฏานซึ่งในเวลานั้นเป็นส่วนหนึ่งของดินแดนทิเบต ต่อมาคุรุปัทมสัมภวะได้รับการเคารพบูชาเป็นเทพารักษ์ของภูฏานจนถึงปัจจุบัน\nอารามนี้ในปัจจุบันเป็นสถานที่ท่องเที่ยวสำคัญและสัญลักษณ์หนึ่งของประเทศภูฏาน ทุก ๆ ปีจะมีการจัดเทศกาลเชชู ซึ่งจัดเพื่อระลึกถึงคุรุปัทมสัมภวะในแถบหุบเขาปาโร ระหว่างเดือนมีนาคมถึงเมษายน\n== อ้างอิง ==","other":"Paro Taktsang"},"en":{"title":"Paro Taktsang","url":"https://en.wikipedia.org/wiki/Paro_Taktsang","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/Paro_Taktsang%2C_Bhutan_%28edited%29.jpg/960px-Paro_Taktsang%2C_Bhutan_%28edited%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Paro Taktsang (Dzongkha: སྤ་གྲོ་སྟག་ཚང་, also known as the Taktsang Palphug Monastery and the Tiger\u0027s Nest) is a sacred Vajrayana Himalayan Buddhist site located in the cliffside of the upper Paro valley in Bhutan. It is one of thirteen Tiger\u0027s Nest caves in historical Tibet in which Padmasambhava practiced and taught Vajrayana.\nA later monastery complex was built in 1692 by the 4th Druk Desi Tenzin Rabgey around the Taktsang Senge Samdup cave, where Guru Padmasambhava meditated and practised with students, including Yeshe Tsogyal, before departing the kingdom of Tibet in the early 9th century.","history":"According to the Namthar of the Lhakhang, it is believed that Padmasambhava (Guru Rinpoche) flew to this location from Singye Dzong on the back of a tigress. Guru Rinpoche disguised himself as the wrathful Dorje Drolo, meditated in a cliffside cave, and then subjugated the malicious spirits.\nAn alternative legend holds that an emperor\u0027s former wife willingly became a disciple of Guru Rinpoche (Padmasambhava) in Tibet. She transformed herself into a tigress and carried the Guru on her back from Tibet to the present location of the Taktsang in Bhutan. In one of the caves here, the Guru then meditated and emerged in eight incarnate forms (manifestations), and the place became holy. Subsequently, the place came to be known as the \"Tiger\u0027s Nest\". \nThe popular legend of the Taktsang monastery is further embellished with the story of Tenzin Rabgye, who built the temple here in 1692. The authors have mentioned that the 8th-century guru Padmasambhava had reincarnated again as Tenzin Rabgye. The corroborative proofs mooted are: that Tenzin Rabgye was seen (by his friends) concurrently inside …","other":"ปาโชตักชัง"}},{"th":{"title":"โบสถ์สตาฟบอร์กุนด์","url":"https://th.wikipedia.org/wiki/%E0%B9%82%E0%B8%9A%E0%B8%AA%E0%B8%96%E0%B9%8C%E0%B8%AA%E0%B8%95%E0%B8%B2%E0%B8%9F%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%81%E0%B8%B8%E0%B8%99%E0%B8%94%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e2/Borgund_Stave_Church_in_L%C3%A6rdalen%2C_2013_June.jpg/960px-Borgund_Stave_Church_in_L%C3%A6rdalen%2C_2013_June.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"โบสถ์สตาฟบอร์กุนด์ (นอร์เวย์: Borgund stavkyrkje; Borgund Stave Church) เป็นอดีตโบสถ์สังฆมณฑล แรกเริ่มเป็นของคริสตจักรคาทอลิก และต่อมาเป็นคริสตจักรนอร์เวย์ ตั้งอยู่ในเทศมณฑลแลร์ดัล ในแคว้นเวสต์ลันด์ ประเทศนอร์เวย์ สร้างขึ้ยในราวปี 1200 เป็นโบสถ์ประจำหมู่บ้านในบอร์กุนด์ และใช้งานเป็นโบสถ์จนถึงปี 1868 ที่ซึ่งย้ายกิจการศาสนาไปยังโบสถ์บอร์กุนด์หลังใหม่ซึ่งตั้งอยู่ไม่ไกลกัน โบสถ์สตาฟหลังนี้ได้รับการบูรณะและแปรสภาพมาเป็นพิพิธภัณฑ์แทน ปัจจุบันได้รับเงินทนุสนับสนุนโดยสมาคมเพื่อการอนุรักษ์ปูชนียสถานโบราณแห่งนอร์เวย์ ในอาณาเขตโบสถ์ยังเป็นที่ตั้งของหอระฆังแยกเดี่ยวทรงสตาฟแห่งเดียวในนอร์เวย์ที่ยังเหลือถึงปัจจุบัน","history":"โบสถ์สตาฟบอร์กุนด์ (นอร์เวย์: Borgund stavkyrkje; Borgund Stave Church) เป็นอดีตโบสถ์สังฆมณฑล แรกเริ่มเป็นของคริสตจักรคาทอลิก และต่อมาเป็นคริสตจักรนอร์เวย์ ตั้งอยู่ในเทศมณฑลแลร์ดัล ในแคว้นเวสต์ลันด์ ประเทศนอร์เวย์ สร้างขึ้ยในราวปี 1200 เป็นโบสถ์ประจำหมู่บ้านในบอร์กุนด์ และใช้งานเป็นโบสถ์จนถึงปี 1868 ที่ซึ่งย้ายกิจการศาสนาไปยังโบสถ์บอร์กุนด์หลังใหม่ซึ่งตั้งอยู่ไม่ไกลกัน โบสถ์สตาฟหลังนี้ได้รับการบูรณะและแปรสภาพมาเป็นพิพิธภัณฑ์แทน ปัจจุบันได้รับเงินทนุสนับสนุนโดยสมาคมเพื่อการอนุรักษ์ปูชนียสถานโบราณแห่งนอร์เวย์ ในอาณาเขตโบสถ์ยังเป็นที่ตั้งของหอระฆังแยกเดี่ยวทรงสตาฟแห่งเดียวในนอร์เวย์ที่ยังเหลือถึงปัจจุบัน\nโบสถ์สร้างขึ้นด้วยรูปแบบโบสถ์ไม้ซึ่งเรียกว่าโบสถ์สตาฟ ภายในของโบสถ์มืดเนื่องจากไม่มีแสงสว่างลอดเข้ามามากนัก ยกเว้นแต่หน้าต่างรูปวงกลมตามแนวหลังคาซึ่งสร้างขึ้นเพื่อเป็นรูแสงเล็ก ๆ ที่เชื่อว่าช่วยกันไม่ให้ปิศาจร้ายเข้ามาภายในได้ ทางเข้าทั้งสามมีการประดับอย่างวิจิตรด้วยรูปงูและพันธุ์ไม้ ประตูมีขนาดกว้างพอให้เข้าได้ทีละคนเท่านั้น โดยสร้างขึ้นในลักษณะนี้เพราะเชื่อว่าจะช่วยป้องกันปิศาจร้ายไม่ให้ตามศาสนิกชนเข้าโบสถ์มาด้วยได้\n== อ้างอิง ==","other":"Borgund Stave Church"},"en":{"title":"Borgund Stave Church","url":"https://en.wikipedia.org/wiki/Borgund_Stave_Church","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e2/Borgund_Stave_Church_in_L%C3%A6rdalen%2C_2013_June.jpg/960px-Borgund_Stave_Church_in_L%C3%A6rdalen%2C_2013_June.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Borgund Stave Church (Norwegian: Borgund stavkyrkje) is a former parish church initially of the Catholic Church and later the Church of Norway in Lærdal Municipality in Vestland county, Norway. It was built around the year 1200 as the village church of Borgund, and belonged to Lærdal parish (part of the Sogn prosti (deanery) in the Diocese of Bjørgvin) until 1868, when its religious functions were transferred to a \"new\" Borgund Church, which was built nearby. The old church was restored, conserved and turned into a museum.","history":"Borgund Stave Church (Norwegian: Borgund stavkyrkje) is a former parish church initially of the Catholic Church and later the Church of Norway in Lærdal Municipality in Vestland county, Norway. It was built around the year 1200 as the village church of Borgund, and belonged to Lærdal parish (part of the Sogn prosti (deanery) in the Diocese of Bjørgvin) until 1868, when its religious functions were transferred to a \"new\" Borgund Church, which was built nearby. The old church was restored, conserved and turned into a museum. It is funded and run by the Society for the Preservation of Ancient Norwegian Monuments, and is classified as a triple-nave stave church of the Sogn-type. Its grounds contain Norway\u0027s sole surviving stave-built free-standing bell tower.","other":"โบสถ์สตาฟบอร์กุนด์"}}];

// ---------- geo ----------
function km(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const r = Math.PI / 180;
  const y = Math.sin((b.lon - a.lon) * r) * Math.cos(b.lat * r);
  const x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos((b.lon - a.lon) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}

function dailyResults() {

  const prefix = LS().slice(0, -dateKey.length), out = {};

  const solvedN = days.filter(d => res[d].solved).length;

  days.forEach(d => { if (res[d].solved && res[d].g.length >= 1 && res[d].g.length <= 5) dist[res[d].g.length - 1]++; });
  // current streak: consecutive finished days ending today (or yesterday if today isn't finished yet)

  ro.replaceChildren();
  const g = state.g[state.g.length - 1];
  if (!g) { ro.textContent = UX_T[LANG].prompt(1, MAX_GUESSES); return; }
  const d = guessKm(g), tr = tier(d);
  const label = typeof ROMAN !== "undefined" ? ROMAN[state.g.length - 1] : String(state.g.length);
  const chip = document.createElement("span"); chip.className = "fb t-" + tr;
  chip.textContent = `${label} · ${fmtKm(d)} ${t("km")}` + (tr === "hit" ? " ✓" : "");
  ro.append(chip, document.createTextNode(" " + UX_T[LANG].next));
}
function scrollToResult() {
  if (!matchMedia("(max-width: 899px)").matches) return;
  setTimeout(() => { const c = document.getElementById("resultCard"); if (c && !c.hidden) c.scrollIntoView({ behavior: "smooth", block: "start" }); }, 700);
}

// ---------- anonymous play data for testing (Google Sheet via Apps Script) ----------
const RESULTS_URL = "https://script.google.com/macros/s/AKfycbzzfkOnhgbwSgHddrvZ286gMrGv-RoBxYcIPE8hZWjf0y8s32OpezgJORBbGU01kKLHIQ/exec";
const EDITION = typeof ROMAN !== "undefined" ? "world" : "thai";
const PRIVACY_T = {
  th: "เกมเก็บผลการเล่นแบบไม่ระบุตัวตน (ข้อที่เล่น จำนวนหมุด ระยะ และเวลา) เพื่อนำไปปรับปรุงเกม",
  en: "The game records anonymous play results (riddle, pins, distance and time) to help improve it."
};
function playerId() {
  try {
    let id = localStorage.getItem("pikadlap:player");
    if (!id) { id = Math.random().toString(36).slice(2, 10); localStorage.setItem("pikadlap:player", id); }
    return id;
  } catch (e) { return "anon"; }
}
// the clock starts at the first tap on the map for today's riddle
map.on("click", () => { if (!state.done && !state.t0) { state.t0 = Date.now(); saveLocal(); } });
function sendResult() {
  if (PRACTICE !== null || !RESULTS_URL) return;
  const key = `pikadlap:sent:${EDITION}:${dateKey}`;
  try { if (localStorage.getItem(key)) return; localStorage.setItem(key, "1"); } catch (e) {}
  const body = {
    edition: EDITION, day: dateKey, file: dayIdx + 1, solved: !!state.solved, pins: state.g.length,
    bestKm: Math.round(bestKm(state) * 10) / 10,
    seconds: state.t0 ? Math.round((Date.now() - state.t0) / 1000) : "",
    device: /Line\//i.test(navigator.userAgent) ? "line" : (matchMedia("(max-width: 899px)").matches ? "mobile" : "desktop"),
    player: playerId(), lang: LANG
  };
  try { fetch(RESULTS_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).catch(() => {}); } catch (e) {}
}
// add the privacy line to the How-to-play list in whichever language is shown
const applyStaticBase = applyStatic;
applyStatic = function () {
  applyStaticBase();
  const li = document.createElement("li"); li.className = "privacy"; li.textContent = PRIVACY_T[LANG];
  document.getElementById("helpList").append(li);
};
// ---------- boot ----------
$("helpBtn").onclick = () => $("help").showModal();
applyStatic();
setupDay();
state = loadLocal() || state;
renderAll();
if (state.done) fitResult();
try { if (!state.g.length && !localStorage.getItem("pikadlap:seenHelpWorld")) { localStorage.setItem("pikadlap:seenHelpWorld", "1"); $("help").showModal(); } } catch (e) {}
</script>
