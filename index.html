ป็นหลัก นอกจากนี้ยังมีเอกสารลายลักษณ์อักษรตั้งแต่คริสต์ศตวรรษที่ 8 ถึง 13 ซึ่งกล่าวถึงเกาะนี้อย่างสั้น ๆ และไม่ต่อเนื่อง\nสเกลลิกไมเคิลปรากฏในงานร้อยแก้วหลายเรื่อง เช่น Conall Corc and the Corcu Loígde, Lebor Gabála Érenn และ Cath Finntrágha ส่วนประวัติอารามมีการกล่าวถึงในพงศาวดาร มรณสักขี และงานร้อยแก้วทางศาสนา เช่น Annals of Ulster, Annals of Inisfallen, Annals of the Four Masters, Martyrology of Tallaght และ Topographia Hibernica ของจีราลดุส กัมเบรนซิส\nตามตำนาน สเกลลิกไมเคิลมีความเกี่ยวข้องกับมนุษย์ตั้งแต่ยุคก่อนคริสต์ศาสนา เรื่องเล่าที่เก่าแก่ที่สุดเกี่ยวกับเกาะเชื่อมโยงกับการมาถึงของชาวไมลีเซียนในไอร์แลนด์ราว 1400 ปีก่อนคริสตกาลในวัฏจักรปกรณัมไอริช โดยเล่าว่าเกาะสเกลลิกไมเคิลเป็นสถานที่ฝังศพของเจ้าชายอีร์ บุตรของมิเล เอสปาเน่ ผู้เป็นบรรพบุรุษในตำนานของชาวเกลิกไอริช หลังจากที่เขาจมน้ำตายเนื่องจากพลังของบุตรธิดาแห่งเทพีดานู ต่อมา ราว ค.ศ. 200 สเกลลิกไมเคิลถูกเล่าว่าเป็นที่ซ่องสุมกำลังก่อนการบุกไอร์แลนด์ของ ดาเร ดอนน์ ผู้เป็นกษัตริย์แห่งโลก ก่อนการศึกกับฟิน แม็ค คูลในการศึกแห่งเวนทราย …","other":"Skellig Michael"},"en":{"title":"Skellig Michael","url":"https://en.wikipedia.org/wiki/Skellig_Michael","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d8/Skellig_Michael03%28js%29.jpg/960px-Skellig_Michael03%28js%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Skellig Michael (Irish: Sceilig Mhichíl [ˌʃcɛlʲəɟ ˈvʲɪçiːlʲ]), also called Great Skellig (Irish: Sceilig Mhór [ˈʃcɛlʲəɟ woːɾˠ]), is a twin-pinnacled crag 11.6 kilometres (7.2 mi) west of the Iveragh Peninsula in County Kerry, Ireland. The island is named after the archangel Michael; while \"Skellig\" is derived from the Irish language word sceilig, meaning a splinter of stone. Its twin island, Little Skellig (Sceilig Bheag), is smaller and inaccessible.","history":"Monks of the Celtic Christian tradition founded a monastery on Skellig Michael sometime between the 6th and 8th centuries. Like many early Christian sites in Kerry, it is said to have been founded by Saint Fionán in the early 6th century, though historians doubt this. Many of the islands off the south-west coast of Ireland have early Christian monasteries; the region was favoured because of its isolation and the abundance of rock for building. There is a concentration of monasteries off the Iveragh and Dingle peninsulas.\nThe first definite reference to monastic activity on the island is a record of the death of \"Suibhini of Skelig\" dating from the 8th century. The Annals of the Four Masters detail events at the Skelligs between the 9th and 11th centuries. The annals record a Viking attack in 823, when \"Skellig was plundered by the heathen and Eitgal [the abbot] was carried off and he died of hunger\". The Vikings again attacked in 838, sacking churches at Skellig, Kenmare, and Innisfallen Island. The Augustinian abbey in Ballinskelligs was founded in 950, the same year that Blathmhac …","other":"เกาะสเกลลิกไมเคิล"}},{"th":null,"en":{"title":"Callanish Stones","url":"https://en.wikipedia.org/wiki/Callanish_Stones","img":"https://upload.wikimedia.org/wikipedia/commons/7/77/Callanish_at_sunset_-_geograph.org.uk_-_820680.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"The Calanais Stones (also known as Calanais I; Scottish Gaelic: Clachan Chalanais or Tursachan Chalanais) are a prehistoric stone circle and stone alignment on the west coast of the Isle of Lewis in the Outer Hebrides of Scotland. The monument was built during the Neolithic period, around c. 2750 BC.\nThe stones form a circle with a tall central monolith and several rows of standing stones extending outward in different directions, creating a distinctive cross-shaped layout. The monument stands on a low ridge overlooking Loch Roag, near the village of Calanais.","history":"The Calanais Stones (also known as Calanais I; Scottish Gaelic: Clachan Chalanais or Tursachan Chalanais) are a prehistoric stone circle and stone alignment on the west coast of the Isle of Lewis in the Outer Hebrides of Scotland. The monument was built during the Neolithic period, around c. 2750 BC.\nThe stones form a circle with a tall central monolith and several rows of standing stones extending outward in different directions, creating a distinctive cross-shaped layout. The monument stands on a low ridge overlooking Loch Roag, near the village of Calanais.\nThe Calanais Stones are the central site within a wider landscape of prehistoric monuments on Lewis. Several other stone circles and settings lie nearby, including Callanish II, Callanish III, Callanish IV, and Callanish VIII, forming what archaeologists often describe as the Calanais complex.\nArchaeological evidence shows that the site was used for ceremonial activity for many centuries during the Neolithic and Bronze Age. Today, the stones are among the most important prehistoric monuments in Britain and are protected as a …","other":null}},{"th":{"title":"ถ้ำลัสโก","url":"https://th.wikipedia.org/wiki/%E0%B8%96%E0%B9%89%E0%B8%B3%E0%B8%A5%E0%B8%B1%E0%B8%AA%E0%B9%82%E0%B8%81","img":"https://upload.wikimedia.org/wikipedia/commons/1/1e/Lascaux_painting.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"ถ้ำลัสโก (ฝรั่งเศส: grotte de Lascaux) ตั้งอยู่บริเวณหุบเขาทางตะวันตกเฉียงใต้ของประเทศฝรั่งเศส ภายในถ้ำมีภาพวาดยุคหิน มีอายุตั้งแต่ 15,000 ปี ก่อนคริสต์ศักราช มีภาพวาดรูปสัตว์ต่าง ๆ เช่นภาพฝูงกวาง ภาพกระทิงดำขนาดใหญ่ และภาพวาดต่าง ๆ อีกประมาณ 2,000 ภาพ","history":"ถ้ำลัสโก (ฝรั่งเศส: grotte de Lascaux) ตั้งอยู่บริเวณหุบเขาทางตะวันตกเฉียงใต้ของประเทศฝรั่งเศส ภายในถ้ำมีภาพวาดยุคหิน มีอายุตั้งแต่ 15,000 ปี ก่อนคริสต์ศักราช มีภาพวาดรูปสัตว์ต่าง ๆ เช่นภาพฝูงกวาง ภาพกระทิงดำขนาดใหญ่ และภาพวาดต่าง ๆ อีกประมาณ 2,000 ภาพ","other":"Lascaux"},"en":{"title":"Lascaux","url":"https://en.wikipedia.org/wiki/Lascaux","img":"https://upload.wikimedia.org/wikipedia/commons/1/1e/Lascaux_painting.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"Lascaux (English:  la-SKOH, US also  lah-SKOH; French: Grotte de Lascaux French pronunciation: [ɡʁɔt də lasko], \"Lascaux Cave\") is a network of caves near the village of Montignac, in the department of Dordogne in southwestern France. Over 600 parietal wall paintings cover the interior walls and ceilings of the cave. The paintings represent primarily large animals, typical local contemporary fauna that correspond with the fossil record of the Upper Paleolithic in the area.","history":"On 12 September 1940, the entrance to the Lascaux Cave was discovered on the La Rochefoucauld-Montbel lands by 18-year-old Marcel Ravidat when his dog investigated a hole left by an uprooted tree (Ravidat would embellish the story in later retellings, saying the dog had fallen into the cave). Ravidat returned to the scene with three friends: Jacques Marsal, Georges Agnel, and Simon Coencas. They entered the cave through a 15-metre-deep (50-foot) shaft that they believed might be a legendary secret passage to the nearby Lascaux Manor. \nThe teenagers discovered that the cave walls were covered with depictions of animals. Galleries that suggest continuity, context or simply represent a cavern were given names. Those include the Hall of the Bulls, the Passageway, the Shaft, the Nave, the Apse, and the Chamber of Felines. They returned along with the Abbé Henri Breuil on 21 September 1940; Breuil would make many sketches of the cave, some of which are used as study material today due to the extreme degradation of many of the paintings. Breuil was accompanied by Denis Peyrony, curator of …","other":"ถ้ำลัสโก"}},{"th":null,"en":{"title":"Wieliczka Salt Mine","url":"https://en.wikipedia.org/wiki/Wieliczka_Salt_Mine","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/%CE%91%CE%BB%CE%B1%CF%84%CF%89%CF%81%CF%85%CF%87%CE%B5%CE%AF%CE%B1_%CE%92%CE%B9%CE%B5%CE%BB%CE%AF%CF%84%CF%83%CE%BA%CE%B1_5021.jpg/960px-%CE%91%CE%BB%CE%B1%CF%84%CF%89%CF%81%CF%85%CF%87%CE%B5%CE%AF%CE%B1_%CE%92%CE%B9%CE%B5%CE%BB%CE%AF%CF%84%CF%83%CE%BA%CE%B1_5021.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Wieliczka Salt Mine (Polish: Kopalnia soli Wieliczka) is a salt mine in the town of Wieliczka, near Kraków in southern Poland.\nFrom Neolithic times, sodium chloride (table salt) was produced there from the upwelling brine. The Wieliczka salt mine, excavated from the 13th century, produced table salt continuously until 1996, as one of the world\u0027s oldest operating salt mines.","history":"The first documentation of the mine dates from 1044, when Casimir I granted a privilege. Monks collected salt around that time.\nSince the 13th century, brine welling up to the surface had been collected and processed for its sodium chloride (table-salt) content. In this period, wells began to be sunk, and the first shafts to be dug to extract the rock salt. From the late 13th to the early 14th century, the Saltworks Castle was built. Wieliczka is now home to the Kraków Saltworks Museum.\nKing Casimir III the Great contributed greatly to the development of the Wieliczka Salt Mine, granting it many privileges and taking the miners under his care. In 1363 he founded a hospital near the salt mine. It is said that he turned a Poland of wood into a Poland of stone due to the great amount of wood from the neighbouring forests used as scaffolding and supports. This has brought huge revenues to the state.\nBy 1871, the mine was considered one of the most productive in the world. Scientific American identified three different qualities of salt around this time. Green salt contained clay and was …","other":null}},{"th":null,"en":{"title":"Cliff Palace","url":"https://en.wikipedia.org/wiki/Cliff_Palace","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Cliff_Palace-Colorado-Mesa_Verde_NP.jpg/960px-Cliff_Palace-Colorado-Mesa_Verde_NP.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Cliff Palace is the largest cliff dwelling in North America. The structure built by the Ancestral Puebloans is located in Mesa Verde National Park in their former homeland region. The cliff dwelling and park are in Montezuma County, in the southwestern corner of Colorado, Southwestern United States.","history":"It is believed that Cliff Palace was constructed and lived in from about 1200 A.D. to 1300 A.D. The Ancestral Puebloans who constructed this cliff dwelling and the others like it at Mesa Verde were driven to these defensible positions by \"increasing competition amidst changing climatic conditions\". Cliff Palace was abandoned by 1300, though debate is ongoing as to the cause. Some contend that a series of megadroughts interrupting food production systems was the main cause.\nCliff Palace was rediscovered in December 1888 by Richard Wetherill and his brother-in-law, Charlie Mason, while they were looking for stray cattle. Wetherill and Mason also rediscovered Spruce Tree House and Square Tower House, which are also located in Mesa Verde. According to Wetherill and Mason, they \"followed the Indian trail down Chapin Mesa, between Cliff and Navajo canyons, and camped at the head of a small branch of the Cliff Palace fork of Cliff Cañon.\" Wetherill and Mason spent time after finding the dwellings looking at artifacts found within the cliff. According to Mason, they found a stone axe \"with …","other":null}},{"th":null,"en":{"title":"Tikal Temple I","url":"https://en.wikipedia.org/wiki/Tikal_Temple_I","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Tikal_Temple1_2006_08_11.JPG/960px-Tikal_Temple1_2006_08_11.JPG?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Tikal Temple I is the designation given to one of the major structures at Tikal, one of the largest cities and archaeological sites of the pre-Columbian Maya civilization in Mesoamerica. It is located in the Petén Basin region of northern Guatemala. It also is known as the Temple of the Great Jaguar because of a lintel that represents a king sitting upon a jaguar throne.","history":"Tikal Temple I is the designation given to one of the major structures at Tikal, one of the largest cities and archaeological sites of the pre-Columbian Maya civilization in Mesoamerica. It is located in the Petén Basin region of northern Guatemala. It also is known as the Temple of the Great Jaguar because of a lintel that represents a king sitting upon a jaguar throne. An alternative name is the Temple of Ah Cacao, after the ruler buried in the temple. Temple I is a typically Petén-styled limestone stepped pyramid structure that is dated to approximately 732 AD.\nSituated at the heart of a World Heritage Site, the temple is surmounted by a characteristic roof comb, a distinctive Maya architectural feature. Building Temple I on the eastern side of the Great Plaza was a significant deviation from the established tradition of building funerary temples just north of the plaza in Tikal\u0027s North Acropolis.","other":null}},{"th":{"title":"สีคิริยะ","url":"https://th.wikipedia.org/wiki/%E0%B8%AA%E0%B8%B5%E0%B8%84%E0%B8%B4%E0%B8%A3%E0%B8%B4%E0%B8%A2%E0%B8%B0","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c7/Sigiriya.jpg/960px-Sigiriya.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"สีคิริยะ (สิงหล: සීගිරිය) หรือ หินราชสีห์ เป็นเมืองในอำเภอมาตเล จังหวัดกลาง ตอนกลางของประเทศศรีลังกา ประกอบด้วยหินปลักภูเขาไฟความสูงประมาณ 370 เมตร ป้อมปราการและปราสาทโบราณ รายล้อมด้วยสวนหย่อมและระบบชลประทาน  ปัจจุบันเป็นสถานที่ท่องเที่ยวสำคัญของศรีลังกา โดยเฉพาะจิตรกรรมฝาผนังโบราณ ได้รับการพิจารณาเป็นมรดกโลกหนึ่งในแปดแห่งของประเทศ\nสีคิริยะมีประชากรอยู่อาศัยมาตั้งแต่ยุคก่อนประวัติศาสตร์ มีหลักฐานการสร้างวิหารพุทธมาตั้งแต่ศตวรรษที่ 5 ก่อนคริสตกาล ในคัมภีร์มหาวงศ์ระบุว่าป้อมปราการเหล่านี้สร้างขึ้นในคริสตศวรรษที่ 5 โดยพระเจ้ากัสสปะ ระหว่าง ค.ศ. 447 ถึง ค.ศ.","history":"สีคิริยะ (สิงหล: සීගිරිය) หรือ หินราชสีห์ เป็นเมืองในอำเภอมาตเล จังหวัดกลาง ตอนกลางของประเทศศรีลังกา ประกอบด้วยหินปลักภูเขาไฟความสูงประมาณ 370 เมตร ป้อมปราการและปราสาทโบราณ รายล้อมด้วยสวนหย่อมและระบบชลประทาน  ปัจจุบันเป็นสถานที่ท่องเที่ยวสำคัญของศรีลังกา โดยเฉพาะจิตรกรรมฝาผนังโบราณ ได้รับการพิจารณาเป็นมรดกโลกหนึ่งในแปดแห่งของประเทศ\nสีคิริยะมีประชากรอยู่อาศัยมาตั้งแต่ยุคก่อนประวัติศาสตร์ มีหลักฐานการสร้างวิหารพุทธมาตั้งแต่ศตวรรษที่ 5 ก่อนคริสตกาล ในคัมภีร์มหาวงศ์ระบุว่าป้อมปราการเหล่านี้สร้างขึ้นในคริสตศวรรษที่ 5 โดยพระเจ้ากัสสปะ ระหว่าง ค.ศ. 447 ถึง ค.ศ. 495 เพื่อป้องกันการชิงราชบัลลังก์จากพระเจ้าโมคคัลลานะ พระเชษฐาของพระองค์","other":"Sigiriya"},"en":{"title":"Sigiriya","url":"https://en.wikipedia.org/wiki/Sigiriya","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/Sigiriya_%28141688197%29.jpeg/960px-Sigiriya_%28141688197%29.jpeg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Sigiriya or Sinhagiri (Lion  Rock Sinhala: සීගිරිය, Tamil: சிகிரியா/சிங்ககிரி, ) is an ancient rock fortress located in the northern Matale District near the town of Dambulla in the Central Province, Sri Lanka. It is a site of historical and archaeological significance that is dominated by a massive column of granite approximately 180 m (590 ft) high.\nAccording to the ancient Sri Lankan chronicle the Cūḷavaṃsa, this area was a large forest, then after storms and landslides it became a hill and was selected by King Kashyapa (CE 477–495) for his new capital.","history":"It is likely that the area around Sigiriya was inhabited since prehistoric times. There is clear evidence from Brahmi inscriptions on the western side of Sigiriya that the many rock shelters and caves in the vicinity were occupied by Buddhist monks and ascetics from as early as the 1st or 2nd century BCE. The earliest evidence of human habitation at Sigiriya is the Aligala rock shelter to the east of Sigiriya rock, indicating that the area was occupied circa 3000 BCE during the Mesolithic Period.\n \nBuddhist monastic settlements were established during the 3rd century BCE in the western and northern slopes of the boulder-strewn hills surrounding the Sigiriya rock. Several rock shelters or caves were created during this period. These shelters were made under large boulders, with carved drip ledges around the cave mouths. Rock inscriptions are carved near the drip ledges on many of the shelters, recording the donation of the shelters to the Buddhist monastic order as residences. These were made in the period between the 3rd century BCE and the 1st century CE.\nThe Cūḷavaṃsa describes …","other":"สีคิริยะ"}},{"th":{"title":"ไกรลาศมนเทียร (เอลโลรา)","url":"https://th.wikipedia.org/wiki/%E0%B9%84%E0%B8%81%E0%B8%A3%E0%B8%A5%E0%B8%B2%E0%B8%A8%E0%B8%A1%E0%B8%99%E0%B9%80%E0%B8%97%E0%B8%B5%E0%B8%A2%E0%B8%A3_(%E0%B9%80%E0%B8%AD%E0%B8%A5%E0%B9%82%E0%B8%A5%E0%B8%A3%E0%B8%B2)","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Kailasha_temple_at_ellora.JPG/960px-Kailasha_temple_at_ellora.JPG?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ไกรลาศมนเทียร (ไอเอเอสที: Kailāśa) หรือ ไกรลาศนาถมนเทียร (Kailāśanātha) เป็นมนเทียรเจาะหินที่ใหญ่ที่สุดในประเทศอินเดีย ตั้งอยู่ในหมู่ถ้ำเอลโลรา รัฐมหาราษฏระ ประเทศอินเดีย มณเฑียรนี้เป็นลักษณะการเจาะเข้าไปในหินใหญ่ก้อนเดี่ยว (เมกาลิธ) เข้าไปในหน้าผาหิน และเป็นหนึ่งในมนเทียรถ้ำที่เป็นที่รู้จักมากที่สุดด้วยขนาดที่ใหญ่โตของมณเฑียร, สถาปัตยกรรม และศิลปกรรมของมณเฑียร และเป็น \"จุดสูงสุดของยุคเจาะหินของสถาปัตยกรรมอินเดีย\" ส่วนบนของหอตรงกลางในโครงสร้างหลักมีความสูง 32.6 เมตรจากพื้นด้านล่าง","history":"ไกรลาศมนเทียร (ไอเอเอสที: Kailāśa) หรือ ไกรลาศนาถมนเทียร (Kailāśanātha) เป็นมนเทียรเจาะหินที่ใหญ่ที่สุดในประเทศอินเดีย ตั้งอยู่ในหมู่ถ้ำเอลโลรา รัฐมหาราษฏระ ประเทศอินเดีย มณเฑียรนี้เป็นลักษณะการเจาะเข้าไปในหินใหญ่ก้อนเดี่ยว (เมกาลิธ) เข้าไปในหน้าผาหิน และเป็นหนึ่งในมนเทียรถ้ำที่เป็นที่รู้จักมากที่สุดด้วยขนาดที่ใหญ่โตของมณเฑียร, สถาปัตยกรรม และศิลปกรรมของมณเฑียร และเป็น \"จุดสูงสุดของยุคเจาะหินของสถาปัตยกรรมอินเดีย\" ส่วนบนของหอตรงกลางในโครงสร้างหลักมีความสูง 32.6 เมตรจากพื้นด้านล่าง\nไกรลาศมนเทียรเป็นมณเฑียรถ้ำในถ้ำหมายเลข 16 จาก 34 ถ้ำในหมู่ถ้ำเอลโลรา ที่สร้างโดยเจาะเข้าไปในหน้าผาหินบะซอลต์ การเจาะถ้ำส่วนใหญ่สร้างขึ้นในรัชสมัยของกษัตริย์ราษฏรกูฏ พระเจ้ากฤษณาที่หนึ่ง (ค. ป. 756 – 773) และบางส่วนที่มีการสร้างต่อจนสำเร็จในภายหลัง มนเทียรต่าง ๆ สร้างขึ้นโดยปรากฏลักษณะของสถาปัตยกรรมปัลลวะ และจาลุกยะ นอกจากประติมากรรมและงานแกะสลักที่วิจิตรแล้ว ยังพบร่องรอยของจิตกรรมฝาผนังที่งดงามหลงเหลือจาง ๆ ในบางส่วน","other":"Kailasa Temple, Ellora"},"en":{"title":"Kailasa Temple, Ellora","url":"https://en.wikipedia.org/wiki/Kailasa_Temple,_Ellora","img":"https://upload.wikimedia.org/wikipedia/en/f/fc/Kailash_temple_%28Ellora_cave_no_15%29_at_Verul.png?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"The Kailasha (IAST: Kailāśa) or Kailasha-natha (IAST: Kailāśa-nātha) temple is the largest of the rock-cut Hindu temples at the Ellora Caves in Chhatrapati Sambhaji Nagar district of Maharashtra, India.\nA megalith carved into a cliff face, it is considered one of the most remarkable cave temples in the world because of its size, architecture, and sculptural treatment. It has been called \"the climax of the rock-cut phase of Indian architecture\".","history":"The Kailasa temple lacks a dedicatory inscription, but there is no doubt that it was commissioned by a Rashtrakuta ruler. Its construction is generally attributed to the Rashtrakuta king Krishna I (r. 756–773 CE), based on two epigraphs that link the temple to \"Krishnaraja\" (IAST Kṛṣṇarāja):\nThe Vadodara copper-plate inscription (c. 812–813 CE) of Karkaraja II (a ruler of a Rashtrakuta branch of Gujarat) records the grant of a village in present-day Gujarat. It mentions Krishnaraja as the patron of Kailasanatha, and also mentions a Shiva temple at Elapura (Ellora). It states that the king constructed a temple so wondrous that even the gods and the architect were astonished. Most scholars believe that this is a reference to the Kailasanatha Shiva temple at Ellora.\nThe Kadaba grant of Govinda Prabhutavarsha, discovered at Kadaba hobli in Gubbi taluka, similarly appears to credit Krishnaraja with the construction of the temple.\nHowever, the attribution of the temple to Krishna I is not completely certain because these epigraphs are not physically connected to the caves, and do not date …","other":"ไกรลาศมนเทียร (เอลโลรา)"}},{"th":null,"en":{"title":"Great Zimbabwe","url":"https://en.wikipedia.org/wiki/Great_Zimbabwe","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/Conical_Tower_-_Great_Enclosure_III_%2833736918448%29.jpg/960px-Conical_Tower_-_Great_Enclosure_III_%2833736918448%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Great Zimbabwe was a city in the south-eastern hills of the modern country of Zimbabwe, near Masvingo. It was settled from around 1000 AD, and served as the capital of the Kingdom of Great Zimbabwe from the 13th century. It is the largest stone structure in precolonial Southern Africa.","history":"The Great Zimbabwe area was previously settled by the San, dating back 100,000 years. Starting around 150 BC, Bantu-speaking peoples settled there, forming agricultural chiefdoms starting in the 4th century AD. Between the 4th and the 7th centuries, communities of the Gokomere or Ziwa cultures farmed the valley, and mined and worked iron, but built no stone structures. These are the earliest Iron Age settlements in the area identified from archaeological diggings.\nThe later Gumanye people are considered the ancestors of the Karanga (south-central Shona), who would construct Great Zimbabwe. Their culture developed and lasted centuries.\nConstruction of the stone buildings started in the 11th century and continued for over 300 years. Agriculture and cattle were the basis of the people developing a vital social network, and served to \"enfranchise management of goods and services distributed as benefits within traditional political and social institutions\". Long-distance trade was crucial for the transformation of localised organisations into regional ones. The ruling dynasty used their …","other":null}},{"th":null,"en":{"title":"Djinguereber Mosque","url":"https://en.wikipedia.org/wiki/Djinguereber_Mosque","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Djingareiber_cour.jpg/960px-Djingareiber_cour.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Djinguereber Mosque (Arabic: مسجد دجينجيربر; French: Mosquée de Djinguereber; from Koyra Chiini jiŋgar-ey beer \u0027grand mosque\u0027), also known as Djingareyber or Djingarey Ber, is a famous learning center in Timbuktu, Mali. Built in 1327, it is one of three mosques associated with the historical community of scholars and students known today as the \"University of Timbuktu\". It was inscribed on the list of UNESCO World Heritage Sites in 1988.","history":"The creation of Djinguereber mosque is attributed to Mansa Musa in 1325. Its Sudano-Sahelian architecture differs stylistically from the mosques of North Africa and Andalusia. \nThe mosque is sometimes credited to the Granadan poet Abū Isḥāq al-Sāḥilī, whom Mansa Musa brought to Mali after the 1324 hajj, but J. O. Hunwick has shown that al-Sāḥilī is firmly attested in the Arabic sources only as the designer of a royal audience chamber at the city of Mali, and that his role there appears to have been organisational rather than that of a structural architect.\nDuring the reign of Askia Dawud of the Songhai Empire, Djinguereber mosque was renovated by the Qadi of Timbuktu Aqib ibn Mahmud beginning in 1570. The work was a source of conflict between the Askia and the Qadi, who resented the renovated mosque\u0027s association with a secular power.\nOn 26 February 2010, during Mawlid (a festival to mark the birth anniversary of Muhammad), a stampede at the mosque killed around 26 people and injured at least 55 others, mostly women and children.\nOn 1 July 2012, militant Islamists of the Ansar Dine …","other":null}},{"th":{"title":"โบสถ์น้อยซิสทีน","url":"https://th.wikipedia.org/wiki/%E0%B9%82%E0%B8%9A%E0%B8%AA%E0%B8%96%E0%B9%8C%E0%B8%99%E0%B9%89%E0%B8%AD%E0%B8%A2%E0%B8%8B%E0%B8%B4%E0%B8%AA%E0%B8%97%E0%B8%B5%E0%B8%99","img":"https://upload.wikimedia.org/wikipedia/commons/8/82/Sistina-interno.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"โบสถ์น้อยซิสทีน (อังกฤษ: Sistine Chapel; อิตาลี: Cappella Sistina) เป็นโบสถ์น้อยภายในพระราชวังพระสันตะปาปา ซึ่งเป็นที่ประทับอย่างเป็นทางการของพระสันตะปาปาในนครรัฐวาติกัน โบสถ์น้อยซิสทีนมึชื่อเสียงในทางสถาปัตยกรรมเพราะเป็นสถานที่ที่ทำให้ระลึกถึงพระวิหารของพระเจ้าโซโลมอนในพันธสัญญาเดิม, การตกแต่ง, จิตรกรรมฝาผนังโดยจิตรกรผู้มีชื่อเสียงในสมัยฟื้นฟูศิลปวิทยารวมทั้งมีเกลันเจโลผู้วาดเพดานของโบสถ์จนที่เป็นที่เลื่องลือ และสุดท้ายคือเป็นสถานที่จัดการประชุมเลือกสันตะปาปาองค์ใหม่ทุกครั้ง","history":"โบสถ์น้อยซิสทีน (อังกฤษ: Sistine Chapel; อิตาลี: Cappella Sistina) เป็นโบสถ์น้อยภายในพระราชวังพระสันตะปาปา ซึ่งเป็นที่ประทับอย่างเป็นทางการของพระสันตะปาปาในนครรัฐวาติกัน โบสถ์น้อยซิสทีนมึชื่อเสียงในทางสถาปัตยกรรมเพราะเป็นสถานที่ที่ทำให้ระลึกถึงพระวิหารของพระเจ้าโซโลมอนในพันธสัญญาเดิม, การตกแต่ง, จิตรกรรมฝาผนังโดยจิตรกรผู้มีชื่อเสียงในสมัยฟื้นฟูศิลปวิทยารวมทั้งมีเกลันเจโลผู้วาดเพดานของโบสถ์จนที่เป็นที่เลื่องลือ และสุดท้ายคือเป็นสถานที่จัดการประชุมเลือกสันตะปาปาองค์ใหม่ทุกครั้ง","other":"Sistine Chapel"},"en":{"title":"Sistine Chapel","url":"https://en.wikipedia.org/wiki/Sistine_Chapel","img":"https://upload.wikimedia.org/wikipedia/commons/8/82/Sistina-interno.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"The Sistine Chapel ( SIST-een; Latin: Sacellum Sixtinum; Italian: Cappella Sistina [kapˈpɛlla siˈstiːna]) is a chapel in the Apostolic Palace, the pope\u0027s official residence in Vatican City. Originally known as the Cappella Magna (\u0027Great Chapel\u0027), it takes its name from Pope Sixtus IV, who had it built between 1473 and 1481. Since that time, it has served as a place of both religious and functionary papal activity.","history":"While known as the location of papal conclaves, the primary function of the Sistine Chapel is as the chapel of the Papal Chapel (Cappella Pontificia), one of the two bodies of the papal household, called until 1968 the Papal Court (Pontificalis Aula). At the time of Pope Sixtus IV in the late 15th century, the Papal Chapel comprised about 200 people, including clerics, officials of the Vatican and distinguished laity. There were 50 occasions during the year on which it was prescribed by the Papal Calendar that the whole Papal Chapel should meet. Of these 50 occasions, 35 were masses, of which 8 were held in basilicas, in general St. Peter\u0027s, and were attended by large congregations. These included the Christmas Day and Easter masses at which the Pope himself was the celebrant. The other 27 masses could be held in a smaller, less public space, for which the Cappella Maggiore was used before it was rebuilt on the same site as the Sistine Chapel.\nThe Cappella Maggiore derived its name, the Greater Chapel, from the fact that there was another chapel also in use by the Pope and his …","other":"โบสถ์น้อยซิสทีน"}},{"th":{"title":"พระพุทธรูปเล่อชาน","url":"https://th.wikipedia.org/wiki/%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%9E%E0%B8%B8%E0%B8%97%E0%B8%98%E0%B8%A3%E0%B8%B9%E0%B8%9B%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%AD%E0%B8%8A%E0%B8%B2%E0%B8%99","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/Leshan_Giant_Buddha%2C_China%2C_2004_-_StrangeInterlude.jpg/960px-Leshan_Giant_Buddha%2C_China%2C_2004_-_StrangeInterlude.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"พระพุทธรูปเล่อชาน เป็นพระพุทธรูปองค์ใหญ่ที่สุดในโลก ตั้งอยู่ในภูเขาเล่อ (เล่อชาน) เมืองเฉิงตู มณฑลเสฉวน ประเทศจีน ได้รับลงทะเบียนเป็นมรดกโลกร่วมกับภูเขาเอ๋อเหมย์เมื่อปี พ.ศ.","history":"พระพุทธรูปเล่อชานเริ่มสร้างตั้งแต่สมัยราชวงศ์ถัง คือคริสต์ศักราช 700 กว่าปี เริ่มต้นโดยมีพระชื่อไห่ทงเดินทางมาถึงเสฉวน และพบว่าเขาเล่อชานตั้งอยู่บนทางผ่านของแม่น้ำสามสาย จึงมักเกิดอุบัติเหตุเรือล่มทำให้มีผู้คนเสียชีวิตบ่อย ๆ พระไห่ทงจึงตั้งใจสร้างพระพุทธรูปองค์ใหญ่ขึ้นตรงจุดนี้เพื่อให้พระคุ้มครองแก่ผู้เดินทาง\nต่อมา มีชาวพุทธผู้มีจิตศรัทธาใช้ความพยายามและใช้เวลาอีก 70 ปี สร้างพระพุทธรูปองค์นี้จนสำเร็จ พุทธศาสนิกชนจากท้องที่ต่าง ๆ พากันมานมัสการเพื่อความสงบสุขแห่งจิตใจ","other":"Leshan Giant Buddha"},"en":{"title":"Leshan Giant Buddha","url":"https://en.wikipedia.org/wiki/Leshan_Giant_Buddha","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/36275-Leshan_%2849067653383%29.jpg/960px-36275-Leshan_%2849067653383%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Leshan Giant Buddha is a 71-meter (233 ft) tall stone statue, built between 712 and 804 AD (during the Tang dynasty). It is carved out of a cliff face of Cretaceous red bed sandstones that lies at the confluence of the Min River and Dadu River in the southern part of Sichuan Province in China, near the city of Leshan. The stone sculpture faces Mount Emei, with the rivers flowing below its feet.","history":"Construction started in 722 AD, led by a Chinese Buddhist monk named Hai Tong. He believed that Maitreya Buddha would calm the turbulent waters that constantly plagued the shipping vessels traveling down the river. When funding for the project was threatened, he is said to have gouged out his own eyes to show his piety and sincerity. After his death, however, the construction was delayed due to insufficient funding. The statue was only completed from the shoulders up at the time. Several years later, Hai Tong\u0027s disciples continued work on the statue with financial support from a local official named Zhangchou Jianxiong. Hai Tong\u0027s disciples continued the construction until the Knees, when construction was halted because Zhangchou JianXiang was called back to serve at the royal court in Chang\u0027an. About 70 years later, Jiedushi Wei Gao continued to support and funded the project and the construction was finally completed by Hai Tong\u0027s disciples in 803.\nBy the beginning of the Northern Song dynasty, the Leshan Giant Buddha had been damaged—the body was covered in moss, and the wooden …","other":"พระพุทธรูปเล่อชาน"}},{"th":{"title":"เกาะโรบเบิน","url":"https://th.wikipedia.org/wiki/%E0%B9%80%E0%B8%81%E0%B8%B2%E0%B8%B0%E0%B9%82%E0%B8%A3%E0%B8%9A%E0%B9%80%E0%B8%9A%E0%B8%B4%E0%B8%99","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f1/SafrikaIMG_8414.JPG/960px-SafrikaIMG_8414.JPG?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"เกาะโรบเบิน (อังกฤษ: Robben Island; อาฟรีกานส์: Robbeneiland) หรือเกาะแมวน้ำ (Seal Island) เป็นเกาะแห่งหนึ่งในอ่าวเทเบิล ห่างจากชายฝั่งเคปทาวน์ในประเทศแอฟริกาใต้ไปประมาณ 7 กิโลเมตร ชื่อเกาะเป็นคำในภาษาดัตช์ซึ่งหมายถึง เกาะแมวน้ำ เกาะนี้มีรูปร่างคล้ายรูปไข่ ความยาวจากเหนือจรดใต้ราว 3.3 กิโลเมตร ความกว้าง 1.9 กิโลเมตร มีพื้นที่รวมประมาณ 5.07 ตารางกิโลเมตร เกาะค่อนข้างเป็นที่ราบและอยู่สูงกว่าระดับน้ำทะเลเล็กน้อย ประกอบด้วยหินแปร Precambrian ในกลุ่ม Malmesbury Group","history":"เกาะโรบเบิน (อังกฤษ: Robben Island; อาฟรีกานส์: Robbeneiland) หรือเกาะแมวน้ำ (Seal Island) เป็นเกาะแห่งหนึ่งในอ่าวเทเบิล ห่างจากชายฝั่งเคปทาวน์ในประเทศแอฟริกาใต้ไปประมาณ 7 กิโลเมตร ชื่อเกาะเป็นคำในภาษาดัตช์ซึ่งหมายถึง เกาะแมวน้ำ เกาะนี้มีรูปร่างคล้ายรูปไข่ ความยาวจากเหนือจรดใต้ราว 3.3 กิโลเมตร ความกว้าง 1.9 กิโลเมตร มีพื้นที่รวมประมาณ 5.07 ตารางกิโลเมตร เกาะค่อนข้างเป็นที่ราบและอยู่สูงกว่าระดับน้ำทะเลเล็กน้อย ประกอบด้วยหินแปร Precambrian ในกลุ่ม Malmesbury Group \nเกาะแห่งนี้มีความสำคัญเนื่องจากเป็นสถานที่คุมขังอดีตประธานาธิบดีแอฟริกาใต้ และเจ้าของรางวัลโนเบลสาขาสันติภาพ คือ เนลสัน แมนเดลา และเป็นที่คุมขังอดีตประธานาธิบดีแอฟริกาใต้ กคาลิมา มุตลาอึนแท (Kgalema Motlanthe) รวมไปถึงนักโทษการเมืองที่มีชื่อเสียงอีกมากมาย ซึ่งถูกคุมขังอยู่ที่นี่นับสิบปีในระหว่างยุคแห่งการแบ่งแยกสีผิวในประเทศ","other":"Robben Island"},"en":{"title":"Robben Island","url":"https://en.wikipedia.org/wiki/Robben_Island","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/Robben_Island_-_Cape_Town%2C_South_Africa_%283883849594%29.jpg/960px-Robben_Island_-_Cape_Town%2C_South_Africa_%283883849594%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Robben Island (Dutch: Robbeneiland) is an island in Table Bay, 6.9 kilometers (4.3 mi) west of the coast of Bloubergstrand, north of Cape Town, South Africa. It takes its name from the archaic Dutch word for seals (robben).\nThe island is roughly oval in shape, 3.3km  long north–south, and 1.9km wide, with an area of 5.08 sq.","history":"Located at the entrance to Table Bay, 11 km from Cape Town, the island was discovered by Bartolomeu Dias in 1488. It was used by the Portuguese navigators, and later by English and Dutch sailors, as a refueling station.\nIn 1654, the settlers of the Dutch Cape Colony sheltered their livestock on the island, since the lack of predators offered better protection than on the mainland. The settlers also collected seal skins and boiled oil to supply the needs of the settlement.\nSince the end of the 17th century, the island was used for the incarceration of mainly political prisoners. The Dutch settlers were the first to use Robben Island as a prison. The island\u0027s first prisoner was probably Autshumato in the mid-17th century. Among its early permanent inhabitants were political leaders imprisoned from other Dutch colonies, including the Dutch East Indies. These included the two surviving Malagasy leaders, named in Dutch East India Company records as Massavana and Koesaaij, of the mutiny of Malagasy slaves on the slave ship Meermin. They had been sold to the Dutch East India Company in …","other":"เกาะโรบเบิน"}},{"th":{"title":"ปาเลงเก","url":"https://th.wikipedia.org/wiki/%E0%B8%9B%E0%B8%B2%E0%B9%80%E0%B8%A5%E0%B8%87%E0%B9%80%E0%B8%81","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a2/Palenque_Overview.jpg/960px-Palenque_Overview.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ปาเลงเก (สเปน: Palenque) หรือ บาก (มายายูกาตัน: Bàakʼ) หรือที่รู้จักกันในสมัยโบราณว่า ลากัมฮะ (มายา: Lakamhaʼ; แปลตรงตัว \u0027แหล่งน้ำใหญ่\u0027) เป็นนครรัฐมายาซึ่งตั้งอยู่ใกล้กับแม่น้ำอูซูมาซินตาในรัฐเชียปัสของประเทศเม็กซิโก ห่างจากซิวดัดเดลการ์เมนไปทางทิศใต้ราว 130 กิโลเมตร (81 ไมล์) ปาเลงเกเคยเจริญรุ่งเรืองถึงขีดสุดระหว่าง ค.ศ. 500–700 หลังจากที่เสื่อมอำนาจลง เมืองถูกปกคลุมไปด้วยป่ามะฮอกกานีและละมุด แต่หลังจากนั้นก็ได้รับการขุดค้นและบูรณะเป็นแหล่งโบราณคดี\nปาเลงเกเป็นแหล่งโบราณคดีขนาดกลาง มีขนาดเล็กกว่าติกัล, ชิเชนอิตซา หรือโกปัน แต่มีสถาปัตยกรรม ประติมากรรม และงานแกะสลักนูนต่ำที่ดีที่สุดที่ชาวมายาผลิตขึ้นบางส่วน ประวัติศาสตร์ส่วนใหญ่ของปาเลงเกได้รับการสืบสร้างจากการอ่านจารึกที่โบราณสถานหลายแห่ง ปัจจุบันนักประวัติศาสตร์รู้ลำดับการครองราชย์ของราชวงศ์ที่ปกครองปาเลงเกในคริสต์ศตวรรษที่ 5 และมีความรู้กว้างขวางเกี่ยวกับการแข่งขันระหว่างปาเลงเกกับนครรัฐอื่น ๆ อย่างกาลักมุลและโตนินาเป็นต้น\nเมื่อถึง ค.ศ. 2005 พื้นที่ที่ได้รับการค้นพบมีเนื้อที่ประมาณ 2.5 ตารางกิโลเมตร (1 ตารางไมล์) แต่คาดกันว่าพื้นที่ที่ได้รับการสำรวจแล้วคิดเป็นน้อยกว่าร้อยละ 10 ของพื้นที่ทั้งหมดของเมืองเท่านั้น และยังเหลือสิ่งปลูกสร้างมากกว่าหนึ่งพันหลังที่ยังคงมีป่าดิบปกคลุม ปาเลงเกมีผู้เข้าชม 920,470 คนใน ค.ศ.","history":"ปาเลงเก (สเปน: Palenque) หรือ บาก (มายายูกาตัน: Bàakʼ) หรือที่รู้จักกันในสมัยโบราณว่า ลากัมฮะ (มายา: Lakamhaʼ; แปลตรงตัว \u0027แหล่งน้ำใหญ่\u0027) เป็นนครรัฐมายาซึ่งตั้งอยู่ใกล้กับแม่น้ำอูซูมาซินตาในรัฐเชียปัสของประเทศเม็กซิโก ห่างจากซิวดัดเดลการ์เมนไปทางทิศใต้ราว 130 กิโลเมตร (81 ไมล์) ปาเลงเกเคยเจริญรุ่งเรืองถึงขีดสุดระหว่าง ค.ศ. 500–700 หลังจากที่เสื่อมอำนาจลง เมืองถูกปกคลุมไปด้วยป่ามะฮอกกานีและละมุด แต่หลังจากนั้นก็ได้รับการขุดค้นและบูรณะเป็นแหล่งโบราณคดี\nปาเลงเกเป็นแหล่งโบราณคดีขนาดกลาง มีขนาดเล็กกว่าติกัล, ชิเชนอิตซา หรือโกปัน แต่มีสถาปัตยกรรม ประติมากรรม และงานแกะสลักนูนต่ำที่ดีที่สุดที่ชาวมายาผลิตขึ้นบางส่วน ประวัติศาสตร์ส่วนใหญ่ของปาเลงเกได้รับการสืบสร้างจากการอ่านจารึกที่โบราณสถานหลายแห่ง ปัจจุบันนักประวัติศาสตร์รู้ลำดับการครองราชย์ของราชวงศ์ที่ปกครองปาเลงเกในคริสต์ศตวรรษที่ 5 และมีความรู้กว้างขวางเกี่ยวกับการแข่งขันระหว่างปาเลงเกกับนครรัฐอื่น ๆ อย่างกาลักมุลและโตนินาเป็นต้น\nเมื่อถึง ค.ศ. 2005 พื้นที่ที่ได้รับการค้นพบมีเนื้อที่ประมาณ 2.5 ตารางกิโลเมตร (1 ตารางไมล์) แต่คาดกันว่าพื้นที่ที่ได้รับการสำรวจแล้วคิดเป็นน้อยกว่าร้อยละ 10 ของพื้นที่ทั้งหมดของเมืองเท่านั้น …","other":"Palenque"},"en":{"title":"Palenque","url":"https://en.wikipedia.org/wiki/Palenque","img":"https://upload.wikimedia.org/wikipedia/commons/9/90/Palenque_Collage.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"Palenque (Spanish pronunciation: [pa\u0027leŋke]; Yucatec Maya: Bàakʼ [ɓaːkʼ]), also anciently known in the Itzaʼ language as Lakamha (\"big water\" or \"big waters\"), was a Maya city-state in southern Mexico that perished in the 8th century. The Palenque ruins date from ca. 226 BC to ca.","history":"Mythological beings using a variety of emblem glyphs in their titles suggests a complex early history. For instance, Kʼukʼ Bahlam I, the supposed founder of the Palenque dynasty, is called a Toktan Ajaw in the text of the Temple of the Foliated Cross.\nThe famous structures that we know today probably represent a rebuilding effort in response to the attacks by the city of Calakmul and its client states in 599 and 611. One of the main figures responsible for rebuilding Palenque and for a renaissance in the city\u0027s art and architecture is also one of the best-known Maya Ajaw, Kʼinich Janaabʼ Pakal (Pacal the Great), who ruled from 615 to 683. He is known through his funerary monument dubbed the Temple of the Inscriptions, after the lengthy text preserved in the temple\u0027s superstructure. At the time Alberto Ruz Lhuillier excavated Pakal\u0027s tomb, it was the richest and best preserved of any scientifically excavated burial then known from the ancient Americas. It held this position until the discovery of the rich Moche burials at Sipán, Peru and the recent discoveries at Copán and Calakmul. …","other":"ปาเลงเก"}},{"th":{"title":"ปราสาทครอนบอร์","url":"https://th.wikipedia.org/wiki/%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%AA%E0%B8%B2%E0%B8%97%E0%B8%84%E0%B8%A3%E0%B8%AD%E0%B8%99%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fc/Helsingoer_Kronborg_Castle.jpg/960px-Helsingoer_Kronborg_Castle.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ครอนบอร์ (เดนมาร์ก: Kronborg) ตั้งอยู่ใกล้เมืองเฮลซิงเงอร์ ทางตะวันออกเฉียงเหนือสุดของเซแลนด์ในเดนมาร์ก ซึ่งเป็นจุดที่แคบที่สุดของเออเรซุนด์ ซึ่งเป็นอ่าวระหว่างเดนมาร์กและสวีเดน ตรงจุดนี้อ่าวมีความกว้างเพียง 4 กิโลเมตร ซึ่งทำให้เป็นจุดยุทธศาสตร์สำคัญของการรักษาป้อมในตำแหน่งที่สามารถควบคุมการเดินเรือในบริเวณทะเลบอลติก ปราสาทโครนบอร์กเป็นสถาปัตยกรรมชิ้นสำคัญของปราสาทแบบสถาปัตยกรรมสมัยฟื้นฟูศิลปวิทยาในทางตอนเหนือของยุโรป ซึ่งทำให้ได้รับการขึ้นทะเบียนเป็นมรดกโลกโดยองค์การยูเนสโกในปี ค.ศ.","history":"ครอนบอร์ (เดนมาร์ก: Kronborg) ตั้งอยู่ใกล้เมืองเฮลซิงเงอร์ ทางตะวันออกเฉียงเหนือสุดของเซแลนด์ในเดนมาร์ก ซึ่งเป็นจุดที่แคบที่สุดของเออเรซุนด์ ซึ่งเป็นอ่าวระหว่างเดนมาร์กและสวีเดน ตรงจุดนี้อ่าวมีความกว้างเพียง 4 กิโลเมตร ซึ่งทำให้เป็นจุดยุทธศาสตร์สำคัญของการรักษาป้อมในตำแหน่งที่สามารถควบคุมการเดินเรือในบริเวณทะเลบอลติก ปราสาทโครนบอร์กเป็นสถาปัตยกรรมชิ้นสำคัญของปราสาทแบบสถาปัตยกรรมสมัยฟื้นฟูศิลปวิทยาในทางตอนเหนือของยุโรป ซึ่งทำให้ได้รับการขึ้นทะเบียนเป็นมรดกโลกโดยองค์การยูเนสโกในปี ค.ศ. 2000","other":"Kronborg"},"en":{"title":"Kronborg","url":"https://en.wikipedia.org/wiki/Kronborg","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2c/Kronborg_April_2026_10.jpg/960px-Kronborg_April_2026_10.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Kronborg (Danish pronunciation: [ˈkʰʁoːnˌpɒˀ]) is a castle and historical stronghold in the town of Helsingør, Denmark. Immortalised as Elsinore in William Shakespeare\u0027s play Hamlet, Kronborg is one of the most important Renaissance castles in Northern Europe. It was inscribed on the UNESCO World Heritage List in 2000.","history":"The castle\u0027s history dates to a fortress, Krogen (lit. \u0027the Hook\u0027), built in the early 15th century by the Danish king, Eric of Pomerania. The king insisted on payment of sound dues by all ships wishing to enter or leave the Baltic Sea through the Øresund; to help enforce his demands, he built a powerful fortress at the narrowest point in the Sound. At the time, the Kingdom of Denmark extended across both sides of the Sound. On the eastern shore the Helsingborg Castle had been operating since the Middle Ages. With the two castles and guard ship, Denmark could control all navigation through the Sound.\nThe castle was built on Ørekrog, a sandy tongue of land stretching into the sea from the coast of Zealand toward the coast of Scania. The castle consisted of a square curtain wall with a number of stone buildings inside. The stone building in the northeastern corner contained the king\u0027s residence. The building in the southwestern corner contained a large arched banquet hall. The building in the southeastern corner possibly served as the chapel. Large portions of the walls of Krogen are …","other":"ปราสาทครอนบอร์"}},{"th":{"title":"บะอ์ละบักก์","url":"https://th.wikipedia.org/wiki/%E0%B8%9A%E0%B8%B0%E0%B8%AD%E0%B9%8C%E0%B8%A5%E0%B8%B0%E0%B8%9A%E0%B8%B1%E0%B8%81%E0%B8%81%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/Temple_of_Bacchus%2C_Baalbek%2C_Lebanon_%2849890013476%29.jpg/960px-Temple_of_Bacchus%2C_Baalbek%2C_Lebanon_%2849890013476%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"บะอ์ละบักก์ (อาหรับ: بَعْلَبَكّ, อักษรโรมัน: Baʿlabakk; ซีรีแอก: ܒܥܠܒܟ) เป็นนครที่ตั้งอยู่ทางทิศตะวันออกของแม่น้ำอัลลีฏอนี ในประเทศเลบานอน มีระยะทางประมาณ 67 km (42 mi) ทางตะวันออกเฉียงเหนือของกรุงเบรุต ในปี 1998 เมืองนี้มีประชากร 82,608 คน ประชากรส่วนใหญ่ประกอบด้วยชาวมุสลิมชีอะฮ์ รองลงมาคือ ชาวมุสลิมนิกายซุนนีและคริสเตียน ในปี 2017 ยังมีผู้ลี้ภัยชาวซีเรียจำนวนมากด้วย","history":"บะอ์ละบักก์ (อาหรับ: بَعْلَبَكّ, อักษรโรมัน: Baʿlabakk; ซีรีแอก: ܒܥܠܒܟ) เป็นนครที่ตั้งอยู่ทางทิศตะวันออกของแม่น้ำอัลลีฏอนี ในประเทศเลบานอน มีระยะทางประมาณ 67 km (42 mi) ทางตะวันออกเฉียงเหนือของกรุงเบรุต ในปี 1998 เมืองนี้มีประชากร 82,608 คน ประชากรส่วนใหญ่ประกอบด้วยชาวมุสลิมชีอะฮ์ รองลงมาคือ ชาวมุสลิมนิกายซุนนีและคริสเตียน ในปี 2017 ยังมีผู้ลี้ภัยชาวซีเรียจำนวนมากด้วย\n== อ้างอิง ==","other":"Baalbek"},"en":{"title":"Baalbek","url":"https://en.wikipedia.org/wiki/Baalbek","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/Temple_of_Bacchus%2C_Baalbek%2C_Lebanon_%2849890013476%29.jpg/960px-Temple_of_Bacchus%2C_Baalbek%2C_Lebanon_%2849890013476%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Baalbek ( BAHL-bek, BAY-əl-bek; Arabic: بَعْلَبَكّ, romanized: Baʿlabakk, Lebanese: Bʿalbak; Syriac: ܒܥܠܒܟ; Phoenician: 𐤁𐤏𐤋𐤁𐤊, romanized: bʿlbk) is a city located east of the Litani River in Lebanon\u0027s Beqaa Valley, about 67 km (42 mi) northeast of Beirut. It is the capital of Baalbek-Hermel Governorate. In 1998, the city had a population of 82,608.","history":"The hilltop of Tell Baalbek, part of a valley to the east of the northern Beqaa Valley (Latin: Coele-Syria), shows signs of almost continual habitation over the last 8–9000 years. It was well-watered both from a stream running from the Rās al-ʿAyn spring southwest of the citadel and, during the spring, from numerous rills formed by meltwater from the Anti-Lebanons. Macrobius later credited the site\u0027s foundation to a colony of Egyptian or Assyrian priests. The settlement\u0027s religious, commercial, and strategic importance was minor enough, however, that it is never mentioned in any known Assyrian or Egyptian record, unless under another name. Its enviable position in a fertile valley, major watershed, and along the route from Tyre to Palmyra should have made it a wealthy and splendid site from an early age. During the Canaanite period, the local temples were primarily devoted to the Heliopolitan Triad: a male god (Baʿal), his consort (Astarte), and their son (Adon). The site of the present Temple of Jupiter was probably the focus of earlier worship, as its altar was located at the …","other":"บะอ์ละบักก์"}},{"th":{"title":"นันมาโตล","url":"https://th.wikipedia.org/wiki/%E0%B8%99%E0%B8%B1%E0%B8%99%E0%B8%A1%E0%B8%B2%E0%B9%82%E0%B8%95%E0%B8%A5","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Nan_madol.jpg/960px-Nan_madol.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"นันมาโตล (โปนเปย์: Nan Madol) เป็นแหล่งโบราณคดีบริเวณชายฝั่งด้านตะวันออกของเกาะโปนเปย์ ปัจจุบันเป็นส่วนหนึ่งของเขตมาโตเลนีม รัฐโปนเปย์ ประเทศไมโครนีเชีย ในบริเวณมหาสมุทรแปซิฟิกตะวันตก นันมาโตลเคยเป็นเมืองหลวงของราชวงศ์เซาเตเลวูร์จนถึง ค.ศ.","history":"นันมาโตลเป็นศูนย์กลางทางพิธีการและการเมืองของราชวงศ์เซาเตเลวูร์ ซึ่งมีส่วนในการรวมประชากรประมาณ 25,000 คน บนเกาะโปนเปย์ไว้ด้วยกัน จนถึง ค.ศ. 1628 ตั้งอยู่ระหว่างเกาะหลักโปนเปย์กับเกาะเจ็มเว็น พื้นที่แห่งนี้พบกิจกรรมของมนุษย์มาตั้งแต่ช่วงต้นคริสต์ศตวรรษที่ 1 หรือ 2 กระทั่งถึงประมาณคริสต์ศตวรรษที่ 8 หรือ 9 การก่อสร้างเกาะเล็กได้เริ่มต้นขึ้นด้วยงานสถาปัตยกรรมหินขนาดใหญ่ช่วงระหว่าง ค.ศ. 1180–1200\nการพิสูจน์การก่อสร้างหินขนาดใหญ่ทำได้เพียงเล็กน้อยเท่านั้น ตามความเชื่อโปนเปย์อ้างว่าผู้สร้างแหล่งโบราณคดีเลลูบนเกาะโกชาเอ (ซึ่งใช้การก่อสร้างด้วยหินใหญ่เหมือนกัน) อพยพเข้ามาที่โปนเปย์ ซึ่งเขาใช้ทักษะและประสบการณ์ในการสร้างสิ่งที่น่าประทับใจยิ่งกว่าอย่างนันมาโตล ทว่าจากการหาอายุจากคาร์บอนกัมมันตรังสีระบุได้ว่านันมาโตลเก่าแก่กว่าเลลู ทำให้นันมาโตลน่าจะเป็นแรงบันดาลใจในการสร้างเลลู\nตามตำนานของโปนเปย์กล่าวว่าผู้วิเศษฝาแฝดชื่อว่าโอลิซีปาและโอโลโซปาจากกาเตาตะวันตกหรือกานัมไวโซ อันเป็นดินแดนในตำนาน พี่น้องคู่นี้เดินทางมาถึงด้วยเรือแคนูขนาดใหญ่เพื่อแสวงหาพื้นที่ในการสร้างแท่นบูชาเพื่อบูชาเทพนานีโซนซาป อันเป็นเทพแห่งเกษตรกรรม หลังจากการก่อสร้างที่ผิดพลาดหลายหลายครั้ง …","other":"Nan Madol"},"en":{"title":"Nan Madol","url":"https://en.wikipedia.org/wiki/Nan_Madol","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Nan_madol.jpg/960px-Nan_madol.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Nan Madol is an archaeological site adjacent to the eastern shore of the island of Pohnpei, now part of the Madolenihmw district of Pohnpei state in the Federated States of Micronesia in the western Pacific Ocean. Nan Madol was the capital of the Saudeleur dynasty until about 1628. The city, constructed in a lagoon, consists of a series of small artificial islands linked by a network of canals.","history":"Nan Madol was the ceremonial and political seat of the Saudeleur dynasty, which united Pohnpei\u0027s estimated population of 25,000 people until about 1628. Set apart between the main island of Pohnpei and Temwen Island, it was a scene of human activity as early as the first or second century AD. By the 8th or 9th century, islet construction had started, with construction of the distinctive megalithic architecture beginning 1180–1200 AD.\nPolish ethnographer and oceanographer John Stanislaw Kubary made the first detailed description of Nan Madol in 1874.\nLittle can be verified about the megalithic construction. Pohnpeian tradition claims that the builders of the Leluh archaeological site on Kosrae (likewise composed of huge stone buildings) migrated to Pohnpei, where they used their skills and experience to build the even more impressive Nan Madol complex. Radiocarbon dating indicates that Nan Madol predates Leluh; thus, it is more likely that Nan Madol influenced Leluh.\nAccording to Pohnpeian legend, Nan Madol was constructed by twin sorcerers Olisihpa and Olosohpa from the mythical …","other":"นันมาโตล"}},{"th":null,"en":{"title":"Sacsayhuamán","url":"https://en.wikipedia.org/wiki/Sacsayhuam%C3%A1n","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Sacsayhuam%C3%A1n%2C_Cusco%2C_Per%C3%BA%2C_2015-07-31%2C_DD_27.JPG/960px-Sacsayhuam%C3%A1n%2C_Cusco%2C_Per%C3%BA%2C_2015-07-31%2C_DD_27.JPG?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Sacsayhuamán ( SACK-sy-wuh-MəN; Spanish pronunciation: [saksajwaˈman]) or Saksaywaman (from Quechua Saksay waman pukara, pronounced [ˈsaksaj ˈwaman], lit. \u0027fortress of the royal falcon or hawk\u0027) is a citadel on the northern outskirts of the city of Cusco, Peru, the historic capital of the Inca Empire. The site is an important example of Inca architecture and sits at an altitude of 3,701 metres (12,142 ft).\nThe Spanish chroniclers recorded that within the Inca\u0027s oral history, the fortress was said to be built during the reign of Sapa Inca Pachacuti and his successors, Topa Inca Yupanqui and Huayna Capac.","history":"Sacsayhuamán ( SACK-sy-wuh-MəN; Spanish pronunciation: [saksajwaˈman]) or Saksaywaman (from Quechua Saksay waman pukara, pronounced [ˈsaksaj ˈwaman], lit. \u0027fortress of the royal falcon or hawk\u0027) is a citadel on the northern outskirts of the city of Cusco, Peru, the historic capital of the Inca Empire. The site is an important example of Inca architecture and sits at an altitude of 3,701 metres (12,142 ft).\nThe Spanish chroniclers recorded that within the Inca\u0027s oral history, the fortress was said to be built during the reign of Sapa Inca Pachacuti and his successors, Topa Inca Yupanqui and Huayna Capac. Dry stone walls constructed of huge stones were built on the site, with the workers carefully cutting the boulders to fit them together tightly without mortar.\nIn 1983, Cusco and Sacsayhuamán together were designated as sites on the UNESCO World Heritage List, for international recognition and protection. The archeological site is now a tourist destination.","other":null}},{"th":{"title":"โกณารักสูรยมนเทียร","url":"https://th.wikipedia.org/wiki/%E0%B9%82%E0%B8%81%E0%B8%93%E0%B8%B2%E0%B8%A3%E0%B8%B1%E0%B8%81%E0%B8%AA%E0%B8%B9%E0%B8%A3%E0%B8%A2%E0%B8%A1%E0%B8%99%E0%B9%80%E0%B8%97%E0%B8%B5%E0%B8%A2%E0%B8%A3","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/Sun_Temple_Main_Structure%2C_Konark%2C_Orissa.jpg/960px-Sun_Temple_Main_Structure%2C_Konark%2C_Orissa.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"โกณารักสุรยมนเทียร (โอเดีย: କୋଣାର୍କ ସୂର୍ଯ୍ୟ ମନ୍ଦିର; Konark Surya Mandir) หรือ เทวสถานพระอาทิตย์โกณารัก (Konark Sun Temple) เป็นมนเทียรบูชาพระสูรยะ สร้างขึ้นในคริสต์ศตวรรษที่ 13 ตั้งอยู่ที่เมืองโกณารัก ราว 35 กิโลเมตร (22 mi) ทางนะวันออกเฉียงเหนือของปุรี บนชายฝั่งของรัฐโอฑิศา ประเทศอินเดีย ผู้มีดำรัสสร้างคือพระเจ้านรสิงหเทวะที่หนึ่งแห่งจักรวรรดิคงคาตะวันออก ในราวปี 1250","history":"โกณารักสุรยมนเทียร (โอเดีย: କୋଣାର୍କ ସୂର୍ଯ୍ୟ ମନ୍ଦିର; Konark Surya Mandir) หรือ เทวสถานพระอาทิตย์โกณารัก (Konark Sun Temple) เป็นมนเทียรบูชาพระสูรยะ สร้างขึ้นในคริสต์ศตวรรษที่ 13 ตั้งอยู่ที่เมืองโกณารัก ราว 35 กิโลเมตร (22 mi) ทางนะวันออกเฉียงเหนือของปุรี บนชายฝั่งของรัฐโอฑิศา ประเทศอินเดีย ผู้มีดำรัสสร้างคือพระเจ้านรสิงหเทวะที่หนึ่งแห่งจักรวรรดิคงคาตะวันออก ในราวปี 1250\nหนึ่งลงในสิ่งก่อสร้างที่ยังคงเหลือในหมู่อาคารคือสูรยรถ (ราชรถพระสูรยะ) ความสูง 100-ฟุต (30 m) ที่ซึ่งมีล้อและม้าสลักจากหินขนาดใหญ่ ที่ซึ่งในอดีตเคยมีความสูงถึง 200 ฟุต (61 m) ปัจจุบันส่วนใหญ่ของหมู่อาคารเหลือเพียงซากปรักหักพัง โดยเฉพาะศิขรเหนือมนเทียรหลัก ที่ซึ่งในอดีตเคยสูงกว่ามณฑปที่เหลืออยู่ สิ่งก่อสร้างและองค์ประกอบที่เหลืออยู่แสดงให้เห็นถึงงานศิลปะ ประติมานวิทยา และการแกะสลักที่วิจิตรตระการตา เช่นฉากที่แสดง กามะ และ มิถุน ในรูปอีโรติก อีกชื่อหนึ่งของมนเทียรนี้คือ สูรยเทวาลัย สถาปัตยกรรมของสูรยเทวาลัยนี้เป็นรูปแบบหนึ่งของแบบโอฑิศา ที่เรียกว่าสถาปัตยกรรมกลึงคะ\nสิ่งที่ทำให้สูรยเทวาลัยถูกทำลายจนเหลือเพียงทุกวันนี้ยังไม่เป็นที่ประจักษ์และยังคงเป็นที่ถกเถียง …","other":"Konark Sun Temple"},"en":{"title":"Konark Sun Temple","url":"https://en.wikipedia.org/wiki/Konark_Sun_Temple","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/47/Konarka_Temple.jpg/960px-Konarka_Temple.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Konark Sun Temple is a 13th-century CE Hindu Sun temple at Konark about 35 kilometres (22 mi) northeast from Puri city on the coastline in Puri district, Odisha, India. The temple is attributed to king Narasingha Deva I of the Eastern Ganga dynasty about 1250 CE. Dedicated to the Hindu Sun-god Surya, it reflects the pinnacle of Kalingan architecture and artistic excellence, what remains of the temple complex has the appearance of a 30-metre (100 ft) high chariot with immense wheels and horses, all carved from stone. Once over 61 metres (200 ft) high, much of the temple is now in ruins, in particular the large shikara tower over the sanctuary; at one time this rose much higher than the mandapa that remains.","history":"Konark, also referred to in Indian texts by the name Kainapara, was a significant trading port by the early centuries of the common era. The current Konark temple dates to the 13th century, though evidence suggests that a sun temple was built in the Konark area by at least the 9th century. Several Puranas mention Surya worship centres in Mundira, which may have been the earlier name for Konark, Kalapriya, and Multan (now in Pakistan). According to the Madala Panji, there was at one time another temple in the region built by Pundara Kesari. He may have been Puranjaya, the 7th-century ruler of the Somavamshi dynasty.\nThe current temple is attributed to Narasimhadeva I of the Eastern Ganga dynasty, r. 1238–1264 CE– . It is one of the few Hindu temples whose planning and construction records written in Sanskrit in the Odia script have been preserved in the form of palm leaf manuscripts that were discovered in a village in the 1960s and subsequently translated. The temple was sponsored by the king, and its construction was overseen by Shiva Samantaraya Mahapatra. It was built near an old …","other":"โกณารักสูรยมนเทียร"}},{"th":null,"en":{"title":"Carnac stones","url":"https://en.wikipedia.org/wiki/Carnac_stones","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a3/4748.1099_Menhire%2C_bis_zu_4_Meter_hoch%2C_von_OstnachWest_in_1167_Meter_Langen_Alignements_%28Granit-Steinreihen%29_in_einem_Halbkreis_endend_Le_M%C3%A9nec%2C_Carnac%2C_Departement_Morbihan%2C_Bretagne_Steffen_Heilfort.jpg/960px-thumbnail.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Carnac stones (Breton: Steudadoù Karnag) are an exceptionally dense collection of megalithic sites near the south coast of Brittany in northwestern France, consisting of stone alignments (rows), dolmens (stone tombs), tumuli (burial mounds), and single menhirs. More than 3,000 prehistoric standing stones were hewn from local granite and erected by the pre-Celtic people of Brittany and form the largest such collection in the world. Most of the stones are within the Breton municipality of Carnac, but some to the east are within neighboring La Trinité-sur-Mer.","history":"The Carnac stones (Breton: Steudadoù Karnag) are an exceptionally dense collection of megalithic sites near the south coast of Brittany in northwestern France, consisting of stone alignments (rows), dolmens (stone tombs), tumuli (burial mounds), and single menhirs. More than 3,000 prehistoric standing stones were hewn from local granite and erected by the pre-Celtic people of Brittany and form the largest such collection in the world. Most of the stones are within the Breton municipality of Carnac, but some to the east are within neighboring La Trinité-sur-Mer. Numerous megaliths and tumuli are also found in the surrounding areas, such as at Locmariaquer and Arzon, and on islands in the Gulf of Morbihan (e.g. Gavrinis). The stones were erected at some stage during the Neolithic period, probably around 3300 BC, but some may date to as early as 4500 BC.\nAlthough the stones date from 4500–3300 BC, modern beliefs associated them with first century AD Roman and later Christian occupations. A Christian legend associated with the stones held that they were pagan soldiers in pursuit of Pope …","other":null}},{"th":{"title":"เมโรวี","url":"https://th.wikipedia.org/wiki/%E0%B9%80%E0%B8%A1%E0%B9%82%E0%B8%A3%E0%B8%A7%E0%B8%B5","img":"https://upload.wikimedia.org/wikipedia/commons/e/e6/NubianMeroePyramids30sep2005%282%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"เมโรวี (; อังกฤษ: Meroë หรือสะกดได้อีกว่า Meroe; เมโรอิติก: Medewi หรือ Bedewi; อาหรับ: مرواه, อักษรโรมัน: Meruwah และ مروي, Meruwi; กรีกโบราณ: Μερόη, อักษรโรมัน: Meróē) เป็นเมืองโบราณบนฝั่งตะวันออกของแม่น้ำไนล์ ห่างจากสถานีรถไฟคาบูชิยา (Kabushiya) ไปทางทิศตะวันออกเฉียงเหนือราว 6 กิโลเมตร อยู่ใกล้กับเมือง เชนดิ ประเทศซูดาน และอยู่ห่างประมาณ 200 กิโลเมตรทางทิศตะวันออกเฉียงเหนือของนครคาร์ทูม ใกล้ ๆ กับเมืองโบราณมีกลุ่มหมู่บ้านที่เรียกว่าบากราวิยาห์ (อาหรับ: البجراوية) เมืองนี้เป็นเมืองหลวงของราชอาณาจักรคูชมาเป็นเวลาหลายศตวรรษนับตั้งแต่ประมาณ 590 ปีก่อนคริสตกาล จนกระทั่งราชอาณาจักรล่มสลายในคริสต์ศตวรรษที่ 6 ราชอาณาจักรของชาวคูชแห่งเมโรวีได้ตั้งชื่อเมืองนี้ว่า \"เกาะแห่งเมโรวี (Island of Meroë)\" ซึ่งเมืองแห่งนี้ตั้งอยู่ในเขตบูทานาในปัจจุบัน ซึ่งเป็นเขตที่ล้อมรอบด้วยแม่น้ำไนล์ (จากแม่น้ำแอตบาราห์ถึงนครคาร์ทูม) ซึ่งบรรจบจากแม่น้ำแอตบาราห์และแม่น้ำบลูไนล์","history":"เมโรวี (; อังกฤษ: Meroë หรือสะกดได้อีกว่า Meroe; เมโรอิติก: Medewi หรือ Bedewi; อาหรับ: مرواه, อักษรโรมัน: Meruwah และ مروي, Meruwi; กรีกโบราณ: Μερόη, อักษรโรมัน: Meróē) เป็นเมืองโบราณบนฝั่งตะวันออกของแม่น้ำไนล์ ห่างจากสถานีรถไฟคาบูชิยา (Kabushiya) ไปทางทิศตะวันออกเฉียงเหนือราว 6 กิโลเมตร อยู่ใกล้กับเมือง เชนดิ ประเทศซูดาน และอยู่ห่างประมาณ 200 กิโลเมตรทางทิศตะวันออกเฉียงเหนือของนครคาร์ทูม ใกล้ ๆ กับเมืองโบราณมีกลุ่มหมู่บ้านที่เรียกว่าบากราวิยาห์ (อาหรับ: البجراوية) เมืองนี้เป็นเมืองหลวงของราชอาณาจักรคูชมาเป็นเวลาหลายศตวรรษนับตั้งแต่ประมาณ 590 ปีก่อนคริสตกาล จนกระทั่งราชอาณาจักรล่มสลายในคริสต์ศตวรรษที่ 6 ราชอาณาจักรของชาวคูชแห่งเมโรวีได้ตั้งชื่อเมืองนี้ว่า \"เกาะแห่งเมโรวี (Island of Meroë)\" ซึ่งเมืองแห่งนี้ตั้งอยู่ในเขตบูทานาในปัจจุบัน ซึ่งเป็นเขตที่ล้อมรอบด้วยแม่น้ำไนล์ (จากแม่น้ำแอตบาราห์ถึงนครคาร์ทูม) ซึ่งบรรจบจากแม่น้ำแอตบาราห์และแม่น้ำบลูไนล์\n== อ้างอิง ==","other":"Meroë"},"en":{"title":"Meroë","url":"https://en.wikipedia.org/wiki/Mero%C3%AB","img":"https://upload.wikimedia.org/wikipedia/commons/e/e6/NubianMeroePyramids30sep2005%282%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"Meroë was an ancient city on the east bank of the Nile about 6 km (3.7 mi) north-east of the Kabushiya station, which is 35 km (22 mi) north-east of Shendi, Sudan, about 200 km north-east of Khartoum. Near the site is a group of villages called Bagrawiyah (Arabic: البجراوية). This city was the capital of the Kingdom of Kush for several centuries from around 590 BC, until its collapse in the 4th century AD. The Kushitic Kingdom of Meroë gave its name to the \"Island of Meroë\", which was the modern region of Butana, a region bounded by the Nile (from the Atbarah River to Khartoum), the Atbarah and the Blue Nile.","history":"Meroë was the southern capital of the Kingdom of Kush. The Kingdom of Kush spanned the period c. 800 BC – c. 350 AD. Initially, its main capital was farther north at Napata. King Aspelta moved the capital to Meroë, considerably farther south than Napata, possibly c. 591 BC, just after the sack of Napata by Egyptian Pharaoh Psamtik II.\nMartin Meredith states the Kushite rulers chose Meroë, between the Fifth and Sixth Cataracts, because it was on the fringe of the summer rainfall belt, and the area was rich in iron ore and hardwood for iron working. The location also afforded access to trade routes to the Red Sea. The city of Meroë was located along the middle Nile which is of much importance due to the annual flooding of the Nile river valley and the connection to many major river systems such as the Niger which aided with the production of pottery and iron characteristic to the Meroitic kingdom that allowed for the rise in power of its people. According to partially deciphered Meroitic texts, Meroitic \"d\" was transcribed in foreign languages as \"r\", with the native name of the city …","other":"เมโรวี"}},{"th":{"title":"อินดิเพนเดนซ์ฮอลล์","url":"https://th.wikipedia.org/wiki/%E0%B8%AD%E0%B8%B4%E0%B8%99%E0%B8%94%E0%B8%B4%E0%B9%80%E0%B8%9E%E0%B8%99%E0%B9%80%E0%B8%94%E0%B8%99%E0%B8%8B%E0%B9%8C%E0%B8%AE%E0%B8%AD%E0%B8%A5%E0%B8%A5%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/Exterior_of_the_Independence_Hall%2C_Aug_2019.jpg/960px-Exterior_of_the_Independence_Hall%2C_Aug_2019.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อินดิเพนเดนซ์ฮอลล์ (อังกฤษ: Independence Hall) คือศูนย์กลางของอุทยานประวัติศาสตร์แห่งชาติอินดิเพนเดนซ์ เมืองฟิลาเดลเฟีย รัฐเพนซิลเวเนีย สหรัฐอเมริกา ตั้งอยู่บนถนนเชสต์นัตระหว่างถนนที่ 5 กับ 6 ในช่วงแรก อาคารนี้เป็นที่รู้จักในฐานะสถานที่ที่มีการอภิปรายแก้ไขและลงมติเห็นชอบคำประกาศอิสรภาพสหรัฐอเมริกาและรัฐธรรมนูญแห่งสหรัฐอเมริกา  \nตัวอาคารสร้างเสร็จสมบูรณ์เมื่อ ค.ศ. 1753 ในฐานะสภานิติบัญญัติของอาณานิคมสำหรับจังหวัดเพนซิลเวเนีย (ต่อมาคือศาลาว่าการรัฐเพนซิลเวเนีย) และกลายเป็นสถานที่หลักในการจัดการประชุมใหญ่สภาแห่งทวีปหรือสภาอาณานิคมรอบที่ 2 (Second Continental Congress) เมื่อ ค.ศ. 1775–1783 นอกจากนี้ยังเป็นที่ตั้งของการประชุมยกร่างรัฐธรรมนูญในฤดูร้อน ค.ศ.","history":"อินดิเพนเดนซ์ฮอลล์ (อังกฤษ: Independence Hall) คือศูนย์กลางของอุทยานประวัติศาสตร์แห่งชาติอินดิเพนเดนซ์ เมืองฟิลาเดลเฟีย รัฐเพนซิลเวเนีย สหรัฐอเมริกา ตั้งอยู่บนถนนเชสต์นัตระหว่างถนนที่ 5 กับ 6 ในช่วงแรก อาคารนี้เป็นที่รู้จักในฐานะสถานที่ที่มีการอภิปรายแก้ไขและลงมติเห็นชอบคำประกาศอิสรภาพสหรัฐอเมริกาและรัฐธรรมนูญแห่งสหรัฐอเมริกา  \nตัวอาคารสร้างเสร็จสมบูรณ์เมื่อ ค.ศ. 1753 ในฐานะสภานิติบัญญัติของอาณานิคมสำหรับจังหวัดเพนซิลเวเนีย (ต่อมาคือศาลาว่าการรัฐเพนซิลเวเนีย) และกลายเป็นสถานที่หลักในการจัดการประชุมใหญ่สภาแห่งทวีปหรือสภาอาณานิคมรอบที่ 2 (Second Continental Congress) เมื่อ ค.ศ. 1775–1783 นอกจากนี้ยังเป็นที่ตั้งของการประชุมยกร่างรัฐธรรมนูญในฤดูร้อน ค.ศ. 1787 อาคารแห่งนี้คือส่วนหนึ่งของอุทยานประวัติศาสตร์แห่งชาติอินดิเพนเดนซ์ และได้รับการขึ้นทะเบียนเป็นแหล่งมรดกโลกเมื่อ ค.ศ. 1979\n== อ้างอิง ==","other":"Independence Hall"},"en":{"title":"Independence Hall","url":"https://en.wikipedia.org/wiki/Independence_Hall","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/Independence_Hall.jpg/960px-Independence_Hall.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Independence Hall is a historic civic building in Philadelphia, Pennsylvania, where both the Declaration of Independence and the Constitution of the United States were debated and adopted by the Founding Fathers of the United States. The building, which is the centerpiece of Independence National Historical Park, was designated a World Heritage Site in 1979. It is an example of American Georgian architecture, which is characterized by symmetry, classical proportions, and exposed brick with stone masonry accents.","history":"Independence Hall is a historic civic building in Philadelphia, Pennsylvania, where both the Declaration of Independence and the Constitution of the United States were debated and adopted by the Founding Fathers of the United States. The building, which is the centerpiece of Independence National Historical Park, was designated a World Heritage Site in 1979. It is an example of American Georgian architecture, which is characterized by symmetry, classical proportions, and exposed brick with stone masonry accents.\nIndependence Hall, which was initially called Pennsylvania State House, was completed in 1753. It was the first capitol of the colonial era Province of Pennsylvania and, even then, was seen as \"the greatest ornament in the town\". The building became a symbol of liberty, democracy, and the founding of the United States. During the American Revolutionary War, the Second Continental Congress convened in the building from 1775 to 1781. They founded the Continental Army there on June 14, 1775, and the Declaration of Independence was adopted there on July 4, 1776. From May 25 to …","other":"อินดิเพนเดนซ์ฮอลล์"}},{"th":null,"en":{"title":"Registan","url":"https://en.wikipedia.org/wiki/Registan","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/RegistanSquare_Samarkand.jpg/960px-RegistanSquare_Samarkand.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Registan, officially the Registan Square (Uzbek: Registon maydoni) is a historic public square in the city of Samarkand, Uzbekistan. It served as the heart of the Timurid Empire and later as the city\u0027s commercial, educational, and ceremonial center. The square is famed for its ensemble of three madrasas (Islamic schools): the Ulugh Beg Madrasa of the Timurid period, the Sherdar Madrasa and the Tilakari Madrasa, built later under the Uzbek Janid dynasty—which together represent some of the finest achievements of Islamic architecture in Central Asia.","history":"Registan, officially the Registan Square (Uzbek: Registon maydoni) is a historic public square in the city of Samarkand, Uzbekistan. It served as the heart of the Timurid Empire and later as the city\u0027s commercial, educational, and ceremonial center. The square is famed for its ensemble of three madrasas (Islamic schools): the Ulugh Beg Madrasa of the Timurid period, the Sherdar Madrasa and the Tilakari Madrasa, built later under the Uzbek Janid dynasty—which together represent some of the finest achievements of Islamic architecture in Central Asia. \nSeveral decades after the Mongol conquest, a Friday mosque was erected on Registan Square in Samarkand, the site that had served as the focal point of the Sarbadar uprising of 1365.\nPeople gathered on the Registan to hear royal proclamations, heralded by blasts on enormous copper pipes called dzharchis — and for public executions. The three madrasas feature distinctive Islamic style with muqarnas. The square was regarded as the hub of the Timurid Renaissance.","other":null}},{"th":{"title":"คูหาใต้ดินฮัลซัฟลีนี","url":"https://th.wikipedia.org/wiki/%E0%B8%84%E0%B8%B9%E0%B8%AB%E0%B8%B2%E0%B9%83%E0%B8%95%E0%B9%89%E0%B8%94%E0%B8%B4%E0%B8%99%E0%B8%AE%E0%B8%B1%E0%B8%A5%E0%B8%8B%E0%B8%B1%E0%B8%9F%E0%B8%A5%E0%B8%B5%E0%B8%99%E0%B8%B5","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Photo_Ellis_Hal_Salflieni.jpg/960px-Photo_Ellis_Hal_Salflieni.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"คูหาใต้ดินฮัลซัฟลีนี (มอลตา: Ipoġew ta\u0027 Ħal Saflieni) เป็นโครงสร้างใต้ดินยุคหินใหม่ในเมืองราฮัลจดีต ประเทศมอลตา มีอายุย้อนไปถึงระยะฮัลซัฟลีนี (3,300–3,000 ปีก่อนคริสต์ศักราช) ในยุคก่อนประวัติศาสตร์ของมอลตา เชื่อกันว่าคูหาใต้ดินแห่งนี้ทำหน้าที่เป็นทั้งบริเวณศักดิ์สิทธิ์และสุสาน โดยนักโบราณคดีได้ค้นพบและบันทึกการมีอยู่ของซากมนุษย์ประมาณกว่า 7,000 คนภายในคูหา ฮัลซัฟลีนีเป็นหนึ่งในตัวอย่างที่ได้รับการอนุรักษ์ไว้อย่างดีที่สุดของวัฒนธรรมการสร้างวิหารมอลตาซึ่งยังก่อกำเนิดหมู่วิหารหินใหญ่และวงหินอิชชาราด้วย","history":"คูหาใต้ดินฮัลซัฟลีนีได้รับการค้นพบโดยบังเอิญใน ค.ศ. 1902 เมื่อคนงานที่กำลังขุดโถงเก็บน้ำใต้ดินสำหรับโครงการที่อยู่อาศัยแห่งใหม่ขุดทะลุหลังคาคูหาโดยไม่เจตนา ในตอนแรกคนงานพยายามปกปิดการค้นพบนี้เอาไว้ แต่ในที่สุดก็ได้รับการเปิดเผย การศึกษาโครงสร้างของคูหาดำเนินการเป็นครั้งแรกโดยมานูเอล มากรี ซึ่งกำกับการขุดค้นในนามของคณะกรรมการพิพิธภัณฑ์ เริ่มตั้งแต่เดือนพฤศจิกายน ค.ศ. 1903 แต่ระหว่างการขุดค้น โบราณวัตถุส่วนหนึ่งของฮัลซัฟลีนี (เช่น สิ่งของในหลุมฝังศพ กระดูกมนุษย์) ถูกนำออกจากพื้นที่และทิ้งไปโดยไม่มีการขึ้นทะเบียนอย่างเหมาะสม ยิ่งไปกว่านั้น มากรีเสียชีวิตใน ค.ศ. 1907 ระหว่างภารกิจเผยแผ่ศาสนาในตูนิเซีย และรายงานของเขาเกี่ยวกับฮัลซัฟลีนีก็สูญหายไป\nการขุดค้นยังคงดำเนินต่อไปภายใต้การนำของทิมิสโตคลีส แซมมิต ซึ่งมีเป้าหมายที่จะกอบกู้ทุกสิ่งเท่าที่เป็นไปได้ แซมมิตเริ่มเผยแพร่รายงานชุดหนึ่งใน ค.ศ. 1910 และดำเนินการขุดค้นต่อไปจนถึง ค.ศ. 1911 โดยฝากโบราณวัตถุที่ค้นพบไว้ที่พิพิธภัณฑ์โบราณคดีแห่งชาติในกรุงวัลเลตตา ฮัลซัฟลีนีเปิดให้เข้าชมเป็นครั้งแรกใน ค.ศ. 1908 ระหว่างที่การขุดค้นยังดำเนินอยู่\nบ้านเรือนสมัยใหม่ 4 หลังที่สร้างขึ้นบนฮัลซัฟลีนีถูกรื้อถอนเพื่อสร้างพิพิธภัณฑ์ …","other":"Ħal Saflieni Hypogeum"},"en":{"title":"Ħal Saflieni Hypogeum","url":"https://en.wikipedia.org/wiki/%C4%A6al_Saflieni_Hypogeum","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Photo_Ellis_Hal_Salflieni.jpg/960px-Photo_Ellis_Hal_Salflieni.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Hypogeum of Ħal Saflieni (Maltese: Ipoġew ta\u0027 Ħal Saflieni [ɪpɔˈd͡ʒɛʊ̯ tɐ ħɐl sɐfˈlɪːnɪ]) is a Neolithic subterranean structure dating to the Saflieni phase (3300 – 3000 BC) in Maltese prehistory, located in Paola, Malta. It is often simply referred to as the Hypogeum, literally meaning \"underground\" in Greek. The Hypogeum is thought to have been a sanctuary and necropolis, with the estimated remains of more than 7,000 people documented by archeologists, and is among the best preserved examples of the Maltese temple building culture that also produced the Megalithic Temples and Xagħra Stone Circle.","history":"The Hypogeum was discovered by accident in 1902 when workers cutting cisterns for a new housing development broke through its roof. The workers tried to hide the temple at first, but eventually it was found. The study of the structure was first conducted by Manuel Magri, who directed the excavations on behalf of the Museums Committee, starting from November 1903. During the excavations, a portion of the contents of the Hypogeum, including grave goods and human remains, were emptied out and discarded without being properly catalogued. Magri\u0027s death in 1907 while conducting missionary work in Tunisia further complicated matters and his report on the Hypogeum was lost.\nExcavation continued under Sir Themistocles Zammit, who attempted to salvage what he could. Zammit began publishing a series of reports in 1910 and continued excavating until 1911, depositing his findings at the National Museum of Archaeology in Valletta. The Hypogeum was first opened to visitors in 1908 while the excavations were ongoing. Queen Mary and Sir Leslie Rundle visited in 1912.\nThe four contemporary houses …","other":"คูหาใต้ดินฮัลซัฟลีนี"}},{"th":null,"en":{"title":"Obelisk of Axum","url":"https://en.wikipedia.org/wiki/Obelisk_of_Axum","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/69/Rome_Stele.jpg/960px-Rome_Stele.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Obelisk of Axum (Tigrinya: ሓወልቲ ኣኽሱም, romanized: ḥawelti Akhsum; Amharic: የአክሱም ሐውልት, romanized: Ye’Åksum ḥāwelt) is a 4th-century CE, 24-metre (79 ft) tall phonolite stele, weighing 160 tonnes (160 long tons; 180 short tons), in the city of Axum in Ethiopia. It is ornamented with two false doors at the base and features decorations resembling windows on all sides. The obelisk ends in a semi-circular top, which used to be enclosed by metal frames.","history":"The \u0027obelisk\u0027—properly termed a stele or, in the local languages, Tigrinya: hawelti; and church Geʽez: hawelti—is found along with many other steles in the city of Axum in modern-day Ethiopia. The steles were probably carved and erected during the 4th century CE by subjects of the Kingdom of Aksum, an ancient Ethiopian civilization. Erection of steles in Axum was a very old practice. Their function is supposed to be as \"markers\" for underground burial chambers. The largest of the grave markers were for royal burial chambers and were decorated with multi-story false windows and false doors, while lesser nobility would have smaller, less decorated ones. While there are only a few large ones standing, there are hundreds of smaller ones in various \"steles fields\". It is still possible to see primitive, roughly carved steles near more elaborate \"obelisks\". The last stele erected in Axum was probably the so-called King Ezana\u0027s Stele, in the 4th century.\nKing Ezana (c. 321 – c. 360), influenced by his childhood tutor Frumentius, introduced Christianity to Axum, precluding the pagan …","other":null}},{"th":{"title":"คิงกากูจิ","url":"https://th.wikipedia.org/wiki/%E0%B8%84%E0%B8%B4%E0%B8%87%E0%B8%81%E0%B8%B2%E0%B8%81%E0%B8%B9%E0%B8%88%E0%B8%B4","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Kinkakuji_2004-09-21.jpg/960px-Kinkakuji_2004-09-21.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"คิงกากูจิ (ญี่ปุ่น: 金閣寺; เฮปเบิร์น: Kinkaku-ji; วัดศาลาทอง) มีชื่ออย่างเป็นทางการว่า โรกูอนจิ (ญี่ปุ่น: 鹿苑寺; เฮปเบิร์น: Rokuon-ji; วัดสวนกวาง) ตั้งอยู่ในเมืองเกียวโต จังหวัดเกียวโต ประเทศญี่ปุ่น มีศาลาทองเป็นจุดเด่นของวัด แรกเริ่มศาลาทองสร้างขึ้นเมื่อปี ค.ศ. 1397 (พ.ศ. 1940) เพื่อเป็นที่พักของโชกุนอาชิกางะ โยชิมิตสึ ต่อมาผู้เป็นบุตรชายได้เปลี่ยนแปลงให้เป็นวัดเซนสำนักรินไซ วัดถูกเผาทำลายหลายครั้งในระหว่างสงครามโอนิน ศาลาทองแห่งนี้เป็นแรงบันดาลใจให้หลานของโยชิมิตสึสร้างวัดอีกแห่งหนึ่งชื่อว่ากิงกากูจิ\nปี ค.ศ.","history":"คิงกากูจิ (ญี่ปุ่น: 金閣寺; เฮปเบิร์น: Kinkaku-ji; วัดศาลาทอง) มีชื่ออย่างเป็นทางการว่า โรกูอนจิ (ญี่ปุ่น: 鹿苑寺; เฮปเบิร์น: Rokuon-ji; วัดสวนกวาง) ตั้งอยู่ในเมืองเกียวโต จังหวัดเกียวโต ประเทศญี่ปุ่น มีศาลาทองเป็นจุดเด่นของวัด แรกเริ่มศาลาทองสร้างขึ้นเมื่อปี ค.ศ. 1397 (พ.ศ. 1940) เพื่อเป็นที่พักของโชกุนอาชิกางะ โยชิมิตสึ ต่อมาผู้เป็นบุตรชายได้เปลี่ยนแปลงให้เป็นวัดเซนสำนักรินไซ วัดถูกเผาทำลายหลายครั้งในระหว่างสงครามโอนิน ศาลาทองแห่งนี้เป็นแรงบันดาลใจให้หลานของโยชิมิตสึสร้างวัดอีกแห่งหนึ่งชื่อว่ากิงกากูจิ\nปี ค.ศ. 1994 โรกูอนจิ รวมทั้งศาลาทอง ได้รับการขึ้นทะเบียนจากองค์การยูเนสโกให้เป็นมรดกโลกร่วมกับสถานที่สำคัญอื่น ๆ ในเมืองเกียวโต\nตัวศาลาทองทั้งหลัง ยกเว้นชั้นใต้ดิน ปิดคลุมด้วยแผ่นทองคำบริสุทธิ์ เป็นที่ประดิษฐานพระพุทธรูปและโบราณวัตถุมีค่าอื่น ๆ บนยอดหลังคาของศาลามีรูปหล่อทองคำรูปนกโฮโอ\nในปี ค.ศ. 1950 ศาลาทองถูกเผาทำลายโดยพระวิกลจริต ศาลาที่เห็นในปัจจุบันสร้างขึ้นใหม่เมื่อปี ค.ศ. 1955","other":"Kinkaku-ji"},"en":{"title":"Kinkaku-ji","url":"https://en.wikipedia.org/wiki/Kinkaku-ji","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/Golden_Pavilion_Kinkaku-ji_water_mirror_2024.jpg/960px-Golden_Pavilion_Kinkaku-ji_water_mirror_2024.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Kinkaku-ji (金閣寺; Japanese pronunciation: [kʲiꜜŋ.ka.kɯ.dʑi], lit. \u0027Temple of the Golden Pavilion\u0027), officially named Rokuon-ji (鹿苑寺; [ɾoꜜ.kɯ.oɲ.dʑi], lit. \u0027Deer Garden Temple\u0027), is a Zen Buddhist temple in Kyoto, Japan and a tourist attraction. It is designated as a World Heritage Site, a National Special Historic Site, a National Special Landscape, and one of the 17 Historic Monuments of Ancient Kyoto. The temple is nicknamed after its reliquary (shariden), the Golden Pavilion (金閣, Kinkaku), whose top two floors are coated in 0.5 μm gold leaf.","history":"The site of Kinkaku-ji was originally a villa called Kitayama-dai (北山第), belonging to a powerful statesman, Saionji Kintsune. Kinkaku-ji\u0027s history dates to 1397, when the villa was purchased from the Saionji family by shōgun Ashikaga Yoshimitsu and transformed into the Kinkaku-ji complex. When Yoshimitsu died the building was converted into a Zen temple by his son, according to his wishes.\nThe original Golden Pavilion is believed to have been constructed in 1399. Gold was an important addition to the pavilion because of its underlying meaning. The gold employed was intended to mitigate and purify any pollution or negative thoughts and feelings towards death. Other than the symbolic meaning behind the gold leaf, the Muromachi period heavily relied on visual excesses. With the focus on the Golden Pavilion, the way that the structure is mainly covered in that material creates an impression that stands out because of the sunlight reflecting and the effect the reflection creates on the pond.\nDuring the Ōnin war (1467–1477), all of the buildings in the complex aside from the pavilion were …","other":"คิงกากูจิ"}},{"th":{"title":"ตีวานากู","url":"https://th.wikipedia.org/wiki/%E0%B8%95%E0%B8%B5%E0%B8%A7%E0%B8%B2%E0%B8%99%E0%B8%B2%E0%B8%81%E0%B8%B9","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c1/Zonnepoort_tiwanaku.jpg/960px-Zonnepoort_tiwanaku.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ตีวานากู (ไอมาราและเกชัว: Tiwanaku), เตียอัวนาโก (สเปน: Tiahuanaco) หรือ เตียอัวนากู (Tiahuanacu) เป็นแหล่งโบราณคดีสมัยก่อนโคลัมบัสใกล้กับทะเลสาบติติกากาทางภาคตะวันตกของประเทศโบลิเวีย และเป็นหนึ่งในแหล่งโบราณคดีที่ใหญ่ที่สุดในอเมริกาใต้ เขตโบราณคดีในปัจจุบันครอบคลุมพื้นที่ประมาณ 4 ตารางกิโลเมตร และรวมถึงเครื่องปั้นเผาที่มีลวดลายตกแต่ง สิ่งปลูกสร้าง และบล็อกหินขนาดใหญ่ ประชากรของเมืองนี้อาจมีจำนวนมากถึง 10,000–20,000 คนในช่วงจุดสูงสุดเมื่อประมาณ ค.ศ. 800\nแหล่งตีวานากูได้รับการกล่าวถึงเป็นครั้งแรกในหลักฐานลายลักษณ์อักษรเมื่อ ค.ศ.","history":"ตีวานากู (ไอมาราและเกชัว: Tiwanaku), เตียอัวนาโก (สเปน: Tiahuanaco) หรือ เตียอัวนากู (Tiahuanacu) เป็นแหล่งโบราณคดีสมัยก่อนโคลัมบัสใกล้กับทะเลสาบติติกากาทางภาคตะวันตกของประเทศโบลิเวีย และเป็นหนึ่งในแหล่งโบราณคดีที่ใหญ่ที่สุดในอเมริกาใต้ เขตโบราณคดีในปัจจุบันครอบคลุมพื้นที่ประมาณ 4 ตารางกิโลเมตร และรวมถึงเครื่องปั้นเผาที่มีลวดลายตกแต่ง สิ่งปลูกสร้าง และบล็อกหินขนาดใหญ่ ประชากรของเมืองนี้อาจมีจำนวนมากถึง 10,000–20,000 คนในช่วงจุดสูงสุดเมื่อประมาณ ค.ศ. 800\nแหล่งตีวานากูได้รับการกล่าวถึงเป็นครั้งแรกในหลักฐานลายลักษณ์อักษรเมื่อ ค.ศ. 1549 โดยเปโดร ซิเอซา เด เลออน ผู้พิชิตชาวสเปน ระหว่างที่กำลังเสาะหาเมืองหลวงของภูมิภาคกุลยาซูยูทางตอนใต้ของจักรวรรดิอินคา\nเบร์นาเบ โกโบ นักบันทึกเหตุการณ์และมิชชันนารีเยสุอิตในเปรู รายงานว่าครั้งหนึ่งตีวานากูเคยมีชื่อว่า ไตปีกาลา (Taypiqala) ซึ่งแปลว่า \"หินที่อยู่ตรงกลาง\" ในภาษาไอมารา สื่อถึงความเชื่อที่ว่าตีวานากูตั้งอยู่ที่ศูนย์กลางของโลก ชื่อที่ชาวตีวานากูรู้จักอาจสูญหายไปเนื่องจากพวกเขายังไม่มีภาษาเขียนใช้ เฮ็กการ์ตีและเบริสเฟิร์ด-โจนส์เสนอว่าภาษาปูกีนามีความเป็นไปได้มากที่สุดที่จะเป็นภาษาของชาวตีวานากูในสมัยนั้น","other":"Tiwanaku"},"en":{"title":"Tiwanaku","url":"https://en.wikipedia.org/wiki/Tiwanaku","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0c/PUERTA_DEL_SOL_TIWANAKU.jpg/960px-PUERTA_DEL_SOL_TIWANAKU.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Tiwanaku (Spanish: Tiahuanaco or Tiahuanacu) is a Pre-Columbian archaeological site in western Bolivia, near Lake Titicaca, about 70 kilometers from La Paz, and it is one of the largest sites in South America. It is just north of another ancient building site, Qhunqhu Wankani. Surface remains currently cover around 4 square kilometers and include decorated ceramics, monumental structures, and megalithic blocks.","history":"Tiwanaku (Spanish: Tiahuanaco or Tiahuanacu) is a Pre-Columbian archaeological site in western Bolivia, near Lake Titicaca, about 70 kilometers from La Paz, and it is one of the largest sites in South America. It is just north of another ancient building site, Qhunqhu Wankani. Surface remains currently cover around 4 square kilometers and include decorated ceramics, monumental structures, and megalithic blocks. It has been conservatively estimated that the site was inhabited by 10,000 to 20,000 people in AD 800.\nThe site was first recorded in written history in 1549 by Spanish conquistador Pedro Cieza de León while he was searching for the southern Inca capital of Qullasuyu.\nBernabé Cobo, a Jesuit chronicler of Peru, reported that Tiwanaku\u0027s name once was taypiqala, which is Aymara meaning \"stone in the center\", alluding to the belief that it lay at the center of the world. The name by which Tiwanaku was known to its inhabitants may have been lost, as they had no written language. Heggarty and Beresford-Jones suggest that the Puq
